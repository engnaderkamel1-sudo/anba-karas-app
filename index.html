          </div>
        </div>
      );
    }

    // --- EXCEL IMPORT MODAL ---
    function ExcelImportModal({ visitData, onApplyUpdates, onClose }) {
      const [fileName, setFileName] = useState('');
      const [matchedItems, setMatchedItems] = useState([]);
      const [unmatchedRows, setUnmatchedRows] = useState([]);
      const [selectedIds, setSelectedIds] = useState({});
      const [executionDate, setExecutionDate] = useState(new Date().toISOString().split('T')[0]);
      const [isProcessing, setIsProcessing] = useState(false);

      const existingCases = [];
      (visitData.churches || []).forEach(ch => {
        (ch.servantsGroups || []).forEach(sg => {
          (sg.cases || []).forEach(c => {
            existingCases.push({
              caseObj: c,
              churchId: ch.id,
              groupId: sg.id,
              churchName: ch.churchName || '',
              regionName: ch.regionName || '',
              villageName: ch.villageName || '',
              servantsNames: sg.servantsNames || ''
            });
          });
        });
      });

      const handleFileUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        setFileName(file.name);
        setIsProcessing(true);

        const reader = new FileReader();
        reader.onload = (evt) => {
          try {
            const bstr = evt.target.result;
            const wb = XLSX.read(bstr, { type: 'binary' });
            const wsName = wb.SheetNames[0];
            const ws = wb.Sheets[wsName];
            const rows = XLSX.utils.sheet_to_json(ws, { defval: '' });

            const matches = [];
            const unmatched = [];
            const initialSelected = {};

            rows.forEach((row, idx) => {
              const rowName = row['اسم الحالة'] || row['الحالة'] || row['الاسم'] || row['اسم_الحالة'] || '';
              if (!rowName || String(rowName).includes('الإجمالي') || String(rowName).includes('اجمالي')) {
                return;
              }

              const normRowName = normalizeArabicText(rowName);
              const rowChurch = normalizeArabicText(row['اسم الكنيسة'] || row['الكنيسة'] || '');
              const newProjectType = String(row['نوع المشروع المنفذ'] || row['نوع المشروع'] || row['المشروع'] || '').trim();
              const newProjectVal = parseArabicNumeric(row['القيمة المنفذة'] || row['القيمة الفعلية'] || row['قيمة المشروع المنفذ'] || row['قيمة المشروع'] || row['القيمة'] || row['المبلغ']) || 0;
              const newInstallmentVal = parseArabicNumeric(row['القسط المنفذ'] || row['القسط الفعلي'] || row['قيمة القسط المنفذ'] || row['قيمة القسط'] || row['القسط']) || 0;
              const newNotes = String(row['ملاحظات التنفيذ'] || row['ملاحظات'] || '').trim();

              let found = existingCases.find(ec => {
                const ecName = normalizeArabicText(ec.caseObj.name);
                if (ecName === normRowName) {
                  if (rowChurch && normalizeArabicText(ec.churchName)) {
                    return normalizeArabicText(ec.churchName).includes(rowChurch) || rowChurch.includes(normalizeArabicText(ec.churchName));
                  }
                  return true;
                }
                return false;
              });

              if (!found) {
                found = existingCases.find(ec => {
                  const ecName = normalizeArabicText(ec.caseObj.name);
                  return (ecName.length > 5 && normRowName.length > 5 && (ecName.includes(normRowName) || normRowName.includes(ecName)));
                });
              }

              if (found) {
                const effectiveVal = newProjectVal > 0 ? newProjectVal : (found.caseObj.executedProjectValue || found.caseObj.projectValue);
                const effectiveInst = newInstallmentVal > 0 ? newInstallmentVal : (found.caseObj.executedInstallmentAmount || found.caseObj.installmentAmount);
                const effectiveType = newProjectType || found.caseObj.executedProjectType || found.caseObj.projectType;

                const hasValueChanged = effectiveVal !== found.caseObj.projectValue;
                const hasInstChanged = effectiveInst !== found.caseObj.installmentAmount;
                const hasTypeChanged = effectiveType !== found.caseObj.projectType;

                const matchObj = {
                  rowIdx: idx,
                  existing: found,
                  excelData: {
                    name: rowName,
                    projectType: effectiveType,
                    projectValue: effectiveVal,
                    installmentAmount: effectiveInst,
                    notes: newNotes || found.caseObj.notes || ''
                  },
                  hasChanges: hasValueChanged || hasInstChanged || hasTypeChanged
                };

                matches.push(matchObj);
                initialSelected[found.caseObj.id] = true;
              } else {
                unmatched.push({
                  rowIdx: idx,
                  name: rowName,
                  church: row['اسم الكنيسة'] || '',
                  projectType: newProjectType,
                  projectValue: newProjectVal,
                  installmentAmount: newInstallmentVal,
                  notes: newNotes
                });
              }
            });

            setMatchedItems(matches);
            setUnmatchedRows(unmatched);
            setSelectedIds(initialSelected);
          } catch (err) {
            console.error("Excel parse error:", err);
            alert('حدث خطأ أثناء قراءة ملف الإكسيل. يرجى التأكد من صيغة الملف.');
          } finally {
            setIsProcessing(false);
          }
        };
        reader.readAsBinaryString(file);
      };

      const toggleSelectAll = () => {
        const allSelected = matchedItems.every(m => selectedIds[m.existing.caseObj.id]);
        const next = {};
        matchedItems.forEach(m => {
          next[m.existing.caseObj.id] = !allSelected;
        });
        setSelectedIds(next);
      };

      const handleApply = () => {
        const selectedMatches = matchedItems.filter(m => selectedIds[m.existing.caseObj.id]);
        if (selectedMatches.length === 0) {
          alert('برجاء تحديد حالة واحدة على الأقل لتحديثها.');
          return;
        }

        onApplyUpdates(selectedMatches, executionDate);
        onClose();
      };

      return (
        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50 animate-fade-in">
          <div className="bg-white rounded-xl shadow-2xl w-full max-w-4xl overflow-hidden border border-gray-100 flex flex-col max-h-[90vh]">
            <div className="p-4 border-b border-gray-100 bg-[#002f6c] text-white flex justify-between items-center shrink-0">
              <div>
                <h3 className="font-bold text-lg flex items-center gap-2">
                  <Upload size={20} className="text-[#d4af37]" />
                  استيراد ومطابقة كشف التنفيذ الفعلي من الإكسيل
                </h3>
                <p className="text-xs text-blue-200 mt-0.5">مطابقة الحالات آلياً وتحديث القيم وتحويلها إلى مشاريع منفذة</p>
              </div>
              <button onClick={onClose} className="text-white/80 hover:text-white p-1"><X size={20} /></button>
            </div>

            <div className="p-5 space-y-5 overflow-y-auto flex-1">
              {!matchedItems.length && !unmatchedRows.length && (
                <div className="border-2 border-dashed border-[#002f6c]/30 hover:border-[#002f6c] rounded-xl p-8 text-center bg-blue-50/30 transition-colors">
                  <FileSpreadsheet size={48} className="mx-auto text-[#002f6c] mb-3 opacity-80" />
                  <p className="text-gray-700 font-bold mb-1">اختر ملف الإكسيل المُعدل من مسؤول القرية</p>
                  <p className="text-gray-500 text-xs mb-4">يدعم ملفات (.xlsx, .xls) التي تم تصديرها من التطبيق سابقاً بعد تعديلها</p>
                  <label className="inline-flex items-center gap-2 bg-[#002f6c] hover:bg-[#001f4c] text-white px-5 py-2.5 rounded-lg cursor-pointer font-medium text-sm transition-colors shadow-sm">
                    <Upload size={18} />
                    <span>اختيار ملف الإكسيل</span>
                    <input type="file" accept=".xlsx,.xls,.csv" onChange={handleFileUpload} className="hidden" />
                  </label>
                </div>
              )}

              {isProcessing && (
                <div className="text-center py-10">
                  <div className="w-8 h-8 border-4 border-[#002f6c] border-t-transparent rounded-full animate-spin mx-auto mb-2"></div>
                  <p className="text-gray-600 font-medium text-sm">جاري قراءة ومطابقة بيانات الإكسيل...</p>
                </div>
              )}

              {(matchedItems.length > 0 || unmatchedRows.length > 0) && (
                <div className="space-y-4 animate-fade-in">
                  <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 bg-gray-50 p-4 rounded-xl border border-gray-200">
                    <div className="flex flex-wrap items-center gap-2">
                      <FileSpreadsheet size={20} className="text-[#002f6c]" />
                      <span className="font-bold text-gray-800 text-sm">{fileName}</span>
                      <span className="bg-emerald-100 text-emerald-800 text-xs font-bold px-2.5 py-0.5 rounded-full">
                        تم مطابقة {matchedItems.length} حالة
                      </span>
                      {unmatchedRows.length > 0 && (
                        <span className="bg-amber-100 text-amber-800 text-xs font-bold px-2.5 py-0.5 rounded-full">
                          {unmatchedRows.length} غير متطابقة
                        </span>
                      )}
                    </div>

                    <div className="flex items-center gap-3 w-full sm:w-auto">
                      <div className="flex items-center gap-1.5 text-xs text-gray-600">
                        <span>تاريخ التنفيذ:</span>
                        <input 
                          type="date" 
                          value={executionDate} 
                          onChange={e => setExecutionDate(e.target.value)} 
                          className="border border-gray-300 rounded px-2 py-1 text-xs font-sans outline-none focus:border-[#002f6c]"
                        />
                      </div>
                      <label className="text-xs text-[#002f6c] hover:underline cursor-pointer flex items-center gap-1">
                        <input type="file" accept=".xlsx,.xls" onChange={handleFileUpload} className="hidden" />
                        تغيير الملف
                      </label>
                    </div>
                  </div>

                  <div className="border border-gray-200 rounded-xl overflow-hidden shadow-sm">
                    <div className="bg-gray-100 px-4 py-2.5 border-b border-gray-200 flex justify-between items-center">
                      <div className="flex items-center gap-2">
                        <input 
                          type="checkbox" 
                          id="selectAllMatches"
                          checked={matchedItems.length > 0 && matchedItems.every(m => selectedIds[m.existing.caseObj.id])} 
                          onChange={toggleSelectAll} 
                          className="w-4 h-4 text-[#002f6c] rounded"
                        />
                        <label htmlFor="selectAllMatches" className="text-xs font-bold text-gray-700 cursor-pointer">
                          تحديد كل الحالات المتطابقة ({matchedItems.length})
                        </label>
                      </div>
                      <span className="text-xs text-gray-500">
                        المحدد للتحديث: {Object.values(selectedIds).filter(Boolean).length}
                      </span>
                    </div>

                    <div className="max-h-72 overflow-y-auto">
                      <table className="w-full text-xs text-right">
                        <thead className="bg-gray-50 text-gray-600 border-b border-gray-200 uppercase sticky top-0">
                          <tr>
                            <th className="p-2.5 w-10 text-center">اختيار</th>
                            <th className="p-2.5">اسم الحالة</th>
                            <th className="p-2.5">الكنيسة</th>
                            <th className="p-2.5">نوع المشروع</th>
                            <th className="p-2.5 text-center">القيمة (المبدئي ⬅️ الفعلي)</th>
                            <th className="p-2.5 text-center">القسط (المبدئي ⬅️ الفعلي)</th>
                            <th className="p-2.5 text-center">الحالة الناتجة</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-gray-100">
                          {matchedItems.map((m) => {
                            const isSelected = !!selectedIds[m.existing.caseObj.id];
                            const oldVal = m.existing.caseObj.projectValue;
                            const newVal = m.excelData.projectValue;
                            const valChanged = newVal !== oldVal;

                            const oldInst = m.existing.caseObj.installmentAmount;
                            const newInst = m.excelData.installmentAmount;
                            const instChanged = newInst !== oldInst;

                            const oldType = m.existing.caseObj.projectType;
                            const newType = m.excelData.projectType;
                            const typeChanged = newType !== oldType;

                            return (
                              <tr key={m.existing.caseObj.id} className={`hover:bg-blue-50/40 transition-colors ${isSelected ? 'bg-blue-50/20' : 'opacity-60'}`}>
                                <td className="p-2.5 text-center">
                                  <input 
                                    type="checkbox" 
                                    checked={isSelected} 
                                    onChange={() => setSelectedIds(p => ({ ...p, [m.existing.caseObj.id]: !p[m.existing.caseObj.id] }))} 
                                    className="w-4 h-4 text-[#002f6c] rounded"
                                  />
                                </td>
                                <td className="p-2.5 font-bold text-gray-900">{m.existing.caseObj.name}</td>
                                <td className="p-2.5 text-gray-600">{m.existing.churchName}</td>
                                <td className="p-2.5">
                                  {typeChanged ? (
                                    <span className="text-amber-800 font-medium">
                                      <span className="line-through text-gray-400 ml-1">{oldType}</span>
                                      <span>{newType}</span>
                                    </span>
                                  ) : (
                                    <span className="text-gray-700">{oldType}</span>
                                  )}
                                </td>
                                <td className="p-2.5 text-center font-sans">
                                  {valChanged ? (
                                    <div className="flex items-center justify-center gap-1 font-bold text-emerald-700">
                                      <span className="line-through text-gray-400 text-[10px]">{formatNumber(oldVal)}</span>
                                      <span>⬅️</span>
                                      <span>{formatNumber(newVal)} ج.م</span>
                                    </div>
                                  ) : (
                                    <span className="text-gray-700">{formatNumber(oldVal)} ج.م</span>
                                  )}
                                </td>
                                <td className="p-2.5 text-center font-sans">
                                  {instChanged ? (
                                    <div className="flex items-center justify-center gap-1 font-bold text-emerald-700">
                                      <span className="line-through text-gray-400 text-[10px]">{formatNumber(oldInst)}</span>
                                      <span>⬅️</span>
                                      <span>{formatNumber(newInst)} ج.م</span>
                                    </div>
                                  ) : (
                                    <span className="text-gray-700">{formatNumber(oldInst)} ج.م</span>
                                  )}
                                </td>
                                <td className="p-2.5 text-center">
                                  <StatusBadge status="executed" />
                                </td>
                              </tr>
                            );
                          })}
                        </tbody>
                      </table>
                    </div>
                  </div>

                  {unmatchedRows.length > 0 && (
                    <div className="bg-amber-50/60 border border-amber-200 rounded-xl p-3 text-xs text-amber-900">
                      <div className="font-bold flex items-center gap-1 mb-1">
                        <AlertTriangle size={14} /> تنبيه: يوجد {unmatchedRows.length} صفوف في الإكسيل لم يتم العثور على اسم مطابق لها في هذه الزيارة (سيتم تجاهلها):
                      </div>
                      <div className="text-gray-600 max-h-20 overflow-y-auto">
                        {unmatchedRows.map((u, i) => (
                          <span key={i} className="inline-block bg-white px-2 py-0.5 rounded border border-amber-200 mr-1 mb-1">
                            {u.name} {u.church ? `(${u.church})` : ''}
                          </span>
                        ))}
                      </div>
                    </div>
                  )}
                </div>
              )}
            </div>

            <div className="p-4 border-t border-gray-100 bg-gray-50 flex justify-between items-center shrink-0">
              <button onClick={onClose} className="px-5 py-2 rounded-md text-sm font-medium text-gray-600 hover:bg-gray-200 transition-colors">إلغاء</button>
              
              {(matchedItems.length > 0) && (
                <button 
                  onClick={handleApply} 
                  disabled={Object.values(selectedIds).filter(Boolean).length === 0}
                  className="px-6 py-2.5 rounded-md text-sm font-bold text-white bg-emerald-600 hover:bg-emerald-700 disabled:opacity-50 transition-colors shadow-md flex items-center gap-2"
                >
                  <CheckCircle size={18} />
                  <span>تطبيق التحديثات وتحويل ({Object.values(selectedIds).filter(Boolean).length}) حالة إلى "مشروع منفذ"</span>
                </button>
              )}
            </div>
          </div>
        </div>
      );
    }

    // --- CASE MODAL ---
    function CaseModal({ caseData, onSave, onClose }) {
      const [formData, setFormData] = useState(caseData || {
        id: uuidv4(), name: '', projectType: '', projectValue: '', installmentAmount: '', notes: '',
        status: 'initial', executedProjectType: '', executedProjectValue: '', executedInstallmentAmount: '',
        executionDate: new Date().toISOString().split('T')[0], executionNotes: ''
      });

      const handleSave = () => {
        if (!formData.name) { alert('برجاء إدخال اسم الحالة'); return; }
        onSave({
          ...formData,
          status: formData.status || 'initial',
          projectValue: parseArabicNumeric(formData.projectValue) || 0,
          installmentAmount: parseArabicNumeric(formData.installmentAmount) || 0,
          executedProjectValue: parseArabicNumeric(formData.executedProjectValue) || parseArabicNumeric(formData.projectValue) || 0,
          executedInstallmentAmount: parseArabicNumeric(formData.executedInstallmentAmount) || parseArabicNumeric(formData.installmentAmount) || 0,
          executedProjectType: formData.executedProjectType ? String(formData.executedProjectType).trim() : formData.projectType,
          executionNotes: formData.executionNotes ? String(formData.executionNotes).trim() : ''
        });
      };

      return (
        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
          <div className="bg-white rounded-xl shadow-2xl w-full max-w-lg overflow-hidden border border-gray-100 flex flex-col max-h-[90vh]">
            <div className="p-4 border-b border-gray-100 bg-[#002f6c] text-white flex justify-between items-center shrink-0">
              <h3 className="font-bold text-lg">{caseData ? 'تعديل الحالة' : 'إضافة حالة جديدة'}</h3>
              <button onClick={onClose} className="text-white/80 hover:text-white p-1"><X size={20} /></button>
            </div>
            <div className="p-5 space-y-4 overflow-y-auto flex-1">
              {/* Status Selector */}
              <div>
                <label className="block text-xs font-bold text-gray-700 mb-1.5">حالة المشروع</label>
                <div className="grid grid-cols-3 gap-2">
                  {Object.entries(STATUS_CONFIG).map(([key, cfg]) => (
                    <button
                      key={key}
                      type="button"
                      onClick={() => setFormData({ ...formData, status: key })}
                      className={`flex items-center justify-center gap-1.5 p-2 rounded-lg border text-xs font-bold transition-all ${
                        (formData.status || 'initial') === key
                          ? 'border-[#002f6c] bg-blue-50 text-[#002f6c] ring-2 ring-[#002f6c]/20'
                          : 'border-gray-200 hover:bg-gray-50 text-gray-600'
                      }`}
                    >
                      <span>{cfg.icon}</span>
                      <span>{cfg.label}</span>
                    </button>
                  ))}
                </div>
              </div>

              <div>
                <label className="block text-sm font-medium text-gray-700 mb-1">اسم الحالة *</label>
                <MicInput value={formData.name} onValueChange={(v) => setFormData({...formData, name: v})} placeholder="الاسم ثلاثي" />
              </div>
              <div>
                <label className="block text-sm font-medium text-gray-700 mb-1">نوع المشروع المبدئي</label>
                <MicInput value={formData.projectType} onValueChange={(v) => setFormData({...formData, projectType: v})} placeholder="مثل: بقالة، ملابس..." />
              </div>
              <div className="grid grid-cols-2 gap-4">
                <div>
                  <label className="block text-sm font-medium text-gray-700 mb-1">قيمة المشروع (ج.م)</label>
                  <MicInput isNumeric value={formData.projectValue} onValueChange={(v) => setFormData({...formData, projectValue: v})} placeholder="0" />
                </div>
                <div>
                  <label className="block text-sm font-medium text-gray-700 mb-1">قيمة القسط (ج.م)</label>
                  <MicInput isNumeric value={formData.installmentAmount} onValueChange={(v) => setFormData({...formData, installmentAmount: v})} placeholder="0" />
                </div>
              </div>

              {/* Executed Extra Fields */}
              {formData.status === 'executed' && (
                <div className="bg-emerald-50/60 border border-emerald-200 rounded-xl p-3.5 space-y-3 animate-fade-in">
                  <div className="text-xs font-bold text-emerald-800 flex items-center gap-1">
                    <CheckCircle size={14} /> بيانات التنفيذ الفعلي (إذا اختلفت عن المبدئي)
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-gray-700 mb-1">نوع المشروع الفعلي</label>
                    <MicInput value={formData.executedProjectType || formData.projectType} onValueChange={(v) => setFormData({...formData, executedProjectType: v})} placeholder="النوع الفعلي المنفذ" />
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs font-semibold text-gray-700 mb-1">القيمة الفعلية (ج.م)</label>
                      <MicInput isNumeric value={formData.executedProjectValue ?? formData.projectValue} onValueChange={(v) => setFormData({...formData, executedProjectValue: v})} placeholder="0" />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-gray-700 mb-1">القسط الفعلي (ج.م)</label>
                      <MicInput isNumeric value={formData.executedInstallmentAmount ?? formData.installmentAmount} onValueChange={(v) => setFormData({...formData, executedInstallmentAmount: v})} placeholder="0" />
                    </div>
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-gray-700 mb-1">تاريخ التنفيذ</label>
                    <input type="date" value={formData.executionDate || new Date().toISOString().split('T')[0]} onChange={e => setFormData({...formData, executionDate: e.target.value})} className="w-full border border-gray-300 rounded p-1.5 text-xs font-sans outline-none" />
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-gray-700 mb-1">ملاحظات التنفيذ</label>
                    <MicInput value={formData.executionNotes} onValueChange={(v) => setFormData({...formData, executionNotes: v})} placeholder="ملاحظات بعد التنفيذ..." />
                  </div>
                </div>
              )}

              <div>
                <label className="block text-sm font-medium text-gray-700 mb-1">ملاحظات عامة (اختياري)</label>
                <MicInput value={formData.notes} onValueChange={(v) => setFormData({...formData, notes: v})} placeholder="أي ملاحظات إضافية" />
              </div>
            </div>
            <div className="p-4 border-t border-gray-100 bg-gray-50 flex justify-end gap-2 shrink-0">
              <button onClick={onClose} className="px-5 py-2 rounded-md text-sm font-medium text-gray-600 hover:bg-gray-200 transition-colors">إلغاء</button>
              <button onClick={handleSave} className="px-5 py-2 rounded-md text-sm font-medium text-white bg-[#002f6c] hover:bg-[#001f4c] transition-colors shadow-sm">حفظ الحالة</button>
            </div>
          </div>
        </div>
      );
    }

        // --- EDIT CHURCH MODAL ---
    function EditChurchModal({ churchInfo, onSave, onClose }) {
      const [name, setName] = useState(churchInfo.churchName || '');
      const [region, setRegion] = useState(churchInfo.regionName || '');
      const [village, setVillage] = useState(churchInfo.villageName || '');

      const handleSave = () => {
        if (!name.trim()) { alert('\u0628\u0631\u062c\u0627\u0621 \u0625\u062f\u062e\u0627\u0644 \u0627\u0633\u0645 \u0627\u0644\u0643\u0646\u064a\u0633\u0629'); return; }
        onSave(churchInfo.churchId, name.trim(), region.trim(), village.trim());
      };

      return (
        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50 animate-fade-in" onClick={onClose}>
          <div className="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden border border-gray-100" onClick={e => e.stopPropagation()}>
            <div className="p-4 border-b border-gray-100 bg-[#002f6c] text-white flex justify-between items-center">
              <h3 className="font-bold text-base flex items-center gap-2">
                <span>{'\u26ea'}</span>
                <span>{'\u062a\u0639\u062f\u064a\u0644 \u0628\u064a\u0627\u0646\u0627\u062a \u0627\u0644\u0643\u0646\u064a\u0633\u0629'}</span>
              </h3>
              <button type="button" onClick={onClose} className="text-white/80 hover:text-white p-1">
                <X size={18} />
              </button>
            </div>
            <div className="p-5 space-y-4 text-right">
              <div>
                <label className="block text-xs font-bold text-gray-700 mb-1">{'\u0627\u0633\u0645 \u0627\u0644\u0643\u0646\u064a\u0633\u0629 *'}</label>
                <input
                  type="text"
                  value={name}
                  onChange={e => setName(e.target.value)}
                  placeholder={'\u0645\u062b\u0644\u0627\u064b: \u0643\u0646\u064a\u0633\u0629 \u0627\u0644\u0645\u0644\u0627\u0643 \u0645\u064a\u062e\u0627\u0626\u064a\u0644'}
                  className="w-full text-sm border border-gray-200 rounded-lg p-2.5 outline-none focus:border-[#002f6c] focus:ring-1 focus:ring-[#002f6c]"
                  autoFocus
                />
              </div>
              <div>
                <label className="block text-xs font-bold text-gray-700 mb-1">{'\u0627\u0644\u0645\u0646\u0637\u0642\u0629'}</label>
                <input
                  type="text"
                  value={region}
                  onChange={e => setRegion(e.target.value)}
                  placeholder={'\u0645\u062b\u0644\u0627\u064b: \u0627\u0628\u0648 \u0642\u0631\u0642\u0627\u0635'}
                  className="w-full text-sm border border-gray-200 rounded-lg p-2.5 outline-none focus:border-[#002f6c] focus:ring-1 focus:ring-[#002f6c]"
                />
              </div>
              <div>
                <label className="block text-xs font-bold text-gray-700 mb-1">{'\u0627\u0644\u0642\u0631\u064a\u0629 / \u0627\u0644\u0639\u0646\u0648\u0627\u0646'}</label>
                <input
                  type="text"
                  value={village}
                  onChange={e => setVillage(e.target.value)}
                  placeholder={'\u0645\u062b\u0644\u0627\u064b: \u0627\u0628\u0648 \u0642\u0631\u0642\u0627\u0635 \u0627\u0644\u0628\u0644\u062f'}
                  className="w-full text-sm border border-gray-200 rounded-lg p-2.5 outline-none focus:border-[#002f6c] focus:ring-1 focus:ring-[#002f6c]"
                />
              </div>
            </div>
            <div className="p-4 bg-gray-50 border-t border-gray-100 flex justify-end gap-2">
              <button
                type="button"
                onClick={onClose}
                className="px-4 py-2 text-xs sm:text-sm font-medium text-gray-600 hover:bg-gray-200 rounded-lg transition-colors"
              >
                {'\u0625\u0644\u063a\u0627\u0621'}
              </button>
              <button
                type="button"
                onClick={handleSave}
                className="px-5 py-2 text-xs sm:text-sm font-bold bg-[#002f6c] text-white hover:bg-[#001f4c] rounded-lg shadow-sm transition-colors"
              >
                {'\u062d\u0641\u0638 \u0627\u0644\u062a\u0639\u062f\u064a\u0644\u0627\u062a'}
              </button>
            </div>
          </div>
        </div>
      );
    }

    // --- SERVANTS GROUP VIEW ---
    function ServantsGroupView({ group, churchId, onUpdateGroup, onDeleteGroup, serialMap, onEditCase, onDeleteCase, onExecuteCase }) {
      const [isAddingCase, setIsAddingCase] = useState(false);

      const handleSaveCase = (newCase) => {
        onUpdateGroup(churchId, { ...group, cases: [...(group.cases || []), newCase] });
        setIsAddingCase(false);
      };

      return (
        <div className="bg-gray-50 border border-gray-200 rounded-lg overflow-hidden">
          <div className="p-4 border-b border-gray-200 bg-gray-100 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
            <div className="flex-1 w-full max-w-md">
              <label className="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-1">أسماء الخدام المسؤولين</label>
              <MicInput value={group.servantsNames || ''} onValueChange={(v) => onUpdateGroup(churchId, {...group, servantsNames: v})} placeholder="أدخل أسماء الخدام" className="bg-white" disabled={isReadOnly} />
            </div>
            {!isReadOnly && <button onClick={() => { if(confirm('هل تريد حذف مجموعة الخدام وحالاتهم؟')) onDeleteGroup(churchId, group.id); }} className="text-red-500 hover:text-red-700 text-sm font-medium p-2">
              حذف المجموعة
            </button>}
          </div>
          
          <div className="p-0 overflow-x-auto">
            <table className="w-full text-sm text-right">
              <thead className="bg-[#002f6c] text-white">
                <tr>
                  <th className="px-3 py-3 font-medium w-14 text-center"># (كنيسة)</th>
                  <th className="px-4 py-3 font-medium min-w-[140px]">اسم الحالة</th>
                  <th className="px-3 py-3 font-medium text-center w-28">حالة المشروع</th>
                  <th className="px-3 py-3 font-medium">نوع المشروع</th>
                  <th className="px-3 py-3 font-medium text-center">القيمة (ج.م)</th>
                  <th className="px-3 py-3 font-medium text-center">القسط (ج.م)</th>
                  <th className="px-4 py-3 font-medium">ملاحظات</th>
                  <th className="px-3 py-3 font-medium text-center w-32">إجراءات</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-gray-200">
                {(group.cases || []).length === 0 && (
                  <tr><td colSpan="8" className="px-4 py-8 text-center text-gray-500">لا توجد حالات مسجلة لهذه المجموعة.</td></tr>
                )}
                {(group.cases || []).map((c) => {
                  const isExec = c.status === 'executed';
                  const hasValDiff = isExec && c.executedProjectValue && c.executedProjectValue !== c.projectValue;
                  const hasInstDiff = isExec && c.executedInstallmentAmount && c.executedInstallmentAmount !== c.installmentAmount;
                  const hasTypeDiff = isExec && c.executedProjectType && c.executedProjectType !== c.projectType;

                  return (
                    <tr key={c.id} className="hover:bg-blue-50/50 transition-colors">
                      <td className="px-3 py-3 text-center font-bold text-gray-500 font-sans">{formatNumber(serialMap[c.id])}</td>
                      <td className="px-4 py-3 font-medium text-gray-900">
                        <div>{c.name}</div>
                        {isExec && c.executionDate && (
                          <div className="text-[10px] text-emerald-700 font-sans mt-0.5">منفذ في: {c.executionDate}</div>
                        )}
                      </td>
                      <td className="px-3 py-3 text-center">
                        <StatusBadge status={c.status || 'initial'} onClick={!isReadOnly ? () => onExecuteCase(c, churchId, group.id) : null} />
                      </td>
                      <td className="px-3 py-3 text-gray-600">
                        {hasTypeDiff ? (
                          <div>
                            <span className="font-bold text-emerald-800">{c.executedProjectType}</span>
                            <span className="block text-[11px] text-gray-400 line-through">{c.projectType}</span>
                          </div>
                        ) : (
                          c.executedProjectType || c.projectType
                        )}
                      </td>
                      <td className="px-3 py-3 text-center font-sans">
                        {hasValDiff ? (
                          <div>
                            <span className="font-bold text-emerald-700">{formatNumber(c.executedProjectValue)}</span>
                            <span className="block text-[11px] text-gray-400 line-through">{formatNumber(c.projectValue)}</span>
                          </div>
                        ) : (
                          <span className="text-[#002f6c] font-semibold">{formatNumber(c.executedProjectValue || c.projectValue)}</span>
                        )}
                      </td>
                      <td className="px-3 py-3 text-center font-sans">
                        {hasInstDiff ? (
                          <div>
                            <span className="font-bold text-emerald-700">{formatNumber(c.executedInstallmentAmount)}</span>
                            <span className="block text-[11px] text-gray-400 line-through">{formatNumber(c.installmentAmount)}</span>
                          </div>
                        ) : (
                          <span className="text-green-700 font-semibold">{formatNumber(c.executedInstallmentAmount || c.installmentAmount)}</span>
                        )}
                      </td>
                      <td className="px-4 py-3 text-gray-500 text-xs">
                        <div>{c.notes || '-'}</div>
                        {c.executionNotes && (
                          <div className="text-[11px] text-emerald-800 bg-emerald-50 rounded p-1 mt-1 border border-emerald-100">
                            <strong>ملاحظات التنفيذ:</strong> {c.executionNotes}
                          </div>
                        )}
                      </td>
                      <td className="px-3 py-3 text-center">
                        <div className="flex items-center justify-center gap-1.5">
                          {!isReadOnly && (
                            <button 
                              onClick={() => onExecuteCase(c, churchId, group.id)} 
                              className={`p-1.5 rounded transition-colors text-xs font-medium flex items-center gap-1 ${
                                isExec 
                                  ? 'text-emerald-700 bg-emerald-50 hover:bg-emerald-100 border border-emerald-200' 
                                  : 'text-amber-700 bg-amber-50 hover:bg-amber-100 border border-amber-300'
                              }`} 
                              title={isExec ? "تعديل بيانات التنفيذ" : "تأكيد التنفيذ"}
                            >
                              <Zap size={14} />
                              <span className="hidden sm:inline">{isExec ? 'المنفذ' : 'تأكيد'}</span>
                            </button>
                          )}
                          {!isReadOnly && <button onClick={() => onEditCase(c, churchId, group.id)} className="text-blue-600 hover:text-blue-800 p-1" title="تعديل"><Edit2 size={16}/></button>}
                          {!isReadOnly && <button onClick={() => onDeleteCase(c.id, churchId, group.id)} className="text-red-500 hover:text-red-700 p-1" title="حذف"><Trash2 size={16}/></button>}
                        </div>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
          
          <div className="p-3 border-t border-gray-200 bg-white">
            {!isReadOnly && <button onClick={() => setIsAddingCase(true)} className="flex items-center gap-1.5 text-sm font-medium text-[#002f6c] hover:text-[#004a8f] px-2 py-1 rounded">
              <Plus size={16} /> إضافة حالة جديدة
            </button>}
          </div>
          
          {isAddingCase && <CaseModal onSave={handleSaveCase} onClose={() => setIsAddingCase(false)} />}
        </div>
      );
    }

    // --- PAGE 1: ACTIVE VISIT ENTRY ---
// ================================================================
// MODULE: pages/ActiveVisitForm.js
// ================================================================
    function ActiveVisitForm({ data, updateData, onEndVisit, onExport, onOpenImportLegacy }) {
      const [editingCaseInfo, setEditingCaseInfo] = useState(null);
      const [editingChurchInfo, setEditingChurchInfo] = useState(null);
      const [executingCaseInfo, setExecutingCaseInfo] = useState(null);
      const [showImportModal, setShowImportModal] = useState(false);
      const [filterStatus, setFilterStatus] = useState('all'); // 'all' | 'initial' | 'executed' | 'cancelled'

      const [filterRegion, setFilterRegion] = useState('');
      const [filterChurch, setFilterChurch] = useState('');
      const [filterServant, setFilterServant] = useState('');
      const [filterProject, setFilterProject] = useState('');
      const [filterCase, setFilterCase] = useState('');
      const [searchQuery, setSearchQuery] = useState('');
      const [expandedRegions, setExpandedRegions] = useState({});
      const [expandedChurches, setExpandedChurches] = useState({});
      const toggleRegion = (regionName) => {
          setExpandedRegions(prev => ({ ...prev, [regionName]: !(prev[regionName] !== undefined ? prev[regionName] : Boolean(searchQuery)) }));
      };

      const uniqueRegions = Array.from(new Set((data.churches||[]).map(ch => ch.regionName).filter(Boolean))).sort();
      const uniqueChurches = Array.from(new Set((data.churches||[]).filter(ch => !filterRegion || ch.regionName === filterRegion).map(ch => ch.churchName).filter(Boolean))).sort();
      const uniqueServants = Array.from(new Set((data.churches||[]).flatMap(ch => (ch.servantsGroups || []).map(sg => sg.servantsNames)).filter(Boolean))).sort();
      const uniqueProjects = Array.from(new Set((data.churches||[]).flatMap(ch => (ch.servantsGroups || []).flatMap(sg => (sg.cases || []).map(c => c.projectType))).filter(Boolean))).sort();
      const uniqueCases = Array.from(new Set((data.churches||[]).flatMap(ch => (ch.servantsGroups || []).flatMap(sg => (sg.cases || []).map(c => c.name))).filter(Boolean))).sort();

      const normalizedSearchQuery = searchQuery.trim() ? (typeof normalizeArabicText === 'function' ? normalizeArabicText(searchQuery.trim()) : searchQuery.trim().toLowerCase()) : '';

      let filteredChurches = (data.churches || []).map(ch => {
          if (filterRegion && ch.regionName !== filterRegion) return null;
          if (filterChurch && ch.churchName !== filterChurch) return null;
          
          const filteredGroups = (ch.servantsGroups || []).map(sg => {
              if (filterServant && sg.servantsNames !== filterServant) return null;
              
              const filteredCases = (sg.cases || []).filter(c => {
                  if (filterStatus !== 'all' && (c.status || 'initial') !== filterStatus) return false;
                  if (filterProject && c.projectType !== filterProject) return false;
                  if (filterCase && c.name !== filterCase) return false;
                  if (normalizedSearchQuery) {
                      const searchableParts = [
                          c.name, c.caseName, c.nationalId, c.phone, c.villageName,
                          c.projectType, c.executedProjectType, c.notes, c.executionNotes,
                          c.address, c.status,
                          ch.churchName, ch.regionName, ch.villageName,
                          sg.servantsNames
                      ].filter(Boolean).map(val => typeof normalizeArabicText === 'function' ? normalizeArabicText(String(val)) : String(val).toLowerCase()).join(' ');
                      const qWords = normalizedSearchQuery.split(/\s+/).filter(Boolean); if (!qWords.every(w => searchableParts.includes(w))) return false;
                  }
                  return true;
              });
              
              if (filteredCases.length === 0 && (filterStatus !== 'all' || filterProject || filterCase || normalizedSearchQuery)) return null;
              return { ...sg, cases: filteredCases };
          }).filter(Boolean);
          
          if (filteredGroups.length === 0 && (filterStatus !== 'all' || filterServant || filterProject || filterCase || normalizedSearchQuery)) return null;
          return { ...ch, servantsGroups: filteredGroups };
      }).filter(Boolean);

      // Compute Church Serials
      const serialMap = {};
      (data.churches || []).forEach(churchLoc => {
        let churchS = 1;
        (churchLoc.servantsGroups || []).forEach(sg => {
          (sg.cases || []).forEach(c => {
            serialMap[c.id] = churchS++;
          });
        });
      });

      const toggleChurch = (id) => setExpandedChurches(prev => ({...prev, [id]: !prev[id]}));
      const handleAddChurch = () => {
        const newChurch = {
          id: uuidv4(), regionName: '', villageName: '', churchName: '',
          servantsGroups: [{ id: uuidv4(), servantsNames: '', cases: [] }]
        };
        updateData(prev => ({ ...prev, churches: [newChurch, ...(prev.churches || [])] }));
        setExpandedChurches(prev => ({ ...prev, [newChurch.id]: true }));
      };

      const handleUpdateChurch = (updatedChurch) => {
        updateData(prev => ({
          ...prev, churches: prev.churches.map(ch => ch.id === updatedChurch.id ? updatedChurch : ch)
        }));
      };

            const handleEditChurch = (ch, e) => {
        if (e) e.stopPropagation();
        setEditingChurchInfo({
          churchId: ch.id,
          churchName: ch.churchName || '',
          regionName: ch.regionName || '',
          villageName: ch.villageName || ''
        });
      };

      const handleSaveEditChurch = (churchId, newChurchName, newRegionName, newVillageName) => {
        updateData(prev => ({
          ...prev,
          churches: (prev.churches || []).map(ch => ch.id === churchId ? {
            ...ch,
            churchName: newChurchName.trim() || ch.churchName,
            regionName: newRegionName.trim() || ch.regionName,
            villageName: newVillageName.trim() || ch.villageName
          } : ch)
        }));
        setEditingChurchInfo(null);
      };

      const handleDeleteChurch = (id) => {
        if(confirm('هل أنت متأكد من حذف بيانات هذه الكنيسة بالكامل؟')) {
          updateData(prev => ({ ...prev, churches: prev.churches.filter(ch => ch.id !== id) }));
        }
      };

      const handleAddGroup = (churchId) => {
        updateData(prev => ({
          ...prev, churches: prev.churches.map(ch => ch.id === churchId ? {
            ...ch, servantsGroups: [...ch.servantsGroups, { id: uuidv4(), servantsNames: '', cases: [] }]
          } : ch)
        }));
      };

      const handleUpdateGroup = (churchId, updatedGroup) => {
        updateData(prev => ({
          ...prev, churches: prev.churches.map(ch => ch.id === churchId ? {
            ...ch, servantsGroups: ch.servantsGroups.map(sg => sg.id === updatedGroup.id ? updatedGroup : sg)
          } : ch)
        }));
      };

      const handleDeleteGroup = (churchId, groupId) => {
        updateData(prev => ({
          ...prev, churches: prev.churches.map(ch => ch.id === churchId ? {
            ...ch, servantsGroups: ch.servantsGroups.filter(sg => sg.id !== groupId)
          } : ch)
        }));
      };

      const handleEditCase = (caseObj, churchId, groupId) => {
        setEditingCaseInfo({ caseObj, churchId, groupId });
      };

      const handleSaveEditCase = (updatedCase) => {
        const { churchId, groupId } = editingCaseInfo;
        updateData(prev => ({
          ...prev, churches: prev.churches.map(ch => ch.id === churchId ? {
            ...ch, servantsGroups: ch.servantsGroups.map(sg => sg.id === groupId ? {
              ...sg, cases: sg.cases.map(c => c.id === updatedCase.id ? updatedCase : c)
            } : sg)
          } : ch)
        }));
        setEditingCaseInfo(null);
      };

      const handleSaveExecutionCase = (updatedCase) => {
        const { churchId, groupId } = executingCaseInfo;
        updateData(prev => ({
          ...prev, churches: prev.churches.map(ch => ch.id === churchId ? {
            ...ch, servantsGroups: ch.servantsGroups.map(sg => sg.id === groupId ? {
              ...sg, cases: sg.cases.map(c => c.id === updatedCase.id ? updatedCase : c)
            } : sg)
          } : ch)
        }));
        setExecutingCaseInfo(null);
      };

      const handleApplyExcelUpdates = (selectedMatches, execDate) => {
        updateData(prev => {
          const updatedChurches = (prev.churches || []).map(ch => ({
            ...ch,
            servantsGroups: (ch.servantsGroups || []).map(sg => ({
              ...sg,
              cases: (sg.cases || []).map(c => {
                const match = selectedMatches.find(m => m.existing.caseObj.id === c.id);
                if (match) {
                  return {
                    ...c,
                    status: 'executed',
                    executedProjectType: match.excelData.projectType || c.projectType,
                    executedProjectValue: match.excelData.projectValue || c.projectValue,
                    executedInstallmentAmount: match.excelData.installmentAmount || c.installmentAmount,
                    executionDate: execDate || new Date().toISOString().split('T')[0],
                    executionNotes: match.excelData.notes || c.notes || ''
                  };
                }
                return c;
              })
            }))
          }));
          return { ...prev, churches: updatedChurches };
        });
        alert(`تم بنجاح تحديث وتأكيد تنفيذ ${selectedMatches.length} حالة!`);
      };

      const handleDeleteCase = (caseId, churchId, groupId) => {
        if (!confirm('هل أنت متأكد من حذف هذه الحالة؟')) return;
        updateData(prev => ({
          ...prev, churches: prev.churches.map(ch => ch.id === churchId ? {
            ...ch, servantsGroups: ch.servantsGroups.map(sg => sg.id === groupId ? {
              ...sg, cases: sg.cases.filter(c => c.id !== caseId)
            } : sg)
          } : ch)
        }));
      };

      return (
        <div className="animate-fade-in">
          <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4">
             <h2 className="text-2xl font-bold text-[#002f6c] flex items-center gap-2">
               <Edit2 size={24} className="text-[#d4af37]" /> تسجيل الزيارة والمشاريع
             </h2>
             <div className="flex flex-wrap gap-2 w-full sm:w-auto">
                {!isReadOnly && (
                  <button onClick={() => setShowImportModal(true)} className="flex-1 sm:flex-none flex items-center justify-center gap-1.5 bg-emerald-600 text-white hover:bg-emerald-700 px-4 py-2 rounded-md font-medium shadow-sm transition-colors text-sm">
                    <Upload size={18} /> استيراد كشف التنفيذ
                  </button>
                )}
                <button onClick={() => onExport && onExport(data)} className="flex-1 sm:flex-none flex items-center justify-center gap-1.5 bg-white border border-[#d4af37] text-[#8a7222] hover:bg-[#fff9e6] px-4 py-2 rounded-md font-medium transition-colors text-sm">
                  <Download size={18} /> تصدير
                </button>
                {!isReadOnly && (
                  <button onClick={onEndVisit} className="flex-1 sm:flex-none flex items-center justify-center gap-1.5 bg-[#002f6c] text-white hover:bg-[#001f4c] px-4 py-2 rounded-md font-medium shadow-md transition-colors text-sm">
                    <CheckCircle size={18} /> حفظ وإنهاء
                  </button>
                )}
             </div>
          </div>

          <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-6 mb-8">
            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
              <div>
                <label className="block text-sm font-medium text-gray-700 mb-1">مكان الزيارة</label>
                <MicInput value={data.location} onValueChange={(v) => updateData(p => ({...p, location: v}))} placeholder="أدخل مكان الزيارة" />
              </div>
              <div>
                <label className="block text-sm font-medium text-gray-700 mb-1">تاريخ الزيارة</label>
                <input type="date" value={data.date} onChange={(e) => updateData(p => ({...p, date: e.target.value}))} className="w-full rounded-md border border-gray-300 p-2.5 text-sm focus:border-[#002f6c] focus:ring-1 focus:ring-[#002f6c] focus:outline-none transition-shadow text-gray-900 font-sans" />
              </div>
            </div>
          </div>

          {/* OVERALL VISIT SUMMARY BAR */}
          {(() => {
              let totalProjects = 0;
              let totalApprovedValue = 0;
              let totalExecutedValue = 0;
              let executedProjectsCount = 0;
              let totalInstallments = 0;
              let totalGroups = 0;
              let totalChurches = filteredChurches.length;
              
              filteredChurches.forEach(ch => {
                  totalGroups += (ch.servantsGroups || []).length;
                  (ch.servantsGroups || []).forEach(sg => {
                      (sg.cases || []).forEach(c => {
                          totalProjects++;
                          const val = parseFloat(c.projectValue) || 0;
                          const execVal = parseFloat(c.executedProjectValue) || val;
                          const inst = parseFloat(c.installmentAmount) || 0;
                          const execInst = parseFloat(c.executedInstallmentAmount) || inst;
                          
                          totalApprovedValue += val;
                          if (c.status === 'executed') {
                            executedProjectsCount++;
                            totalExecutedValue += execVal;
                            totalInstallments += execInst;
                          } else {
                            totalInstallments += inst;
                          }
                      });
                  });
              });

              return (
                 <div className="bg-[#002f6c]/5 rounded-xl border border-[#002f6c]/20 p-4 mb-6 flex flex-wrap gap-4 items-center justify-between">
                     <div className="flex flex-wrap gap-3 items-center">
                        <div className="bg-white px-3.5 py-2 rounded-lg shadow-sm border border-gray-100 flex items-center gap-2">
                           <span className="text-lg">👥</span>
                           <div className="flex flex-col">
                              <span className="text-[11px] text-gray-500 font-medium">مجموعات الخدام</span>
                              <span className="font-bold text-blue-600 text-sm"><span className="font-sans">{formatNumber(totalGroups)}</span> مجموعة</span>
                           </div>
                        </div>
                        <div className="bg-white px-3.5 py-2 rounded-lg shadow-sm border border-gray-100 flex items-center gap-2">
                           <span className="text-lg">📊</span>
                           <div className="flex flex-col">
                              <span className="text-[11px] text-gray-500 font-medium">إجمالي الحالات</span>
                              <span className="font-bold text-[#002f6c] text-sm"><span className="font-sans">{formatNumber(totalProjects)}</span> مشروع</span>
                           </div>
                        </div>
                        <div className="bg-white px-3.5 py-2 rounded-lg shadow-sm border border-amber-200 bg-amber-50/40 flex items-center gap-2">
                           <span className="text-lg">⏳</span>
                           <div className="flex flex-col">
                              <span className="text-[11px] text-amber-800 font-medium">موافقة مبدئية</span>
                              <span className="font-bold text-amber-700 text-sm"><span className="font-sans">{formatNumber(totalApprovedValue)}</span> ج.م</span>
                           </div>
                        </div>
                        <div className="bg-white px-3.5 py-2 rounded-lg shadow-sm border border-emerald-200 bg-emerald-50/40 flex items-center gap-2">
                           <span className="text-lg">✅</span>
                           <div className="flex flex-col">
                              <span className="text-[11px] text-emerald-800 font-medium">المنفذ فعلياً ({formatNumber(executedProjectsCount)})</span>
                              <span className="font-bold text-emerald-700 text-sm"><span className="font-sans">{formatNumber(totalExecutedValue)}</span> ج.م</span>
                           </div>
                        </div>
                        <div className="bg-white px-3.5 py-2 rounded-lg shadow-sm border border-gray-100 flex items-center gap-2">
                           <span className="text-lg">💸</span>
                           <div className="flex flex-col">
                              <span className="text-[11px] text-gray-500 font-medium">إجمالي الأقساط</span>
                              <span className="font-bold text-[#8a7222] text-sm"><span className="font-sans">{formatNumber(totalInstallments)}</span> ج.م</span>
                           </div>
                        </div>
                     </div>
                     <div className="bg-[#002f6c] text-white px-4 py-2 rounded-lg shadow-sm flex items-center gap-2">
                        <span className="text-xl">⛪</span>
                        <div className="flex flex-col">
                           <span className="text-xs text-blue-200 font-medium">عدد الكنائس</span>
                           <span className="font-bold"><span className="font-sans">{formatNumber(totalChurches)}</span> كنيسة</span>
                        </div>
                     </div>
                 </div>
              );
          })()}

          {/* STATUS NAVIGATION TABS */}
          {(() => {
              let all = 0, initial = 0, executed = 0, cancelled = 0;
              (data.churches || []).forEach(ch => {
                (ch.servantsGroups || []).forEach(sg => {
                  (sg.cases || []).forEach(c => {
                    all++;
                    const st = c.status || 'initial';
                    if (st === 'executed') executed++;
                    else if (st === 'cancelled') cancelled++;
                    else initial++;
                  });
                });
              });

              return (
                <div className="flex flex-wrap items-center gap-2 mb-6 bg-white p-2 rounded-xl shadow-sm border border-gray-200">
                  <button
                    type="button"
                    onClick={() => setFilterStatus('all')}
                    className={`flex items-center gap-2 px-4 py-2.5 rounded-lg text-sm font-bold transition-all ${
                      filterStatus === 'all'
                        ? 'bg-[#002f6c] text-white shadow-md'
                        : 'text-gray-600 hover:bg-gray-100'
                    }`}
                  >
                    <span>🌐 كل المشاريع</span>
                    <span className={`px-2 py-0.5 rounded-full text-xs font-sans ${filterStatus === 'all' ? 'bg-white/20 text-white' : 'bg-gray-200 text-gray-700'}`}>
                      {formatNumber(all)}
                    </span>
                  </button>

                  <button
                    type="button"
                    onClick={() => setFilterStatus('initial')}
                    className={`flex items-center gap-2 px-4 py-2.5 rounded-lg text-sm font-bold transition-all ${
                      filterStatus === 'initial'
                        ? 'bg-amber-600 text-white shadow-md'
                        : 'text-amber-800 hover:bg-amber-50'
                    }`}
                  >
                    <span>⏳ موافقة مبدئية</span>
                    <span className={`px-2 py-0.5 rounded-full text-xs font-sans ${filterStatus === 'initial' ? 'bg-white/20 text-white' : 'bg-amber-100 text-amber-900'}`}>
                      {formatNumber(initial)}
                    </span>
                  </button>

                  <button
                    type="button"
                    onClick={() => setFilterStatus('executed')}
                    className={`flex items-center gap-2 px-4 py-2.5 rounded-lg text-sm font-bold transition-all ${
                      filterStatus === 'executed'
                        ? 'bg-emerald-600 text-white shadow-md'
                        : 'text-emerald-800 hover:bg-emerald-50'
                    }`}
                  >
                    <span>✅ مشاريع منفذة</span>
                    <span className={`px-2 py-0.5 rounded-full text-xs font-sans ${filterStatus === 'executed' ? 'bg-white/20 text-white' : 'bg-emerald-100 text-emerald-900'}`}>
                      {formatNumber(executed)}
                    </span>
                  </button>

                  <button
                    type="button"
                    onClick={() => setFilterStatus('cancelled')}
                    className={`flex items-center gap-2 px-4 py-2.5 rounded-lg text-sm font-bold transition-all ${
                      filterStatus === 'cancelled'
                        ? 'bg-red-600 text-white shadow-md'
                        : 'text-red-700 hover:bg-red-50'
                    }`}
                  >
                    <span>❌ لم تُنفّذ / ملغاة</span>
                    <span className={`px-2 py-0.5 rounded-full text-xs font-sans ${filterStatus === 'cancelled' ? 'bg-white/20 text-white' : 'bg-red-100 text-red-800'}`}>
                      {formatNumber(cancelled)}
                    </span>
                  </button>
                </div>
              );
          })()}

          {/* ADVANCED FILTERS */}
          <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-5 mb-6">
             <div className="flex justify-between items-center mb-4 border-b border-gray-50 pb-2">
                <h4 className="text-sm font-bold text-gray-700 flex items-center gap-2"><Search size={16} className="text-[#002f6c]"/> تصفية متقدمة</h4>
                {(searchQuery || filterRegion || filterChurch || filterServant || filterProject || filterCase) && (
                   <button onClick={() => { setSearchQuery(''); setFilterRegion(''); setFilterChurch(''); setFilterServant(''); setFilterProject(''); setFilterCase(''); }} className="text-xs flex items-center gap-1 text-red-500 hover:text-red-700 bg-red-50 hover:bg-red-100 px-3 py-1.5 rounded-md transition-colors font-medium">
                       <RotateCcw size={14}/> إعادة ضبط الفلاتر
                   </button>
                )}
             </div>

             {/* Search input bar */}
             <div className="mb-4">
                <div className="relative">
                   <div className="absolute inset-y-0 right-0 pr-3.5 flex items-center pointer-events-none text-gray-400">
                      <Search size={16} />
                   </div>
                   <input
                      type="text"
                      value={searchQuery}
                      onChange={e => setSearchQuery(e.target.value)}
                      placeholder="بحث سريع بأي كلمة (اسم الحالة، الرقم القومي، رقم الهاتف، نوع المشروع، الكنيسة، القرية، الخادم...)"
                      className="w-full text-sm border border-gray-200 rounded-lg pr-10 pl-10 py-2.5 outline-none focus:border-[#002f6c] focus:ring-2 focus:ring-[#002f6c]/20 bg-gray-50/50 hover:bg-white focus:bg-white transition-all text-gray-800 placeholder-gray-400"
                   />
                   {searchQuery && (
                      <button
                         onClick={() => setSearchQuery('')}
                         className="absolute inset-y-0 left-0 pl-3.5 flex items-center text-gray-400 hover:text-red-500 transition-colors"
                         title="مسح البحث"
                      >
                         <X size={16} />
                      </button>
                   )}
                </div>
             </div>

             <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4">
                   <SearchableSelect
                      label={'\u0642\u0627\u0626\u0645\u0629 \u0627\u0644\u0645\u0646\u0627\u0637\u0642'}
                      value={filterRegion}
                      onChange={val => { setFilterRegion(val); setFilterChurch(''); }}
                      options={uniqueRegions}
                      placeholder={'\u0643\u0644 \u0627\u0644\u0645\u0646\u0627\u0637\u0642'}
                   />
                   <SearchableSelect
                      label={'\u0642\u0627\u0626\u0645\u0629 \u0627\u0644\u0643\u0646\u0627\u0626\u0633'}
                      value={filterChurch}
                      onChange={val => setFilterChurch(val)}
                      options={uniqueChurches}
                      placeholder={'\u0643\u0644 \u0627\u0644\u0643\u0646\u0627\u0626\u0633'}
                   />
                   <SearchableSelect
                      label={'\u0642\u0627\u0626\u0645\u0629 \u0627\u0644\u062e\u062f\u0627\u0645'}
                      value={filterServant}
                      onChange={val => setFilterServant(val)}
                      options={uniqueServants}
                      placeholder={'\u0643\u0644 \u0627\u0644\u062e\u062f\u0627\u0645'}
                   />
                   <SearchableSelect
                      label={'\u0642\u0627\u0626\u0645\u0629 \u0623\u0646\u0648\u0627\u0639 \u0627\u0644\u0645\u0634\u0627\u0631\u064a\u0639'}
                      value={filterProject}
                      onChange={val => setFilterProject(val)}
                      options={uniqueProjects}
                      placeholder={'\u0643\u0644 \u0627\u0644\u0645\u0634\u0627\u0631\u064a\u0639'}
                   />
                   <SearchableSelect
                      label={'\u0642\u0627\u0626\u0645\u0629 \u0627\u0644\u062d\u0627\u0644\u0627\u062a'}
                      value={filterCase}
                      onChange={val => setFilterCase(val)}
                      options={uniqueCases}
                      placeholder={'\u0643\u0644 \u0627\u0644\u062d\u0627\u0644\u0627\u062a'}
                   />
                </div>
          </div>
          
          <div className="mb-6 flex flex-col sm:flex-row justify-between items-start sm:items-end gap-4">
            <h3 className="text-lg font-bold text-gray-800">الكنائس والمناطق ({formatNumber((data.churches||[]).length)})</h3>
            {!isReadOnly && <button onClick={handleAddChurch} className="flex items-center gap-1.5 bg-[#002f6c] text-white hover:bg-[#001f4c] px-4 py-2 rounded-md text-sm font-medium shadow-sm transition-colors">
              <Plus size={16} /> إضافة كنيسة/منطقة
            </button>}
          </div>

          {(data.churches || []).length === 0 ? (
            <div className="text-center py-16 bg-white rounded-xl border border-dashed border-gray-300">
              <MapPin size={48} className="mx-auto text-gray-300 mb-3" />
              <p className="text-gray-500 font-medium text-lg">لم يتم إضافة أي كنائس بعد</p>
              <p className="text-gray-400 text-sm mt-1">اضغط على زر إضافة كنيسة للبدء في التسجيل</p>
            </div>
          ) : (
            <div className="space-y-8">
              {(() => {
                if (filteredChurches.length === 0 && (filterStatus !== 'all' || filterRegion || filterChurch || filterServant || filterProject || filterCase || searchQuery)) {
                    return (
                        <div className="text-center py-12 bg-white rounded-xl border border-gray-100">
                           <Search size={48} className="mx-auto text-gray-200 mb-3" />
                           <p className="text-gray-500 font-medium text-lg">لا توجد نتائج مطابقة للبحث</p>
                        </div>
                    );
                }

                const groupedByRegion = filteredChurches.reduce((acc, ch) => {
                    const r = ch.regionName || 'منطقة غير محددة';
                    if(!acc[r]) acc[r] = [];
                    acc[r].push(ch);
                    return acc;
                }, {});
                
                return Object.entries(groupedByRegion).map(([regionName, churchesInRegion]) => {
                    const regionStats = churchesInRegion.reduce((acc, ch) => {
                        const s = getChurchStats(ch);
                        acc.totalChurches += 1;
                        acc.totalGroups += s.totalGroups;
                        acc.totalCases += s.totalCases;
                        acc.totalValue += s.totalValue;
                        acc.totalInst += s.totalInst;
                        return acc;
                    }, {totalChurches: 0, totalGroups: 0, totalCases: 0, totalValue: 0, totalInst: 0});
                    
                    return (
                        <div key={regionName} className="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden mb-6">
                            <div className="p-4 sm:p-5 border-b border-gray-200 bg-[#002f6c]/10 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 cursor-pointer hover:bg-[#002f6c]/20 transition-colors" onClick={() => toggleRegion(regionName)}>
                                <div className="flex-1 flex flex-wrap items-center gap-2 text-sm sm:text-base font-bold text-[#002f6c]">
                                    <span className="text-lg">🏛️ {regionName}</span>
                                    <div className="mr-auto flex flex-wrap gap-2 items-center">
                                       <span className="bg-white text-[#002f6c] border border-[#002f6c]/30 px-3 py-1 rounded-full text-xs font-bold shadow-sm whitespace-nowrap">
                                          ⛪ <span className="font-sans">{formatNumber(regionStats.totalChurches)}</span> كنائس
                                       </span>
                                       <span className="bg-white text-blue-600 border border-blue-200 px-3 py-1 rounded-full text-xs font-bold shadow-sm whitespace-nowrap">
                                          👥 <span className="font-sans">{formatNumber(regionStats.totalGroups)}</span> مجموعات
                                       </span>
                                       <span className="bg-white text-[#d4af37] border border-[#d4af37]/30 px-3 py-1 rounded-full text-xs font-bold shadow-sm whitespace-nowrap">
                                          📊 <span className="font-sans">{formatNumber(regionStats.totalCases)}</span> مشاريع
                                       </span>
                                       <span className="bg-white text-green-700 border border-green-200 px-3 py-1 rounded-full text-xs font-bold shadow-sm whitespace-nowrap">
                                          💰 <span className="font-sans">{formatNumber(regionStats.totalValue)}</span> ج.م
                                       </span>
                                    </div>
                                </div>
                                <div className="text-gray-500">
                                   {(expandedRegions[regionName] !== undefined ? expandedRegions[regionName] : Boolean(searchQuery)) ? <ChevronUp size={24} /> : <ChevronDown size={24} />}
                                </div>
                            </div>
                            
                            {(expandedRegions[regionName] !== undefined ? expandedRegions[regionName] : Boolean(searchQuery)) && (
                                <div className="p-4 sm:p-5 space-y-6 bg-gray-50/50">
                                    {churchesInRegion.map((churchLoc) => (
                                        <div key={churchLoc.id} className="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                  {/* Accordion Header */}
                  <div 
                    className="p-4 sm:p-5 border-b border-gray-200 bg-[#002f6c]/5 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 cursor-pointer hover:bg-[#002f6c]/10 transition-colors"
                    onClick={() => toggleChurch(churchLoc.id)}
                  >
                    <div className="flex-1 flex flex-wrap items-center gap-2 text-sm sm:text-base font-bold text-[#002f6c]">
                      <span>{churchLoc.regionName || 'منطقة غير محددة'}</span>
                      <span className="text-gray-400">-</span>
                      <span>{churchLoc.villageName || 'قرية غير محددة'}</span>
                      <span className="text-gray-400">-</span>
                      <span>{churchLoc.churchName || 'كنيسة غير محددة'}</span>
                      {(() => {
                         const stats = getChurchStats(churchLoc);
                         return (
                           <div className="mr-auto flex flex-wrap gap-2 items-center">
                              <span className="bg-white text-blue-600 border border-blue-200 px-3 py-1 rounded-full text-xs font-bold shadow-sm whitespace-nowrap">
                                 👥 <span className="font-sans">{formatNumber(stats.totalGroups)}</span> مجموعة
                              </span>
                              <span className="bg-white text-[#d4af37] border border-[#d4af37]/30 px-3 py-1 rounded-full text-xs font-bold shadow-sm whitespace-nowrap">
                                 📊 <span className="font-sans">{formatNumber(stats.totalCases)}</span> مشاريع
                              </span>
                              <span className="bg-white text-green-700 border border-green-200 px-3 py-1 rounded-full text-xs font-bold shadow-sm whitespace-nowrap">
                                 💰 <span className="font-sans">{formatNumber(stats.totalValue)}</span> ج.م
                              </span>
                              <span className="bg-white text-[#8a7222] border border-[#f0e0a8] px-3 py-1 rounded-full text-xs font-bold shadow-sm whitespace-nowrap hidden sm:inline-block">
                                 💸 <span className="font-sans">{formatNumber(stats.totalInst)}</span> ج.م
                              </span>
                           </div>
                         );
                      })()}
                    </div>
                    <div className="flex items-center gap-2">
                       {!isReadOnly && <button onClick={(e) => { e.stopPropagation(); handleDeleteChurch(churchLoc.id); }} className="text-red-500 hover:text-red-700 hover:bg-red-50 p-2 rounded-md transition-colors" title="حذف الكنيسة"><Trash2 size={20}/></button>}
                       <div className="text-gray-500">
                          {expandedChurches[churchLoc.id] ? <ChevronUp size={24} /> : <ChevronDown size={24} />}
                       </div>
                    </div>
                  </div>
                  
                  {/* Accordion Body */}
                  {(expandedChurches[churchLoc.id] !== undefined ? expandedChurches[churchLoc.id] : Boolean(searchQuery)) && (
                    <div className="animate-fade-in border-t-2 border-[#002f6c]">
                      {/* Edit Fields */}
                      <div className="p-4 sm:p-5 bg-gray-50 border-b border-gray-200 flex-1 w-full grid grid-cols-1 sm:grid-cols-3 gap-4">
                        <div><label className="block text-xs font-medium text-[#002f6c] mb-1">المنطقة</label><MicInput value={churchLoc.regionName||''} onValueChange={(v) => handleUpdateChurch({...churchLoc, regionName: v})} placeholder="اسم المنطقة" disabled={isReadOnly} /></div>
                        <div><label className="block text-xs font-medium text-[#002f6c] mb-1">القرية</label><MicInput value={churchLoc.villageName||''} onValueChange={(v) => handleUpdateChurch({...churchLoc, villageName: v})} placeholder="اسم القرية" disabled={isReadOnly} /></div>
                        <div><label className="block text-xs font-medium text-[#002f6c] mb-1">الكنيسة</label><MicInput value={churchLoc.churchName||''} onValueChange={(v) => handleUpdateChurch({...churchLoc, churchName: v})} placeholder="اسم الكنيسة" disabled={isReadOnly} /></div>
                      </div>
                      
                      <div className="p-4 sm:p-5 space-y-6">
                        {(churchLoc.servantsGroups || []).map(group => (
                          <ServantsGroupView 
                            key={group.id} 
                            group={group} 
                            churchId={churchLoc.id} 
                            onUpdateGroup={handleUpdateGroup} 
                            onDeleteGroup={handleDeleteGroup} 
                            serialMap={serialMap} 
                            onEditCase={handleEditCase} 
                            onDeleteCase={handleDeleteCase}
                            onExecuteCase={(caseObj, chId, grpId) => setExecutingCaseInfo({ caseObj, churchId: chId, groupId: grpId, churchName: churchLoc.churchName })}
                          />
                        ))}
                        <div className="flex justify-center">
                          {!isReadOnly && <button onClick={() => handleAddGroup(churchLoc.id)} className="flex items-center gap-2 bg-gray-50 hover:bg-gray-100 text-[#002f6c] text-sm font-medium py-2 px-5 rounded-md transition-colors border border-gray-300 border-dashed">
                            <Plus size={16} /> إضافة خدام آخرين لنفس الكنيسة
                          </button>}
                        </div>
                      </div>
                    </div>
                  )}
                </div>
              ))}
                                </div>
                            )}
                        </div>
                    );
                });
            })()}
            </div>
          )}

          {editingCaseInfo && <CaseModal caseData={editingCaseInfo.caseObj} onSave={handleSaveEditCase} onClose={() => setEditingCaseInfo(null)} />}
          {executingCaseInfo && (
            <ExecutionModal 
              caseData={executingCaseInfo.caseObj} 
              churchName={executingCaseInfo.churchName} 
              onSave={handleSaveExecutionCase} 
              onClose={() => setExecutingCaseInfo(null)} 
            />
          )}
          {editingChurchInfo && (
            <EditChurchModal 
              churchInfo={editingChurchInfo} 
              onSave={handleSaveEditChurch} 
              onClose={() => setEditingChurchInfo(null)} 
            />
          )}
          {showImportModal && (
            <ExcelImportModal 
              visitData={data} 
              onApplyUpdates={handleApplyExcelUpdates} 
              onClose={() => setShowImportModal(false)} 
            />
          )}
        </div>
      );
    }
