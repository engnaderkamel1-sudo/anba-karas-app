                                    <span className="bg-purple-50 text-purple-800 border border-purple-200 px-2.5 py-0.5 rounded-full text-xs font-bold font-sans shadow-sm">
                                      💜 معفى: {formatNumber(reg.exemptedAmount)} ج.م ({reg.exemptedCasesCount} حالة)
                                    </span>
                                  )}
                                  {reg.overdueCasesCount > 0 ? (
                                    <span className="bg-rose-50 text-rose-700 border border-rose-200 px-2.5 py-0.5 rounded-full text-xs font-bold font-sans shadow-sm">
                                      ⚠️ المتأخرات: {formatNumber(reg.overdueAmount)} ج.م ({reg.overdueCasesCount} حالة • {reg.overdueInstallments} قسط • {reg.overduePct}%)
                                    </span>
                                  ) : (
                                    <span className="bg-emerald-50 text-emerald-700 border border-emerald-200 px-2.5 py-0.5 rounded-full text-xs font-bold font-sans shadow-sm">
                                      ✅ السداد منتظم
                                    </span>
                                  )}
                                </div>
                              </div>

                              <div className="flex items-center gap-2 mr-auto sm:mr-0">
                                <button
                                  type="button"
                                  onClick={(e) => {
                                    e.stopPropagation();
                                    triggerBatchPayment(`سداد قسط لمنطقة: ${reg.regionName} (كل النزلات)`, reg.cases, null);
                                  }}
                                  className="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-3 py-1.5 rounded-xl shadow-sm flex items-center gap-1.5 transition-all"
                                  title={`تسجيل سداد قسط لجميع حالات منطقة ${reg.regionName}`}
                                >
                                  <CreditCard size={14} />
                                  <span>سداد المنطقة كلها</span>
                                </button>
                                <div className="text-gray-500">
                                  {isRegExpanded ? <ChevronUp size={22} /> : <ChevronDown size={22} />}
                                </div>
                              </div>
                            </div>

                            {/* Churches within Region */}
                            {isRegExpanded && (
                              <div className="divide-y divide-gray-100 bg-gray-50/30 p-3 sm:p-4 space-y-4">
                                {reg.churches.map(ch => {
                                  const isChExpanded = expandedGeoChurches[ch.key] !== false;
                                  const chProgress = ch.totalVal > 0 ? Math.min(100, Math.round((ch.paidVal / ch.totalVal) * 100)) : 0;

                                  return (
                                    <div key={ch.key} className="bg-white rounded-2xl border border-gray-200 overflow-hidden shadow-sm">
                                      {/* Church Header */}
                                      <div
                                        onClick={() => toggleGeoChurch(ch.key)}
                                        className="p-3.5 sm:p-4 bg-gray-50/80 border-b border-gray-200 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 cursor-pointer hover:bg-gray-100/90 transition-colors select-none"
                                      >
                                        <div className="flex items-center gap-2">
                                          <div className="text-gray-400">
                                            {isChExpanded ? <ChevronUp size={18} /> : <ChevronDown size={18} />}
                                          </div>
                                          <span className="text-base">⛪</span>
                                          <h4 className="font-bold text-sm sm:text-base text-gray-900">
                                            {ch.churchName}
                                            {ch.villageName && (
                                              <span className="text-xs font-normal text-gray-500 mr-2">
                                                • {ch.villageName}
                                              </span>
                                            )}
                                          </h4>
                                        </div>

                                        <div className="flex flex-wrap items-center gap-2 mr-6 sm:mr-0">
                                          <span className="bg-white text-blue-900 border border-blue-200 px-2 py-0.5 rounded-md text-[11px] font-bold font-sans">
                                            🗂️ {formatNumber(ch.visits.length)} زيارات
                                          </span>
                                          <span className="bg-white text-gray-700 border border-gray-200 px-2 py-0.5 rounded-md text-[11px] font-bold font-sans">
                                            📊 {formatNumber(ch.casesCount)} مشاريع
                                          </span>
                                          <span className="bg-white text-emerald-700 border border-emerald-200 px-2 py-0.5 rounded-md text-[11px] font-bold font-sans">
                                            ✅ {formatNumber(ch.paidVal)} ج.م ({chProgress}%)
                                          </span>
                                          <span className="bg-white text-rose-700 border border-rose-200 px-2 py-0.5 rounded-md text-[11px] font-bold font-sans">
                                            ⏳ {formatNumber(ch.remVal)} ج.م متبقي
                                          </span>
                                          {ch.exemptedCasesCount > 0 && (
                                            <span className="bg-purple-50 text-purple-800 border border-purple-200 px-2 py-0.5 rounded-md text-[11px] font-bold font-sans">
                                              💜 معفى: {formatNumber(ch.exemptedAmount)} ج.م ({ch.exemptedCasesCount})
                                            </span>
                                          )}
                                          <span className="bg-white text-amber-800 border border-amber-200 px-2 py-0.5 rounded-md text-[11px] font-bold font-sans">
                                            📅 {formatNumber(ch.monthlyInst)} ج.م/شهر
                                          </span>
                                          {ch.overdueCasesCount > 0 ? (
                                            <span className="bg-rose-50 text-rose-700 border border-rose-200 px-2 py-0.5 rounded-md text-[11px] font-bold font-sans">
                                              ⚠️ المتأخرات: {formatNumber(ch.overdueAmount)} ج.م ({ch.overdueCasesCount} حالة • {ch.overdueInstallments} قسط • {ch.overduePct}%)
                                            </span>
                                          ) : (
                                            <span className="bg-emerald-50 text-emerald-700 border border-emerald-200 px-2 py-0.5 rounded-md text-[11px] font-bold font-sans">
                                              ✅ السداد منتظم
                                            </span>
                                          )}

                                          <button
                                            type="button"
                                            onClick={(e) => {
                                              e.stopPropagation();
                                              triggerBatchPayment(`سداد قسط لكنيسة: ${ch.churchName} (كل النزلات)`, ch.cases, null);
                                            }}
                                            className="bg-emerald-600 hover:bg-emerald-700 text-white text-[11px] font-bold px-2.5 py-1 rounded-lg shadow-sm flex items-center gap-1 transition-all mr-1"
                                            title={`تسجيل سداد قسط لجميع حالات كنيسة ${ch.churchName}`}
                                          >
                                            <CreditCard size={13} />
                                            <span>سداد الكنيسة كلها</span>
                                          </button>
                                        </div>
                                      </div>

                                      {/* Church Visits and Cases Container */}
                                      {isChExpanded && (
                                        <div className="p-3 sm:p-4 space-y-4 bg-gray-50/30">
                                          {ch.visits.map(vData => {
                                            return (
                                              <div key={vData.visitId} className="border border-blue-100 rounded-xl overflow-hidden bg-white shadow-xs">
                                                {/* Visit Partition Banner */}
                                                <div className="bg-gradient-to-r from-blue-50 to-indigo-50/40 p-2.5 sm:p-3 border-b border-blue-100 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
                                                  <div className="flex flex-wrap items-center gap-2">
                                                    <span className="text-sm">🏛️</span>
                                                    <span className="font-bold text-xs sm:text-sm text-[#002f6c]">{vData.visitLocation || 'زيارة بدون اسم'}</span>
                                                    <span className="text-xs text-gray-500 font-sans flex items-center gap-1 mr-2">
                                                      <Calendar size={13} className="text-gray-400" />
                                                      <span>{vData.visitDate}</span>
                                                    </span>
                                                    <span className="bg-white text-[#002f6c] border border-blue-200 text-[10px] font-bold px-2 py-0.5 rounded-full font-sans">
                                                      {formatNumber(vData.cases.length)} حالات بهذه النزلة
                                                    </span>
                                                    {vData.exemptedCasesCount > 0 && (
                                                      <span className="bg-purple-100 text-purple-800 border border-purple-200 text-[10px] font-bold px-2 py-0.5 rounded-full font-sans">
                                                        💜 معفى: {formatNumber(vData.exemptedAmount)} ج.م ({vData.exemptedCasesCount})
                                                      </span>
                                                    )}
                                                    {vData.overdueCasesCount > 0 ? (
                                                      <span className="bg-rose-100 text-rose-800 border border-rose-200 text-[10px] font-bold px-2 py-0.5 rounded-full font-sans">
                                                        ⚠️ متأخرات: {formatNumber(vData.overdueAmount)} ج.م ({vData.overdueCasesCount} حالة • {vData.overdueInstallments} قسط)
                                                      </span>
                                                    ) : (
                                                      <span className="bg-emerald-100 text-emerald-800 border border-emerald-200 text-[10px] font-bold px-2 py-0.5 rounded-full font-sans">
                                                        ✅ سداد منتظم
                                                      </span>
                                                    )}
                                                  </div>

                                                  <button
                                                    type="button"
                                                    onClick={() => triggerBatchPayment(`سداد قسط لنزلة (${vData.visitLocation} - ${vData.visitDate}) بكنيسة ${ch.churchName}`, vData.cases, vData.visitId)}
                                                    className="bg-emerald-600 hover:bg-emerald-700 text-white text-[11px] font-bold px-2.5 py-1 rounded-lg transition-colors flex items-center gap-1 shadow-sm"
                                                    title="تسجيل سداد قسط لحالات هذه النزلة فقط"
                                                  >
                                                    <CreditCard size={12} />
                                                    <span>سداد هذه النزلة ({vData.cases.length})</span>
                                                  </button>
                                                </div>

                                                {/* Desktop Table View */}
                                                <div className="hidden md:block overflow-x-auto">
                                                  <table className="w-full text-right text-xs">
                                                    <thead className="bg-gray-50 text-gray-600 font-bold border-b border-gray-200">
                                                      <tr>
                                                        <th className="p-3 w-12 text-center">م</th>
                                                        <th className="p-3">اسم المستفيد</th>
                                                        <th className="p-3">نوع المشروع المنفذ</th>
                                                        <th className="p-3">تاريخ التنفيذ</th>
                                                        <th className="p-3">أصل المبلغ</th>
                                                        <th className="p-3">القسط الشهري</th>
                                                        <th className="p-3">المسدد والمتبقي</th>
                                                        <th className="p-3">نسبة السداد</th>
                                                        <th className="p-3 text-center">الحالة</th>
                                                        <th className="p-3 text-center w-28">الإجراءات</th>
                                                      </tr>
                                                    </thead>
                                                    <tbody className="divide-y divide-gray-100">
                                                      {vData.cases.map((item, cIdx) => {
                                                        const pPct = item.totalAmt > 0 ? Math.min(100, Math.round((item.totalPaid / item.totalAmt) * 100)) : 0;
                                                        return (
                                                          <tr key={item.caseObj.id || cIdx} className="hover:bg-blue-50/30 transition-colors">
                                                            <td className="p-3 text-center font-sans text-gray-400 font-bold">{cIdx + 1}</td>
                                                            <td className="p-3 font-bold text-gray-900">
                                                              <div>{item.caseObj.caseName}</div>
                                                              {item.caseObj.nationalId && (
                                                                <div className="text-[10px] text-gray-400 font-sans mt-0.5">رقم قومي: {item.caseObj.nationalId}</div>
                                                              )}
                                                              <div className="text-[10px] text-gray-500 font-normal">الخدام: {item.servantsNames || '—'}</div>
                                                            </td>
                                                            <td className="p-3 font-medium text-blue-900">
                                                              {item.caseObj.executedProjectType || item.caseObj.projectType || '—'}
                                                            </td>
                                                            <td className="p-3 font-sans text-gray-500">
                                                              {item.caseObj.executionDate || '—'}
                                                            </td>
                                                            <td className="p-3 font-sans font-bold text-gray-900">
                                                              {formatNumber(item.totalAmt)} ج.م
                                                            </td>
                                                            <td className="p-3">
                                                              <div className="font-sans font-bold text-amber-800">{formatNumber(item.monthlyAmt)} ج.م / شهر</div>
                                                              <div className="text-[10px] text-gray-500 font-sans">{item.totalMonths} شهر استحقاق</div>
                                                            </td>
                                                            <td className="p-3">
                                                              <div className="font-sans font-bold text-emerald-700">{formatNumber(item.totalPaid)} ج.م مسدد</div>
                                                              {item.isExempted ? (
                                                                <div className="font-sans text-[11px] text-purple-700 font-bold">معفى: {formatNumber(item.exemptedAmount)} ج.م</div>
                                                              ) : (
                                                                <div className="font-sans text-[11px] text-rose-600 font-bold">متبقي: {formatNumber(item.remainingAmt)} ج.م</div>
                                                              )}
                                                            </td>
                                                            <td className="p-3 w-28">
                                                              <div className="flex justify-between text-[10px] font-bold font-sans text-gray-600 mb-1">
                                                                <span>{pPct}%</span>
                                                              </div>
                                                              <div className="w-full bg-gray-200 h-2 rounded-full overflow-hidden">
                                                                <div 
                                                                  className={`h-full ${item.isExempted ? 'bg-purple-600' : item.isCompleted ? 'bg-emerald-500' : 'bg-blue-600'}`} 
                                                                  style={{ width: `${pPct}%` }}
                                                                />
                                                              </div>
                                                            </td>
                                                            <td className="p-3 text-center">
                                                              {item.isExempted ? (
                                                                <span className="bg-purple-100 text-purple-800 border border-purple-300 px-2 py-0.5 rounded-full text-[10px] font-bold inline-flex items-center gap-1" title={item.exemptionReason ? `سبب الإعفاء: ${item.exemptionReason}` : ''}>
                                                                  <span>💜</span> معفى {item.exemptionReason ? `(${item.exemptionReason})` : ''}
                                                                </span>
                                                              ) : item.isCompleted ? (
                                                                <span className="bg-emerald-100 text-emerald-800 border border-emerald-300 px-2 py-0.5 rounded-full text-[10px] font-bold inline-flex items-center gap-1">
                                                                  <span>✅</span> مكتمل
                                                                </span>
                                                              ) : item.isOverdue ? (
                                                                <span className="bg-rose-100 text-rose-800 border border-rose-300 px-2 py-0.5 rounded-full text-[10px] font-bold inline-flex items-center gap-1 font-sans" title={`المستحق حتى اليوم: ${formatNumber(item.expectedDueAmount)} ج.م`}>
                                                                  <span>⚠️</span> متأخر ({item.overdueCount} قسط • {formatNumber(item.overdueAmount)} ج.م)
                                                                </span>
                                                              ) : item.totalPaid > 0 ? (
                                                                <span className="bg-amber-100 text-amber-800 border border-amber-300 px-2 py-0.5 rounded-full text-[10px] font-bold inline-flex items-center gap-1">
                                                                  <span>🔄</span> جاري
                                                                </span>
                                                              ) : (
                                                                <span className="bg-gray-100 text-gray-700 border border-gray-300 px-2 py-0.5 rounded-full text-[10px] font-bold inline-flex items-center gap-1">
                                                                  <span>⏳</span> لم يبدأ
                                                                </span>
                                                              )}
                                                            </td>
                                                            <td className="p-3 text-center">
                                                              <button
                                                                type="button"
                                                                onClick={() => setActiveModalCaseInfo(item)}
                                                                className="bg-[#002f6c] hover:bg-[#001f4c] text-white text-xs font-bold px-2.5 py-1.5 rounded-lg shadow-sm flex items-center justify-center gap-1 transition-colors mx-auto"
                                                              >
                                                                <span>💵</span>
                                                                <span>سداد ومتابعة</span>
                                                              </button>
                                                            </td>
                                                          </tr>
                                                        );
                                                      })}
                                                    </tbody>
                                                  </table>
                                                </div>

                                                {/* Mobile Touch Cards View */}
                                                <div className="md:hidden divide-y divide-gray-100 p-2.5 space-y-2.5 bg-gray-50/50">
                                                  {vData.cases.map((item, cIdx) => {
                                                    const pPct = item.totalAmt > 0 ? Math.min(100, Math.round((item.totalPaid / item.totalAmt) * 100)) : 0;
                                                    return (
                                                      <div key={item.caseObj.id || cIdx} className="bg-white rounded-xl p-3 border border-gray-200 shadow-xs space-y-2.5">
                                                        <div className="flex justify-between items-start gap-2">
                                                          <div>
                                                            <div className="font-bold text-xs sm:text-sm text-gray-900">{item.caseObj.caseName}</div>
                                                            {item.caseObj.nationalId && (
                                                              <div className="text-[10px] text-gray-500 font-sans mt-0.5">رقم قومي: {item.caseObj.nationalId}</div>
                                                            )}
                                                            <div className="text-[10px] text-gray-500 mt-0.5">الخدام: {item.servantsNames || '—'}</div>
                                                          </div>
                                                          {item.isExempted ? (
                                                            <span className="bg-purple-100 text-purple-800 border border-purple-300 px-2.5 py-1 rounded-full text-[10px] font-bold shrink-0">
                                                              💜 معفى {item.exemptionReason ? `(${item.exemptionReason})` : ''}
                                                            </span>
                                                          ) : item.isCompleted ? (
                                                            <span className="bg-emerald-100 text-emerald-800 border border-emerald-300 px-2.5 py-1 rounded-full text-[10px] font-bold shrink-0">
                                                              ✅ مكتمل
                                                            </span>
                                                          ) : item.isOverdue ? (
                                                            <span className="bg-rose-100 text-rose-800 border border-rose-300 px-2.5 py-1 rounded-full text-[10px] font-bold shrink-0 font-sans">
                                                              ⚠️ متأخر ({item.overdueCount} قسط • {formatNumber(item.overdueAmount)} ج.م)
                                                            </span>
                                                          ) : item.totalPaid > 0 ? (
                                                            <span className="bg-amber-100 text-amber-800 border border-amber-300 px-2.5 py-1 rounded-full text-[10px] font-bold shrink-0">
                                                              🔄 جاري
                                                            </span>
                                                          ) : (
                                                            <span className="bg-gray-100 text-gray-700 border border-gray-300 px-2.5 py-1 rounded-full text-[10px] font-bold shrink-0">
                                                              ⏳ لم يبدأ
                                                            </span>
                                                          )}
                                                        </div>

                                                        <div className="grid grid-cols-3 gap-1.5 text-center bg-gray-50 p-2 rounded-lg border border-gray-100">
                                                          <div>
                                                            <div className="text-[9px] text-gray-500">أصل المبلغ</div>
                                                            <div className="font-bold text-[11px] font-sans text-gray-900 mt-0.5">{formatNumber(item.totalAmt)} ج.م</div>
                                                          </div>
                                                          <div>
                                                            <div className="text-[9px] text-gray-500">المسدد</div>
                                                            <div className="font-bold text-[11px] font-sans text-emerald-700 mt-0.5">{formatNumber(item.totalPaid)} ج.م</div>
                                                          </div>
                                                          <div>
                                                            {item.isExempted ? (
                                                              <>
                                                                <div className="text-[9px] text-purple-600">المعفى</div>
                                                                <div className="font-bold text-[11px] font-sans text-purple-700 mt-0.5">{formatNumber(item.exemptedAmount)} ج.م</div>
                                                              </>
                                                            ) : (
                                                              <>
                                                                <div className="text-[9px] text-gray-500">المتبقي</div>
                                                                <div className="font-bold text-[11px] font-sans text-rose-600 mt-0.5">{formatNumber(item.remainingAmt)} ج.م</div>
                                                              </>
                                                            )}
                                                          </div>
                                                        </div>

                                                        <div className="space-y-1">
                                                          <div className="flex justify-between text-[10px] text-gray-600 font-sans">
                                                            <span>القسط: <strong className="text-amber-800">{formatNumber(item.monthlyAmt)}</strong> ج.م / شهر</span>
                                                            <span className="font-bold text-[#002f6c]">{pPct}%</span>
                                                          </div>
                                                          <div className="w-full bg-gray-200 h-1.5 rounded-full overflow-hidden">
                                                            <div 
                                                              className={`h-full ${item.isExempted ? 'bg-purple-600' : item.isCompleted ? 'bg-emerald-500' : 'bg-blue-600'}`} 
                                                              style={{ width: `${pPct}%` }}
                                                            />
                                                          </div>
                                                        </div>

                                                        <button
                                                          type="button"
                                                          onClick={() => setActiveModalCaseInfo(item)}
                                                          className="w-full bg-[#002f6c] hover:bg-[#001f4c] text-white text-[11px] font-bold py-2 px-3 rounded-lg shadow-xs flex items-center justify-center gap-1.5 transition-colors"
                                                        >
                                                          <span>💵</span>
                                                          <span>سداد ومتابعة الأقساط</span>
                                                        </button>
                                                      </div>
                                                    );
                                                  })}
                                                </div>
                                              </div>
                                            );
                                          })}
                                        </div>
                                      )}
                                    </div>
                                  );
                                })}
                              </div>
                            )}
                          </div>
                        );
                      })}
                    </div>
                  )}
                </div>
              
    </div>
  );
}

function InstallmentsTableView({
  allExecutedCases,
  filteredCases,
  filterStatus,
  setFilterStatus,
  filterChurch,
  setFilterChurch,
  uniqueChurches,
  activeCount,
  completedCount,
  unpaidCount,
  overdueCasesCount,
  exemptedCasesCount,
  projectAnalyticsData,
  selectedAnalyticsCategory,
  setSelectedAnalyticsCategory,
  setShowProjectDictModal,
  setActiveModalCaseInfo
}) {
  return (
    <div className="space-y-4">
                  <div className="bg-white rounded-2xl shadow-sm border border-gray-100 p-4 space-y-3">
                    <div className="flex flex-wrap gap-2 border-b border-gray-100 pb-3">
                      <button
                        type="button"
                        onClick={() => setFilterStatus('all')}
                        className={`px-3.5 py-1.5 rounded-xl text-xs font-bold transition-all ${
                          filterStatus === 'all' 
                            ? 'bg-[#002f6c] text-white shadow-sm' 
                            : 'bg-gray-100 text-gray-600 hover:bg-gray-200'
                        }`}
                      >
                        🌐 كل الحالات ({formatNumber(allExecutedCases.length)})
                      </button>
                      <button
                        type="button"
                        onClick={() => setFilterStatus('active')}
                        className={`px-3.5 py-1.5 rounded-xl text-xs font-bold transition-all ${
                          filterStatus === 'active' 
                            ? 'bg-amber-600 text-white shadow-sm' 
                            : 'bg-gray-100 text-gray-600 hover:bg-gray-200'
                        }`}
                      >
                        🔄 جاري السداد ({formatNumber(activeCount)})
                      </button>
                      <button
                        type="button"
                        onClick={() => setFilterStatus('completed')}
                        className={`px-3.5 py-1.5 rounded-xl text-xs font-bold transition-all ${
                          filterStatus === 'completed' 
                            ? 'bg-emerald-600 text-white shadow-sm' 
                            : 'bg-gray-100 text-gray-600 hover:bg-gray-200'
                        }`}
                      >
                        ✅ مكتمل السداد ({formatNumber(completedCount)})
                      </button>
                      <button
                        type="button"
                        onClick={() => setFilterStatus('unpaid')}
                        className={`px-3.5 py-1.5 rounded-xl text-xs font-bold transition-all ${
                          filterStatus === 'unpaid' 
                            ? 'bg-rose-600 text-white shadow-sm' 
                            : 'bg-gray-100 text-gray-600 hover:bg-gray-200'
                        }`}
                      >
                        ⏳ لم يبدأ السداد ({formatNumber(unpaidCount)})
                      </button>
                      <button
                        type="button"
                        onClick={() => setFilterStatus('overdue')}
                        className={`px-3.5 py-1.5 rounded-xl text-xs font-bold transition-all ${

    function InstallmentsPage({ allVisits, onUpdateVisit, onExport }) {
      const activeVisits = (allVisits || []).filter(v => !v.isDeleted);

      // Selected visit for hierarchical breakdown view ('null' means viewing the list of visits or flat table)
      const [selectedVisitIdForDetails, setSelectedVisitIdForDetails] = useState(null);

      // View mode at top level: 'visits' (سجل الزيارات المنفذة) | 'allCases' (عرض كل الحالات مباشرة)
      const [viewMode, setViewMode] = useState('visits');

      // Top-level / Visit-level Filters
      const [filterStatus, setFilterStatus] = useState('all'); // 'all' | 'completed' | 'active' | 'unpaid'
      const [filterRegion, setFilterRegion] = useState('');
      const [filterChurch, setFilterChurch] = useState('');
      const [filterSearch, setFilterSearch] = useState('');

      // Accordion states for hierarchical visit view
      const [expandedRegions, setExpandedRegions] = useState({});
      const [expandedChurches, setExpandedChurches] = useState({});
      const toggleRegion = (reg) => setExpandedRegions(prev => ({ ...prev, [reg]: prev[reg] === false ? true : false }));
      const toggleChurch = (chId) => setExpandedChurches(prev => ({ ...prev, [chId]: prev[chId] === false ? true : false }));

      // Accordion states for Geographic (Region -> Church -> Visits) view
      const [expandedGeoRegions, setExpandedGeoRegions] = useState({});
      const [expandedGeoChurches, setExpandedGeoChurches] = useState({});
      const toggleGeoRegion = (reg) => setExpandedGeoRegions(prev => ({ ...prev, [reg]: prev[reg] === false ? true : false }));
      const toggleGeoChurch = (key) => setExpandedGeoChurches(prev => ({ ...prev, [key]: prev[key] === false ? true : false }));

      // Modals
      const [activeModalCaseInfo, setActiveModalCaseInfo] = useState(null);
      const [showAddLegacyModal, setShowAddLegacyModal] = useState(false);
      const [showImportLegacyModal, setShowImportLegacyModal] = useState(false);
      const [showProjectDictModal, setShowProjectDictModal] = useState(false);
      const [batchPaymentConfig, setBatchPaymentConfig] = useState(null);

      // Project Dictionary (Loaded from visits + user-defined rules)
      const [projectDictionary, setProjectDictionary] = useState(() => buildEffectiveProjectDictionary(allVisits));
      useEffect(() => {
        setProjectDictionary(buildEffectiveProjectDictionary(allVisits));
      }, [allVisits]);

      // Helper to compute case stats
      const extractCaseData = (c, v, ch, sg) => {
        const totalAmt = parseFloat(c.executedProjectValue || c.projectValue) || 0;
        const monthlyAmt = parseFloat(c.executedInstallmentAmount || c.installmentAmount) || 0;
        const totalMonths = monthlyAmt > 0 ? Math.ceil(totalAmt / monthlyAmt) : 0;
        const payments = c.payments || [];
        const totalPaid = payments.reduce((sum, p) => sum + (parseFloat(p.amount) || 0), 0);
        const rawRemaining = Math.max(0, totalAmt - totalPaid);

        // Exemption (إعفاء الحالة لوفاة أو مرض)
        const isExempted = !!c.isExempted;
        const exemptionReason = c.exemptionReason || '';
        const exemptionNotes = c.exemptionNotes || '';
        const exemptedAt = c.exemptedAt || '';
        const exemptedAmount = isExempted
          ? (c.exemptedAmount !== undefined ? parseFloat(c.exemptedAmount) : rawRemaining)
          : 0;
        const remainingAmt = isExempted ? 0 : rawRemaining;
        const isCompleted = !isExempted && remainingAmt <= 0 && totalAmt > 0;

        // Compute Due & Arrears (المتأخرات) - Excluded 100% if exempted
        let expectedDueAmount = 0;
        let dueInstallmentsCount = 0;
        let overdueAmount = 0;
        let overdueCount = 0;
        let isOverdue = false;

        if (!isExempted && !isCompleted && totalAmt > 0 && monthlyAmt > 0) {
          const hasFirstDate = !!c.firstInstallmentDate;
          const rawStart = c.firstInstallmentDate || c.executionDate || v.date;
          if (rawStart) {
            const startDate = new Date(rawStart);
            const today = new Date();
            for (let i = 1; i <= totalMonths; i++) {
              const dueDate = new Date(startDate);
              if (hasFirstDate) {
                dueDate.setMonth(dueDate.getMonth() + (i - 1));
              } else {
                dueDate.setMonth(dueDate.getMonth() + i);
              }
              if (dueDate <= today) {
                dueInstallmentsCount++;
                const instAmt = (i === totalMonths && totalAmt % monthlyAmt !== 0)
                  ? (totalAmt - (totalMonths - 1) * monthlyAmt)
                  : monthlyAmt;
                expectedDueAmount += instAmt;
              } else {
                break;
              }
            }
            expectedDueAmount = Math.min(expectedDueAmount, totalAmt);

            if (totalPaid < expectedDueAmount) {
              overdueAmount = Math.min(remainingAmt, expectedDueAmount - totalPaid);
              overdueCount = Math.ceil(overdueAmount / monthlyAmt);
              isOverdue = overdueAmount > 0;
            }
          }
        }

        return {
          visitId: v.id,
          visitDate: v.date,
          visitLocation: v.location,
          regionName: ch.regionName || '',
          churchId: ch.id,
          churchName: ch.churchName || '',
          villageName: ch.villageName || '',
          groupId: sg.id,
          servantsNames: sg.servantsNames || '',
          caseObj: c,
          totalAmt,
          monthlyAmt,
          totalMonths,
          payments,
          totalPaid,
          remainingAmt,
          isCompleted,
          isExempted,
          exemptionReason,
          exemptionNotes,
          exemptedAt,
          exemptedAmount,
          dueInstallmentsCount,
          expectedDueAmount,
          overdueAmount,
          overdueCount,
          isOverdue,
          repaymentState: isExempted ? 'exempted' : (isCompleted ? 'completed' : (isOverdue ? 'overdue' : (totalPaid > 0 ? 'active' : 'unpaid')))
        };
      };

      // Extract all executed cases across all visits
      const allExecutedCases = [];
      activeVisits.forEach(v => {
        (v.churches || []).forEach(ch => {
          (ch.servantsGroups || []).forEach(sg => {
            (sg.cases || []).forEach(c => {
              if (c.status === 'executed') {
                allExecutedCases.push(extractCaseData(c, v, ch, sg));
              }
            });
          });
        });
      });

      // Global Aggregate Financial Metrics
      let sumTotalExecuted = 0;
      let sumTotalPaid = 0;
      let sumMonthlyActiveInstallments = 0;
      let completedCount = 0;
      let activeCount = 0;
      let unpaidCount = 0;
      let overdueCasesCount = 0;
      let sumOverdueAmount = 0;
      let sumOverdueInstallments = 0;
      let exemptedCasesCount = 0;
      let sumExemptedAmount = 0;

      allExecutedCases.forEach(item => {
        sumTotalExecuted += item.totalAmt;
        sumTotalPaid += item.totalPaid;
        if (item.isExempted) {
          exemptedCasesCount++;
          sumExemptedAmount += item.exemptedAmount;
        } else if (item.isCompleted) {
          completedCount++;
        } else {
          if (item.isOverdue) {
            overdueCasesCount++;
            sumOverdueAmount += item.overdueAmount;
            sumOverdueInstallments += item.overdueCount;
          }
          if (item.totalPaid > 0) activeCount++;
          else unpaidCount++;
          sumMonthlyActiveInstallments += item.monthlyAmt;
        }
      });

      const sumTotalRemaining = Math.max(0, sumTotalExecuted - sumTotalPaid - sumExemptedAmount);
      const overallPaidPercentage = sumTotalExecuted > 0 ? Math.round((sumTotalPaid / sumTotalExecuted) * 100) : 0;
      const overdueCasesPercentage = allExecutedCases.length > 0 ? Math.round((overdueCasesCount / allExecutedCases.length) * 100) : 0;

      // Group executed visits with summaries
      const visitsWithExecuted = activeVisits.map(v => {
        const vCases = [];
        (v.churches || []).forEach(ch => {
          (ch.servantsGroups || []).forEach(sg => {
            (sg.cases || []).forEach(c => {
              if (c.status === 'executed') {
                vCases.push(extractCaseData(c, v, ch, sg));
              }
            });
          });
        });

        if (vCases.length === 0) return null;

        const totalVal = vCases.reduce((s, c) => s + c.totalAmt, 0);
        const paidVal = vCases.reduce((s, c) => s + c.totalPaid, 0);
        const exemptedVal = vCases.reduce((s, c) => s + (c.isExempted ? c.exemptedAmount : 0), 0);
        const remVal = Math.max(0, totalVal - paidVal - exemptedVal);
        const activeInst = vCases.filter(c => !c.isCompleted && !c.isExempted).reduce((s, c) => s + c.monthlyAmt, 0);
        const compCount = vCases.filter(c => c.isCompleted).length;
        const exempCount = vCases.filter(c => c.isExempted).length;
        const actCount = vCases.filter(c => !c.isCompleted && !c.isExempted && c.totalPaid > 0).length;
        const unpCount = vCases.filter(c => !c.isCompleted && !c.isExempted && c.totalPaid === 0).length;
        const overdueCases = vCases.filter(c => c.isOverdue);
        const overdueCasesCount = overdueCases.length;
        const overdueAmount = overdueCases.reduce((s, c) => s + c.overdueAmount, 0);
        const overdueInstallments = overdueCases.reduce((s, c) => s + c.overdueCount, 0);
        const overduePct = vCases.length > 0 ? Math.round((overdueCasesCount / vCases.length) * 100) : 0;
        const progressPct = totalVal > 0 ? Math.round((paidVal / totalVal) * 100) : 0;

        return {
          visit: v,
          cases: vCases,
          count: vCases.length,
          totalVal,
          paidVal,
          exemptedVal,
          remVal,
          activeInst,
          compCount,
          exempCount,
          actCount,
          unpCount,
          overdueCasesCount,
          overdueAmount,
          overdueInstallments,
          overduePct,
          progressPct
        };
      }).filter(Boolean);

      // Selected Visit Data if in detail mode
      const selectedVisitData = selectedVisitIdForDetails
        ? visitsWithExecuted.find(item => item.visit.id === selectedVisitIdForDetails)
        : null;

      // Filtered Cases for Global Flat Table view
      const filteredCases = allExecutedCases.filter(item => {
        if (filterStatus === 'completed' && !item.isCompleted) return false;
        if (filterStatus === 'active' && (item.isCompleted || item.isExempted || item.totalPaid === 0)) return false;
        if (filterStatus === 'unpaid' && (item.isCompleted || item.isExempted || item.totalPaid > 0)) return false;
        if (filterStatus === 'overdue' && (!item.isOverdue || item.isExempted)) return false;
        if (filterStatus === 'exempted' && !item.isExempted) return false;

        if (filterRegion && item.regionName !== filterRegion) return false;
        if (filterChurch && item.churchName !== filterChurch) return false;

        if (filterSearch.trim()) {
          const normSearch = normalizeArabicText(filterSearch);
          const nameMatch = normalizeArabicText(item.caseObj.caseName || '').includes(normSearch);
          const typeMatch = normalizeArabicText(item.caseObj.executedProjectType || item.caseObj.projectType || '').includes(normSearch);
          const churchMatch = normalizeArabicText(item.churchName || '').includes(normSearch);
          const idMatch = normalizeArabicText(item.caseObj.nationalId || '').includes(normSearch);
          if (!nameMatch && !typeMatch && !churchMatch && !idMatch) return false;
        }

        return true;
      });

      // Filtered Visits for Visits Record Grid
      const filteredVisits = visitsWithExecuted.filter(item => {
        if (filterRegion) {
          const hasRegion = item.cases.some(c => c.regionName === filterRegion);
          if (!hasRegion) return false;
        }
        if (filterSearch.trim()) {
          const norm = normalizeArabicText(filterSearch);
          const locMatch = normalizeArabicText(item.visit.location || '').includes(norm);
          const dateMatch = (item.visit.date || '').includes(filterSearch.trim());
          const caseMatch = item.cases.some(c => 
            normalizeArabicText(c.caseObj.caseName || '').includes(norm) ||
            normalizeArabicText(c.caseObj.executedProjectType || c.caseObj.projectType || '').includes(norm)
          );
          if (!locMatch && !dateMatch && !caseMatch) return false;
        }
        return true;
      });

      // Unique Regions & Churches for Filter
      const uniqueRegions = Array.from(new Set(allExecutedCases.map(i => i.regionName).filter(Boolean))).sort();
      const uniqueChurches = Array.from(new Set(allExecutedCases.filter(i => !filterRegion || i.regionName === filterRegion).map(i => i.churchName).filter(Boolean))).sort();

      // Group all executed cases by Region -> Church -> Visit for the Geographic View
      const geoRegionsData = useMemo(() => {
        const regionsMap = {};

        allExecutedCases.forEach(item => {
          const rName = item.regionName || 'منطقة غير محددة';
          const chKey = `${rName}__${item.churchName || 'كنيسة غير محددة'}`;
          const chName = item.churchName || 'كنيسة غير محددة';
          const vId = item.visitId;

          if (!regionsMap[rName]) {
            regionsMap[rName] = {
              regionName: rName,
              totalVal: 0,
              paidVal: 0,
              remVal: 0,
              exemptedAmount: 0,
              exemptedCasesCount: 0,
              monthlyInst: 0,
              casesCount: 0,
              compCount: 0,
              overdueAmount: 0,
              overdueInstallments: 0,
              overdueCasesCount: 0,
              cases: [],
              churchesMap: {}
            };
          }

          const reg = regionsMap[rName];
          reg.totalVal += item.totalAmt;
          reg.paidVal += item.totalPaid;
          reg.remVal += item.remainingAmt;
          if (item.isExempted) {
            reg.exemptedCasesCount++;
            reg.exemptedAmount += item.exemptedAmount;
          } else if (!item.isCompleted) {
            reg.monthlyInst += item.monthlyAmt;
          } else {
            reg.compCount++;
          }
          if (item.isOverdue) {
            reg.overdueCasesCount++;
            reg.overdueAmount += item.overdueAmount;
            reg.overdueInstallments += item.overdueCount;
          }
          reg.casesCount++;
          reg.cases.push(item);

          if (!reg.churchesMap[chKey]) {
            reg.churchesMap[chKey] = {
              key: chKey,
              churchName: chName,
              regionName: rName,
              villageName: item.villageName || '',
              totalVal: 0,
              paidVal: 0,
              remVal: 0,
              exemptedAmount: 0,
              exemptedCasesCount: 0,
              monthlyInst: 0,
              casesCount: 0,
              compCount: 0,
              overdueAmount: 0,
              overdueInstallments: 0,
              overdueCasesCount: 0,
              cases: [],
              visitsMap: {}
            };
          }

          const ch = reg.churchesMap[chKey];
          ch.totalVal += item.totalAmt;
          ch.paidVal += item.totalPaid;
          ch.remVal += item.remainingAmt;
          if (item.isExempted) {
            ch.exemptedCasesCount++;
            ch.exemptedAmount += item.exemptedAmount;
          } else if (!item.isCompleted) {
            ch.monthlyInst += item.monthlyAmt;
          } else {
            ch.compCount++;
          }
          if (item.isOverdue) {
            ch.overdueCasesCount++;
            ch.overdueAmount += item.overdueAmount;
            ch.overdueInstallments += item.overdueCount;
          }
          ch.casesCount++;
          ch.cases.push(item);

          if (!ch.visitsMap[vId]) {
            ch.visitsMap[vId] = {
              visitId: vId,
              visitDate: item.visitDate,
              visitLocation: item.visitLocation,
              cases: [],
              overdueAmount: 0,
              overdueInstallments: 0,
              overdueCasesCount: 0,
              exemptedAmount: 0,
              exemptedCasesCount: 0
            };
          }

          ch.visitsMap[vId].cases.push(item);
          if (item.isExempted) {
            ch.visitsMap[vId].exemptedCasesCount++;
            ch.visitsMap[vId].exemptedAmount += item.exemptedAmount;
          }
          if (item.isOverdue) {
            ch.visitsMap[vId].overdueCasesCount++;
            ch.visitsMap[vId].overdueAmount += item.overdueAmount;
            ch.visitsMap[vId].overdueInstallments += item.overdueCount;
          }
        });

        return Object.values(regionsMap).map(reg => ({
          ...reg,
          overduePct: reg.casesCount > 0 ? Math.round((reg.overdueCasesCount / reg.casesCount) * 100) : 0,
          churches: Object.values(reg.churchesMap).map(ch => ({
            ...ch,
            overduePct: ch.casesCount > 0 ? Math.round((ch.overdueCasesCount / ch.casesCount) * 100) : 0,
            visits: Object.values(ch.visitsMap).sort((a, b) => (b.visitDate || '').localeCompare(a.visitDate || ''))
          })).sort((a, b) => a.churchName.localeCompare(b.churchName, 'ar'))
        })).sort((a, b) => a.regionName.localeCompare(b.regionName, 'ar'));
      }, [allExecutedCases]);

      // Filter geoRegionsData based on filterRegion and filterSearch
      const filteredGeoRegions = useMemo(() => {
        let list = geoRegionsData;
        if (filterRegion) {
          list = list.filter(r => r.regionName === filterRegion);
        }
        if (filterSearch.trim()) {
          const norm = normalizeArabicText(filterSearch);
          list = list.map(reg => {
            const regMatches = normalizeArabicText(reg.regionName).includes(norm);
            const matchingChurches = reg.churches.map(ch => {
              const chMatches = normalizeArabicText(ch.churchName).includes(norm) ||
                                normalizeArabicText(ch.villageName).includes(norm);
              const matchingVisits = ch.visits.map(vItem => {
                const vMatches = normalizeArabicText(vItem.visitLocation || '').includes(norm) ||
                                 (vItem.visitDate || '').includes(filterSearch.trim());
                const matchingCases = vItem.cases.filter(c => 
                  normalizeArabicText(c.caseObj.caseName || '').includes(norm) ||
                  normalizeArabicText(c.caseObj.executedProjectType || c.caseObj.projectType || '').includes(norm) ||
                  normalizeArabicText(c.caseObj.nationalId || '').includes(norm)
                );
                if (regMatches || chMatches || vMatches) {
                  return vItem;
                }
                if (matchingCases.length > 0) {
                  return { ...vItem, cases: matchingCases };
                }
                return null;
              }).filter(Boolean);

              if (regMatches || chMatches) {
                return ch;
              }
              if (matchingVisits.length > 0) {
                return { ...ch, visits: matchingVisits };
              }
              return null;
            }).filter(Boolean);

            if (regMatches) {
              return reg;
            }
            if (matchingChurches.length > 0) {
              return { ...reg, churches: matchingChurches };
            }
            return null;
          }).filter(Boolean);
        }
        return list;
      }, [geoRegionsData, filterRegion, filterSearch]);

      // Compute Analytics Data by Project Category using the Dynamic Project Dictionary
      const projectAnalyticsData = useMemo(() => {
        const statsMap = {};
        let grandTotalCases = 0;
        let grandTotalValue = 0;
        let grandTotalPaid = 0;
        let grandTotalRemaining = 0;
        let grandTotalExempted = 0;
        let grandTotalOverdue = 0;

        allExecutedCases.forEach(item => {
          const rawType = item.caseObj.executedProjectType || item.caseObj.projectType || 'مشروع غير محدد';
          const canonicalName = resolveCanonicalProject(rawType, projectDictionary);

          if (!statsMap[canonicalName]) {
            statsMap[canonicalName] = {
              name: canonicalName,
              rawTypes: new Set(),
              count: 0,
              totalValue: 0,
              totalPaid: 0,
              totalRemaining: 0,
              totalExempted: 0,
              overdueCount: 0,
              overdueAmount: 0,
              completedCount: 0,
              cases: []
            };
          }

          const s = statsMap[canonicalName];
          s.rawTypes.add(rawType);
          s.count++;
          s.totalValue += item.totalAmt;
          s.totalPaid += item.totalPaid;
          s.totalRemaining += item.remainingAmt;
          s.totalExempted += item.exemptedAmount;
          if (item.isCompleted) s.completedCount++;
          if (item.isOverdue) {
            s.overdueCount++;
            s.overdueAmount += item.overdueAmount;
          }
          s.cases.push(item);

          grandTotalCases++;
          grandTotalValue += item.totalAmt;
          grandTotalPaid += item.totalPaid;
          grandTotalRemaining += item.remainingAmt;
          grandTotalExempted += item.exemptedAmount;
          if (item.isOverdue) grandTotalOverdue += item.overdueAmount;
        });

        const list = Object.values(statsMap).map(s => {
          const pctOfTotal = grandTotalCases > 0 ? Math.round((s.count / grandTotalCases) * 100) : 0;
          const paidPct = s.totalValue > 0 ? Math.round((s.totalPaid / s.totalValue) * 100) : 0;
          return {
            ...s,
            rawTypesList: Array.from(s.rawTypes),
            pctOfTotal,
            paidPct
          };
        }).sort((a, b) => b.count - a.count);

        return {
          list,
          grandTotalCases,
          grandTotalValue,
          grandTotalPaid,
          grandTotalRemaining,
          grandTotalExempted,
          grandTotalOverdue
        };
      }, [allExecutedCases, projectDictionary]);

      // Selected project category in Analytics view to drill-down cases
      const [selectedAnalyticsCategory, setSelectedAnalyticsCategory] = useState(null);

      // State for editing a case
      const [editingCaseInfo, setEditingCaseInfo] = useState(null);

      // Handle updating payments from InstallmentModal
      const handleSavePayments = (updatedPayments, caseMeta = {}) => {
        if (!activeModalCaseInfo) return;
        const { visitId, churchId, groupId, caseObj } = activeModalCaseInfo;
        const targetVisit = activeVisits.find(v => v.id === visitId);
        if (!targetVisit) return;

        const updatedChurches = (targetVisit.churches || []).map(ch => ch.id === churchId ? {
          ...ch,
          servantsGroups: (ch.servantsGroups || []).map(sg => sg.id === groupId ? {
            ...sg,
            cases: (sg.cases || []).map(c => c.id === caseObj.id ? {
              ...c,
              payments: updatedPayments !== undefined ? updatedPayments : c.payments,
              ...caseMeta
            } : c)
          } : sg)
        } : ch);

        const updatedVisit = { ...targetVisit, churches: updatedChurches };
        onUpdateVisit(updatedVisit);

        // Update local modal object
        setActiveModalCaseInfo(prev => ({
          ...prev,
          caseObj: {
            ...prev.caseObj,
            payments: updatedPayments !== undefined ? updatedPayments : prev.caseObj.payments,
            ...caseMeta
          }
        }));
      };

      // Handle permanently deleting a case from installments / visit
      const handleDeleteCase = (caseItem) => {
        if (!caseItem) return;
        const { visitId, churchId, groupId, caseObj } = caseItem;
        const targetVisit = activeVisits.find(v => v.id === visitId);
        if (!targetVisit) return;

        const displayName = caseObj.caseName || caseObj.beneficiaryName || caseObj.name || 'هذه الحالة';

        window.showConfirm({
          title: 'حذف الحالة نهائياً',
          message: `هل أنت متأكد من حذف حالة "${displayName}" نهائياً من سجل الأقساط والمشاريع؟ لا يمكن التراجع عن هذا الإجراء.`,
          confirmText: 'نعم، احذف الحالة',
          cancelText: 'إلغاء وتراجع',
          isDangerous: true,
          onConfirm: () => {
            const updatedChurches = (targetVisit.churches || []).map(ch => ch.id === churchId ? {
              ...ch,
              servantsGroups: (ch.servantsGroups || []).map(sg => sg.id === groupId ? {
                ...sg,
                cases: (sg.cases || []).filter(c => c.id !== caseObj.id)
              } : sg)
            } : ch);

            const updatedVisit = { ...targetVisit, churches: updatedChurches };
            onUpdateVisit(updatedVisit);
            if (activeModalCaseInfo && activeModalCaseInfo.caseObj.id === caseObj.id) {
              setActiveModalCaseInfo(null);
            }
            window.notifySuccess(`تم حذف حالة "${displayName}" بنجاح.`);
          }
        });
      };

      // Handle saving edited case details
      const handleSaveEditedCase = (e) => {
        e.preventDefault();
        if (!editingCaseInfo) return;
        const { visitId, churchId, groupId, caseObj, formValues } = editingCaseInfo;
        const targetVisit = activeVisits.find(v => v.id === visitId);
        if (!targetVisit) return;

        const val = parseFloat(formValues.projectValue) || 0;
        const inst = parseFloat(formValues.installmentAmount) || 0;

        if (!formValues.caseName.trim()) {
          window.notifyWarning('يرجى إدخال اسم المستفيد / الحالة.');
          return;
        }

        const updatedChurches = (targetVisit.churches || []).map(ch => ch.id === churchId ? {
          ...ch,
          servantsGroups: (ch.servantsGroups || []).map(sg => sg.id === groupId ? {
            ...sg,
            cases: (sg.cases || []).map(c => c.id === caseObj.id ? {
              ...c,
              name: formValues.caseName.trim(),
              caseName: formValues.caseName.trim(),
              beneficiaryName: formValues.caseName.trim(),
              nationalId: (formValues.nationalId || '').trim(),
              projectType: formValues.projectType.trim(),
              executedProjectType: formValues.projectType.trim(),
              projectValue: val,
              executedProjectValue: val,
              installmentAmount: inst,
              executedInstallmentAmount: inst,
              executionDate: formValues.executionDate || c.executionDate,
              firstInstallmentDate: formValues.firstInstallmentDate || c.firstInstallmentDate,
              notes: (formValues.notes || '').trim()
            } : c)
          } : sg)
        } : ch);

        const updatedVisit = { ...targetVisit, churches: updatedChurches };
        onUpdateVisit(updatedVisit);
        setEditingCaseInfo(null);
        window.notifySuccess('تم تحديث بيانات الحالة بنجاح.');
      };

      // Trigger batch payment modal with prepared scope
      const triggerBatchPayment = (scopeTitle, casesArray, targetVisitId) => {
        const eligibleCases = (casesArray || []).filter(item => {
          const c = item.caseObj || item;
          if (c.status !== 'executed' || c.isExempted) return false;
          const total = parseFloat(c.executedProjectValue || c.projectValue) || 0;
          const payments = c.payments || [];
          const paid = payments.reduce((sum, p) => sum + (parseFloat(p.amount) || 0), 0);
          return (total - paid) > 0;
        });

        if (eligibleCases.length === 0) {
          window.notifyWarning('لا توجد حالات جارية بها مبالغ متبقية للسداد في هذا النطاق.');
          return;
        }

        setBatchPaymentConfig({
          title: scopeTitle,
          targetCases: eligibleCases,
          visitId: targetVisitId
        });
      };

      // Execute batch payment across target visit(s)
      const handleExecuteBatchPayment = (paidDate, notes, selectedCaseIds) => {
        if (!batchPaymentConfig) return;
        const { targetCases } = batchPaymentConfig;
        const selectedSet = new Set(selectedCaseIds);

        // Group selected cases by visitId
        const casesByVisit = {};
        targetCases.forEach(item => {
          const c = item.caseObj || item;
          if (selectedSet.has(c.id)) {
            const vId = item.visitId || c.visitId || batchPaymentConfig.visitId;
            if (vId) {
              if (!casesByVisit[vId]) casesByVisit[vId] = [];
              casesByVisit[vId].push(c.id);
            }
          }
        });

        let totalPaidCasesCount = 0;
        let totalPaidAmount = 0;

        Object.entries(casesByVisit).forEach(([vId, caseIdsList]) => {
          const targetVisit = activeVisits.find(v => v.id === vId);
          if (!targetVisit) return;
          const vCaseSet = new Set(caseIdsList);

          const updatedChurches = (targetVisit.churches || []).map(ch => ({
            ...ch,
            servantsGroups: (ch.servantsGroups || []).map(sg => ({
              ...sg,
              cases: (sg.cases || []).map(c => {
                if (vCaseSet.has(c.id)) {
                  const total = parseFloat(c.executedProjectValue || c.projectValue) || 0;
                  const monthly = parseFloat(c.executedInstallmentAmount || c.installmentAmount) || 0;
                  const payments = c.payments || [];
                  const paid = payments.reduce((sum, p) => sum + (parseFloat(p.amount) || 0), 0);
                  const remaining = Math.max(0, total - paid);

                  if (remaining > 0) {
                    const payAmt = monthly > 0 ? Math.min(monthly, remaining) : remaining;
                    if (payAmt > 0) {
                      totalPaidCasesCount++;
                      totalPaidAmount += payAmt;
                      const newPayment = {
                        id: uuidv4(),
                        amount: payAmt,
                        paidDate: paidDate || new Date().toISOString().split('T')[0],
                        notes: notes || 'سداد قسط شهري مجمع',
                        createdAt: Date.now()
                      };
                      return {
                        ...c,
                        payments: [...payments, newPayment]
                      };
                    }
                  }
                }
                return c;
              })
            }))
          }));

          const updatedVisit = { ...targetVisit, churches: updatedChurches };
          onUpdateVisit(updatedVisit);
        });

        setBatchPaymentConfig(null);
        window.notifySuccess(`تم تسجيل سداد القسط بنجاح لعدد (${totalPaidCasesCount}) حالة بإجمالي ${formatNumber(totalPaidAmount)} ج.م.`);
      };

      // Export Installments Report to Excel
      const handleExportInstallmentsExcel = () => {
        if (typeof XLSX === 'undefined') {
          window.notifyError('مكتبة الإكسيل غير متوفرة حالياً.');
          return;
        }

        const aoa = [];
        const headers = [
          'مسلسل', 'الزيارة', 'تاريخ الزيارة', 'المنطقة', 'الكنيسة', 'القرية', 'اسم الحالة',
          'نوع المشروع المنفذ', 'تاريخ التنفيذ', 'أصل المبلغ المنفذ', 'القسط الشهري', 
          'عدد الأشهر', 'إجمالي المسدد', 'المبلغ المتبقي', 'نسبة السداد', 'حالة السداد', 'آخر تاريخ سداد'
        ];
        aoa.push(headers);

        const casesToExport = selectedVisitData ? selectedVisitData.cases : filteredCases;

        casesToExport.forEach((item, idx) => {
          const lastPaymentDate = item.payments.length > 0 
            ? item.payments[item.payments.length - 1].paidDate 
            : '—';
          const pPct = item.totalAmt > 0 ? Math.round((item.totalPaid / item.totalAmt) * 100) : 0;
          const statusText = item.isCompleted ? 'مكتمل السداد بالكامل' : (item.totalPaid > 0 ? 'جاري السداد' : 'لم يبدأ السداد');

          aoa.push([
            idx + 1,
            item.visitLocation || '—',
            item.visitDate || '—',
            item.regionName || '—',
            item.churchName || '—',
            item.villageName || '—',
            item.caseObj.caseName || '—',
            item.caseObj.executedProjectType || item.caseObj.projectType || '—',
            item.caseObj.executionDate || '—',
            item.totalAmt,
            item.monthlyAmt,
            item.totalMonths,
            item.totalPaid,
            item.remainingAmt,
            `${pPct}%`,
            statusText,
            lastPaymentDate
          ]);
        });

        const wb = XLSX.utils.book_new();
        const ws = XLSX.utils.aoa_to_sheet(aoa);
        ws['!dir'] = 'rtl';
        XLSX.utils.book_append_sheet(wb, ws, 'متابعة_الأقساط');
        const filename = `تقرير_الأقساط_والسداد_${new Date().toISOString().split('T')[0]}.xlsx`;
        XLSX.writeFile(wb, filename);
        window.notifySuccess('تم تصدير كشف الأقساط إلى Excel بنجاح!');
      };

      return (
        <div className="space-y-6 animate-fade-in pb-12">
          {/* Top Control Bar */}
          <div className="bg-white rounded-2xl shadow-sm border border-gray-100 p-4 sm:p-5">
            <div className="flex flex-col lg:flex-row justify-between items-start lg:items-center gap-4">
              <div>
                <div className="flex items-center gap-2">
                  <span className="text-2xl">💵</span>
                  <h2 className="text-lg sm:text-xl font-bold text-[#002f6c]">متابعة الأقساط والتحصيل الدوري</h2>
                </div>
                <p className="text-xs sm:text-sm text-gray-500 mt-1">
                  إدارة ومتابعة سداد المستفيدين للمشاريع المنفذة مقسمة بسجل الزيارات والمناطق والكنائس
                </p>
              </div>

              {/* Actions: Add Legacy Project + Import from Excel + Export */}
              <div className="grid grid-cols-1 sm:grid-cols-3 gap-2 w-full lg:w-auto">
                <button
                  type="button"
                  onClick={() => setShowAddLegacyModal(true)}
                  className="bg-[#002f6c] hover:bg-[#001f4c] text-white py-2 px-3 rounded-xl shadow-sm flex items-center justify-center gap-2 transition-all text-right"
                  title="إضافة نزلة / مشاريع سابقة يدوياً"
                >
                  <Plus size={18} className="shrink-0 text-blue-200" />
                  <div className="flex flex-col text-right">
                    <span className="text-xs font-bold">إضافة نزلة سابقة</span>
                    <span className="text-[10px] text-blue-200 font-medium">تسجيل يدوي لحالة قديمة</span>
                  </div>
                </button>

                <button
                  type="button"
                  onClick={() => setShowImportLegacyModal(true)}
                  className="bg-teal-700 hover:bg-teal-800 text-white py-2 px-3 rounded-xl shadow-sm flex items-center justify-center gap-2 transition-all text-right"
                  title="استيراد مشاريع قديمة دفعة واحدة من ملف إكسيل"
                >
                  <Upload size={18} className="shrink-0 text-teal-100" />
                  <div className="flex flex-col text-right">
                    <span className="text-xs font-bold">استيراد نزلات (Excel)</span>
                    <span className="text-[10px] text-teal-100 font-medium">رفع شيت نزلات سابقة</span>
                  </div>
                </button>

                <button
                  type="button"
                  onClick={handleExportInstallmentsExcel}
                  className="bg-emerald-600 hover:bg-emerald-700 text-white py-2 px-3 rounded-xl shadow-sm flex items-center justify-center gap-2 transition-all text-right"
                  title="تصدير كشف التحصيل لإكسيل"
                >
                  <FileSpreadsheet size={18} className="shrink-0 text-emerald-100" />
                  <div className="flex flex-col text-right">
                    <span className="text-xs font-bold">تصدير التحصيل (Excel)</span>
                    <span className="text-[10px] text-emerald-100 font-medium">تحميل الأقساط والمتأخرات</span>
                  </div>
                </button>
              </div>
            </div>
          </div>

          {/* Global Aggregate Financial Metrics Cards */}
          <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3 sm:gap-4">
            <div className="bg-white rounded-2xl p-4 border border-gray-100 shadow-sm flex flex-col justify-between">
              <div className="flex items-center justify-between text-gray-500 text-xs font-medium">
                <span>إجمالي المصروف للمشاريع</span>
                <span className="text-blue-600 text-base">💰</span>
              </div>
              <div className="text-lg sm:text-xl font-bold font-sans text-[#002f6c] mt-2">
                {formatNumber(sumTotalExecuted)} <span className="text-xs font-normal">ج.م</span>
              </div>
              <div className="text-[11px] text-gray-500 font-sans mt-1">
                {formatNumber(allExecutedCases.length)} مشروع منفذ
              </div>
            </div>

            <div className="bg-white rounded-2xl p-4 border border-gray-100 shadow-sm flex flex-col justify-between">
              <div className="flex items-center justify-between text-gray-500 text-xs font-medium">
                <span>إجمالي السداد المحصل فعلياً</span>
                <span className="text-emerald-600 text-base">✅</span>
              </div>
              <div className="text-lg sm:text-xl font-bold font-sans text-emerald-700 mt-2">
                {formatNumber(sumTotalPaid)} <span className="text-xs font-normal">ج.م</span>
              </div>
              <div className="text-[11px] text-emerald-600 font-sans mt-1 font-bold">
                نسبة التحصيل: {overallPaidPercentage}%
              </div>
            </div>

            <div className="bg-white rounded-2xl p-4 border border-gray-100 shadow-sm flex flex-col justify-between">
              <div className="flex items-center justify-between text-gray-500 text-xs font-medium">
                <span>المتبقي النشط للتحصيل</span>
                <span className="text-rose-600 text-base">⏳</span>
              </div>
              <div className="text-lg sm:text-xl font-bold font-sans text-rose-700 mt-2">
                {formatNumber(sumTotalRemaining)} <span className="text-xs font-normal">ج.م</span>
              </div>
              <div className="text-[11px] text-rose-500 font-sans mt-1">
                المتبقي الفعلي المطلوب
              </div>
            </div>

            <div className="bg-white rounded-2xl p-4 border border-purple-200/80 shadow-sm flex flex-col justify-between bg-gradient-to-b from-purple-50/40 to-white">
              <div className="flex items-center justify-between text-purple-900 text-xs font-bold">
                <span>حالات الإعفاء (وفاة / مرض)</span>
                <span className="text-purple-600 text-base">💜</span>
              </div>
              <div className="text-lg sm:text-xl font-bold font-sans text-purple-900 mt-2">
                {formatNumber(sumExemptedAmount)} <span className="text-xs font-normal">ج.م</span>
              </div>
              <div className="text-[11px] text-purple-700 font-sans mt-1 font-bold">
                {formatNumber(exemptedCasesCount)} حالة معفاة ومسقطة
              </div>
            </div>

            <div className="bg-white rounded-2xl p-4 border border-gray-100 shadow-sm flex flex-col justify-between">
              <div className="flex items-center justify-between text-gray-500 text-xs font-medium">
                <span>القسط الشهري المجمع</span>
                <span className="text-amber-500 text-base">📅</span>
              </div>
              <div className="text-lg sm:text-xl font-bold font-sans text-amber-800 mt-2">
                {formatNumber(sumMonthlyActiveInstallments)} <span className="text-xs font-normal">ج.م/شهر</span>
              </div>
              <div className="text-[11px] text-amber-700 font-sans mt-1">
                متوقع من {formatNumber(activeCount + unpaidCount)} حالة جارية
              </div>
            </div>

            <div className="bg-white rounded-2xl p-4 border border-gray-100 shadow-sm flex flex-col justify-between col-span-2 sm:col-span-1">
              <div className="flex items-center justify-between text-gray-500 text-xs font-medium">
                <span>حالة السداد والمتأخرات</span>
                <span className="text-purple-600 text-base">📊</span>
              </div>
              <div className="text-lg sm:text-xl font-bold font-sans text-[#002f6c] mt-2">
                {formatNumber(completedCount)} <span className="text-xs font-normal text-emerald-600 font-bold">مكتمل ✅</span>
              </div>
              <div className="text-[11px] font-sans mt-1">
                {overdueCasesCount > 0 ? (
                  <span className="text-rose-600 font-bold">
                    ⚠️ {formatNumber(overdueCasesCount)} متأخر ({overdueCasesPercentage}%) • {formatNumber(sumOverdueAmount)} ج.م
                  </span>
                ) : (
                  <span className="text-gray-500">
                    {formatNumber(activeCount)} جاري • {formatNumber(unpaidCount)} لم يبدأ
                  </span>
                )}
              </div>
            </div>
          </div>

          {/* Global Overdue Banner if any arrears exist */}
          {overdueCasesCount > 0 && (
            <div className="bg-rose-50 border border-rose-200 rounded-2xl p-3.5 sm:p-4 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 text-rose-900 shadow-xs">
              <div className="flex items-center gap-2.5">
                <span className="text-2xl shrink-0">⚠️</span>
                <div>
                  <div className="font-bold text-xs sm:text-sm">
                    إجمالي المتأخرات عبر كل الحالات: <strong className="font-sans font-extrabold text-rose-700">{formatNumber(sumOverdueAmount)} ج.م</strong>
                  </div>
                  <div className="text-[11px] text-rose-600 mt-0.5 font-sans">
                    يوجد {formatNumber(overdueCasesCount)} حالة متأخرة ({overdueCasesPercentage}% من إجمالي المشاريع) بإجمالي {formatNumber(sumOverdueInstallments)} قسط مستحق لم يُسدد في موعده.
                  </div>
                </div>
              </div>
              <div className="flex items-center gap-2 shrink-0">
                <button
                  type="button"
                  onClick={() => { setViewMode('allCases'); setFilterStatus('overdue'); }}
                  className="bg-rose-700 hover:bg-rose-800 text-white text-xs font-bold px-3.5 py-1.5 rounded-xl shadow-xs transition-colors flex items-center gap-1.5"
                >
                  <span>عرض كل المتأخرين</span>
