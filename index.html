<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>خدمة الأنبا كاراس - أبحاث</title>
  
  <!-- PWA & Mobile Web App Icons -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='50' fill='%23001f4c'/%3E%3Ccircle cx='50' cy='45' r='28' fill='none' stroke='%23d4af37' stroke-width='3'/%3E%3Cpath d='M50 25 V55 M35 38 H65' stroke='%23d4af37' stroke-width='5' stroke-linecap='round'/%3E%3Cpath d='M30 100 C30 70, 70 70, 70 100' fill='%23d4af37'/%3E%3C/svg%3E" />
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='50' fill='%23001f4c'/%3E%3Ccircle cx='50' cy='45' r='28' fill='none' stroke='%23d4af37' stroke-width='3'/%3E%3Cpath d='M50 25 V55 M35 38 H65' stroke='%23d4af37' stroke-width='5' stroke-linecap='round'/%3E%3Cpath d='M30 100 C30 70, 70 70, 70 100' fill='%23d4af37'/%3E%3C/svg%3E" />
  <meta name="apple-mobile-web-app-title" content="خدمة الأنبا كاراس" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM via CDNJS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  
  <!-- SheetJS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <!-- Firebase Compat -->
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>

  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background-color: #f8fafc; }
    .font-sans { font-family: sans-serif; } /* For forcing Western numbers */
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    // --- FIREBASE INITIALIZATION ---
    const firebaseConfig = {
      apiKey: "AIzaSyDpzXjAZ-VQfwNs_2yjMyQdhuOKl1khNUQ",
      authDomain: "anba-karas-projects.firebaseapp.com",
      projectId: "anba-karas-projects",
      storageBucket: "anba-karas-projects.firebasestorage.app",
      messagingSenderId: "747402974061",
      appId: "1:747402974061:web:b0831b41baa3e533544064",
      measurementId: "G-MSTGV49GW2"
    };

    if (typeof firebase !== 'undefined' && !firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = typeof firebase !== 'undefined' ? firebase.firestore() : null;
    
    if (db) {
      try {
        db.settings({
          cacheSizeBytes: firebase.firestore.CACHE_SIZE_UNLIMITED,
          experimentalForceLongPolling: true
        });
        db.enablePersistence().catch((err) => {
          console.warn("Persistence Error:", err.code);
        });
      } catch (e) {
        console.warn("Firestore settings error:", e);
      }
    }

    const { useState, useEffect, useRef } = React;

    // --- UTILS & HELPERS ---
    const uuidv4 = () => {
      return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
        const r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8);
        return v.toString(16);
      });
    };

    
    const getChurchStats = (churchLoc) => {
        let totalCases = 0;
        let totalValue = 0;
        let totalInst = 0;
        (churchLoc.servantsGroups || []).forEach(sg => {
            (sg.cases || []).forEach(c => {
                totalCases++;
                totalValue += (parseFloat(c.projectValue) || 0);
                totalInst += (parseFloat(c.installmentAmount) || 0);
            });
        });
        return { totalCases, totalValue, totalInst };
    };

    const formatNumber = (num) => {
      if (num === null || num === undefined || num === '') return '';
      const str = String(num).replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));
      const cleanStr = str.replace(/,/g, '');
      if (!isNaN(cleanStr) && cleanStr.trim() !== '') {
        return Number(cleanStr).toLocaleString('en-US');
      }
      return str;
    };

    const parseArabicNumeric = (str) => {
      if (!str && str !== 0) return '';
      const englishStr = String(str).replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/,/g, '');
      const parsed = parseFloat(englishStr);
      return isNaN(parsed) ? '' : parsed;
    };

    // --- ICONS ---
    const Menu = ({ size=24, className='' }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>;
    const X = ({ size=24, className='' }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>;
    const Plus = ({ size=24, className='' }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>;
    const Trash2 = ({ size=24, className='' }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>;
    const Edit2 = ({ size=24, className='' }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></svg>;
    const Mic = ({ size=24, className='' }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg>;
    const MapPin = ({ size=24, className='' }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>;
    const Download = ({ size=24, className='' }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>;
    const Cloud = ({ size=24, className='' }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></svg>;
    const CloudUpload = ({ size=24, className='' }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/><path d="M12 12v9"/><path d="m8 16 4-4 4 4"/></svg>;
    const CloudOff = ({ size=24, className='' }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m2 2 20 20"/><path d="M5.782 5.782A7 7 0 0 0 9 19h8.5a4.5 4.5 0 0 0 1.307-.193"/><path d="M21.532 16.5A4.5 4.5 0 0 0 17.5 10h-1.79A7.008 7.008 0 0 0 10 5.22"/></svg>;
    const ListIcon = ({ size=24, className='' }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>;
    const ChevronRight = ({ size=24, className='' }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="9 18 15 12 9 6"/></svg>;

    const ChevronDown = ({ size=24, className='' }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="6 9 12 15 18 9"/></svg>;
    const ChevronUp = ({ size=24, className='' }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="18 15 12 9 6 15"/></svg>;
    const SaintHaloIcon = ({ className='' }) => (
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" className={className}>
        <circle cx="50" cy="50" r="50" fill="#001f4c"/>
        <circle cx="50" cy="45" r="28" fill="none" stroke="#d4af37" strokeWidth="3"/>
        <path d="M50 25 V55 M35 38 H65" stroke="#d4af37" strokeWidth="5" strokeLinecap="round"/>
        <path d="M30 100 C30 70, 70 70, 70 100" fill="#d4af37"/>
      </svg>
    );
    const Calendar = ({ size=24, className='' }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>;
    const CheckCircle = ({ size=24, className='' }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>;

    // --- MIC INPUT COMPONENT ---
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const MicInput = ({ value, onValueChange, placeholder, isNumeric = false, className = '' }) => {
      const [isListening, setIsListening] = useState(false);

      const startListening = () => {
        if (!SpeechRecognition) {
          alert('متصفحك لا يدعم الإدخال الصوتي.');
          return;
        }
        const recognition = new SpeechRecognition();
        recognition.lang = 'ar-EG';
        recognition.continuous = false;
        recognition.interimResults = false;

        recognition.onstart = () => setIsListening(true);
        recognition.onresult = (event) => {
          const transcript = event.results[0][0].transcript;
          if (isNumeric) {
            onValueChange(parseArabicNumeric(transcript));
          } else {
            onValueChange(transcript);
          }
        };
        recognition.onerror = () => setIsListening(false);
        recognition.onend = () => setIsListening(false);
        recognition.start();
      };

      return (
        <div className={`relative flex items-center ${className}`}>
          <input
            type={isNumeric ? "text" : "text"}
            inputMode={isNumeric ? "numeric" : "text"}
            value={isNumeric ? formatNumber(value) : value}
            onChange={(e) => isNumeric ? onValueChange(parseArabicNumeric(e.target.value)) : onValueChange(e.target.value)}
            className={`w-full rounded-md border border-gray-300 p-2.5 pl-10 text-sm focus:border-[#002f6c] focus:ring-1 focus:ring-[#002f6c] focus:outline-none transition-shadow ${isNumeric ? 'font-sans text-left' : 'text-right'} text-gray-900`}
            placeholder={placeholder}
            dir={isNumeric ? "ltr" : "rtl"}
          />
          <button
            type="button"
            onClick={startListening}
            className={`absolute left-2 p-1.5 rounded-full transition-colors ${isListening ? 'bg-red-100 text-red-600 animate-pulse' : 'text-gray-400 hover:text-[#002f6c] hover:bg-gray-100'}`}
            title="إدخال صوتي"
          >
            <Mic size={18} />
          </button>
        </div>
      );
    };

    // --- EXPORT FUNCTION ---
    const handleExportExcel = (visitData) => {
        if (typeof XLSX === 'undefined') {
          alert('مكتبة الإكسيل غير متوفرة.');
          return;
        }

        const rows = [];
        let grandTotalProjects = 0;
        let grandTotalProjectValue = 0;
        let grandTotalInstallments = 0;

        (visitData.churches || []).forEach((churchLoc, index) => {
          let churchSerial = 1;
          let churchHasCases = false;

          (churchLoc.servantsGroups || []).forEach(sg => {
            (sg.cases || []).forEach(c => {
              churchHasCases = true;
              const projectVal = parseArabicNumeric(c.projectValue) || 0;
              const instVal = parseArabicNumeric(c.installmentAmount) || 0;

              rows.push({
                'مسلسل الكنيسة': churchSerial,
                'مكان الزيارة': visitData.location,
                'تاريخ الزيارة': visitData.date,
                'اسم المنطقة': churchLoc.regionName,
                'اسم القرية': churchLoc.villageName,
                'اسم الكنيسة': churchLoc.churchName,
                'أسماء الخدام': sg.servantsNames,
                'اسم الحالة': c.name,
                'نوع المشروع': c.projectType,
                'قيمة المشروع': projectVal,
                'قيمة القسط': instVal,
                'ملاحظات': c.notes
              });
              
              churchSerial++;
              grandTotalProjects++;
              grandTotalProjectValue += projectVal;
              grandTotalInstallments += instVal;
            });
          });

          // Add a divider row if it's not the last church and this church had cases
          if (index < (visitData.churches || []).length - 1 && churchHasCases) {
              rows.push({
                'مسلسل الكنيسة': '',
                'مكان الزيارة': '',
                'تاريخ الزيارة': '',
                'اسم المنطقة': '',
                'اسم القرية': '',
                'اسم الكنيسة': '',
                'أسماء الخدام': '',
                'اسم الحالة': '',
                'نوع المشروع': '',
                'قيمة المشروع': null,
                'قيمة القسط': null,
                'ملاحظات': ''
              });
          }
        });

        if (rows.length === 0) {
          alert('لا توجد بيانات للتصدير.');
          return;
        }

        // Final Summary Row
        rows.push({
          'مسلسل الكنيسة': 'الإجمالي',
          'مكان الزيارة': '',
          'تاريخ الزيارة': '',
          'اسم المنطقة': '',
          'اسم القرية': '',
          'اسم الكنيسة': '',
          'أسماء الخدام': '',
          'اسم الحالة': '',
          'نوع المشروع': grandTotalProjects + ' مشروع',
          'قيمة المشروع': grandTotalProjectValue,
          'قيمة القسط': grandTotalInstallments,
          'ملاحظات': ''
        });

        const worksheet = XLSX.utils.json_to_sheet(rows);
        
        // RTL Direction
        if(!worksheet['!dir']) worksheet['!dir'] = 'rtl';

        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, 'الزيارة');

        const locationPart = visitData.location ? `_${visitData.location.replace(/\s+/g, '_')}` : '';
        const filename = `زيارة${locationPart}_${visitData.date}.xlsx`;
        XLSX.writeFile(workbook, filename);
    };

    // --- CASE MODAL ---
    function CaseModal({ caseData, onSave, onClose }) {
      const [formData, setFormData] = useState(caseData || {
        id: uuidv4(), name: '', projectType: '', projectValue: '', installmentAmount: '', notes: ''
      });

      const handleSave = () => {
        if (!formData.name) { alert('برجاء إدخال اسم الحالة'); return; }
        onSave({...formData, projectValue: parseArabicNumeric(formData.projectValue) || 0, installmentAmount: parseArabicNumeric(formData.installmentAmount) || 0});
      };

      return (
        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
          <div className="bg-white rounded-xl shadow-2xl w-full max-w-lg overflow-hidden border border-gray-100 flex flex-col max-h-[90vh]">
            <div className="p-4 border-b border-gray-100 bg-gray-50 flex justify-between items-center shrink-0">
              <h3 className="font-bold text-[#002f6c] text-lg">{caseData ? 'تعديل الحالة' : 'إضافة حالة جديدة'}</h3>
              <button onClick={onClose} className="text-gray-400 hover:text-gray-600 p-1"><X size={20} /></button>
            </div>
            <div className="p-5 space-y-4 overflow-y-auto flex-1">
              <div>
                <label className="block text-sm font-medium text-gray-700 mb-1">اسم الحالة</label>
                <MicInput value={formData.name} onValueChange={(v) => setFormData({...formData, name: v})} placeholder="الاسم ثلاثي" />
              </div>
              <div>
                <label className="block text-sm font-medium text-gray-700 mb-1">نوع المشروع</label>
                <MicInput value={formData.projectType} onValueChange={(v) => setFormData({...formData, projectType: v})} placeholder="مثل: بقالة، ملابس..." />
              </div>
              <div className="grid grid-cols-2 gap-4">
                <div>
                  <label className="block text-sm font-medium text-gray-700 mb-1">قيمة المشروع (ج.م)</label>
                  <MicInput isNumeric value={formData.projectValue} onValueChange={(v) => setFormData({...formData, projectValue: v})} placeholder="0" />
                </div>
                <div>
                  <label className="block text-sm font-medium text-gray-700 mb-1">قيمة القسط (ج.م)</label>
                  <MicInput isNumeric value={formData.installmentAmount} onValueChange={(v) => setFormData({...formData, installmentAmount: v})} placeholder="0" />
                </div>
              </div>
              <div>
                <label className="block text-sm font-medium text-gray-700 mb-1">ملاحظات (اختياري)</label>
                <MicInput value={formData.notes} onValueChange={(v) => setFormData({...formData, notes: v})} placeholder="أي ملاحظات إضافية" />
              </div>
            </div>
            <div className="p-4 border-t border-gray-100 bg-gray-50 flex justify-end gap-2 shrink-0">
              <button onClick={onClose} className="px-5 py-2 rounded-md text-sm font-medium text-gray-600 hover:bg-gray-200 transition-colors">إلغاء</button>
              <button onClick={handleSave} className="px-5 py-2 rounded-md text-sm font-medium text-white bg-[#002f6c] hover:bg-[#001f4c] transition-colors shadow-sm">حفظ الحالة</button>
            </div>
          </div>
        </div>
      );
    }

    // --- SERVANTS GROUP VIEW ---
    function ServantsGroupView({ group, churchId, onUpdateGroup, onDeleteGroup, serialMap, onEditCase, onDeleteCase }) {
      const [isAddingCase, setIsAddingCase] = useState(false);

      const handleSaveCase = (newCase) => {
        onUpdateGroup(churchId, { ...group, cases: [...(group.cases || []), newCase] });
        setIsAddingCase(false);
      };

      return (
        <div className="bg-gray-50 border border-gray-200 rounded-lg overflow-hidden">
          <div className="p-4 border-b border-gray-200 bg-gray-100 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
            <div className="flex-1 w-full max-w-md">
              <label className="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-1">أسماء الخدام المسؤولين</label>
              <MicInput value={group.servantsNames || ''} onValueChange={(v) => onUpdateGroup(churchId, {...group, servantsNames: v})} placeholder="أدخل أسماء الخدام" className="bg-white" />
            </div>
            <button onClick={() => { if(confirm('هل تريد حذف مجموعة الخدام وحالاتهم؟')) onDeleteGroup(churchId, group.id); }} className="text-red-500 hover:text-red-700 text-sm font-medium p-2">
              حذف المجموعة
            </button>
          </div>
          
          <div className="p-0 overflow-x-auto">
            <table className="w-full text-sm text-right">
              <thead className="bg-[#002f6c] text-white">
                <tr>
                  <th className="px-4 py-3 font-medium w-16 text-center"># (كنيسة)</th>
                  <th className="px-4 py-3 font-medium min-w-[150px]">اسم الحالة</th>
                  <th className="px-4 py-3 font-medium">نوع المشروع</th>
                  <th className="px-4 py-3 font-medium text-center">القيمة</th>
                  <th className="px-4 py-3 font-medium text-center">القسط</th>
                  <th className="px-4 py-3 font-medium">ملاحظات</th>
                  <th className="px-4 py-3 font-medium text-center w-20">إجراء</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-gray-200">
                {(group.cases || []).length === 0 && (
                  <tr><td colSpan="7" className="px-4 py-8 text-center text-gray-500">لا توجد حالات مسجلة لهذه المجموعة.</td></tr>
                )}
                {(group.cases || []).map((c) => (
                  <tr key={c.id} className="hover:bg-blue-50/50 transition-colors">
                    <td className="px-4 py-3 text-center font-bold text-gray-500 font-sans">{formatNumber(serialMap[c.id])}</td>
                    <td className="px-4 py-3 font-medium text-gray-900">{c.name}</td>
                    <td className="px-4 py-3 text-gray-600">{c.projectType}</td>
                    <td className="px-4 py-3 text-center text-[#002f6c] font-semibold font-sans">{formatNumber(c.projectValue)}</td>
                    <td className="px-4 py-3 text-center text-green-700 font-semibold font-sans">{formatNumber(c.installmentAmount)}</td>
                    <td className="px-4 py-3 text-gray-500 text-xs">{c.notes}</td>
                    <td className="px-4 py-3 text-center">
                      <div className="flex items-center justify-center gap-2">
                        <button onClick={() => onEditCase(c, churchId, group.id)} className="text-blue-600 hover:text-blue-800 p-1" title="تعديل"><Edit2 size={16}/></button>
                        <button onClick={() => onDeleteCase(c.id, churchId, group.id)} className="text-red-500 hover:text-red-700 p-1" title="حذف"><Trash2 size={16}/></button>
                      </div>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          
          <div className="p-3 border-t border-gray-200 bg-white">
            <button onClick={() => setIsAddingCase(true)} className="flex items-center gap-1.5 text-sm font-medium text-[#002f6c] hover:text-[#004a8f] px-2 py-1 rounded">
              <Plus size={16} /> إضافة حالة جديدة
            </button>
          </div>
          
          {isAddingCase && <CaseModal onSave={handleSaveCase} onClose={() => setIsAddingCase(false)} />}
        </div>
      );
    }

    // --- PAGE 1: ACTIVE VISIT ENTRY ---
    function ActiveVisitForm({ data, updateData, onEndVisit }) {
      const [editingCaseInfo, setEditingCaseInfo] = useState(null);
      const [expandedChurches, setExpandedChurches] = useState({});

      // Compute Church Serials
      const serialMap = {};
      (data.churches || []).forEach(churchLoc => {
        let churchS = 1;
        (churchLoc.servantsGroups || []).forEach(sg => {
          (sg.cases || []).forEach(c => {
            serialMap[c.id] = churchS++;
          });
        });
      });

      const toggleChurch = (id) => setExpandedChurches(prev => ({...prev, [id]: !prev[id]}));
      const handleAddChurch = () => {
        const newChurch = {
          id: uuidv4(), regionName: '', villageName: '', churchName: '',
          servantsGroups: [{ id: uuidv4(), servantsNames: '', cases: [] }]
        };
        updateData(prev => ({ ...prev, churches: [newChurch, ...(prev.churches || [])] }));
        setExpandedChurches(prev => ({ ...prev, [newChurch.id]: true }));
      };

      const handleUpdateChurch = (updatedChurch) => {
        updateData(prev => ({
          ...prev, churches: prev.churches.map(ch => ch.id === updatedChurch.id ? updatedChurch : ch)
        }));
      };

      const handleDeleteChurch = (id) => {
        if(confirm('هل أنت متأكد من حذف بيانات هذه الكنيسة بالكامل؟')) {
          updateData(prev => ({ ...prev, churches: prev.churches.filter(ch => ch.id !== id) }));
        }
      };

      const handleAddGroup = (churchId) => {
        updateData(prev => ({
          ...prev, churches: prev.churches.map(ch => ch.id === churchId ? {
            ...ch, servantsGroups: [...ch.servantsGroups, { id: uuidv4(), servantsNames: '', cases: [] }]
          } : ch)
        }));
      };

      const handleUpdateGroup = (churchId, updatedGroup) => {
        updateData(prev => ({
          ...prev, churches: prev.churches.map(ch => ch.id === churchId ? {
            ...ch, servantsGroups: ch.servantsGroups.map(sg => sg.id === updatedGroup.id ? updatedGroup : sg)
          } : ch)
        }));
      };

      const handleDeleteGroup = (churchId, groupId) => {
        updateData(prev => ({
          ...prev, churches: prev.churches.map(ch => ch.id === churchId ? {
            ...ch, servantsGroups: ch.servantsGroups.filter(sg => sg.id !== groupId)
          } : ch)
        }));
      };

      const handleEditCase = (caseObj, churchId, groupId) => {
        setEditingCaseInfo({ caseObj, churchId, groupId });
      };

      const handleSaveEditCase = (updatedCase) => {
        const { churchId, groupId } = editingCaseInfo;
        updateData(prev => ({
          ...prev, churches: prev.churches.map(ch => ch.id === churchId ? {
            ...ch, servantsGroups: ch.servantsGroups.map(sg => sg.id === groupId ? {
              ...sg, cases: sg.cases.map(c => c.id === updatedCase.id ? updatedCase : c)
            } : sg)
          } : ch)
        }));
        setEditingCaseInfo(null);
      };

      const handleDeleteCase = (caseId, churchId, groupId) => {
        if (!confirm('هل أنت متأكد من حذف هذه الحالة؟')) return;
        updateData(prev => ({
          ...prev, churches: prev.churches.map(ch => ch.id === churchId ? {
            ...ch, servantsGroups: ch.servantsGroups.map(sg => sg.id === groupId ? {
              ...sg, cases: sg.cases.filter(c => c.id !== caseId)
            } : sg)
          } : ch)
        }));
      };

      return (
        <div className="animate-fade-in">
          <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4">
             <h2 className="text-2xl font-bold text-[#002f6c] flex items-center gap-2">
               <Edit2 size={24} className="text-[#d4af37]" /> تسجيل الزيارة الحالية
             </h2>
             <div className="flex gap-2 w-full sm:w-auto">
                <button onClick={() => handleExportExcel(data)} className="flex-1 sm:flex-none flex items-center justify-center gap-1.5 bg-white border border-[#d4af37] text-[#8a7222] hover:bg-[#fff9e6] px-4 py-2 rounded-md font-medium transition-colors">
                  <Download size={18} /> تصدير
                </button>
                <button onClick={onEndVisit} className="flex-1 sm:flex-none flex items-center justify-center gap-1.5 bg-[#002f6c] text-white hover:bg-[#001f4c] px-4 py-2 rounded-md font-medium shadow-md transition-colors">
                  <CheckCircle size={18} /> حفظ وإنهاء
                </button>
             </div>
          </div>

          <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-6 mb-8">
            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
              <div>
                <label className="block text-sm font-medium text-gray-700 mb-1">مكان الزيارة</label>
                <MicInput value={data.location} onValueChange={(v) => updateData(p => ({...p, location: v}))} placeholder="أدخل مكان الزيارة" />
              </div>
              <div>
                <label className="block text-sm font-medium text-gray-700 mb-1">تاريخ الزيارة</label>
                <input type="date" value={data.date} onChange={(e) => updateData(p => ({...p, date: e.target.value}))} className="w-full rounded-md border border-gray-300 p-2.5 text-sm focus:border-[#002f6c] focus:ring-1 focus:ring-[#002f6c] focus:outline-none transition-shadow text-gray-900 font-sans" />
              </div>
            </div>
          </div>

          <div className="mb-6 flex justify-between items-end">
            <h3 className="text-lg font-bold text-gray-800">الكنائس والمناطق ({formatNumber((data.churches||[]).length)})</h3>
            <button onClick={handleAddChurch} className="flex items-center gap-1.5 bg-[#002f6c] text-white hover:bg-[#001f4c] px-4 py-2 rounded-md text-sm font-medium shadow-sm transition-colors">
              <Plus size={16} /> إضافة كنيسة/منطقة
            </button>
          </div>

          {(data.churches || []).length === 0 ? (
            <div className="text-center py-16 bg-white rounded-xl border border-dashed border-gray-300">
              <MapPin size={48} className="mx-auto text-gray-300 mb-3" />
              <p className="text-gray-500 font-medium text-lg">لم يتم إضافة أي كنائس بعد</p>
              <p className="text-gray-400 text-sm mt-1">اضغط على زر إضافة كنيسة للبدء في التسجيل</p>
            </div>
          ) : (
            <div className="space-y-8">
              {data.churches.map((churchLoc) => (
                <div key={churchLoc.id} className="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                  {/* Accordion Header */}
                  <div 
                    className="p-4 sm:p-5 border-b border-gray-200 bg-[#002f6c]/5 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 cursor-pointer hover:bg-[#002f6c]/10 transition-colors"
                    onClick={() => toggleChurch(churchLoc.id)}
                  >
                    <div className="flex-1 flex flex-wrap items-center gap-2 text-sm sm:text-base font-bold text-[#002f6c]">
                      <span>{churchLoc.regionName || 'منطقة غير محددة'}</span>
                      <span className="text-gray-400">-</span>
                      <span>{churchLoc.villageName || 'قرية غير محددة'}</span>
                      <span className="text-gray-400">-</span>
                      <span>{churchLoc.churchName || 'كنيسة غير محددة'}</span>
                      {(() => {
                         const stats = getChurchStats(churchLoc);
                         return (
                           <div className="mr-auto flex flex-wrap gap-2 items-center">
                              <span className="bg-white text-[#d4af37] border border-[#d4af37]/30 px-3 py-1 rounded-full text-xs font-bold shadow-sm whitespace-nowrap">
                                 📊 <span className="font-sans">{formatNumber(stats.totalCases)}</span> مشاريع
                              </span>
                              <span className="bg-white text-green-700 border border-green-200 px-3 py-1 rounded-full text-xs font-bold shadow-sm whitespace-nowrap">
                                 💰 <span className="font-sans">{formatNumber(stats.totalValue)}</span> ج.م
                              </span>
                              <span className="bg-white text-[#8a7222] border border-[#f0e0a8] px-3 py-1 rounded-full text-xs font-bold shadow-sm whitespace-nowrap hidden sm:inline-block">
                                 💸 <span className="font-sans">{formatNumber(stats.totalInst)}</span> ج.م
                              </span>
                           </div>
                         );
                      })()}
                    </div>
                    <div className="flex items-center gap-2">
                       <button onClick={(e) => { e.stopPropagation(); handleDeleteChurch(churchLoc.id); }} className="text-red-500 hover:text-red-700 hover:bg-red-50 p-2 rounded-md transition-colors" title="حذف الكنيسة"><Trash2 size={20}/></button>
                       <div className="text-gray-500">
                          {expandedChurches[churchLoc.id] ? <ChevronUp size={24} /> : <ChevronDown size={24} />}
                       </div>
                    </div>
                  </div>
                  
                  {/* Accordion Body */}
                  {expandedChurches[churchLoc.id] && (
                    <div className="animate-fade-in border-t-2 border-[#002f6c]">
                      {/* Edit Fields */}
                      <div className="p-4 sm:p-5 bg-gray-50 border-b border-gray-200 flex-1 w-full grid grid-cols-1 sm:grid-cols-3 gap-4">
                        <div><label className="block text-xs font-medium text-[#002f6c] mb-1">المنطقة</label><MicInput value={churchLoc.regionName||''} onValueChange={(v) => handleUpdateChurch({...churchLoc, regionName: v})} placeholder="اسم المنطقة" /></div>
                        <div><label className="block text-xs font-medium text-[#002f6c] mb-1">القرية</label><MicInput value={churchLoc.villageName||''} onValueChange={(v) => handleUpdateChurch({...churchLoc, villageName: v})} placeholder="اسم القرية" /></div>
                        <div><label className="block text-xs font-medium text-[#002f6c] mb-1">الكنيسة</label><MicInput value={churchLoc.churchName||''} onValueChange={(v) => handleUpdateChurch({...churchLoc, churchName: v})} placeholder="اسم الكنيسة" /></div>
                      </div>
                      
                      <div className="p-4 sm:p-5 space-y-6">
                        {(churchLoc.servantsGroups || []).map(group => (
                          <ServantsGroupView key={group.id} group={group} churchId={churchLoc.id} onUpdateGroup={handleUpdateGroup} onDeleteGroup={handleDeleteGroup} serialMap={serialMap} onEditCase={handleEditCase} onDeleteCase={handleDeleteCase} />
                        ))}
                        <div className="flex justify-center">
                          <button onClick={() => handleAddGroup(churchLoc.id)} className="flex items-center gap-2 bg-gray-50 hover:bg-gray-100 text-[#002f6c] text-sm font-medium py-2 px-5 rounded-md transition-colors border border-gray-300 border-dashed">
                            <Plus size={16} /> إضافة خدام آخرين لنفس الكنيسة
                          </button>
                        </div>
                      </div>
                    </div>
                  )}
                </div>
              ))}
            </div>
          )}

          {editingCaseInfo && <CaseModal caseData={editingCaseInfo.caseObj} onSave={handleSaveEditCase} onClose={() => setEditingCaseInfo(null)} />}
        </div>
      );
    }

    // --- PAGE 2: ARCHIVE & ANALYTICS ---
    function ArchivePage({ allVisits, onViewDetails, onEditVisit, onDeleteVisit }) {
      if (allVisits.length === 0) {
        return (
          <div className="text-center py-20">
             <ListIcon size={48} className="mx-auto text-gray-300 mb-4" />
             <p className="text-gray-500 text-lg">لا توجد زيارات مسجلة في السجل.</p>
          </div>
        );
      }
      return (
        <div className="animate-fade-in">
          <h2 className="text-2xl font-bold text-[#002f6c] mb-6 flex items-center gap-2">
            <ListIcon size={24} className="text-[#d4af37]" /> سجل الزيارات والإحصائيات
          </h2>
          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            {allVisits.map(visit => {
               const churchesCount = (visit.churches||[]).length;
               const casesCount = (visit.churches||[]).reduce((sum, ch) => sum + (ch.servantsGroups||[]).reduce((s2, sg) => s2 + (sg.cases||[]).length, 0), 0);
               return (
                 <div key={visit.id} onClick={() => onViewDetails(visit)} className="bg-white rounded-xl shadow-sm border border-gray-100 p-5 cursor-pointer hover:shadow-md hover:border-[#002f6c]/30 transition-all group">
                    <div className="flex justify-between items-start mb-3">
                       <h3 className="font-bold text-lg text-gray-900 group-hover:text-[#002f6c]">{visit.location || 'زيارة بدون اسم'}</h3>
                       <div className="flex items-center gap-2">
                           <div className="bg-gray-100 text-gray-500 text-xs px-2 py-1 rounded font-sans flex items-center gap-1"><Calendar size={12}/>{visit.date}</div>
                           <button onClick={(e) => { e.stopPropagation(); onEditVisit(visit); }} className="text-gray-400 hover:text-[#002f6c] p-1 transition-colors bg-gray-50 hover:bg-gray-100 rounded" title="تعديل الزيارة"><Edit2 size={16}/></button>
                           <button onClick={(e) => { e.stopPropagation(); onDeleteVisit(visit.id); }} className="text-gray-400 hover:text-red-600 p-1 transition-colors bg-gray-50 hover:bg-red-50 rounded" title="حذف الزيارة"><Trash2 size={16}/></button>
                       </div>
                    </div>
                    <div className="flex gap-4 text-sm text-gray-600 mt-4 pt-4 border-t border-gray-50">
                       <div>كنائس: <span className="font-bold font-sans text-gray-900">{formatNumber(churchesCount)}</span></div>
                       <div>حالات: <span className="font-bold font-sans text-gray-900">{formatNumber(casesCount)}</span></div>
                    </div>
                 </div>
               );
            })}
          </div>
        </div>
      );
    }

    function ArchiveDetails({ visit, onBack }) {
      const churchesCount = (visit.churches||[]).length;
      let totalCases = 0, totalValue = 0, totalInst = 0;
      
      const serialMap = {};
      (visit.churches || []).forEach(ch => {
         let s = 1;
         (ch.servantsGroups || []).forEach(sg => {
             (sg.cases || []).forEach(c => {
                 totalCases++;
                 totalValue += c.projectValue;
                 totalInst += c.installmentAmount;
                 serialMap[c.id] = s++;
             });
         });
      });

      return (
         <div className="animate-fade-in pb-10">
            <button onClick={onBack} className="flex items-center gap-1 text-sm font-medium text-gray-500 hover:text-[#002f6c] mb-6 transition-colors">
               <ChevronRight size={18} /> العودة للسجل
            </button>
            
            <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4">
               <div>
                  <h2 className="text-2xl font-bold text-[#002f6c]">{visit.location || 'زيارة بدون اسم'}</h2>
                  <p className="text-gray-500 text-sm mt-1 flex items-center gap-1"><Calendar size={14}/> {visit.date}</p>
               </div>
               <button onClick={() => handleExportExcel(visit, serialMap)} className="flex items-center gap-2 bg-[#d4af37] text-white hover:bg-[#c49b27] px-5 py-2 rounded-md shadow transition-colors font-medium">
                  <Download size={18} /> تصدير الإكسيل
               </button>
            </div>

            <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
               <div className="bg-white p-4 rounded-xl border border-gray-100 shadow-sm text-center">
                  <div className="text-sm text-gray-500 mb-1">إجمالي الحالات</div>
                  <div className="text-2xl font-bold text-[#002f6c] font-sans">{formatNumber(totalCases)}</div>
               </div>
               <div className="bg-white p-4 rounded-xl border border-gray-100 shadow-sm text-center">
                  <div className="text-sm text-gray-500 mb-1">عدد الكنائس</div>
                  <div className="text-2xl font-bold text-[#002f6c] font-sans">{formatNumber(churchesCount)}</div>
               </div>
               <div className="bg-green-50 p-4 rounded-xl border border-green-100 shadow-sm text-center">
                  <div className="text-sm text-green-700 mb-1">إجمالي المشاريع</div>
                  <div className="text-2xl font-bold text-green-800 font-sans">{formatNumber(totalValue)} <span className="text-sm font-normal">ج.م</span></div>
               </div>
               <div className="bg-[#fff9e6] p-4 rounded-xl border border-[#f0e0a8] shadow-sm text-center">
                  <div className="text-sm text-[#8a7222] mb-1">إجمالي الأقساط</div>
                  <div className="text-2xl font-bold text-[#8a7222] font-sans">{formatNumber(totalInst)} <span className="text-sm font-normal">ج.م</span></div>
               </div>
            </div>

            <h3 className="text-lg font-bold text-gray-800 mb-4">تفاصيل الحالات</h3>
            <div className="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
               {(visit.churches||[]).length === 0 ? <div className="p-8 text-center text-gray-500">لا توجد تفاصيل.</div> : null}
               {(visit.churches||[]).map(ch => (
                  <div key={ch.id} className="border-b border-gray-100 last:border-0">
                     <div className="bg-gray-50 px-4 py-3 border-b border-gray-200">
                        <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
                           <h4 className="font-bold text-[#002f6c]">{ch.churchName} <span className="text-sm font-normal text-gray-500">({ch.regionName} - {ch.villageName})</span></h4>
                           {(() => {
                             const stats = getChurchStats(ch);
                             return (
                               <div className="flex flex-wrap gap-2 items-center">
                                  <span className="bg-white text-[#d4af37] border border-[#d4af37]/30 px-2 py-0.5 rounded-full text-xs font-bold shadow-sm whitespace-nowrap">
                                     📊 <span className="font-sans">{formatNumber(stats.totalCases)}</span> مشاريع
                                  </span>
                                  <span className="bg-white text-green-700 border border-green-200 px-2 py-0.5 rounded-full text-xs font-bold shadow-sm whitespace-nowrap">
                                     💰 <span className="font-sans">{formatNumber(stats.totalValue)}</span> ج.م
                                  </span>
                                  <span className="bg-white text-[#8a7222] border border-[#f0e0a8] px-2 py-0.5 rounded-full text-xs font-bold shadow-sm whitespace-nowrap hidden sm:inline-block">
                                     💸 <span className="font-sans">{formatNumber(stats.totalInst)}</span> ج.م
                                  </span>
                               </div>
                             );
                           })()}
                        </div>
                     </div>
                     <div className="p-0 overflow-x-auto">
                        <table className="w-full text-sm text-right">
                           <thead className="bg-white text-gray-600 border-b border-gray-200 text-xs uppercase">
                              <tr>
                                 <th className="px-4 py-2 text-center">#</th>
                                 <th className="px-4 py-2">الخدام</th>
                                 <th className="px-4 py-2">الحالة</th>
                                 <th className="px-4 py-2">المشروع</th>
                                 <th className="px-4 py-2 text-center">القيمة</th>
                                 <th className="px-4 py-2 text-center">القسط</th>
                              </tr>
                           </thead>
                           <tbody className="divide-y divide-gray-100">
                              {(ch.servantsGroups||[]).map(sg => (
                                 (sg.cases||[]).map(c => (
                                    <tr key={c.id} className="hover:bg-gray-50">
                                       <td className="px-4 py-2 text-center font-sans text-gray-500">{formatNumber(serialMap[c.id])}</td>
                                       <td className="px-4 py-2 text-gray-600 truncate max-w-[120px]" title={sg.servantsNames}>{sg.servantsNames || '-'}</td>
                                       <td className="px-4 py-2 font-medium">{c.name}</td>
                                       <td className="px-4 py-2 text-gray-600">{c.projectType}</td>
                                       <td className="px-4 py-2 text-center font-sans text-green-700">{formatNumber(c.projectValue)}</td>
                                       <td className="px-4 py-2 text-center font-sans text-gray-600">{formatNumber(c.installmentAmount)}</td>
                                    </tr>
                                 ))
                              ))}
                           </tbody>
                        </table>
                     </div>
                  </div>
               ))}
            </div>
         </div>
      );
    }


    // --- MAIN APP COMPONENT ---
    function App() {
      const [activeTab, setActiveTab] = useState('entry'); // 'entry' | 'archive' | 'archiveDetails'
      const [isSidebarOpen, setIsSidebarOpen] = useState(false);
      const [syncStatus, setSyncStatus] = useState('synced');
      
      const [allVisits, setAllVisits] = useState([]);
      const [currentVisitId, setCurrentVisitId] = useState(null);
      const [viewingArchive, setViewingArchive] = useState(null);

      const [data, setData] = useState({ visitId: uuidv4(), location: '', date: new Date().toISOString().split('T')[0], churches: [], createdAt: Date.now() });

      // Fetch all visits once
      useEffect(() => {
        if (!db) return;
        const unsubscribe = db.collection('visits').onSnapshot(snapshot => {
          const list = [];
          snapshot.forEach(doc => {
            list.push({ id: doc.id, ...doc.data() });
          });
          list.sort((a, b) => b.createdAt - a.createdAt);
          setAllVisits(list);

          // Auto-load most recent visit into Active Entry if we don't have one loaded
          setCurrentVisitId(prev => {
             if (prev) return prev;
             if (list.length > 0) {
                 setData(list[0]);
                 return list[0].id;
             }
             return data.visitId; // use initialized fallback
          });
        });
        return () => unsubscribe();
      }, []);

      const updateData = (updater) => {
        setData(prev => {
          const next = typeof updater === 'function' ? updater(prev) : updater;
          
          // Safe cloud write ONLY triggered by explicit user actions
          if (db && currentVisitId) {
             setSyncStatus('syncing');
             const toSave = { ...next, visitId: currentVisitId };
             if (!toSave.createdAt) toSave.createdAt = Date.now();
             db.collection('visits').doc(currentVisitId).set(toSave)
               .then(() => setSyncStatus('synced'))
               .catch(() => setSyncStatus('error'));
          }
          return next;
        });
      };

      const handleEditVisit = (visit) => {
        setData(visit);
        setCurrentVisitId(visit.id);
        setActiveTab('entry');
      };

      const handleDeleteVisit = async (visitId) => {
        if (confirm('هل أنت متأكد من حذف هذه الزيارة نهائياً؟')) {
            try {
                await db.collection('visits').doc(visitId).delete();
                if (currentVisitId === visitId) {
                     const newId = uuidv4();
                     setData({ visitId: newId, location: '', date: new Date().toISOString().split('T')[0], churches: [], createdAt: Date.now() });
                     setCurrentVisitId(newId);
                }
            } catch (e) {
                console.error(e);
                alert('حدث خطأ أثناء الحذف.');
            }
        }
      };

      const handleEndVisit = () => {
        if(confirm("هل أنت متأكد من حفظ وإنهاء هذه الزيارة والبدء في زيارة جديدة؟")) {
            const newId = uuidv4();
            const emptyData = { visitId: newId, location: '', date: new Date().toISOString().split('T')[0], churches: [], createdAt: Date.now() };
            setCurrentVisitId(newId);
            setData(emptyData);
            // Optionally save the new empty shell so it exists
            if (db) db.collection('visits').doc(newId).set(emptyData);
        }
      };

      return (
        <div className="min-h-screen bg-[#f8fafc] text-gray-900 selection:bg-[#002f6c] selection:text-white pb-20">
          
          {/* TOP NAVBAR */}
          <nav className="bg-[#002f6c] text-white shadow-md sticky top-0 z-30">
            <div className="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
               <div className="flex items-center gap-4">
                  <button onClick={() => setIsSidebarOpen(true)} className="p-2 hover:bg-[#001f4c] rounded-md transition-colors"><Menu size={24} /></button>
                  <div className="flex items-center gap-3">
                     <SaintHaloIcon className="w-10 h-10 rounded-full border-2 border-[#d4af37] shadow-sm object-cover" />
                     <div className="font-bold text-[#d4af37] text-lg sm:text-xl tracking-wide hidden sm:block">خدمة الأنبا كاراس - أبحاث</div>
                  </div>
               </div>
               <div className="flex items-center gap-2">
                  <div className="hidden sm:flex items-center text-xs font-medium px-2 py-1 rounded bg-[#001f4c] text-blue-200">
                    {syncStatus === 'syncing' && <><CloudUpload size={14} className="ml-1 animate-pulse" /><span>جاري الحفظ...</span></>}
                    {syncStatus === 'synced' && <><Cloud size={14} className="ml-1 text-green-400" /><span>تم الحفظ</span></>}
                    {syncStatus === 'error' && <><CloudOff size={14} className="ml-1 text-red-400" /><span>غير متصل</span></>}
                  </div>
               </div>
            </div>
          </nav>

          {/* SIDEBAR DRAWER */}
          <div className={`fixed inset-0 bg-black/50 z-40 transition-opacity duration-300 ${isSidebarOpen ? 'opacity-100' : 'opacity-0 pointer-events-none'}`} onClick={() => setIsSidebarOpen(false)} />
          <div className={`fixed top-0 right-0 h-full w-72 bg-white shadow-2xl z-50 transform transition-transform duration-300 ease-in-out ${isSidebarOpen ? 'translate-x-0' : 'translate-x-full'}`}>
             <div className="h-16 bg-[#002f6c] px-4 flex items-center justify-between border-b border-[#001f4c]">
                <div className="flex items-center gap-3">
                   <SaintHaloIcon className="w-8 h-8 rounded-full border border-[#d4af37] object-cover" />
                   <span className="font-bold text-[#d4af37] text-sm">خدمة الأنبا كاراس</span>
                </div>
                <button onClick={() => setIsSidebarOpen(false)} className="text-white hover:text-gray-300 p-2"><X size={20}/></button>
             </div>
             <div className="py-4 flex flex-col">
                <button onClick={() => { setActiveTab('entry'); setIsSidebarOpen(false); }} className={`flex items-center gap-3 px-6 py-4 text-right transition-colors ${activeTab === 'entry' ? 'bg-blue-50 text-[#002f6c] border-r-4 border-[#002f6c] font-bold' : 'text-gray-600 hover:bg-gray-50'}`}>
                   <Edit2 size={20} /> تسجيل الزيارة الحالية
                </button>
                <button onClick={() => { setActiveTab('archive'); setIsSidebarOpen(false); }} className={`flex items-center gap-3 px-6 py-4 text-right transition-colors ${activeTab === 'archive' || activeTab === 'archiveDetails' ? 'bg-blue-50 text-[#002f6c] border-r-4 border-[#002f6c] font-bold' : 'text-gray-600 hover:bg-gray-50'}`}>
                   <ListIcon size={20} /> سجل الزيارات والإحصائيات
                </button>
             </div>
          </div>

          {/* MAIN CONTENT AREA */}
          <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
             {activeTab === 'entry' && (
                <ActiveVisitForm data={data} updateData={updateData} onEndVisit={handleEndVisit} />
             )}
             {activeTab === 'archive' && (
                <ArchivePage 
                   allVisits={allVisits} 
                   onViewDetails={(v) => { setViewingArchive(v); setActiveTab('archiveDetails'); }}
                   onEditVisit={handleEditVisit}
                   onDeleteVisit={handleDeleteVisit}
                />
             )}
             {activeTab === 'archiveDetails' && viewingArchive && (
                <ArchiveDetails 
                   visit={viewingArchive} 
                   onBack={() => { setViewingArchive(null); setActiveTab('archive'); }} 
                />
             )}
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
