                  <span className="bg-white/20 px-2 py-0.5 rounded-full text-[10px] font-sans">{formatNumber(overdueCasesCount)}</span>
                </button>
              </div>
            </div>
          )}

          {/* ========================================================= */}
          {/* VIEW MODE 1: DETAILED VISIT VIEW (PARTITIONED LIKE ARCHIVE) */}
          {/* ========================================================= */}
          {selectedVisitData ? (() => {
            const v = selectedVisitData.visit;
            
            // Build hierarchical structure for the selected visit
            const churchesInVisit = (v.churches || []).map(ch => {
              const groupsInChurch = (ch.servantsGroups || []).map(sg => {
                const executedCases = (sg.cases || []).filter(c => {
                  if (c.status !== 'executed') return false;

                  const data = extractCaseData(c, v, ch, sg);

                  if (filterStatus === 'completed' && !data.isCompleted) return false;
                  if (filterStatus === 'active' && (data.isCompleted || data.totalPaid === 0)) return false;
                  if (filterStatus === 'unpaid' && (data.isCompleted || data.totalPaid > 0)) return false;
                  if (filterStatus === 'overdue' && !data.isOverdue) return false;

                  if (filterSearch.trim()) {
                    const normSearch = normalizeArabicText(filterSearch);
                    const nMatch = normalizeArabicText(c.caseName || '').includes(normSearch);
                    const tMatch = normalizeArabicText(c.executedProjectType || c.projectType || '').includes(normSearch);
                    const idMatch = normalizeArabicText(c.nationalId || '').includes(normSearch);
                    if (!nMatch && !tMatch && !idMatch) return false;
                  }

                  return true;
                });

                if (executedCases.length === 0) return null;
                return { ...sg, cases: executedCases };
              }).filter(Boolean);

              if (groupsInChurch.length === 0) return null;
              return { ...ch, servantsGroups: groupsInChurch };
            }).filter(Boolean);

            // Group churches by regionName
            const groupedByRegion = churchesInVisit.reduce((acc, ch) => {
              const r = ch.regionName || 'منطقة غير محددة';
              if (!acc[r]) acc[r] = [];
              acc[r].push(ch);
              return acc;
            }, {});

            return (
              <div className="space-y-5">
                {/* Back button & Selected Visit Banner */}
                <div className="bg-white rounded-2xl shadow-sm border border-gray-100 p-5 space-y-4">
                  <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                    <button
                      type="button"
                      onClick={() => { setSelectedVisitIdForDetails(null); setFilterSearch(''); setFilterStatus('all'); }}
                      className="inline-flex items-center gap-1.5 text-xs font-bold text-[#002f6c] bg-blue-50 hover:bg-blue-100 px-3.5 py-2 rounded-xl transition-colors border border-blue-200 shadow-sm"
                    >
                      <ChevronRight size={16} />
                      <span>العودة لسجل الزيارات المنفذة</span>
                    </button>

                    <div className="text-xs text-gray-500 font-sans flex flex-wrap items-center gap-2">
                      <span className="bg-emerald-50 text-emerald-700 font-bold px-3 py-1 rounded-full border border-emerald-200">
                        {formatNumber(selectedVisitData.count)} مشروع منفذ بالزيارة
                      </span>
                      <button
                        type="button"
                        onClick={() => triggerBatchPayment(`سداد قسط للنزلة كلها (${v.location || 'زيارة'} - ${v.date})`, selectedVisitData.cases, v.id)}
                        className="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-3.5 py-1.5 rounded-xl shadow-sm flex items-center gap-1.5 transition-all"
                        title="تسجيل سداد قسط مجمع لجميع حالات النزلة الجارية"
                      >
                        <CreditCard size={15} />
                        <span>سداد النزلة كلها</span>
                      </button>
                    </div>
                  </div>

                  <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 pt-2 border-t border-gray-100">
                    <div>
                      <div className="flex items-center gap-2 text-lg sm:text-xl font-bold text-[#002f6c]">
                        <span>🏛️</span>
                        <span>{v.location || 'زيارة بدون اسم'}</span>
                        <span className="text-gray-500 font-normal text-sm font-sans flex items-center gap-1 mr-2">
                          <Calendar size={14} /> {v.date}
                        </span>
                      </div>
                      <p className="text-xs text-gray-500 mt-1">
                        تفاصيل سداد وأقساط مشاريع هذه الزيارة مقسمة حسب المناطق والكنائس ومجموعات الخدام
                      </p>
                    </div>

                    {/* Visit Quick Metrics Chips */}
                    <div className="flex flex-wrap gap-2 items-center">
                      <span className="bg-blue-50 text-blue-900 border border-blue-200 px-3 py-1 rounded-xl text-xs font-bold font-sans">
                        المصروف: {formatNumber(selectedVisitData.totalVal)} ج.م
                      </span>
                      <span className="bg-emerald-50 text-emerald-800 border border-emerald-200 px-3 py-1 rounded-xl text-xs font-bold font-sans">
                        المحصل: {formatNumber(selectedVisitData.paidVal)} ج.م ({selectedVisitData.progressPct}%)
                      </span>
                      <span className="bg-rose-50 text-rose-800 border border-rose-200 px-3 py-1 rounded-xl text-xs font-bold font-sans">
                        المتبقي النشط: {formatNumber(selectedVisitData.remVal)} ج.م
                      </span>
                      {(selectedVisitData.exempCount > 0 || (selectedVisitData.exemptedVal || 0) > 0) && (
                        <span className="bg-purple-50 text-purple-800 border border-purple-200 px-3 py-1 rounded-xl text-xs font-bold font-sans">
                          💜 الإعفاءات: {formatNumber(selectedVisitData.exemptedVal || 0)} ج.م ({formatNumber(selectedVisitData.exempCount || 0)} حالة)
                        </span>
                      )}
                      <span className="bg-amber-50 text-amber-900 border border-amber-200 px-3 py-1 rounded-xl text-xs font-bold font-sans">
                        القسط الشهري: {formatNumber(selectedVisitData.activeInst)} ج.م/شهر
                      </span>
                      {selectedVisitData.overdueCasesCount > 0 ? (
                        <span className="bg-rose-100 text-rose-800 border border-rose-300 px-3 py-1 rounded-xl text-xs font-bold font-sans">
                          ⚠️ المتأخرات: {formatNumber(selectedVisitData.overdueAmount)} ج.م ({selectedVisitData.overdueCasesCount} حالة • {selectedVisitData.overdueInstallments} قسط • {selectedVisitData.overduePct}%)
                        </span>
                      ) : (
                        <span className="bg-emerald-50 text-emerald-800 border border-emerald-200 px-3 py-1 rounded-xl text-xs font-bold font-sans">
                          ✅ السداد منتظم
                        </span>
                      )}
                    </div>
                  </div>

                  {/* Visit-level Filters & Search */}
                  <div className="pt-3 border-t border-gray-100 flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3">
                    {/* Status Tabs */}
                    <div className="flex flex-wrap gap-1.5">
                      <button
                        type="button"
                        onClick={() => setFilterStatus('all')}
                        className={`px-3 py-1 rounded-lg text-xs font-bold transition-all ${
                          filterStatus === 'all' 
                            ? 'bg-[#002f6c] text-white shadow-sm' 
                            : 'bg-gray-100 text-gray-600 hover:bg-gray-200'
                        }`}
                      >
                        الكل ({formatNumber(selectedVisitData.count)})
                      </button>
                      <button
                        type="button"
                        onClick={() => setFilterStatus('active')}
                        className={`px-3 py-1 rounded-lg text-xs font-bold transition-all ${
                          filterStatus === 'active' 
                            ? 'bg-amber-600 text-white shadow-sm' 
                            : 'bg-gray-100 text-gray-600 hover:bg-gray-200'
                        }`}
                      >
                        🔄 جاري ({formatNumber(selectedVisitData.actCount)})
                      </button>
                      <button
                        type="button"
                        onClick={() => setFilterStatus('completed')}
                        className={`px-3 py-1 rounded-lg text-xs font-bold transition-all ${
                          filterStatus === 'completed' 
                            ? 'bg-emerald-600 text-white shadow-sm' 
                            : 'bg-gray-100 text-gray-600 hover:bg-gray-200'
                        }`}
                      >
                        ✅ مكتمل ({formatNumber(selectedVisitData.compCount)})
                      </button>
                      <button
                        type="button"
                        onClick={() => setFilterStatus('unpaid')}
                        className={`px-3 py-1 rounded-lg text-xs font-bold transition-all ${
                          filterStatus === 'unpaid' 
                            ? 'bg-rose-600 text-white shadow-sm' 
                            : 'bg-gray-100 text-gray-600 hover:bg-gray-200'
                        }`}
                      >
                        ⏳ لم يبدأ ({formatNumber(selectedVisitData.unpCount)})
                      </button>
                      <button
                        type="button"
                        onClick={() => setFilterStatus('overdue')}
                        className={`px-3 py-1 rounded-lg text-xs font-bold transition-all ${
                          filterStatus === 'overdue' 
                            ? 'bg-rose-700 text-white shadow-sm' 
                            : 'bg-rose-50 text-rose-700 hover:bg-rose-100 border border-rose-200'
                        }`}
                      >
                        ⚠️ متأخر ({formatNumber(selectedVisitData.overdueCasesCount)})
                      </button>
                      <button
                        type="button"
                        onClick={() => setFilterStatus('exempted')}
                        className={`px-3 py-1 rounded-lg text-xs font-bold transition-all ${
                          filterStatus === 'exempted' 
                            ? 'bg-purple-700 text-white shadow-sm' 
                            : 'bg-purple-50 text-purple-700 hover:bg-purple-100 border border-purple-200'
                        }`}
                      >
                        💜 معفى ({formatNumber(selectedVisitData.exempCount || 0)})
                      </button>
                    </div>

                    {/* Search inside visit */}
                    <div className="relative w-full sm:w-64">
                      <input
                        type="text"
                        value={filterSearch}
                        onChange={(e) => setFilterSearch(e.target.value)}
                        placeholder="بحث باسم المستفيد أو نوع المشروع..."
                        className="w-full pl-8 pr-3 py-1.5 text-xs rounded-xl border border-gray-200 focus:border-[#002f6c] outline-none"
                      />
                      <Search size={14} className="absolute left-2.5 top-2 text-gray-400" />
                    </div>
                  </div>
                </div>

                {/* Hierarchical Breakdown: Regions -> Churches -> Cases (Partitioned like Archive) */}
                {Object.keys(groupedByRegion).length === 0 ? (
                  <div className="bg-white rounded-2xl p-12 text-center text-gray-400 text-sm border border-gray-100 shadow-sm">
                    لا توجد مشاريع منفذة تطابق معايير البحث داخل هذه الزيارة.
                  </div>
                ) : (
                  <div className="space-y-4">
                    {Object.entries(groupedByRegion).map(([regionName, churchesInReg]) => {
                      // Calculate Region Level Stats
                      let regCasesCount = 0;
                      let regTotalVal = 0;
                      let regPaidVal = 0;
                      let regOverdueAmount = 0;
                      let regOverdueInstallments = 0;
                      let regOverdueCasesCount = 0;

                      churchesInReg.forEach(ch => {
                        (ch.servantsGroups || []).forEach(sg => {
                          (sg.cases || []).forEach(c => {
                            const data = extractCaseData(c, v, ch, sg);
                            regCasesCount++;
                            regTotalVal += data.totalAmt;
                            regPaidVal += data.totalPaid;
                            if (data.isOverdue) {
                              regOverdueCasesCount++;
                              regOverdueAmount += data.overdueAmount;
                              regOverdueInstallments += data.overdueCount;
                            }
                          });
                        });
                      });

                      const regOverduePct = regCasesCount > 0 ? Math.round((regOverdueCasesCount / regCasesCount) * 100) : 0;

                      const isRegionExpanded = expandedRegions[regionName] !== false;

                      return (
                        <div key={regionName} className="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
                          {/* Region Accordion Header */}
                          <div
                            onClick={() => toggleRegion(regionName)}
                            className="p-4 sm:p-5 bg-gradient-to-r from-[#002f6c]/10 to-blue-50/40 border-b border-gray-200 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 cursor-pointer hover:bg-[#002f6c]/15 transition-colors select-none"
                          >
                            <div className="flex flex-wrap items-center gap-2">
                              <span className="text-xl">🏛️</span>
                              <h3 className="font-bold text-base sm:text-lg text-[#002f6c]">{regionName}</h3>
                              <div className="flex flex-wrap gap-2 items-center mr-2">
                                <span className="bg-white text-[#002f6c] border border-blue-200 px-2.5 py-0.5 rounded-full text-xs font-bold font-sans shadow-sm">
                                  ⛪ {formatNumber(churchesInReg.length)} كنائس
                                </span>
                                <span className="bg-white text-emerald-800 border border-emerald-200 px-2.5 py-0.5 rounded-full text-xs font-bold font-sans shadow-sm">
                                  📊 {formatNumber(regCasesCount)} مشاريع منفذة
                                </span>
                                <span className="bg-white text-blue-900 border border-blue-200 px-2.5 py-0.5 rounded-full text-xs font-bold font-sans shadow-sm">
                                  💰 {formatNumber(regTotalVal)} ج.م مصروف
                                </span>
                                <span className="bg-white text-emerald-700 border border-emerald-200 px-2.5 py-0.5 rounded-full text-xs font-bold font-sans shadow-sm">
                                  ✅ {formatNumber(regPaidVal)} ج.م مسدد
                                </span>
                                {regOverdueCasesCount > 0 ? (
                                  <span className="bg-rose-50 text-rose-700 border border-rose-200 px-2.5 py-0.5 rounded-full text-xs font-bold font-sans shadow-sm">
                                    ⚠️ المتأخرات: {formatNumber(regOverdueAmount)} ج.م ({regOverdueCasesCount} حالة • {regOverdueInstallments} قسط • {regOverduePct}%)
                                  </span>
                                ) : (
                                  <span className="bg-emerald-50 text-emerald-700 border border-emerald-200 px-2.5 py-0.5 rounded-full text-xs font-bold font-sans shadow-sm">
                                    ✅ السداد منتظم
                                  </span>
                                )}
                              </div>
                            </div>
                            <div className="flex items-center gap-2 mr-auto sm:mr-0">
                              <button
                                type="button"
                                onClick={(e) => {
                                  e.stopPropagation();
                                  const regCases = [];
                                  churchesInReg.forEach(chItem => {
                                    (chItem.servantsGroups || []).forEach(sg => {
                                      (sg.cases || []).forEach(c => {
                                        if (c.status === 'executed') {
                                          regCases.push({ caseObj: c, churchName: chItem.churchName, regionName: chItem.regionName });
                                        }
                                      });
                                    });
                                  });
                                  triggerBatchPayment(`سداد قسط لمنطقة: ${regionName}`, regCases, v.id);
                                }}
                                className="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-3 py-1.5 rounded-xl shadow-sm flex items-center gap-1.5 transition-all"
                                title={`تسجيل سداد قسط لجميع حالات منطقة ${regionName}`}
                              >
                                <CreditCard size={14} />
                                <span>سداد المنطقة كلها</span>
                              </button>
                              <div className="text-gray-500">
                                {isRegionExpanded ? <ChevronUp size={22} /> : <ChevronDown size={22} />}
                              </div>
                            </div>
                          </div>

                          {/* Churches within Region */}
                          {isRegionExpanded && (
                            <div className="divide-y divide-gray-100 bg-gray-50/40">
                              {churchesInReg.map(ch => {
                                let chCasesCount = 0;
                                let chTotalVal = 0;
                                let chPaidVal = 0;
                                let chOverdueAmount = 0;
                                let chOverdueInstallments = 0;
                                let chOverdueCasesCount = 0;

                                (ch.servantsGroups || []).forEach(sg => {
                                  (sg.cases || []).forEach(c => {
                                    const data = extractCaseData(c, v, ch, sg);
                                    chCasesCount++;
                                    chTotalVal += data.totalAmt;
                                    chPaidVal += data.totalPaid;
                                    if (data.isOverdue) {
                                      chOverdueCasesCount++;
                                      chOverdueAmount += data.overdueAmount;
                                      chOverdueInstallments += data.overdueCount;
                                    }
                                  });
                                });

                                const chOverduePct = chCasesCount > 0 ? Math.round((chOverdueCasesCount / chCasesCount) * 100) : 0;

                                const isChurchExpanded = expandedChurches[ch.id] !== false;

                                return (
                                  <div key={ch.id} className="bg-white">
                                    {/* Church Accordion Header */}
                                    <div
                                      onClick={() => toggleChurch(ch.id)}
                                      className="p-3.5 sm:p-4 bg-gray-50 border-b border-gray-200 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 cursor-pointer hover:bg-gray-100/80 transition-colors select-none"
                                    >
                                      <div className="flex items-center gap-2">
                                        <div className="text-gray-400">
                                          {isChurchExpanded ? <ChevronUp size={18} /> : <ChevronDown size={18} />}
                                        </div>
                                        <span className="text-base">⛪</span>
                                        <h4 className="font-bold text-sm sm:text-base text-gray-900">
                                          {ch.churchName}
                                          <span className="text-xs font-normal text-gray-500 mr-2">
                                            ({ch.regionName} {ch.villageName ? `• ${ch.villageName}` : ''})
                                          </span>
                                        </h4>
                                      </div>

                                      <div className="flex flex-wrap items-center gap-2 mr-6 sm:mr-0">
                                        <span className="bg-white text-gray-700 border border-gray-200 px-2 py-0.5 rounded-md text-[11px] font-bold font-sans">
                                          👥 {formatNumber((ch.servantsGroups || []).length)} مجموعات
                                        </span>
                                        <span className="bg-white text-[#002f6c] border border-blue-200 px-2 py-0.5 rounded-md text-[11px] font-bold font-sans">
                                          📊 {formatNumber(chCasesCount)} مشاريع
                                        </span>
                                        <span className="bg-white text-emerald-700 border border-emerald-200 px-2 py-0.5 rounded-md text-[11px] font-bold font-sans">
                                          💰 {formatNumber(chTotalVal)} ج.م
                                        </span>
                                        {chOverdueCasesCount > 0 ? (
                                          <span className="bg-rose-50 text-rose-700 border border-rose-200 px-2 py-0.5 rounded-md text-[11px] font-bold font-sans">
                                            ⚠️ المتأخرات: {formatNumber(chOverdueAmount)} ج.م ({chOverdueCasesCount} حالة • {chOverdueInstallments} قسط • {chOverduePct}%)
                                          </span>
                                        ) : (
                                          <span className="bg-emerald-50 text-emerald-700 border border-emerald-200 px-2 py-0.5 rounded-md text-[11px] font-bold font-sans">
                                            ✅ السداد منتظم
                                          </span>
                                        )}
                                        <button
                                          type="button"
                                          onClick={(e) => {
                                            e.stopPropagation();
                                            const chCases = [];
                                            (ch.servantsGroups || []).forEach(sg => {
                                              (sg.cases || []).forEach(c => {
                                                if (c.status === 'executed') {
                                                  chCases.push({ caseObj: c, churchName: ch.churchName, regionName: ch.regionName });
                                                }
                                              });
                                            });
                                            triggerBatchPayment(`سداد قسط لكنيسة: ${ch.churchName}`, chCases, v.id);
                                          }}
                                          className="bg-emerald-600 hover:bg-emerald-700 text-white text-[11px] font-bold px-2.5 py-1 rounded-lg shadow-sm flex items-center gap-1 transition-all mr-1"
                                          title={`تسجيل سداد قسط لجميع حالات كنيسة ${ch.churchName}`}
                                        >
                                          <CreditCard size={13} />
                                          <span>سداد الكنيسة كلها</span>
                                        </button>
                                      </div>
                                    </div>

                                    {/* Church Cases Container (Desktop Table + Mobile Cards) */}
                                    {isChurchExpanded && (() => {
                                      let serial = 1;
                                      const casesList = [];
                                      (ch.servantsGroups || []).forEach(sg => {
                                        (sg.cases || []).forEach(c => {
                                          const data = extractCaseData(c, v, ch, sg);
                                          const pPct = data.totalAmt > 0 ? Math.min(100, Math.round((data.totalPaid / data.totalAmt) * 100)) : 0;
                                          casesList.push({
                                            serial: serial++,
                                            ...data,
                                            pPct
                                          });
                                        });
                                      });

                                      return (
                                        <div>
                                          {/* Desktop Table View (Hidden on mobile < 768px) */}
                                          <div className="hidden md:block overflow-x-auto">
                                            <table className="w-full text-right text-xs">
                                              <thead className="bg-[#002f6c] text-white">
                                                <tr>
                                                  <th className="p-3">#</th>
                                                  <th className="p-3">الخدام</th>
                                                  <th className="p-3">اسم المستفيد</th>
                                                  <th className="p-3">نوع المشروع المنفذ</th>
                                                  <th className="p-3 font-sans">أصل المبلغ</th>
                                                  <th className="p-3 font-sans">القسط والمدة</th>
                                                  <th className="p-3 font-sans">المسدد / المتبقي</th>
                                                  <th className="p-3">نسبة السداد</th>
                                                  <th className="p-3 text-center">حالة السداد</th>
                                                  <th className="p-3 text-center">إجراء السداد</th>
                                                </tr>
                                              </thead>
                                              <tbody className="divide-y divide-gray-100 bg-white">
                                                {casesList.map(item => (
                                                  <tr key={item.caseObj.id || item.serial} className="hover:bg-blue-50/50 transition-colors">
                                                    <td className="p-3 font-sans font-bold text-gray-400">{item.serial}</td>
                                                    <td className="p-3 text-gray-600 max-w-[130px] truncate" title={item.servantsNames}>
                                                      {item.servantsNames || '—'}
                                                    </td>
                                                    <td className="p-3 font-bold text-gray-900">
                                                      <div>{item.caseObj.caseName}</div>
                                                      {item.caseObj.nationalId && (
                                                        <div className="text-[10px] text-gray-500 font-sans">{item.caseObj.nationalId}</div>
                                                      )}
                                                    </td>
                                                    <td className="p-3">
                                                      <span className="bg-blue-50 text-blue-900 border border-blue-200 px-2.5 py-0.5 rounded-full text-[11px] font-medium">
                                                        {item.caseObj.executedProjectType || item.caseObj.projectType || 'مشروع'}
                                                      </span>
                                                      {item.caseObj.executionDate && (
                                                        <div className="text-[10px] text-gray-500 font-sans mt-0.5">نفذ: {item.caseObj.executionDate}</div>
                                                      )}
                                                    </td>
                                                    <td className="p-3 font-sans font-bold text-gray-900 text-sm">
                                                      {formatNumber(item.totalAmt)} ج.م
                                                    </td>
                                                    <td className="p-3">
                                                      <div className="font-sans font-bold text-amber-800">{formatNumber(item.monthlyAmt)} ج.م / شهر</div>
                                                      <div className="text-[10px] text-gray-500 font-sans">{item.totalMonths} شهر استحقاق</div>
                                                    </td>
                                                    <td className="p-3">
                                                      <div className="font-sans font-bold text-emerald-700">{formatNumber(item.totalPaid)} ج.م مسدد</div>
                                                      {item.isExempted ? (
                                                        <div className="font-sans text-[11px] text-purple-700 font-bold">معفى: {formatNumber(item.exemptedAmount)} ج.م</div>
                                                      ) : (
                                                        <div className="font-sans text-[11px] text-rose-600 font-bold">متبقي: {formatNumber(item.remainingAmt)} ج.م</div>
                                                      )}
                                                    </td>
                                                    <td className="p-3 w-32">
                                                      <div className="flex justify-between text-[10px] font-bold font-sans text-gray-600 mb-1">
                                                        <span>{item.pPct}%</span>
                                                      </div>
                                                      <div className="w-full bg-gray-200 h-2 rounded-full overflow-hidden">
                                                        <div 
                                                          className={`h-full ${item.isExempted ? 'bg-purple-500' : (item.isCompleted ? 'bg-emerald-500' : 'bg-blue-600')}`} 
                                                          style={{ width: `${item.pPct}%` }}
                                                        ></div>
                                                      </div>
                                                    </td>
                                                    <td className="p-3 text-center">
                                                      {item.isExempted ? (
                                                        <span className="bg-purple-100 text-purple-800 border border-purple-300 px-2.5 py-1 rounded-full text-[10px] font-bold inline-flex items-center gap-1 shadow-xs">
                                                          <span>💜</span> معفى ({item.exemptionReason || 'وفاة'})
                                                        </span>
                                                      ) : item.isCompleted ? (
                                                        <span className="bg-emerald-100 text-emerald-800 border border-emerald-300 px-2.5 py-1 rounded-full text-[10px] font-bold inline-flex items-center gap-1">
                                                          <span>✅</span> مكتمل
                                                        </span>
                                                      ) : item.isOverdue ? (
                                                        <span className="bg-rose-100 text-rose-800 border border-rose-300 px-2.5 py-1 rounded-full text-[10px] font-bold inline-flex items-center gap-1 font-sans" title={`المستحق حتى اليوم: ${formatNumber(item.expectedDueAmount)} ج.م`}>
                                                          <span>⚠️</span> متأخر ({item.overdueCount} قسط • {formatNumber(item.overdueAmount)} ج.م)
                                                        </span>
                                                      ) : item.totalPaid > 0 ? (
                                                        <span className="bg-amber-100 text-amber-800 border border-amber-300 px-2.5 py-1 rounded-full text-[10px] font-bold inline-flex items-center gap-1">
                                                          <span>🔄</span> جاري
                                                        </span>
                                                      ) : (
                                                        <span className="bg-gray-100 text-gray-700 border border-gray-300 px-2.5 py-1 rounded-full text-[10px] font-bold inline-flex items-center gap-1">
                                                          <span>⏳</span> لم يبدأ
                                                        </span>
                                                      )}
                                                    </td>
                                                    <td className="p-3 text-center">
                                                      <button
                                                        type="button"
                                                        onClick={() => setActiveModalCaseInfo(item)}
                                                        className="bg-[#002f6c] hover:bg-[#001f4c] text-white text-xs font-bold px-3 py-1.5 rounded-lg shadow-sm flex items-center justify-center gap-1.5 transition-colors mx-auto"
                                                      >
                                                        <span>💵</span>
                                                        <span>سداد ومتابعة</span>
                                                      </button>
                                                    </td>
                                                  </tr>
                                                ))}
                                              </tbody>
                                            </table>
                                          </div>

                                          {/* Mobile Touch Cards View (Shown only on mobile < 768px) */}
                                          <div className="md:hidden divide-y divide-gray-100 p-3 space-y-3 bg-gray-50/60">
                                            {casesList.map(item => (
                                              <div key={item.caseObj.id || item.serial} className="bg-white rounded-2xl p-4 border border-gray-200 shadow-sm space-y-3">
                                                <div className="flex justify-between items-start gap-2">
                                                  <div>
                                                    <div className="font-bold text-sm text-gray-900">{item.caseObj.caseName}</div>
                                                    {item.caseObj.nationalId && (
                                                      <div className="text-[11px] text-gray-500 font-sans mt-0.5">رقم قومي: {item.caseObj.nationalId}</div>
                                                    )}
                                                    <div className="text-[11px] text-gray-500 mt-1">الخدام: {item.servantsNames || '—'}</div>
                                                  </div>
                                                  {item.isExempted ? (
                                                    <span className="bg-purple-100 text-purple-800 border border-purple-300 px-2.5 py-1 rounded-full text-[10px] font-bold shrink-0 shadow-xs">
                                                      💜 معفى ({item.exemptionReason || 'وفاة'})
                                                    </span>
                                                  ) : item.isCompleted ? (
                                                    <span className="bg-emerald-100 text-emerald-800 border border-emerald-300 px-2.5 py-1 rounded-full text-[10px] font-bold shrink-0">
                                                      ✅ مكتمل
                                                    </span>
                                                  ) : item.isOverdue ? (
                                                    <span className="bg-rose-100 text-rose-800 border border-rose-300 px-2.5 py-1 rounded-full text-[10px] font-bold shrink-0 font-sans">
                                                      ⚠️ متأخر ({item.overdueCount} قسط • {formatNumber(item.overdueAmount)} ج.م)
                                                    </span>
                                                  ) : item.totalPaid > 0 ? (
                                                    <span className="bg-amber-100 text-amber-800 border border-amber-300 px-2.5 py-1 rounded-full text-[10px] font-bold shrink-0">
                                                      🔄 جاري
                                                    </span>
                                                  ) : (
                                                    <span className="bg-gray-100 text-gray-700 border border-gray-300 px-2.5 py-1 rounded-full text-[10px] font-bold shrink-0">
                                                      ⏳ لم يبدأ
                                                    </span>
                                                  )}
                                                </div>

                                                <div className="flex flex-wrap items-center gap-1.5 text-xs">
                                                  <span className="bg-blue-50 text-blue-900 border border-blue-200 px-2.5 py-0.5 rounded-md text-[11px] font-medium">
                                                    🏷️ {item.caseObj.executedProjectType || item.caseObj.projectType || 'مشروع'}
                                                  </span>
                                                  {item.caseObj.executionDate && (
                                                    <span className="bg-gray-100 text-gray-600 px-2 py-0.5 rounded-md text-[10px] font-sans">
                                                      تاريخ التنفيذ: {item.caseObj.executionDate}
                                                    </span>
                                                  )}
                                                </div>

                                                {/* 3-col Numbers Grid */}
                                                <div className="grid grid-cols-3 gap-2 text-center bg-gray-50 p-2.5 rounded-xl border border-gray-100">
                                                  <div>
                                                    <div className="text-[10px] text-gray-500">أصل المبلغ</div>
                                                    <div className="font-bold text-xs font-sans text-gray-900 mt-0.5">{formatNumber(item.totalAmt)} ج.م</div>
                                                  </div>
                                                  <div>
                                                    <div className="text-[10px] text-gray-500">المسدد</div>
                                                    <div className="font-bold text-xs font-sans text-emerald-700 mt-0.5">{formatNumber(item.totalPaid)} ج.م</div>
                                                  </div>
                                                  <div>
                                                    <div className="text-[10px] text-gray-500">{item.isExempted ? 'المعفى المسقط' : 'المتبقي'}</div>
                                                    <div className={`font-bold text-xs font-sans mt-0.5 ${item.isExempted ? 'text-purple-700' : 'text-rose-600'}`}>
                                                      {formatNumber(item.isExempted ? item.exemptedAmount : item.remainingAmt)} ج.م
                                                    </div>
                                                  </div>
                                                </div>

                                                {/* Installment & Progress Bar */}
                                                <div className="space-y-1">
                                                  <div className="flex justify-between text-[11px] text-gray-600 font-sans">
                                                    <span>القسط: <strong className="text-amber-800">{formatNumber(item.monthlyAmt)}</strong> ج.م / شهر ({item.totalMonths} شهر)</span>
                                                    <span className="font-bold text-[#002f6c]">{item.pPct}%</span>
                                                  </div>
                                                  <div className="w-full bg-gray-200 h-2 rounded-full overflow-hidden">
                                                    <div 
                                                      className={`h-full ${item.isCompleted ? 'bg-emerald-500' : 'bg-blue-600'}`} 
                                                      style={{ width: `${item.pPct}%` }}
                                                    />
                                                  </div>
                                                </div>

                                                {/* Action Button */}
                                                <button
                                                  type="button"
                                                  onClick={() => setActiveModalCaseInfo(item)}
                                                  className="w-full bg-[#002f6c] hover:bg-[#001f4c] text-white text-xs font-bold py-2.5 px-3 rounded-xl shadow-sm flex items-center justify-center gap-1.5 transition-colors"
                                                >
                                                  <span>💵</span>
                                                  <span>سداد ومتابعة الأقساط</span>
                                                </button>
                                              </div>
                                            ))}
                                          </div>
                                        </div>
                                      );
                                    })()}
                                  </div>
                                );
                              })}
                            </div>
                          )}
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            );
          })() : (
            /* ========================================================= */
            /* VIEW MODE 2 & 3: VISITS RECORD (CARDS) OR ALL CASES (TABLE) */
            /* ========================================================= */
            <div className="space-y-4">
              {/* View Switcher Tabs: سجل الزيارات المنفذة OR عرض كل الحالات مباشرة */}
              <div className="bg-white rounded-2xl shadow-sm border border-gray-100 p-2 flex flex-col sm:flex-row justify-between items-stretch sm:items-center gap-3">
                <div className="flex flex-wrap gap-2">
                  <button
                    type="button"
                    onClick={() => setViewMode('visits')}
                    className={`px-4 py-2 rounded-xl text-xs font-bold transition-all flex items-center gap-2 ${
                      viewMode === 'visits'
                        ? 'bg-[#002f6c] text-white shadow-sm'
                        : 'bg-gray-100 text-gray-700 hover:bg-gray-200'
                    }`}
                  >
                    <span>🗂️ سجل الزيارات المنفذة</span>
                    <span className={`px-2 py-0.5 rounded-full text-[11px] font-sans ${viewMode === 'visits' ? 'bg-white/20 text-white' : 'bg-gray-200 text-gray-800'}`}>
                      {formatNumber(visitsWithExecuted.length)} زيارة
                    </span>
                  </button>

                  <button
                    type="button"
                    onClick={() => setViewMode('regions')}
                    className={`px-4 py-2 rounded-xl text-xs font-bold transition-all flex items-center gap-2 ${
                      viewMode === 'regions'
                        ? 'bg-[#002f6c] text-white shadow-sm'
                        : 'bg-gray-100 text-gray-700 hover:bg-gray-200'
                    }`}
                  >
                    <span>🏛️ دليل المناطق والكنائس</span>
                    <span className={`px-2 py-0.5 rounded-full text-[11px] font-sans ${viewMode === 'regions' ? 'bg-white/20 text-white' : 'bg-gray-200 text-gray-800'}`}>
                      {formatNumber(geoRegionsData.length)} منطقة
                    </span>
                  </button>

                  <button
                    type="button"
                    onClick={() => setViewMode('allCases')}
                    className={`px-4 py-2 rounded-xl text-xs font-bold transition-all flex items-center gap-2 ${
                      viewMode === 'allCases'
                        ? 'bg-[#002f6c] text-white shadow-sm'
                        : 'bg-gray-100 text-gray-700 hover:bg-gray-200'
                    }`}
                  >
                    <span>📋 عرض كل الحالات مباشرة</span>
                    <span className={`px-2 py-0.5 rounded-full text-[11px] font-sans ${viewMode === 'allCases' ? 'bg-white/20 text-white' : 'bg-gray-200 text-gray-800'}`}>
                      {formatNumber(allExecutedCases.length)} حالة
                    </span>
                  </button>

                  <button
                    type="button"
                    onClick={() => { setViewMode('analytics'); setSelectedAnalyticsCategory(null); }}
                    className={`px-4 py-2 rounded-xl text-xs font-bold transition-all flex items-center gap-2 ${
                      viewMode === 'analytics'
                        ? 'bg-purple-700 text-white shadow-sm ring-2 ring-purple-400/30'
                        : 'bg-purple-50 text-purple-800 hover:bg-purple-100 border border-purple-200'
                    }`}
                  >
                    <span>📊 تحليل وتوزيع المشاريع</span>
                    <span className={`px-2 py-0.5 rounded-full text-[11px] font-sans ${viewMode === 'analytics' ? 'bg-white/20 text-white' : 'bg-purple-200 text-purple-900'}`}>
                      {formatNumber(projectAnalyticsData.list.length)} أنشطة
                    </span>
                  </button>
                </div>

                {/* Region Filter & Search Inputs */}
                <div className="flex flex-col sm:flex-row items-center gap-2">
                  <div className="relative w-full sm:w-56">
                    <input
                      type="text"
                      value={filterSearch}
                      onChange={(e) => setFilterSearch(e.target.value)}
                      placeholder={viewMode === 'visits' ? "بحث باسم المنطقة أو التاريخ..." : viewMode === 'regions' ? "بحث بالمنطقة أو الكنيسة أو المستفيد..." : "بحث باسم المستفيد أو المشروع..."}
                      className="w-full pl-8 pr-3 py-1.5 text-xs rounded-xl border border-gray-200 focus:border-[#002f6c] outline-none"
                    />
                    <Search size={14} className="absolute left-2.5 top-2 text-gray-400" />
                  </div>

                  <select
                    value={filterRegion}
                    onChange={(e) => { setFilterRegion(e.target.value); setFilterChurch(''); }}
                    className="w-full sm:w-44 py-1.5 px-2 text-xs rounded-xl border border-gray-200 focus:border-[#002f6c] outline-none bg-white font-medium"
                  >
                    <option value="">🗺️ كل المناطق ({formatNumber(uniqueRegions.length)})</option>
                    {uniqueRegions.map(r => (
                      <option key={r} value={r}>{r}</option>
                    ))}
                  </select>
                </div>
              </div>

              {/* ---------------------------------------------------- */}
              {/* SUBVIEW A: VISITS RECORD (GRID OF EXECUTED VISITS)   */}
              {/* ---------------------------------------------------- */}
              {viewMode === 'visits' && (
                <div>
                  {filteredVisits.length === 0 ? (
                    <div className="bg-white rounded-2xl p-12 text-center text-gray-400 text-sm border border-gray-100 shadow-sm space-y-3">
                      <div className="text-3xl">🗂️</div>
                      <div className="font-bold text-gray-700">لا توجد زيارات بمشاريع منفذة مطابقة لمعايير البحث.</div>
                      <p className="text-xs text-gray-500">
                        يمكنك إضافة مشروع سابق يدوياً أو استيراد مشاريع من ملف Excel، أو اعتماد تنفيذ المشاريع من سجل الزيارات.
                      </p>
                    </div>
                  ) : (
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-5">
                      {filteredVisits.map(item => {
                        const v = item.visit;
                        const isFullyCollected = item.compCount === item.count;

                        return (
                          <div
                            key={v.id}
                            onClick={() => { setSelectedVisitIdForDetails(v.id); setFilterSearch(''); setFilterStatus('all'); }}
                            className="bg-white rounded-2xl shadow-sm border border-gray-200 hover:border-[#002f6c]/40 hover:shadow-md transition-all p-5 cursor-pointer flex flex-col justify-between group relative overflow-hidden"
                          >
                            {/* Top decorative accent */}
                            <div className={`absolute top-0 right-0 left-0 h-1.5 ${isFullyCollected ? 'bg-emerald-500' : 'bg-[#002f6c]'}`} />

                            <div className="space-y-3">
                              {/* Card Header: Location & Date */}
                              <div className="flex justify-between items-start gap-2 pt-1">
                                <div>
                                  <h3 className="font-bold text-base sm:text-lg text-gray-900 group-hover:text-[#002f6c] transition-colors flex items-center gap-1.5">
                                    <span>🏛️</span>
                                    <span>{v.location || 'زيارة بدون اسم'}</span>
                                  </h3>
                                  <div className="text-xs text-gray-500 font-sans flex items-center gap-1 mt-1">
                                    <Calendar size={13} className="text-gray-400" />
                                    <span>تاريخ الزيارة: {v.date}</span>
                                  </div>
                                </div>

                                <span className="bg-blue-50 text-[#002f6c] border border-blue-200 px-2.5 py-1 rounded-full text-xs font-bold font-sans whitespace-nowrap shadow-sm">
                                  📊 {formatNumber(item.count)} مشروع
                                </span>
                              </div>

                              {/* Repayment Progress Bar */}
                              <div className="bg-gray-50 p-3 rounded-xl border border-gray-100 space-y-1.5">
                                <div className="flex justify-between items-center text-xs font-bold font-sans">
                                  <span className="text-gray-600">نسبة السداد المحصل:</span>
                                  <span className={item.progressPct >= 100 ? 'text-emerald-700 font-extrabold' : 'text-[#002f6c]'}>
                                    {item.progressPct}%
                                  </span>
                                </div>
                                <div className="w-full bg-gray-200 h-2 rounded-full overflow-hidden">
                                  <div
                                    className={`h-full transition-all duration-500 ${isFullyCollected ? 'bg-emerald-500' : 'bg-blue-600'}`}
                                    style={{ width: `${item.progressPct}%` }}
                                  />
                                </div>
                                <div className="flex justify-between items-center text-[10px] text-gray-500 font-sans pt-0.5">
                                  <span>{formatNumber(item.compCount)} مكتمل</span>
                                  <span>{formatNumber(item.actCount)} جاري</span>
                                  <span>{formatNumber(item.unpCount)} لم يبدأ</span>
                                </div>
                              </div>

                              {/* Financial Numbers Grid */}
                              <div className="grid grid-cols-2 gap-2 text-xs">
                                <div className="bg-blue-50/50 p-2 rounded-lg border border-blue-100">
                                  <div className="text-[10px] text-gray-500">المصروف المنفذ</div>
                                  <div className="font-bold font-sans text-blue-900 text-sm mt-0.5">
                                    {formatNumber(item.totalVal)} <span className="text-[10px] font-normal">ج.م</span>
                                  </div>
                                </div>

// Reusable Pure SVG Pie Chart Component
function SvgPieChart({ data = [], valueKey = 'count', labelKey = 'name', title = '', subTitle = '', unit = '', colors = [], onSliceClick = null, selectedLabel = null }) {
  const { useMemo } = React;

  const total = useMemo(() => {
    return data.reduce((sum, item) => sum + (parseFloat(item[valueKey]) || 0), 0);
  }, [data, valueKey]);

  // Generate pie slices with SVG arc paths
  const slices = useMemo(() => {
    if (total <= 0) return [];
    let cumulativeAngle = 0;

    return data.map((item, idx) => {
      const val = parseFloat(item[valueKey]) || 0;
      if (val <= 0) return null;

      const percentage = (val / total) * 100;
      const angle = (val / total) * 360;
      const startAngle = cumulativeAngle;
      const endAngle = cumulativeAngle + angle;
      cumulativeAngle += angle;

      // Convert angles to radians (start from top: -90 deg)
      const startRad = ((startAngle - 90) * Math.PI) / 180;
      const endRad = ((endAngle - 90) * Math.PI) / 180;

      const cx = 110;
      const cy = 110;
      const r = 90;
      const innerR = 48; // Donut chart for modern elegance

      const x1 = cx + r * Math.cos(startRad);
      const y1 = cy + r * Math.sin(startRad);
      const x2 = cx + r * Math.cos(endRad);
      const y2 = cy + r * Math.sin(endRad);

      const ix1 = cx + innerR * Math.cos(endRad);
      const iy1 = cy + innerR * Math.sin(endRad);
      const ix2 = cx + innerR * Math.cos(startRad);
      const iy2 = cy + innerR * Math.sin(startRad);

      const largeArc = angle > 180 ? 1 : 0;

      // SVG path definition
      let pathData = '';
      if (angle >= 359.9) {
        // Full circle
        pathData = `M ${cx} ${cy - r} A ${r} ${r} 0 1 0 ${cx} ${cy + r} A ${r} ${r} 0 1 0 ${cx} ${cy - r} M ${cx} ${cy - innerR} A ${innerR} ${innerR} 0 1 1 ${cx} ${cy + innerR} A ${innerR} ${innerR} 0 1 1 ${cx} ${cy - innerR} Z`;
      } else {
        pathData = `M ${x1} ${y1} A ${r} ${r} 0 ${largeArc} 1 ${x2} ${y2} L ${ix1} ${iy1} A ${innerR} ${innerR} 0 ${largeArc} 0 ${ix2} ${iy2} Z`;
      }

      const color = colors[idx % colors.length] || '#3b82f6';
      const isSelected = selectedLabel === item[labelKey];

      return {
        item,
        val,
        percentage: percentage.toFixed(1),
        pathData,
        color,
        isSelected
      };
    }).filter(Boolean);
  }, [data, valueKey, labelKey, total, colors, selectedLabel]);

  return (
    <div className="bg-white rounded-2xl p-5 border border-gray-100 shadow-sm flex flex-col justify-between">
      {/* Chart Title */}
      <div className="border-b border-gray-100 pb-3 mb-4">
        <h3 className="text-sm sm:text-base font-black text-[#002f6c] flex items-center gap-2">
          <span>🥧</span>
          <span>{title}</span>
        </h3>
        {subTitle && (
          <p className="text-xs text-gray-500 mt-0.5">{subTitle}</p>
        )}
      </div>

      {total <= 0 ? (
        <div className="h-64 flex items-center justify-center text-gray-400 text-xs">
          لا توجد بيانات كافية للرسم
        </div>
      ) : (
        <div className="flex flex-col md:flex-row items-center justify-around gap-6">
          {/* SVG Donut / Pie */}
          <div className="relative w-[220px] h-[220px] shrink-0">
            <svg viewBox="0 0 220 220" className="w-full h-full transform hover:scale-105 transition-transform duration-300 drop-shadow-sm">
              {slices.map((s, idx) => (
                <path
                  key={idx}
                  d={s.pathData}
                  fill={s.color}
                  stroke="#ffffff"
                  strokeWidth={s.isSelected ? "3" : "1.5"}
                  className="cursor-pointer transition-all duration-200 hover:opacity-85"
                  style={{
                    filter: s.isSelected ? 'drop-shadow(0 0 6px rgba(0,0,0,0.3))' : 'none'
                  }}
                  onClick={() => onSliceClick && onSliceClick(s.item[labelKey])}
                >
                  <title>{`${s.item[labelKey]}: ${formatNumber(s.val)} ${unit} (${s.percentage}%)`}</title>
                </path>
              ))}
            </svg>
            {/* Center Donut Label */}
            <div className="absolute inset-0 flex flex-col items-center justify-center pointer-events-none text-center">
              <span className="text-[11px] font-bold text-gray-400">الإجمالي</span>
              <span className="text-xs sm:text-sm font-black text-gray-900 font-sans">
                {formatNumber(total)}
              </span>
              {unit && <span className="text-[10px] text-gray-500 font-semibold">{unit}</span>}
            </div>
          </div>

          {/* Interactive Legend List */}
          <div className="flex-1 w-full max-h-56 overflow-y-auto pr-1 space-y-1.5 custom-scrollbar">
            {slices.map((s, idx) => {
              const isSelected = s.isSelected;
              return (
                <div
                  key={idx}
                  onClick={() => onSliceClick && onSliceClick(s.item[labelKey])}
                  className={`flex items-center justify-between p-2 rounded-xl text-xs cursor-pointer transition-all ${
                    isSelected
                      ? 'bg-[#002f6c] text-white shadow-sm font-bold'
                      : 'hover:bg-gray-50 text-gray-700 font-medium'
                  }`}
                >
                  <div className="flex items-center gap-2 min-w-0">
                    <span
                      className="w-3 h-3 rounded-full shrink-0 shadow-xs"
                      style={{ backgroundColor: s.color }}
                    ></span>
                    <span className="truncate">{s.item[labelKey]}</span>
                  </div>
                  <div className="flex items-center gap-2 font-sans shrink-0">
                    <span className={isSelected ? 'text-white' : 'font-bold text-gray-900'}>
                      {formatNumber(s.val)} {unit}
                    </span>
                    <span className={`px-1.5 py-0.5 rounded-md text-[10px] font-bold ${
                      isSelected ? 'bg-white/20 text-white' : 'bg-gray-100 text-gray-600'
                    }`}>
                      {s.percentage}%
                    </span>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      )}
    </div>
  );
}

function AnalyticsPage({ allVisits = [], onNavigateToCase, onExport }) {
  const { useState, useMemo } = React;

  // Active Visits (non-deleted)
  const activeVisits = useMemo(() => {
    return allVisits.filter(v => !v.isDeleted);
  }, [allVisits]);

  // Project Dictionary (for canonical project resolution)
  const projectDictionary = useMemo(() => buildEffectiveProjectDictionary(allVisits), [allVisits]);

  // Filters
  const [filterRegion, setFilterRegion] = useState('');
  const [filterChurch, setFilterChurch] = useState('');
  const [selectedCategory, setSelectedCategory] = useState(null); // Drill-down into a specific project type
  const [searchTerm, setSearchTerm] = useState('');

  // Extract all executed cases across all visits
  const allExecutedCases = useMemo(() => {
    const list = [];
    activeVisits.forEach(v => {
      (v.churches || []).forEach(ch => {
        (ch.servantsGroups || []).forEach(sg => {
          (sg.cases || []).forEach(c => {
            if (c.status === 'executed') {
              const totalAmt = parseFloat(c.executedProjectValue || c.projectValue) || 0;
              const payments = c.payments || [];
              const totalPaid = payments.reduce((sum, p) => sum + (parseFloat(p.amount) || 0), 0);
              const monthlyAmt = parseFloat(c.executedInstallmentAmount || c.installmentAmount) || 0;
              const isExempted = !!c.isExempted;
              const exemptedAmount = isExempted ? (parseFloat(c.exemptedAmount) || Math.max(0, totalAmt - totalPaid)) : 0;
              const remainingAmt = Math.max(0, totalAmt - totalPaid - exemptedAmount);
              const isCompleted = !isExempted && remainingAmt <= 0 && totalAmt > 0;

              // Overdue Calculation
              let isOverdue = false;
              let overdueCount = 0;
              let overdueAmount = 0;
              if (!isCompleted && !isExempted && totalAmt > 0) {
                const startDateStr = c.executionDate || v.date;
                if (startDateStr) {
                  const [sY, sM] = startDateStr.split('-').map(Number);
                  const now = new Date();
                  const currentYear = now.getFullYear();
                  const currentMonth = now.getMonth() + 1;
                  const monthsElapsed = Math.max(0, (currentYear - sY) * 12 + (currentMonth - sM));
                  const totalMonths = monthlyAmt > 0 ? Math.ceil(totalAmt / monthlyAmt) : 0;
                  const expectedDueMonths = Math.min(monthsElapsed, totalMonths);
                  const monthsPaid = monthlyAmt > 0 ? Math.floor(totalPaid / monthlyAmt) : 0;
                  if (expectedDueMonths > monthsPaid) {
                    overdueCount = expectedDueMonths - monthsPaid;
                    isOverdue = true;
                    overdueAmount = Math.min(remainingAmt, overdueCount * monthlyAmt);
                  }
                }
              }

              list.push({
                caseObj: c,
                visitId: v.id,
                visitDate: v.date,
                visitLocation: v.location,
                regionName: ch.region || '',
                churchName: ch.name || '',
                villageName: ch.village || '',
                groupLeader: sg.leader || '',
                totalAmt,
                totalPaid,
                monthlyAmt,
                remainingAmt,
                isCompleted,
                isExempted,
                exemptedAmount,
                isOverdue,
                overdueCount,
                overdueAmount,
                payments
              });
            }
          });
        });
      });
    });
    return list;
  }, [activeVisits]);

  // Unique regions and churches
  const uniqueRegions = useMemo(() => {
    return Array.from(new Set(allExecutedCases.map(c => c.regionName).filter(Boolean))).sort();
  }, [allExecutedCases]);

  const uniqueChurches = useMemo(() => {
    return Array.from(new Set(allExecutedCases.filter(c => !filterRegion || c.regionName === filterRegion).map(c => c.churchName).filter(Boolean))).sort();
  }, [allExecutedCases, filterRegion]);

  // Apply filters
  const filteredCases = useMemo(() => {
    return allExecutedCases.filter(item => {
      if (filterRegion && item.regionName !== filterRegion) return false;
      if (filterChurch && item.churchName !== filterChurch) return false;
      if (searchTerm.trim()) {
        const norm = normalizeArabicText(searchTerm);
        const nameMatch = normalizeArabicText(item.caseObj.caseName || '').includes(norm);
        const typeMatch = normalizeArabicText(item.caseObj.executedProjectType || item.caseObj.projectType || '').includes(norm);
        const churchMatch = normalizeArabicText(item.churchName || '').includes(norm);
        const regMatch = normalizeArabicText(item.regionName || '').includes(norm);
        if (!nameMatch && !typeMatch && !churchMatch && !regMatch) return false;
      }
      return true;
    });
  }, [allExecutedCases, filterRegion, filterChurch, searchTerm]);

  // Compute Analytics Data by Project Category
  const analytics = useMemo(() => {
    const statsMap = {};
    let grandTotalCases = 0;
    let grandTotalValue = 0;
    let grandTotalPaid = 0;
    let grandTotalRemaining = 0;
    let grandTotalExempted = 0;
    let grandTotalOverdue = 0;
    let grandCompletedCases = 0;
    let grandExemptedCases = 0;
    let grandOverdueCases = 0;

    filteredCases.forEach(item => {
      const rawType = item.caseObj.executedProjectType || item.caseObj.projectType || 'مشروع غير محدد';
      const canonicalName = resolveCanonicalProject(rawType, projectDictionary);

      if (!statsMap[canonicalName]) {
        statsMap[canonicalName] = {
          name: canonicalName,
          rawTypes: new Set(),
          count: 0,
          totalValue: 0,
          totalPaid: 0,
          totalRemaining: 0,
          totalExempted: 0,
          overdueCount: 0,
          overdueAmount: 0,
          completedCount: 0,
          exemptedCount: 0,
          cases: []
        };
      }

      const s = statsMap[canonicalName];
      s.rawTypes.add(rawType);
      s.count++;
      s.totalValue += item.totalAmt;
      s.totalPaid += item.totalPaid;
      s.totalRemaining += item.remainingAmt;
      s.totalExempted += item.exemptedAmount;
      if (item.isCompleted) s.completedCount++;
      if (item.isExempted) s.exemptedCount++;
      if (item.isOverdue) {
        s.overdueCount++;
        s.overdueAmount += item.overdueAmount;
      }
      s.cases.push(item);

      grandTotalCases++;
      grandTotalValue += item.totalAmt;
      grandTotalPaid += item.totalPaid;
      grandTotalRemaining += item.remainingAmt;
      grandTotalExempted += item.exemptedAmount;
      if (item.isCompleted) grandCompletedCases++;
      if (item.isExempted) grandExemptedCases++;
      if (item.isOverdue) {
        grandOverdueCases++;
        grandTotalOverdue += item.overdueAmount;
      }
    });

    const categoriesList = Object.values(statsMap).map(s => {
      // Percentage by count of cases
      const casesPercentage = grandTotalCases > 0 ? ((s.count / grandTotalCases) * 100).toFixed(1) : '0';
      // Percentage by financial capital invested
      const valuePercentage = grandTotalValue > 0 ? ((s.totalValue / grandTotalValue) * 100).toFixed(1) : '0';
      // Collection rate inside this specific project type
      const collectionRate = s.totalValue > 0 ? Math.round((s.totalPaid / s.totalValue) * 100) : 0;
      // Overdue rate inside this project type
      const overdueRate = s.count > 0 ? Math.round((s.overdueCount / s.count) * 100) : 0;

      return {
        ...s,
        rawTypesList: Array.from(s.rawTypes),
        casesPercentage: parseFloat(casesPercentage),
        valuePercentage: parseFloat(valuePercentage),
        collectionRate,
        overdueRate
      };
    }).sort((a, b) => b.count - a.count);

    const overallCollectionRate = grandTotalValue > 0 ? Math.round((grandTotalPaid / grandTotalValue) * 100) : 0;
    const overallOverdueRate = grandTotalCases > 0 ? Math.round((grandOverdueCases / grandTotalCases) * 100) : 0;
    const overallExemptedRate = grandTotalCases > 0 ? Math.round((grandExemptedCases / grandTotalCases) * 100) : 0;

    return {
      categoriesList,
      grandTotalCases,
      grandTotalValue,
      grandTotalPaid,
      grandTotalRemaining,
      grandTotalExempted,
      grandTotalOverdue,
      grandCompletedCases,
      grandExemptedCases,
      grandOverdueCases,
      overallCollectionRate,
      overallOverdueRate,
      overallExemptedRate
    };
  }, [filteredCases, projectDictionary]);

  // Export Analytics to Excel
  const handleExportAnalyticsExcel = () => {
    if (typeof XLSX === 'undefined') {
      window.notifyError('مكتبة الإكسيل غير متوفرة حالياً.');
      return;
    }

    const aoa = [
      ['تقرير تحليلات أنواع المشاريع ونسب التنفيذ والسداد - خدمة القديس الأنبا كاراس'],
      [`تاريخ التقرير: ${new Date().toISOString().split('T')[0]}`],
      [],
      [
        'مسلسل',
        'نوع المشروع (التصنيف)',
        'المسميات المندرجة تحته',
        'عدد الحالات المنفذة',
        'نسبة الحالات (%)',
        'إجمالي التمويل (ج.م)',
        'نسبة التمويل من الخدمة (%)',
        'إجمالي المسدد (ج.م)',
        'نسبة السداد والتحصيل (%)',
        'المبلغ المتبقي (ج.م)',
        'مبالغ المتأخرات (ج.م)',
        'عدد الحالات المتأخرة',
        'مبالغ الإعفاءات (ج.م)',
        'عدد الحالات المعفاة',
        'مكتمل السداد'
      ]
    ];

    analytics.categoriesList.forEach((c, idx) => {
      aoa.push([
        idx + 1,
        c.name,
        c.rawTypesList.join('، '),
        c.count,
        `${c.casesPercentage}%`,
        c.totalValue,
        `${c.valuePercentage}%`,
        c.totalPaid,
        `${c.collectionRate}%`,
        c.totalRemaining,
        c.overdueAmount,
        c.overdueCount,
        c.totalExempted,
        c.exemptedCount,
        c.completedCount
      ]);
    });

    aoa.push([]);
    aoa.push([
      'الإجمالي العام للخدمة',
      `عدد الأنشطة: ${analytics.categoriesList.length}`,
      '',
      analytics.grandTotalCases,
      '100%',
      analytics.grandTotalValue,
      '100%',
      analytics.grandTotalPaid,
      `${analytics.overallCollectionRate}%`,
      analytics.grandTotalRemaining,
      analytics.grandTotalOverdue,
      analytics.grandOverdueCases,
      analytics.grandTotalExempted,
      analytics.grandExemptedCases,
      analytics.grandCompletedCases
    ]);

    const wb = XLSX.utils.book_new();

                            </span>

                            <span className="px-2 py-0.5 rounded-full text-xs font-bold bg-amber-100 text-amber-800">
                              متأخر ({pct}%)
                            </span>
                          ) : (
                            <span className="px-2 py-0.5 rounded-full text-xs font-bold bg-blue-100 text-blue-800">

                            </span>
                          )}
                        </td>
                      </tr>
                    );
                  })}
              </tbody>
            </table>
          </div>
        </div>
      )}
    </div>
  );
}
