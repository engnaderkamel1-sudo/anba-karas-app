// ================================================================
// MODULE: pages/ArchivePage.js
// ================================================================
    function ArchivePage({ allVisits, onViewDetails, onEditVisit, onDeleteVisit }) {
      if (allVisits.length === 0) {
        return (
          <div className="text-center py-20">
             <ListIcon size={48} className="mx-auto text-gray-300 mb-4" />
             <p className="text-gray-500 text-lg">لا توجد زيارات مسجلة في السجل.</p>
          </div>
        );
      }
      return (
        <div className="animate-fade-in">
          <h2 className="text-2xl font-bold text-[#002f6c] mb-6 flex items-center gap-2">
            <ListIcon size={24} className="text-[#d4af37]" /> سجل الزيارات والإحصائيات
          </h2>
          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            {allVisits.map(visit => {
               const churchesCount = (visit.churches||[]).length;
               const casesCount = (visit.churches||[]).reduce((sum, ch) => sum + (ch.servantsGroups||[]).reduce((s2, sg) => s2 + (sg.cases||[]).length, 0), 0);
               return (
                 <div key={visit.id} onClick={() => onViewDetails(visit)} className="bg-white rounded-xl shadow-sm border border-gray-100 p-5 cursor-pointer hover:shadow-md hover:border-[#002f6c]/30 transition-all group">
                    <div className="flex justify-between items-start mb-3">
                       <h3 className="font-bold text-lg text-gray-900 group-hover:text-[#002f6c]">{visit.location || 'زيارة بدون اسم'}</h3>
                       <div className="flex items-center gap-2">
                           <div className="bg-gray-100 text-gray-500 text-xs px-2 py-1 rounded font-sans flex items-center gap-1"><Calendar size={12}/>{visit.date}</div>
                           {!isReadOnly && <button onClick={(e) => { e.stopPropagation(); onEditVisit(visit); }} className="text-gray-400 hover:text-[#002f6c] p-1 transition-colors bg-gray-50 hover:bg-gray-100 rounded" title="تعديل الزيارة"><Edit2 size={16}/></button>}
                           {!isReadOnly && <button onClick={(e) => { e.stopPropagation(); onDeleteVisit(visit.id); }} className="text-gray-400 hover:text-red-600 p-1 transition-colors bg-gray-50 hover:bg-red-50 rounded" title="حذف الزيارة"><Trash2 size={16}/></button>}
                       </div>
                    </div>
                    <div className="flex gap-4 text-sm text-gray-600 mt-4 pt-4 border-t border-gray-50">
                       <div>كنائس: <span className="font-bold font-sans text-gray-900">{formatNumber(churchesCount)}</span></div>
                       <div>حالات: <span className="font-bold font-sans text-gray-900">{formatNumber(casesCount)}</span></div>
                    </div>
                 </div>
               );
            })}
          </div>
        </div>
      );
    }

// ================================================================
// MODULE: pages/TrashPage.js
// ================================================================
    function TrashPage({ deletedVisits, onRestore, onPermanentDelete, onEmptyTrash }) {
      if (deletedVisits.length === 0) {
        return (
          <div className="text-center py-20">
             <Trash2 size={48} className="mx-auto text-gray-300 mb-4" />
             <p className="text-gray-500 text-lg">سلة المهملات فارغة.</p>
          </div>
        );
      }
      return (
        <div className="animate-fade-in">
          <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
              <h2 className="text-2xl font-bold text-[#002f6c] flex items-center gap-2">
                <Trash2 size={24} className="text-red-500" /> سلة المهملات
              </h2>
              {!isReadOnly && <button onClick={onEmptyTrash} className="flex items-center gap-2 bg-red-50 text-red-600 hover:bg-red-100 hover:text-red-700 px-4 py-2 rounded-md font-medium text-sm transition-colors border border-red-200 shadow-sm">
                 <AlertTriangle size={16} /> تفريغ سلة المهملات بالكامل
              </button>}
          </div>
          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            {deletedVisits.map(visit => {
               const churchesCount = (visit.churches||[]).length;
               const now = Date.now();
               const deletedAt = visit.deletedAt || now;
               const THIRTY_DAYS = 30 * 24 * 60 * 60 * 1000;
               const timePassed = now - deletedAt;
               const daysRemaining = Math.max(0, Math.ceil((THIRTY_DAYS - timePassed) / (1000 * 60 * 60 * 24)));

               return (
                 <div key={visit.id} className="bg-white rounded-xl shadow-sm border border-red-100 p-5 group relative overflow-hidden">
                    <div className="absolute top-0 right-0 left-0 h-1 bg-red-200"></div>
                    <div className="flex justify-between items-start mb-3">
                       <h3 className="font-bold text-lg text-gray-800 line-through opacity-70">{visit.location || 'زيارة بدون اسم'}</h3>
                       <div className="bg-red-50 text-red-600 text-xs px-2 py-1 rounded font-sans flex items-center gap-1 font-bold">
                           متبقي {formatNumber(daysRemaining)} يوم
                       </div>
                    </div>
                    <div className="text-sm text-gray-500 mb-4 flex items-center gap-1">
                        <Calendar size={14}/> تاريخ الزيارة: {visit.date}
                    </div>
                    <div className="flex gap-2 text-sm mt-4 pt-4 border-t border-gray-50 justify-end">
                       {!isReadOnly && <>
                       <button onClick={() => onRestore(visit.id)} className="flex items-center gap-1 bg-gray-50 hover:bg-green-50 text-gray-600 hover:text-green-700 px-3 py-1.5 rounded-md transition-colors border border-gray-200 hover:border-green-300 font-medium text-xs shadow-sm">
                           <RotateCcw size={14} /> استعادة
                       </button>
                       <button onClick={() => onPermanentDelete(visit.id)} className="flex items-center gap-1 bg-red-50 hover:bg-red-600 text-red-600 hover:text-white px-3 py-1.5 rounded-md transition-colors font-medium text-xs shadow-sm">
                           <Trash2 size={14} /> حذف نهائي للأبد
                       </button>
                       </>}
                    </div>
                 </div>
               );
            })}
          </div>
        </div>
      );
    }

// ================================================================
// MODULE: pages/ArchiveDetails.js
// ================================================================
    function ArchiveDetails({ visit, onBack, onExport, onUpdateVisit }) {
      const [filterStatus, setFilterStatus] = useState('all'); // 'all' | 'initial' | 'executed' | 'cancelled'
      const [executingCaseInfo, setExecutingCaseInfo] = useState(null);
      const [editingCaseInfo, setEditingCaseInfo] = useState(null);
      const [editingChurchInfo, setEditingChurchInfo] = useState(null);
      const [showImportModal, setShowImportModal] = useState(false);

      const [filterRegion, setFilterRegion] = useState('');
      const [filterChurch, setFilterChurch] = useState('');
      const [filterServant, setFilterServant] = useState('');
      const [filterProject, setFilterProject] = useState('');
      const [filterCase, setFilterCase] = useState('');
      const [searchQuery, setSearchQuery] = useState('');
      const [expandedRegions, setExpandedRegions] = useState({});
      const [expandedChurches, setExpandedChurches] = useState({});
      const toggleRegion = (regionName) => setExpandedRegions(prev => ({ ...prev, [regionName]: !(prev[regionName] !== undefined ? prev[regionName] : Boolean(searchQuery)) }));
      const toggleChurch = (churchId) => setExpandedChurches(prev => ({ ...prev, [churchId]: !(prev[churchId] !== undefined ? prev[churchId] : Boolean(searchQuery)) }));

      const uniqueRegions = Array.from(new Set((visit.churches||[]).map(ch => ch.regionName).filter(Boolean))).sort();
      const uniqueChurches = Array.from(new Set((visit.churches||[]).filter(ch => !filterRegion || ch.regionName === filterRegion).map(ch => ch.churchName).filter(Boolean))).sort();
      const uniqueServants = Array.from(new Set((visit.churches||[]).flatMap(ch => (ch.servantsGroups || []).map(sg => sg.servantsNames)).filter(Boolean))).sort();
      const uniqueProjects = Array.from(new Set((visit.churches||[]).flatMap(ch => (ch.servantsGroups || []).flatMap(sg => (sg.cases || []).map(c => c.projectType))).filter(Boolean))).sort();
      const uniqueCases = Array.from(new Set((visit.churches||[]).flatMap(ch => (ch.servantsGroups || []).flatMap(sg => (sg.cases || []).map(c => c.name))).filter(Boolean))).sort();

      const normalizedSearchQuery = searchQuery.trim() ? (typeof normalizeArabicText === 'function' ? normalizeArabicText(searchQuery.trim()) : searchQuery.trim().toLowerCase()) : '';

      const statusCounts = { all: 0, initial: 0, executed: 0, cancelled: 0 };
      (visit.churches || []).forEach(ch => {
        (ch.servantsGroups || []).forEach(sg => {
          (sg.cases || []).forEach(c => {
            statusCounts.all++;
            const st = c.status || 'initial';
            if (st === 'executed') statusCounts.executed++;
            else if (st === 'cancelled') statusCounts.cancelled++;
            else statusCounts.initial++;
          });
        });
      });

      let filteredChurches = (visit.churches || []).map(ch => {
          if (filterRegion && ch.regionName !== filterRegion) return null;
          if (filterChurch && ch.churchName !== filterChurch) return null;
          
          const filteredGroups = (ch.servantsGroups || []).map(sg => {
              if (filterServant && sg.servantsNames !== filterServant) return null;
              
              const filteredCases = (sg.cases || []).filter(c => {
                  if (filterStatus !== 'all' && (c.status || 'initial') !== filterStatus) return false;
                  if (filterProject && c.projectType !== filterProject) return false;
                  if (filterCase && c.name !== filterCase) return false;
                  if (normalizedSearchQuery) {
                      const searchableParts = [
                          c.name, c.caseName, c.nationalId, c.phone, c.villageName,
                          c.projectType, c.executedProjectType, c.notes, c.executionNotes,
                          c.address, c.status,
                          ch.churchName, ch.regionName, ch.villageName,
                          sg.servantsNames
                      ].filter(Boolean).map(val => typeof normalizeArabicText === 'function' ? normalizeArabicText(String(val)) : String(val).toLowerCase()).join(' ');
                      const qWords = normalizedSearchQuery.split(/\s+/).filter(Boolean); if (!qWords.every(w => searchableParts.includes(w))) return false;
                  }
                  return true;
              });
              
              if (filteredCases.length === 0 && (filterStatus !== 'all' || filterProject || filterCase || normalizedSearchQuery)) return null;
              return { ...sg, cases: filteredCases };
          }).filter(Boolean);
          
          if (filteredGroups.length === 0 && (filterStatus !== 'all' || filterServant || filterProject || filterCase || normalizedSearchQuery)) return null;
          return { ...ch, servantsGroups: filteredGroups };
      }).filter(Boolean);

      let totalCases = 0, totalApprovedValue = 0, totalExecutedValue = 0, executedCasesCount = 0, totalInst = 0;
      const churchesCount = filteredChurches.length;
      
      const serialMap = {};
      (visit.churches || []).forEach(ch => {
         let s = 1;
         (ch.servantsGroups || []).forEach(sg => {
             (sg.cases || []).forEach(c => {
                 serialMap[c.id] = s++;
             });
         });
      });

      filteredChurches.forEach(ch => {
         (ch.servantsGroups || []).forEach(sg => {
             (sg.cases || []).forEach(c => {
                 totalCases++;
                 const val = parseFloat(c.projectValue) || 0;
                 const execVal = parseFloat(c.executedProjectValue) || val;
                 const inst = parseFloat(c.installmentAmount) || 0;
                 const execInst = parseFloat(c.executedInstallmentAmount) || inst;
                 
                 totalApprovedValue += val;
                 if (c.status === 'executed') {
                   executedCasesCount++;
                   totalExecutedValue += execVal;
                   totalInst += execInst;
                 } else {
                   totalInst += inst;
                 }
             });
         });
      });

            const handleEditCase = (caseObj, churchId, groupId) => {
        setEditingCaseInfo({ caseObj, churchId, groupId });
      };

      const handleSaveEditCase = (updatedCase) => {
        if (!onUpdateVisit || !editingCaseInfo) return;
        const { churchId, groupId } = editingCaseInfo;
        const updatedChurches = (visit.churches || []).map(ch => ch.id === churchId ? {
          ...ch,
          servantsGroups: (ch.servantsGroups || []).map(sg => sg.id === groupId ? {
            ...sg,
            cases: (sg.cases || []).map(c => c.id === updatedCase.id ? updatedCase : c)
          } : sg)
        } : ch);
        onUpdateVisit({ ...visit, churches: updatedChurches });
        setEditingCaseInfo(null);
      };

      const handleDeleteCase = (caseId, caseName, churchId, groupId) => {
        if (!confirm('\u0647\u0644 \u0623\u0646\u062a \u0645\u062a\u0623\u0643\u062f \u0645\u0646 \u062d\u063f\u0641 \u062d\u0627\u0644\u0629 "' + (caseName || '') + '"\u061f')) return;
        if (!onUpdateVisit) return;
        const updatedChurches = (visit.churches || []).map(ch => ch.id === churchId ? {
          ...ch,
          servantsGroups: (ch.servantsGroups || []).map(sg => sg.id === groupId ? {
            ...sg,
            cases: (sg.cases || []).filter(c => c.id !== caseId)
          } : sg)
        } : ch);
        onUpdateVisit({ ...visit, churches: updatedChurches });
      };

      const handleEditChurch = (ch, e) => {
        if (e) e.stopPropagation();
        setEditingChurchInfo({
          churchId: ch.id,
          churchName: ch.churchName || '',
          regionName: ch.regionName || '',
          villageName: ch.villageName || ''
        });
      };

      const handleSaveEditChurch = (churchId, newChurchName, newRegionName, newVillageName) => {
        if (!onUpdateVisit) return;
        const updatedChurches = (visit.churches || []).map(ch => ch.id === churchId ? {
          ...ch,
          churchName: newChurchName.trim() || ch.churchName,
          regionName: newRegionName.trim() || ch.regionName,
          villageName: newVillageName.trim() || ch.villageName
        } : ch);
        onUpdateVisit({ ...visit, churches: updatedChurches });
        setEditingChurchInfo(null);
      };

      const handleDeleteChurch = (churchId, churchName, e) => {
        if (e) e.stopPropagation();
        if (!confirm('\u0647\u0644 \u0623\u0646\u062a \u0645\u062a\u0623\u0643\u062f \u0645\u0646 \u062d\u063f\u0641 \u0643\u0646\u064a\u0633\u0629 "' + (churchName || '') + '" \u0648\u062c\u0645\u064a\u0639 \u062d\u0627\u0644\u0627\u062a\u0647\u0627 \u0646\u0647\u0627\u0626\u064a\u0627\u064b\u061f')) return;
        if (!onUpdateVisit) return;
        const updatedChurches = (visit.churches || []).filter(ch => ch.id !== churchId);
        onUpdateVisit({ ...visit, churches: updatedChurches });
      };

      const handleSaveExecutionCase = (updatedCase) => {
        if (!onUpdateVisit || !executingCaseInfo) return;
        const { churchId, groupId } = executingCaseInfo;
        const updatedChurches = (visit.churches || []).map(ch => ch.id === churchId ? {
          ...ch,
          servantsGroups: (ch.servantsGroups || []).map(sg => sg.id === groupId ? {
            ...sg,
            cases: (sg.cases || []).map(c => c.id === updatedCase.id ? updatedCase : c)
          } : sg)
        } : ch);
        const nextVisit = { ...visit, churches: updatedChurches };
        onUpdateVisit(nextVisit);
        setExecutingCaseInfo(null);
      };

      const handleApplyExcelUpdates = (selectedMatches, execDate) => {
        if (!onUpdateVisit) return;
        const updatedChurches = (visit.churches || []).map(ch => ({
          ...ch,
          servantsGroups: (ch.servantsGroups || []).map(sg => ({
            ...sg,
            cases: (sg.cases || []).map(c => {
              const match = selectedMatches.find(m => m.existing.caseObj.id === c.id);
              if (match) {
                return {
                  ...c,
                  status: 'executed',
                  executedProjectType: match.excelData.projectType || c.projectType,
                  executedProjectValue: match.excelData.projectValue || c.projectValue,
                  executedInstallmentAmount: match.excelData.installmentAmount || c.installmentAmount,
                  executionDate: execDate || new Date().toISOString().split('T')[0],
                  executionNotes: match.excelData.notes || c.notes || ''
                };
              }
              return c;
            })
          }))
        }));
        const nextVisit = { ...visit, churches: updatedChurches };
        onUpdateVisit(nextVisit);
        setShowImportModal(false);
        alert(`تم بنجاح تحديث وتأكيد تنفيذ ${selectedMatches.length} حالة في هذه الزيارة!`);
      };

      return (
         <div className="animate-fade-in pb-10">
            <button onClick={onBack} className="flex items-center gap-1 text-sm font-medium text-gray-500 hover:text-[#002f6c] mb-6 transition-colors">
               <ChevronRight size={18} /> العودة للسجل
            </button>
            
            <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4">
               <div>
                  <h2 className="text-2xl font-bold text-[#002f6c]">{visit.location || 'زيارة بدون اسم'}</h2>
                  <p className="text-gray-500 text-sm mt-1 flex items-center gap-1"><Calendar size={14}/> {visit.date}</p>
               </div>
               <div className="flex flex-wrap gap-2 w-full md:w-auto">
                  {!isReadOnly && (
                     <button onClick={() => setShowImportModal(true)} className="flex-1 md:flex-none flex items-center justify-center gap-2 bg-emerald-600 text-white hover:bg-emerald-700 px-5 py-2 rounded-md shadow transition-colors font-medium text-sm">
                        <Upload size={18} /> استيراد كشف التنفيذ
                     </button>
                  )}
                  <button onClick={() => onExport(visit)} className="flex-1 md:flex-none flex items-center justify-center gap-2 bg-[#d4af37] text-white hover:bg-[#c49b27] px-5 py-2 rounded-md shadow transition-colors font-medium text-sm">
                     <Download size={18} /> تصدير الإكسيل
                  </button>
               </div>
            </div>

            <div className="grid grid-cols-2 md:grid-cols-5 gap-4 mb-6">
               <div className="bg-white p-4 rounded-xl border border-gray-100 shadow-sm text-center">
                  <div className="text-xs text-gray-500 mb-1">إجمالي الحالات</div>
                  <div className="text-xl font-bold text-[#002f6c] font-sans">{formatNumber(totalCases)}</div>
               </div>
               <div className="bg-white p-4 rounded-xl border border-gray-100 shadow-sm text-center">
                  <div className="text-xs text-gray-500 mb-1">عدد الكنائس</div>
                  <div className="text-xl font-bold text-[#002f6c] font-sans">{formatNumber(churchesCount)}</div>
               </div>
               <div className="bg-amber-50 p-4 rounded-xl border border-amber-200 shadow-sm text-center">
                  <div className="text-xs text-amber-800 mb-1">الموافقة المبدئية</div>
                  <div className="text-xl font-bold text-amber-700 font-sans">{formatNumber(totalApprovedValue)} <span className="text-xs font-normal">ج.م</span></div>
               </div>
               <div className="bg-emerald-50 p-4 rounded-xl border border-emerald-200 shadow-sm text-center">
                  <div className="text-xs text-emerald-800 mb-1">المنفذ فعلياً ({formatNumber(executedCasesCount)})</div>
                  <div className="text-xl font-bold text-emerald-700 font-sans">{formatNumber(totalExecutedValue)} <span className="text-xs font-normal">ج.م</span></div>
               </div>
               <div className="bg-[#fff9e6] p-4 rounded-xl border border-[#f0e0a8] shadow-sm text-center col-span-2 md:col-span-1">
                  <div className="text-xs text-[#8a7222] mb-1">إجمالي الأقساط</div>
                  <div className="text-xl font-bold text-[#8a7222] font-sans">{formatNumber(totalInst)} <span className="text-xs font-normal">ج.م</span></div>
               </div>
            </div>

            {/* STATUS NAVIGATION TABS */}
            <div className="flex flex-wrap items-center gap-2 mb-6 bg-white p-2 rounded-xl shadow-sm border border-gray-200">
               <button
                 type="button"
                 onClick={() => setFilterStatus('all')}
                 className={`flex items-center gap-2 px-4 py-2.5 rounded-lg text-sm font-bold transition-all ${
                   filterStatus === 'all'
                     ? 'bg-[#002f6c] text-white shadow-md'
                     : 'text-gray-600 hover:bg-gray-100'
                 }`}
               >
                 <span>🌐 كل المشاريع</span>
                 <span className={`px-2 py-0.5 rounded-full text-xs font-sans ${filterStatus === 'all' ? 'bg-white/20 text-white' : 'bg-gray-200 text-gray-700'}`}>
                   {formatNumber(statusCounts.all)}
                 </span>
               </button>

               <button
                 type="button"
                 onClick={() => setFilterStatus('initial')}
                 className={`flex items-center gap-2 px-4 py-2.5 rounded-lg text-sm font-bold transition-all ${
                   filterStatus === 'initial'
                     ? 'bg-amber-600 text-white shadow-md'
                     : 'text-amber-800 hover:bg-amber-50'
                 }`}
               >
                 <span>⏳ موافقة مبدئية</span>
                 <span className={`px-2 py-0.5 rounded-full text-xs font-sans ${filterStatus === 'initial' ? 'bg-white/20 text-white' : 'bg-amber-100 text-amber-900'}`}>
                   {formatNumber(statusCounts.initial)}
                 </span>
               </button>

               <button
                 type="button"
                 onClick={() => setFilterStatus('executed')}
                 className={`flex items-center gap-2 px-4 py-2.5 rounded-lg text-sm font-bold transition-all ${
                   filterStatus === 'executed'
                     ? 'bg-emerald-600 text-white shadow-md'
                     : 'text-emerald-800 hover:bg-emerald-50'
                 }`}
               >
                 <span>✅ مشاريع منفذة</span>
                 <span className={`px-2 py-0.5 rounded-full text-xs font-sans ${filterStatus === 'executed' ? 'bg-white/20 text-white' : 'bg-emerald-100 text-emerald-900'}`}>
                   {formatNumber(statusCounts.executed)}
                 </span>
               </button>

               <button
                 type="button"
                 onClick={() => setFilterStatus('cancelled')}
                 className={`flex items-center gap-2 px-4 py-2.5 rounded-lg text-sm font-bold transition-all ${
                   filterStatus === 'cancelled'
                     ? 'bg-red-600 text-white shadow-md'
                     : 'text-red-700 hover:bg-red-50'
                 }`}
               >
                 <span>❌ لم تُنفّذ / ملغاة</span>
                 <span className={`px-2 py-0.5 rounded-full text-xs font-sans ${filterStatus === 'cancelled' ? 'bg-white/20 text-white' : 'bg-red-100 text-red-800'}`}>
                   {formatNumber(statusCounts.cancelled)}
                 </span>
               </button>
            </div>
            
            {/* ADVANCED FILTERS */}
            <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-5 mb-6">
               <div className="flex justify-between items-center mb-4 border-b border-gray-50 pb-2">
                  <h4 className="text-sm font-bold text-gray-700 flex items-center gap-2"><Search size={16} className="text-[#002f6c]"/> تصفية متقدمة</h4>
                  {(searchQuery || filterRegion || filterChurch || filterServant || filterProject || filterCase) && (
                     <button onClick={() => { setSearchQuery(''); setFilterRegion(''); setFilterChurch(''); setFilterServant(''); setFilterProject(''); setFilterCase(''); }} className="text-xs flex items-center gap-1 text-red-500 hover:text-red-700 bg-red-50 hover:bg-red-100 px-3 py-1.5 rounded-md transition-colors font-medium">
                         <RotateCcw size={14}/> إعادة ضبط الفلاتر
                     </button>
                  )}
               </div>
               {/* Search input bar */}
             <div className="mb-4">
                <div className="relative">
                   <div className="absolute inset-y-0 right-0 pr-3.5 flex items-center pointer-events-none text-gray-400">
                      <Search size={16} />
                   </div>
                   <input
                      type="text"
                      value={searchQuery}
                      onChange={e => setSearchQuery(e.target.value)}
                      placeholder="بحث سريع بأي كلمة (اسم الحالة، الرقم القومي، رقم الهاتف، نوع المشروع، الكنيسة، القرية، الخادم...)"
                      className="w-full text-sm border border-gray-200 rounded-lg pr-10 pl-10 py-2.5 outline-none focus:border-[#002f6c] focus:ring-2 focus:ring-[#002f6c]/20 bg-gray-50/50 hover:bg-white focus:bg-white transition-all text-gray-800 placeholder-gray-400"
                   />
                   {searchQuery && (
                      <button
                         onClick={() => setSearchQuery('')}
                         className="absolute inset-y-0 left-0 pl-3.5 flex items-center text-gray-400 hover:text-red-500 transition-colors"
                         title="مسح البحث"
                      >
                         <X size={16} />
                      </button>
                   )}
                </div>
             </div>

             
               <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4">
                   <SearchableSelect
                      label={'\u0642\u0627\u0626\u0645\u0629 \u0627\u0644\u0645\u0646\u0627\u0637\u0642'}
                      value={filterRegion}
                      onChange={val => { setFilterRegion(val); setFilterChurch(''); }}
                      options={uniqueRegions}
                      placeholder={'\u0643\u0644 \u0627\u0644\u0645\u0646\u0627\u0637\u0642'}
                   />
                   <SearchableSelect
                      label={'\u0642\u0627\u0626\u0645\u0629 \u0627\u0644\u0643\u0646\u0627\u0626\u0633'}
                      value={filterChurch}
                      onChange={val => setFilterChurch(val)}
                      options={uniqueChurches}
                      placeholder={'\u0643\u0644 \u0627\u0644\u0643\u0646\u0627\u0626\u0633'}
                   />
                   <SearchableSelect
                      label={'\u0642\u0627\u0626\u0645\u0629 \u0627\u0644\u062e\u062f\u0627\u0645'}
                      value={filterServant}
                      onChange={val => setFilterServant(val)}
                      options={uniqueServants}
                      placeholder={'\u0643\u0644 \u0627\u0644\u062e\u062f\u0627\u0645'}
                   />
                   <SearchableSelect
                      label={'\u0642\u0627\u0626\u0645\u0629 \u0623\u0646\u0648\u0627\u0639 \u0627\u0644\u0645\u0634\u0627\u0631\u064a\u0639'}
                      value={filterProject}
                      onChange={val => setFilterProject(val)}
                      options={uniqueProjects}
                      placeholder={'\u0643\u0644 \u0627\u0644\u0645\u0634\u0627\u0631\u064a\u0639'}
                   />
                   <SearchableSelect
                      label={'\u0642\u0627\u0626\u0645\u0629 \u0627\u0644\u062d\u0627\u0644\u0627\u062a'}
                      value={filterCase}
                      onChange={val => setFilterCase(val)}
                      options={uniqueCases}
                      placeholder={'\u0643\u0644 \u0627\u0644\u062d\u0627\u0644\u0627\u062a'}
                   />
                </div>
             </div>
             
             <h3 className="text-lg font-bold text-gray-800 mb-4">تفاصيل الحالات</h3>
            <div className="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
               {(visit.churches||[]).length === 0 ? <div className="p-8 text-center text-gray-500">لا توجد تفاصيل.</div> : null}
               {(() => {
                  if (filteredChurches.length === 0 && (filterStatus !== 'all' || filterRegion || filterChurch || filterServant || filterProject || filterCase || searchQuery)) {
                      return (
                          <div className="p-8 text-center bg-white rounded-xl">
                             <Search size={32} className="mx-auto text-gray-200 mb-2" />
                             <p className="text-gray-500 font-medium">لا توجد نتائج مطابقة للبحث</p>
                          </div>
                      );
                  }
                  
                  const groupedByRegion = filteredChurches.reduce((acc, ch) => {
                    const r = ch.regionName || 'منطقة غير محددة';
                    if(!acc[r]) acc[r] = [];
                    acc[r].push(ch);
                    return acc;
                }, {});
                
                return Object.entries(groupedByRegion).map(([regionName, churchesInRegion]) => {
                    const regionStats = churchesInRegion.reduce((acc, ch) => {
                        const s = getChurchStats(ch);
                        acc.totalChurches += 1;
                        acc.totalGroups += s.totalGroups;
                        acc.totalCases += s.totalCases;
                        acc.totalValue += s.totalValue;
                        acc.totalInst += s.totalInst;
                        return acc;
                    }, {totalChurches: 0, totalGroups: 0, totalCases: 0, totalValue: 0, totalInst: 0});
                    
                    return (
                        <div key={regionName} className="bg-white border-b-4 border-gray-200 last:border-0">
                            <div className="p-4 sm:p-5 border-b border-gray-200 bg-[#002f6c]/10 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 cursor-pointer hover:bg-[#002f6c]/20 transition-colors" onClick={() => toggleRegion(regionName)}>
                                <div className="flex-1 flex flex-wrap items-center gap-2 text-sm sm:text-base font-bold text-[#002f6c]">
                                    <span className="text-lg">🏛️ {regionName}</span>
                                    <div className="mr-auto flex flex-wrap gap-2 items-center">
                                       <span className="bg-white text-[#002f6c] border border-[#002f6c]/30 px-3 py-1 rounded-full text-xs font-bold shadow-sm whitespace-nowrap">
                                          ⛪ <span className="font-sans">{formatNumber(regionStats.totalChurches)}</span> كنائس
                                       </span>
                                       <span className="bg-white text-blue-600 border border-blue-200 px-3 py-1 rounded-full text-xs font-bold shadow-sm whitespace-nowrap">
                                          👥 <span className="font-sans">{formatNumber(regionStats.totalGroups)}</span> مجموعات
                                       </span>
                                       <span className="bg-white text-[#d4af37] border border-[#d4af37]/30 px-3 py-1 rounded-full text-xs font-bold shadow-sm whitespace-nowrap">
                                          📊 <span className="font-sans">{formatNumber(regionStats.totalCases)}</span> مشاريع
                                       </span>
                                       <span className="bg-white text-green-700 border border-green-200 px-3 py-1 rounded-full text-xs font-bold shadow-sm whitespace-nowrap">
                                          💰 <span className="font-sans">{formatNumber(regionStats.totalValue)}</span> ج.م
                                       </span>
                                    </div>
                                </div>
                                <div className="text-gray-500">
                                   {(expandedRegions[regionName] !== undefined ? expandedRegions[regionName] : Boolean(searchQuery)) ? <ChevronUp size={24} /> : <ChevronDown size={24} />}
                                </div>
                            </div>
                            
                            {(expandedRegions[regionName] !== undefined ? expandedRegions[regionName] : Boolean(searchQuery)) && (
                                <div className="bg-gray-50/50">
                                    {churchesInRegion.map(ch => (
                                        <div key={ch.id} className="border-b border-gray-200 last:border-0">
                                           <div className="bg-gray-50 px-4 py-3 border-b border-gray-200 cursor-pointer hover:bg-gray-100 transition-colors" onClick={() => toggleChurch(ch.id)}>
                                              <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
                                                 <div className="flex items-center gap-2">
                                                    <div className="text-gray-500">
                                                       {(expandedChurches[ch.id] !== undefined ? expandedChurches[ch.id] : Boolean(searchQuery)) ? <ChevronUp size={20} /> : <ChevronDown size={20} />}
                                                    </div>
                                                    <h4 className="font-bold text-[#002f6c]">{ch.churchName} <span className="text-sm font-normal text-gray-500">({ch.regionName} - {ch.villageName})</span></h4>
                                                     {!isReadOnly && (
                                                       <div className="flex items-center gap-1 mr-2" onClick={e => e.stopPropagation()}>
                                                         <button
                                                           type="button"
                                                           onClick={(e) => handleEditChurch(ch, e)}
                                                           className="p-1 text-blue-600 hover:bg-blue-100 rounded-md transition-colors"
                                                           title={'\u062a\u0639\u062f\u064a\u0644 \u0627\u0633\u0645 \u0627\u0644\u0643\u0646\u064a\u0633\u0629 \u0648\u0627\u0644\u0628\u064a\u0627\u0646\u0627\u062a'}
                                                         >
                                                           <Edit2 size={15} />
                                                         </button>
                                                         <button
                                                           type="button"
                                                           onClick={(e) => handleDeleteChurch(ch.id, ch.churchName, e)}
                                                           className="p-1 text-red-500 hover:bg-red-100 rounded-md transition-colors"
                                                           title={'\u062d\u063f\u0641 \u0627\u0644\u0643\u0646\u064a\u0633\u0629 \u0628\u0627\u0644\u0643\u0627\u0645\u0644'}
                                                         >
                                                           <Trash2 size={15} />
                                                         </button>
                                                       </div>
                                                     )}
                                                 </div>
                                                 {(() => {
                              const stats = getChurchStats(ch);
                              return (
                                <div className="flex flex-wrap gap-2 items-center">
                                   <span className="bg-white text-blue-600 border border-blue-200 px-2 py-0.5 rounded-full text-xs font-bold shadow-sm whitespace-nowrap">
                                      👥 <span className="font-sans">{formatNumber(stats.totalGroups)}</span> مجموعة
                                   </span>
                                   <span className="bg-white text-[#d4af37] border border-[#d4af37]/30 px-2 py-0.5 rounded-full text-xs font-bold shadow-sm whitespace-nowrap">
                                      📊 <span className="font-sans">{formatNumber(stats.totalCases)}</span> مشاريع
                                   </span>
                                   <span className="bg-white text-green-700 border border-green-200 px-2 py-0.5 rounded-full text-xs font-bold shadow-sm whitespace-nowrap">
                                      💰 <span className="font-sans">{formatNumber(stats.totalValue)}</span> ج.م
                                   </span>
                                   <span className="bg-white text-[#8a7222] border border-[#f0e0a8] px-2 py-0.5 rounded-full text-xs font-bold shadow-sm whitespace-nowrap hidden sm:inline-block">
                                      💸 <span className="font-sans">{formatNumber(stats.totalInst)}</span> ج.م
                                   </span>
                                </div>
                              );
                            })()}
                         </div>
                      </div>
                      {(expandedChurches[ch.id] !== undefined ? expandedChurches[ch.id] : Boolean(searchQuery)) && (
                        <div>
                                            {/* Desktop Table View */}
                      <div className="hidden md:block p-0 overflow-x-auto">
                         <table className="w-full text-sm text-right">
                            <thead className="bg-[#002f6c] text-white text-xs uppercase">
                               <tr>
                                  <th className="px-3 py-2.5 text-center w-12">#</th>
                                  <th className="px-3 py-2.5 min-w-[120px]">الخدام</th>
                                  <th className="px-3 py-2.5 min-w-[130px]">اسم الحالة</th>
                                  <th className="px-3 py-2.5 text-center min-w-[110px]">حالة المشروع</th>
                                  <th className="px-3 py-2.5 min-w-[110px]">نوع المشروع</th>
                                  <th className="px-3 py-2.5 text-center min-w-[100px]">القيمة (ج.م)</th>
                                  <th className="px-3 py-2.5 text-center min-w-[100px]">القسط (ج.م)</th>
                                  <th className="px-3 py-2.5 min-w-[130px]">ملاحظات</th>
                                  <th className="px-3 py-2.5 text-center w-24">إجراءات</th>
                               </tr>
                            </thead>
                            <tbody className="divide-y divide-gray-200 bg-white">
                               {(ch.servantsGroups||[]).map(sg => (
                                  (sg.cases||[]).map(c => {
                                     const isExec = c.status === 'executed';
                                     const hasValDiff = isExec && c.executedProjectValue && c.executedProjectValue !== c.projectValue;
                                     const hasInstDiff = isExec && c.executedInstallmentAmount && c.executedInstallmentAmount !== c.installmentAmount;
                                     const hasTypeDiff = isExec && c.executedProjectType && c.executedProjectType !== c.projectType;

                                     return (
                                     <tr key={c.id} className="hover:bg-blue-50/50 transition-colors">
                                        <td className="px-3 py-3 text-center font-sans text-gray-500 font-bold">{formatNumber(serialMap[c.id])}</td>
                                        <td className="px-3 py-3 text-gray-600 truncate max-w-[120px]" title={sg.servantsNames}>{sg.servantsNames || '-'}</td>
                                        <td className="px-3 py-3 font-medium text-gray-900">
                                          <div>{c.name}</div>
                                          {isExec && c.executionDate && (
                                            <div className="text-[10px] text-emerald-700 font-sans mt-0.5">منفذ في: {c.executionDate}</div>
                                          )}
                                        </td>
                                        <td className="px-3 py-3 text-center">
                                          <StatusBadge status={c.status || 'initial'} onClick={!isReadOnly ? () => setExecutingCaseInfo({ caseObj: c, churchId: ch.id, groupId: sg.id, churchName: ch.churchName }) : null} />
                                        </td>
                                        <td className="px-3 py-3 text-gray-600">
                                          {hasTypeDiff ? (
                                            <div>
                                              <span className="font-bold text-emerald-800">{c.executedProjectType}</span>
                                              <span className="block text-[11px] text-gray-400 line-through">{c.projectType}</span>
                                            </div>
                                          ) : (
                                            c.executedProjectType || c.projectType
                                          )}
                                        </td>
                                        <td className="px-3 py-3 text-center font-sans">
                                          {hasValDiff ? (
                                            <div>
                                              <span className="font-bold text-emerald-700">{formatNumber(c.executedProjectValue)}</span>
                                              <span className="block text-[11px] text-gray-400 line-through">{formatNumber(c.projectValue)}</span>
                                            </div>
                                          ) : (

                                                 <Trash2 size={14} />

                        {(ch.servantsGroups||[]).map(sg => (

                                <div className="flex flex-wrap items-center gap-2 text-xs">

                                  </span>

                                    <span className="text-[10px] text-emerald-700 font-sans bg-emerald-50 px-2 py-0.5 rounded-md border border-emerald-100">

                                  <div>
                                    <div className="text-[10px] text-gray-500">القيمة المنفذة</div>
                                    <div className="font-bold font-sans text-emerald-700 mt-0.5">
                                      {formatNumber(c.executedProjectValue || c.projectValue)} ج.م
                                    </div>
                                  </div>
                                  <div>
                                    <div className="text-[10px] text-gray-500">القسط الشهري</div>
                                    <div className="font-bold font-sans text-amber-800 mt-0.5">

                                                                 {!isReadOnly && (
                                   <div className="flex items-center gap-2 pt-1">
                                     <button
                                       type="button"
                                       onClick={() => setExecutingCaseInfo({ caseObj: c, churchId: ch.id, groupId: sg.id, churchName: ch.churchName })}
                                       className={`flex-1 py-2 px-3 rounded-xl text-xs font-bold transition-all shadow-sm flex items-center justify-center gap-1.5 ${
                                         isExec 
                                           ? 'bg-emerald-600 hover:bg-emerald-700 text-white' 
                                           : 'bg-gradient-to-r from-[#002f6c] to-[#001f4c] text-white hover:opacity-95'
                                       }`}
                                     >
                                       <Zap size={14} />
                                       <span>{isExec ? '\u062a\u0639\u062f\u064a\u0644 \u0628\u064a\u0627\u0646\u0627\u062a \u0627\u0644\u062a\u0646\u0641\u064a\u0630' : '\u062a\u0633\u062c\u064a\u0644 \u062a\u0646\u0641\u064a\u0630 \u0627\u0644\u0645\u0634\u0631\u0648\u0639'}</span>
                                     </button>
                                     <button
                                       type="button"
                                       onClick={() => handleEditCase(c, ch.id, sg.id)}
                                       className="p-2 rounded-xl bg-blue-50 text-blue-700 hover:bg-blue-100 border border-blue-200 transition-colors"
                                       title={'\u062a\u0639\u062f\u064a\u0644 \u0627\u0644\u062d\u0627\u0644\u0629'}
                                     >
                                       <Edit2 size={16} />
                                     </button>
                                     <button
                                       type="button"
                                       onClick={() => handleDeleteCase(c.id, c.name, ch.id, sg.id)}
                                       className="p-2 rounded-xl bg-red-50 text-red-600 hover:bg-red-100 border border-red-200 transition-colors"
                                       title={'\u062d\u063f\u0641 \u0627\u0644\u062d\u0627\u0644\u0629'}
                                     >
                                       <Trash2 size={16} />
                                     </button>
                                   </div>
                                 )}
                              </div>
                            );
                          })
                        ))}
                      </div>
                      </div>

                      )}
                   </div>
                ))}
                                </div>
                            )}
                        </div>
                    );
                });
            })()}
            </div>

            {executingCaseInfo && (
              <ExecutionModal 
                caseData={executingCaseInfo.caseObj} 
                churchName={executingCaseInfo.churchName} 
                onSave={handleSaveExecutionCase} 
                onClose={() => setExecutingCaseInfo(null)} 
              />
            )}
            {editingCaseInfo && (
              <CaseModal 
                caseData={editingCaseInfo.caseObj} 
                onSave={handleSaveEditCase} 
                onClose={() => setEditingCaseInfo(null)} 
              />
            )}
            {editingChurchInfo && (
              <EditChurchModal 
                churchInfo={editingChurchInfo} 
                onSave={handleSaveEditChurch} 
                onClose={() => setEditingChurchInfo(null)} 
              />
            )}
            {showImportModal && (
              <ExcelImportModal 
                visitData={visit} 
                onApplyUpdates={handleApplyExcelUpdates} 
                onClose={() => setShowImportModal(false)} 
              />
            )}
         </div>
      );
    }

    // --- MAIN APP COMPONENT ---
    
        // --- BULK EXECUTION MODAL ---

      const [execNotes, setExecNotes] = useState('');

      return (
        <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm animate-fade-in" onClick={onClose}>
          <div className="bg-white rounded-2xl shadow-2xl w-full max-w-lg overflow-hidden border border-gray-100" onClick={e => e.stopPropagation()}>
            <div className="bg-[#002f6c] p-4 sm:p-5 text-white flex justify-between items-center">
              <div className="flex items-center gap-2">
                <span className="text-2xl">⚡</span>
                <div>
                  <h3 className="font-bold text-base sm:text-lg">تأكيد الاعتماد للتنفيذ</h3>

              <button onClick={onClose} className="text-white/80 hover:text-white p-1 rounded-lg transition-colors"><X size={20} /></button>

              <div className="bg-emerald-50 border border-emerald-200 rounded-xl p-4 flex items-center gap-3">
                <div className="w-10 h-10 rounded-full bg-emerald-100 text-emerald-700 flex items-center justify-center font-bold text-lg shrink-0">
                  {formatNumber(pendingCases.length)}
                </div>
                <div>
                  <div className="font-bold text-emerald-900 text-sm">سيتم اعتماد {formatNumber(pendingCases.length)} حالة كمشاريع منفذة فعلياً</div>
                  <div className="text-xs text-emerald-700 mt-0.5">الحالات التي تم تعديل قيمتها ستحتفظ بتعديلاتها، وباقي الحالات ستعتمد بقيمتها المعتمدة.</div>
                </div>

              <div>
                <label className="block text-xs font-semibold text-gray-700 mb-1">تاريخ التنفيذ الفعلي</label>
                <input 
                  type="date" 
                  value={execDate} 
                  onChange={e => setExecDate(e.target.value)} 
                  className="w-full rounded-lg border border-gray-300 p-2.5 text-sm focus:border-[#002f6c] focus:ring-1 focus:ring-[#002f6c] outline-none font-sans"

              <div>
                <label className="block text-xs font-semibold text-gray-700 mb-1">ملاحظات الاعتماد (اختياري)</label>
                <MicInput 
                  value={execNotes} 
                  onValueChange={setExecNotes} 
                  placeholder="ملاحظات تنطبق على الحالات المعتمدة..." 
                />

            <div className="p-4 border-t border-gray-100 bg-gray-50 flex justify-end gap-2">
              <button onClick={onClose} className="px-4 py-2 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-200 transition-colors">
                إلغاء
              </button>
              <button 
                onClick={() => onConfirm(pendingCases, execDate, execNotes)} 
                className="px-6 py-2 rounded-lg text-sm font-bold text-white bg-emerald-600 hover:bg-emerald-700 shadow-md transition-colors flex items-center gap-1.5"
              >
                <CheckCircle size={16} />
                <span>تأكيد اعتماد {formatNumber(pendingCases.length)} حالة</span>
              </button>
