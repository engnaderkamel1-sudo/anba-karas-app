              <span>⏳ بانتظار الاعتماد (موافقة مبدئية)</span>
              <span className={`px-2 py-0.5 rounded-full text-xs font-sans ${filterStatus === 'initial' ? 'bg-white/20 text-white' : 'bg-amber-100 text-amber-900'}`}>
                {formatNumber(statusCounts.initial)}
              </span>
            </button>

            <button
              onClick={() => setFilterStatus('executed')}
              className={`flex items-center gap-2 px-4 py-2.5 rounded-xl text-sm font-bold transition-all ${
                filterStatus === 'executed'
                  ? 'bg-emerald-600 text-white shadow-md'
                  : 'text-emerald-800 hover:bg-emerald-50'
              }`}
            >
              <span>✅ منفذة ومعتمدة فعلياً</span>
              <span className={`px-2 py-0.5 rounded-full text-xs font-sans ${filterStatus === 'executed' ? 'bg-white/20 text-white' : 'bg-emerald-100 text-emerald-900'}`}>
                {formatNumber(statusCounts.executed)}
              </span>
            </button>

            <button
              onClick={() => setFilterStatus('cancelled')}
              className={`flex items-center gap-2 px-4 py-2.5 rounded-lg text-sm font-bold transition-all ${
                filterStatus === 'cancelled'
                  ? 'bg-rose-600 text-white shadow-md'
                  : 'text-rose-700 hover:bg-rose-50'
              }`}
            >
              <span>❌ لم تُنفّذ / ملغاة</span>
              <span className={`px-2 py-0.5 rounded-full text-xs font-sans ${filterStatus === 'cancelled' ? 'bg-white/20 text-white' : 'bg-rose-100 text-rose-800'}`}>
                {formatNumber(statusCounts.cancelled)}
              </span>
            </button>
          </div>

          {/* SEARCH & FILTERS BAR */}
          <div className="bg-white rounded-2xl shadow-sm border border-gray-200 p-4 sm:p-5">
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
              <div>
                <label className="block text-xs font-bold text-gray-500 mb-1">بحث بالاسم أو نوع المشروع</label>
                <div className="relative">
                  <input 
                    type="text" 
                    value={filterSearch} 
                    onChange={e => setFilterSearch(e.target.value)} 
                    placeholder="ابحث عن اسم الحالة..." 
                    className="w-full text-sm border border-gray-200 rounded-xl py-2 pr-9 pl-3 outline-none focus:border-[#002f6c] focus:ring-1 focus:ring-[#002f6c]"
                  />
                  <Search size={16} className="absolute right-3 top-2.5 text-gray-400" />
                </div>
              </div>

              <div>
                <label className="block text-xs font-bold text-gray-500 mb-1">تصفية حسب المنطقة</label>
                <select 
                  value={filterRegion} 
                  onChange={e => { setFilterRegion(e.target.value); setFilterChurch(''); }} 
                  className="w-full text-sm border border-gray-200 rounded-xl py-2 px-3 outline-none focus:border-[#002f6c] bg-gray-50"
                >
                  <option value="">كل المناطق ({formatNumber(uniqueRegions.length)})</option>
                  {uniqueRegions.map(r => <option key={r} value={r}>{r}</option>)}
                </select>
              </div>

              <div>
                <label className="block text-xs font-bold text-gray-500 mb-1">تصفية حسب الكنيسة</label>
                <select 
                  value={filterChurch} 
                  onChange={e => setFilterChurch(e.target.value)} 
                  className="w-full text-sm border border-gray-200 rounded-xl py-2 px-3 outline-none focus:border-[#002f6c] bg-gray-50"
                >
                  <option value="">كل الكنائس ({formatNumber(uniqueChurches.length)})</option>
                  {uniqueChurches.map(c => <option key={c} value={c}>{c}</option>)}
                </select>
              </div>

              <div className="flex items-end gap-2">
                {(filterSearch || filterRegion || filterChurch || filterStatus !== 'all') && (
                  <button 
                    onClick={() => { setFilterSearch(''); setFilterRegion(''); setFilterChurch(''); setFilterStatus('all'); }} 
                    className="w-full flex items-center justify-center gap-1.5 text-xs font-bold text-rose-600 bg-rose-50 hover:bg-rose-100 py-2.5 px-3 rounded-xl transition-colors border border-rose-200"
                  >
                    <RotateCcw size={14} />
                    <span>إعادة ضبط الفلاتر</span>
                  </button>
                )}
              </div>
            </div>
          </div>

          {/* FLOATING / FIXED MULTI-SELECT ACTION BAR */}
          {selectedCount > 0 && (
            <div className="sticky top-20 z-20 bg-[#002f6c] text-white p-3.5 rounded-2xl shadow-xl border border-blue-400/30 flex flex-wrap items-center justify-between gap-3 animate-fade-in">
              <div className="flex items-center gap-2">
                <span className="w-7 h-7 rounded-full bg-amber-400 text-[#002f6c] flex items-center justify-center font-black text-sm">
                  {formatNumber(selectedCount)}
                </span>
                <span className="text-sm font-bold">تم تحديد {formatNumber(selectedCount)} حالة</span>
              </div>

              <div className="flex items-center gap-2">
                {!isReadOnly && (
                  <button 
                    onClick={triggerApproveSelected} 
                    className="bg-emerald-500 hover:bg-emerald-600 text-white text-xs sm:text-sm font-black px-4 py-2 rounded-xl shadow transition-all flex items-center gap-1.5"
                  >
                    <CheckCircle size={16} />
                    <span>اعتماد الحالات المحددة للتنفيذ ({formatNumber(selectedCount)})</span>
                  </button>
                )}
                <button 
                  onClick={() => setSelectedCaseIds({})} 
                  className="bg-white/10 hover:bg-white/20 text-white text-xs font-bold px-3 py-2 rounded-xl transition-colors"
                >
                  إلغاء التحديد
                </button>
              </div>
            </div>
          )}

          {/* HIERARCHICAL ACCORDIONS: REGIONS -> CHURCHES -> CASES */}
          {filteredChurches.length === 0 ? (
            <div className="bg-white rounded-2xl border border-dashed border-gray-300 p-12 text-center text-gray-500">
              <Search size={40} className="mx-auto text-gray-300 mb-2" />
              <p className="font-bold text-base">لا توجد حالات مطابقة للبحث أو الفلتر المختار</p>
            </div>
          ) : (
            <div className="space-y-6">
              {(() => {
                const groupedByRegion = filteredChurches.reduce((acc, ch) => {
                  const r = ch.regionName || 'منطقة غير محددة';
                  if (!acc[r]) acc[r] = [];
                  acc[r].push(ch);
                  return acc;
                }, {});

                return Object.entries(groupedByRegion).map(([regionName, churchesInReg]) => {
                  // Region cases
                  const regMetas = allCasesMeta.filter(m => m.regionName === regionName);
                  const regPending = regMetas.filter(m => (m.caseObj.status || 'initial') !== 'executed');
                  const regExecuted = regMetas.filter(m => m.caseObj.status === 'executed');

                  const regStats = churchesInReg.reduce((acc, ch) => {
                    const s = getChurchStats(ch);
                    acc.totalChurches += 1;
                    acc.totalCases += s.totalCases;
                    acc.totalValue += s.totalValue;
                    return acc;
                  }, { totalChurches: 0, totalCases: 0, totalValue: 0 });

                  return (
                    <div key={regionName} className="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
                      {/* Region Header */}
                      <div 
                        onClick={() => toggleRegion(regionName)} 
                        className="p-4 sm:p-5 bg-gradient-to-r from-blue-50/90 to-indigo-50/50 border-b border-gray-200 flex flex-col md:flex-row justify-between items-start md:items-center gap-3 cursor-pointer hover:bg-blue-100/50 transition-colors"
                      >
                        <div className="flex flex-wrap items-center gap-3">
                          <span className="text-xl">🏛️</span>
                          <span className="font-black text-lg text-[#002f6c]">{regionName}</span>
                          <span className="bg-white text-[#002f6c] border border-blue-200 px-3 py-1 rounded-full text-xs font-bold shadow-sm font-sans">
                            {formatNumber(regStats.totalChurches)} كنائس
                          </span>
                          <span className="bg-white text-emerald-700 border border-emerald-200 px-3 py-1 rounded-full text-xs font-bold shadow-sm font-sans">
                            {formatNumber(regExecuted.length)} منفذ / {formatNumber(regMetas.length)} إجمالي
                          </span>
                        </div>

                        <div className="flex items-center gap-3 w-full md:w-auto justify-between md:justify-end">
                          {!isReadOnly && regPending.length > 0 && (
                            <button 
                              onClick={(e) => { e.stopPropagation(); triggerApproveRegion(regionName); }} 
                              className="bg-amber-600 hover:bg-amber-700 text-white text-xs font-bold px-3.5 py-1.5 rounded-lg shadow-sm flex items-center gap-1.5 transition-colors"
                              title="اعتماد كافة الحالات المتبقية في هذه المنطقة للتنفيذ"
                            >
                              <span>⚡</span>
                              <span>اعتماد منطقة {regionName} ({formatNumber(regPending.length)})</span>
                            </button>
                          )}
                          <div className="text-gray-400">
                            {expandedRegions[regionName] ? <ChevronUp size={22} /> : <ChevronDown size={22} />}
                          </div>
                        </div>
                      </div>

                      {/* Region Body: Churches */}
                      {expandedRegions[regionName] && (
                        <div className="p-4 sm:p-5 space-y-5 bg-gray-50/40">
                          {churchesInReg.map(ch => {
                            const chMetas = allCasesMeta.filter(m => m.churchId === ch.id);
                            const chPending = chMetas.filter(m => (m.caseObj.status || 'initial') !== 'executed');
                            const chExecuted = chMetas.filter(m => m.caseObj.status === 'executed');

                            return (
                              <div key={ch.id} className="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                                {/* Church Header */}
                                <div 
                                  onClick={() => toggleChurch(ch.id)} 
                                  className="p-3.5 sm:p-4 bg-gray-50 border-b border-gray-200 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 cursor-pointer hover:bg-gray-100 transition-colors"
                                >
                                  <div className="flex flex-wrap items-center gap-2">
                                    <span className="text-lg">⛪</span>
                                    <h4 className="font-bold text-[#002f6c] text-base">{ch.churchName}</h4>
                                    {ch.villageName && <span className="text-xs text-gray-500 font-medium">({ch.villageName})</span>}
                                    <span className="bg-white text-emerald-700 border border-emerald-200 px-2.5 py-0.5 rounded-full text-xs font-bold font-sans">
                                      {formatNumber(chExecuted.length)} منفذ من {formatNumber(chMetas.length)}
                                    </span>
                                  </div>

                                  <div className="flex items-center gap-2 w-full sm:w-auto justify-between sm:justify-end">
                                    {!isReadOnly && chPending.length > 0 && (
                                      <button 
                                        onClick={(e) => { e.stopPropagation(); triggerApproveChurch(ch.id, ch.churchName); }} 
                                        className="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-3 py-1.5 rounded-lg shadow-sm flex items-center gap-1 transition-colors"
                                        title="اعتماد كافة الحالات المتبقية في هذه الكنيسة للتنفيذ"
                                      >
                                        <span>⚡</span>
                                        <span>اعتماد كنيسة {ch.churchName} ({formatNumber(chPending.length)})</span>
                                      </button>
                                    )}
                                    <div className="text-gray-400">
                                      {expandedChurches[ch.id] ? <ChevronUp size={20} /> : <ChevronDown size={20} />}
                                    </div>
                                  </div>
                                </div>

                                {/* Church Body: Cases Table */}
                                {expandedChurches[ch.id] && (
                                  <div className="p-0 overflow-x-auto">
                                    <table className="w-full text-sm text-right">
                                      <thead className="bg-[#002f6c] text-white text-xs">
                                        <tr>
                                          <th className="px-3 py-3 text-center w-10">
                                            <input 
                                              type="checkbox" 
                                              onChange={handleSelectAllFiltered}
                                              className="w-4 h-4 rounded text-[#002f6c] cursor-pointer"
                                              title="تحديد الكل"
                                            />
                                          </th>
                                          <th className="px-2 py-3 text-center w-12 font-bold"># كنيسة</th>
                                          <th className="px-3 py-3 min-w-[120px] font-bold">الخدام</th>
                                          <th className="px-3 py-3 min-w-[140px] font-bold">اسم الحالة</th>
                                          <th className="px-3 py-3 text-center min-w-[120px] font-bold">حالة المشروع</th>
                                          <th className="px-3 py-3 min-w-[120px] font-bold">نوع المشروع</th>
                                          <th className="px-3 py-3 text-center min-w-[110px] font-bold">القيمة المعتمدة</th>
                                          <th className="px-3 py-3 text-center min-w-[110px] font-bold">القيمة المنفذة</th>

                                            const isCancelled = c.status === 'cancelled';

                                            const hasInstDiff = isExec && c.executedInstallmentAmount && c.executedInstallmentAmount !== c.installmentAmount;

                                              <tr key={c.id} className={`hover:bg-blue-50/50 transition-colors ${selectedCaseIds[c.id] ? 'bg-blue-50/80' : ''}`}>

                                                    className="w-4 h-4 rounded text-[#002f6c] cursor-pointer"
                                                  />
                                                </td>
                                                <td className="px-2 py-3 text-center font-bold text-gray-500 font-sans">
                                                  {formatNumber(serialMap[c.id])}
                                                </td>
                                                <td className="px-3 py-3 text-gray-600 truncate max-w-[120px]" title={sg.servantsNames}>
                                                  {sg.servantsNames || '-'}
                                                </td>
                                                <td className="px-3 py-3 font-bold text-gray-900">
                                                  <div>{c.name}</div>
                                                  {isExec && c.executionDate && (
                                                    <div className="text-[10px] text-emerald-700 font-sans mt-0.5">منفذ في: {c.executionDate}</div>

                                                </td>
                                                <td className="px-3 py-3 text-center">

                                                <td className="px-3 py-3 text-gray-700">

                                                      <span className="block text-[11px] text-gray-400 line-through">{c.projectType}</span>

                                                    c.executedProjectType || c.projectType

                                                </td>
                                                <td className="px-3 py-3 text-center font-sans text-amber-800 font-bold">

                                                <td className="px-3 py-3 text-center font-sans">
                                                  {hasValDiff ? (
                                                    <div>
                                                      <span className="font-bold text-emerald-700">{formatNumber(c.executedProjectValue)} ج.م</span>
                                                      <span className="block text-[11px] text-gray-400 line-through">{formatNumber(c.projectValue)}</span>
                                                    </div>
                                                  ) : (
                                                    <span className="font-bold text-emerald-700">{formatNumber(c.executedProjectValue || c.projectValue)} ج.م</span>
                                                  )}
                                                </td>
                                                <td className="px-3 py-3 text-center font-sans">
                                                  {hasInstDiff ? (
                                                    <div>
                                                      <span className="font-bold text-emerald-700">{formatNumber(c.executedInstallmentAmount)} ج.م</span>
                                                      <span className="block text-[11px] text-gray-400 line-through">{formatNumber(c.installmentAmount)}</span>
                                                    </div>
                                                  ) : (
                                                    <span className="font-semibold text-gray-700">{formatNumber(c.executedInstallmentAmount || c.installmentAmount)} ج.م</span>
                                                  )}
                                                </td>
                                                <td className="px-3 py-3 text-xs text-gray-500">
                                                  {c.executionNotes ? (
                                                    <div className="bg-emerald-50 text-emerald-900 p-1.5 rounded-lg border border-emerald-100">
                                                      {c.executionNotes}
                                                    </div>
                                                  ) : (
                                                    c.notes || '-'
                                                  )}
                                                </td>
                                                <td className="px-3 py-3 text-center">
                                                  <div className="flex items-center justify-center gap-1.5">
                                                    {!isReadOnly && !isExec && (
                                                      <button 
                                                        onClick={() => handleSingleQuickExecute(c, ch.id, sg.id)} 
                                                        className="bg-emerald-50 text-emerald-700 hover:bg-emerald-600 hover:text-white border border-emerald-300 p-1.5 rounded-lg text-xs font-bold transition-all flex items-center gap-1 shadow-sm"
                                                        title="اعتماد فوري للتنفيذ بنفس القيمة المعتمدة"
                                                      >
                                                        <span>⚡</span>
                                                        <span>اعتماد</span>
                                                      </button>
                                                    )}

                                                    {!isReadOnly && (
                                                      <button 
                                                        onClick={() => setExecutingCaseInfo({ caseObj: c, churchId: ch.id, groupId: sg.id, churchName: ch.churchName })} 
                                                        className="bg-blue-50 text-[#002f6c] hover:bg-blue-600 hover:text-white border border-blue-200 p-1.5 rounded-lg text-xs font-bold transition-all flex items-center gap-1"
                                                        title="تعديل القيمة المنفذة أو القسط الفعلي"
                                                      >
                                                        <Edit2 size={13} />
                                                        <span>تعديل</span>
                                                      </button>
                                                    )}

                                                    {!isReadOnly && isExec && (
                                                      <button 
                                                        onClick={() => handleRevertToInitial(c.id, ch.id, sg.id)} 
                                                        className="text-gray-400 hover:text-rose-600 p-1.5 rounded-lg hover:bg-rose-50 transition-colors"
                                                        title="إلغاء الاعتماد والعودة للموافقة المبدئية"
                                                      >
                                                        <RotateCcw size={14} />
                                                      </button>
                                                    )}
                                                  </div>
                                                </td>
                                              </tr>
                                            );
                                          })
                                        ))}
                                      </tbody>
                                    </table>
                                  </div>
                                )}
                              </div>
                            );
                          })}
                        </div>
                      )}
                    </div>
                  );
                });
              })()}
            </div>
          )}

          {/* MODALS */}
          {executingCaseInfo && (
            <ExecutionModal 
              caseData={executingCaseInfo.caseObj} 
              churchName={executingCaseInfo.churchName} 
              onSave={handleSaveExecutionCase} 
              onClose={() => setExecutingCaseInfo(null)}

          {bulkConfirmInfo && (

    function ExportModal({ visit, onClose }) {
      const [scope, setScope] = useState('full');
      const [selectedRegion, setSelectedRegion] = useState('');
      const [selectedChurchId, setSelectedChurchId] = useState('');

      const uniqueRegions = [...new Set((visit?.churches || []).map(ch => ch.regionName).filter(Boolean))];
      // Store unique church objects to show name + region (and village if any)
      const churchOptions = (visit?.churches || []).filter(ch => ch.churchName).map(ch => ({
          id: ch.id,
          churchName: ch.churchName,
          regionName: ch.regionName,
          villageName: ch.villageName
      }));

      useEffect(() => {
         if (scope === 'region' && !selectedRegion && uniqueRegions.length > 0) setSelectedRegion(uniqueRegions[0]);
         if (scope === 'church' && !selectedChurchId && churchOptions.length > 0) setSelectedChurchId(churchOptions[0].id);
      }, [scope]);

      const handleExport = () => {
         const churchData = churchOptions.find(c => c.id === selectedChurchId);
         handleExportExcel(visit, { 
             scope, 
             targetRegion: scope === 'region' ? selectedRegion : '',
             targetChurchId: scope === 'church' ? selectedChurchId : '',
             targetChurchObj: churchData
         });
         onClose();
      };

      return (
        <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm animate-fade-in">
           <div className="bg-white rounded-xl shadow-2xl w-full max-w-md overflow-hidden" onClick={e => e.stopPropagation()}>
              <div className="bg-[#002f6c] p-4 text-white flex justify-between items-center">
                 <h3 className="font-bold text-lg flex items-center gap-2"><Download size={20} className="text-[#d4af37]" /> تصدير الإكسيل</h3>
                 <button onClick={onClose} className="text-white/80 hover:text-white transition-colors"><X size={24} /></button>
              </div>
              <div className="p-5">
                 <p className="text-gray-600 mb-4 text-sm">اختر نطاق البيانات الذي ترغب في تصديره لزيارة <strong className="text-[#002f6c]">{visit.location || 'بدون اسم'}</strong>:</p>
                 
                 <div className="space-y-3 mb-6">
                    <label className={`flex items-center gap-3 p-3 rounded-lg border cursor-pointer transition-colors ${scope === 'full' ? 'border-[#002f6c] bg-blue-50/50' : 'border-gray-200 hover:bg-gray-50'}`}>
                       <input type="radio" name="exportScope" value="full" checked={scope === 'full'} onChange={() => setScope('full')} className="w-4 h-4 text-[#002f6c]" />
                       <span className="font-medium text-gray-800">تصدير الزيارة بالكامل</span>
                    </label>

                    <label className={`flex flex-col gap-2 p-3 rounded-lg border cursor-pointer transition-colors ${scope === 'region' ? 'border-[#002f6c] bg-blue-50/50' : 'border-gray-200 hover:bg-gray-50'}`}>
                       <div className="flex items-center gap-3">
                          <input type="radio" name="exportScope" value="region" checked={scope === 'region'} onChange={() => setScope('region')} className="w-4 h-4 text-[#002f6c]" />
                          <span className="font-medium text-gray-800">تصدير حسب المنطقة</span>
                       </div>
                       {scope === 'region' && (
                          <div className="mr-7 mt-1">
                             <select value={selectedRegion} onChange={e => setSelectedRegion(e.target.value)} className="w-full border-gray-300 rounded-md shadow-sm focus:border-[#002f6c] focus:ring focus:ring-[#002f6c]/20 p-2 text-sm bg-white">
                                {uniqueRegions.map(r => <option key={r} value={r}>{r}</option>)}
                                {uniqueRegions.length === 0 && <option value="">لا توجد مناطق</option>}
                             </select>
                          </div>
                       )}
                    </label>

                    <label className={`flex flex-col gap-2 p-3 rounded-lg border cursor-pointer transition-colors ${scope === 'church' ? 'border-[#002f6c] bg-blue-50/50' : 'border-gray-200 hover:bg-gray-50'}`}>
                       <div className="flex items-center gap-3">
                          <input type="radio" name="exportScope" value="church" checked={scope === 'church'} onChange={() => setScope('church')} className="w-4 h-4 text-[#002f6c]" />
                          <span className="font-medium text-gray-800">تصدير حسب الكنيسة</span>
                       </div>
                       {scope === 'church' && (
                          <div className="mr-7 mt-1">
                             <select value={selectedChurchId} onChange={e => setSelectedChurchId(e.target.value)} className="w-full border-gray-300 rounded-md shadow-sm focus:border-[#002f6c] focus:ring focus:ring-[#002f6c]/20 p-2 text-sm bg-white">
                                {churchOptions.map(c => (
                                    <option key={c.id} value={c.id}>
                                        {c.churchName} - {c.regionName} {c.villageName ? `(${c.villageName})` : ''}
                                    </option>
                                ))}
                                {churchOptions.length === 0 && <option value="">لا توجد كنائس</option>}
                             </select>
                          </div>
                       )}
                    </label>
                 </div>

                 <div className="flex gap-3 justify-end pt-2 border-t border-gray-100">
                    <button onClick={onClose} className="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-md font-medium transition-colors">إلغاء</button>
                    <button onClick={handleExport} disabled={ (scope === 'region' && !selectedRegion) || (scope === 'church' && !selectedChurchId) } className="px-6 py-2 bg-[#d4af37] text-white hover:bg-[#c49b27] rounded-md font-medium shadow transition-colors disabled:opacity-50 flex items-center gap-2">
                       <Download size={18} /> بدء التصدير
                    </button>
                 </div>
              </div>
           </div>
        </div>
      );
    }

function App() {
      const [activeTab, setActiveTab] = useState('execution'); // 'execution' | 'archive' | 'entry' | 'archiveDetails'
      const [showExportModal, setShowExportModal] = useState(false);
      const [exportVisitData, setExportVisitData] = useState(null);
      
      const openExportModal = (visitData) => {
         setExportVisitData(visitData);
         setShowExportModal(true);
      };
      const [isSidebarOpen, setIsSidebarOpen] = useState(true);
      const [syncStatus, setSyncStatus] = useState('synced');
      
      const [allVisits, setAllVisits] = useState([]);
      const [currentVisitId, setCurrentVisitId] = useState(null);
      const [viewingArchive, setViewingArchive] = useState(null);

      const [data, setData] = useState({ visitId: uuidv4(), location: '', date: new Date().toISOString().split('T')[0], churches: [], createdAt: Date.now() });

      // Real-Time Firestore Synchronization
      useEffect(() => {
        if (!db) return;
        const unsubscribe = db.collection('visits').onSnapshot(snapshot => {
          const list = [];
          snapshot.forEach(doc => {
            list.push({ id: doc.id, ...doc.data() });
          });
          list.sort((a, b) => b.createdAt - a.createdAt);
          setAllVisits(list);

          // Update Active Entry if another device modifies it
          setCurrentVisitId(prevId => {
             if (prevId) {
                 const updated = list.find(v => v.id === prevId);
                 if (updated) {
                     setData(updated);
                 }
                 return prevId;
             }
             if (list.length > 0) {
                 setData(list[0]);
                 return list[0].id;
             }
             // If nothing exists, keep whatever data is initialized
             return prevId; 
          });

          // Update Archive Details if open and modified remotely
          setViewingArchive(prev => {
             if (prev) {
                 const updated = list.find(v => v.id === prev.id);
                 return updated || prev;
             }
             return prev;
          });

        }, (error) => {
          console.error("Realtime sync error:", error);
        });
        return () => unsubscribe();
      }, []);

      const updateData = (updater) => {
        setData(prev => {
          const next = typeof updater === 'function' ? updater(prev) : updater;
          
          // Safe cloud write ONLY triggered by explicit user actions
          if (db && currentVisitId && !isReadOnly) {
             setSyncStatus('syncing');
             const toSave = { ...next, visitId: currentVisitId };
             if (!toSave.createdAt) toSave.createdAt = Date.now();
             db.collection('visits').doc(currentVisitId).set(toSave)
               .then(() => setSyncStatus('synced'))
               .catch(() => setSyncStatus('error'));
          }
          return next;
        });
      };

      const handleEditVisit = (visit) => {
        setData(visit);
        setCurrentVisitId(visit.id);
        setActiveTab('entry');
      };

      const handleDeleteVisit = async (visitId) => {
        if (confirm('هل أنت متأكد من نقل هذه الزيارة إلى سلة المهملات؟')) {
            if(isReadOnly) { alert('عذراً، أنت في وضع المشاهدة فقط.'); return; }
            try {
                await db.collection('visits').doc(visitId).update({ isDeleted: true, deletedAt: Date.now() });
                alert('تم نقل الزيارة إلى سلة المهملات (يمكنك استعادتها خلال 30 يوماً)');
                if (currentVisitId === visitId) {
                     const newId = uuidv4();
                     setData({ visitId: newId, location: '', date: new Date().toISOString().split('T')[0], churches: [], createdAt: Date.now() });
                     setCurrentVisitId(newId);
                }
            } catch (e) {
                console.error(e);
                alert('حدث خطأ أثناء النقل لسلة المهملات.');
            }
        }
      };

      const handleRestoreVisit = async (visitId) => {
          if (isReadOnly) { alert('عذراً، أنت في وضع المشاهدة فقط.'); return; }
          try {
              await db.collection('visits').doc(visitId).update({ isDeleted: false, deletedAt: firebase.firestore.FieldValue.delete() });
          } catch (e) {
              console.error(e);
              alert('حدث خطأ أثناء الاستعادة.');
          }
      };

      const handlePermanentDelete = async (visitId) => {
          if (confirm('هل أنت متأكد من حذف هذه الزيارة نهائياً للأبد؟ لا يمكن التراجع عن هذا الإجراء.')) {
              if (isReadOnly) { alert('عذراً، أنت في وضع المشاهدة فقط.'); return; }
              try {
                  await db.collection('visits').doc(visitId).delete();
              } catch (e) {
                  console.error(e);
                  alert('حدث خطأ أثناء الحذف النهائي.');
              }
          }
      };

      const handleEmptyTrash = async () => {
          const deletedVisits = allVisits.filter(v => v.isDeleted);
          if (deletedVisits.length === 0) return;
          if (confirm('هل أنت متأكد من إفراغ سلة المهملات بالكامل؟ سيتم حذف جميع الزيارات المحذوفة نهائياً.')) {
              if (isReadOnly) { alert('عذراً، أنت في وضع المشاهدة فقط.'); return; }
              try {
                  const batch = db.batch();
                  deletedVisits.forEach(v => {
                      batch.delete(db.collection('visits').doc(v.id));
                  });
                  await batch.commit();
              } catch(e) {
                  console.error(e);
                  alert('حدث خطأ أثناء إفراغ سلة المهملات.');
              }
          }
      };

      const handleEndVisit = () => {
        if(isReadOnly) return;
        if(confirm("هل أنت متأكد من حفظ وإنهاء هذه الزيارة والبدء في زيارة جديدة؟")) {
            const newId = uuidv4();
            const emptyData = { visitId: newId, location: '', date: new Date().toISOString().split('T')[0], churches: [], createdAt: Date.now() };
            setCurrentVisitId(newId);
            setData(emptyData);
            // Optionally save the new empty shell so it exists
            if (db && !isReadOnly) db.collection('visits').doc(newId).set(emptyData);
        }
      };

      return (

                   <div className="flex items-center gap-3"><Trash2 size={20} /> سلة المهملات</div>

                       <span className="bg-red-100 text-red-700 px-2 py-0.5 rounded-full text-xs font-bold font-sans">
                          {formatNumber(allVisits.filter(v => v.isDeleted).length)}

                <ExecutionPage

             )}

                   deletedVisits={allVisits.filter(v => v.isDeleted)} 
                   onRestore={handleRestoreVisit} 
                   onPermanentDelete={handlePermanentDelete} 
                   onEmptyTrash={handleEmptyTrash} 
                />
             )}
             {showExportModal && exportVisitData && (
                 <ExportModal visit={exportVisitData} onClose={() => setShowExportModal(false)} />
             )}
          </main>
        </div>
      );

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);

    // Automatically unregister old service workers and purge caches to guarantee immediate fresh updates
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(registrations => {
        for (let reg of registrations) {
          reg.unregister();
        }
      });
    }
    if (window.caches) {
      caches.keys().then(names => {
        for (let name of names) caches.delete(name);
      });
    }
  </script>
</body>
