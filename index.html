function UserManagementModal({ isOpen, onClose, currentUser }) {
    const [users, setUsers] = useState([]);
    const [logs, setLogs] = useState([]);
    const [activeSubTab, setActiveSubTab] = useState('users'); // 'users' | 'logs'
    const [isLoading, setIsLoading] = useState(true);
    const [processingUid, setProcessingUid] = useState(null);

    useEffect(() => {
        if (!isOpen) return;
        loadData();
    }, [isOpen]);

    const loadData = async () => {
        setIsLoading(true);
        try {
            if (!db) return;
            // 1. Load users
            const usersSnap = await db.collection('users').orderBy('createdAt', 'desc').get();
            const uList = usersSnap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            setUsers(uList);

            // 2. Load activity logs
            const logsSnap = await db.collection('activity_logs').orderBy('timestamp', 'desc').limit(50).get();
            const lList = logsSnap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            setLogs(lList);
        } catch (e) {
            console.error('Error loading users/logs:', e);
            window.notifyError('تعذر تحميل بيانات المستخدمين أو السجلات.');
        } finally {
            setIsLoading(false);
        }
    };

    const handleApprove = async (targetUser) => {
        setProcessingUid(targetUser.uid || targetUser.id);
        try {
            await AuthService.approveUser(targetUser.uid || targetUser.id, targetUser.name, currentUser);
            window.notifySuccess(`تم تفعيل وموافقة حساب الخادم (${targetUser.name}) بنجاح!`);
            await loadData();
        } catch (e) {
            console.error(e);
            window.notifyError('فشلت عملية الموافقة على الحساب.');
        } finally {
            setProcessingUid(null);
        }
    };

    const handleBlock = async (targetUser) => {
        window.showConfirm({
            title: 'حظر / تعطيل حساب الخادم',
            message: `هل أنت متأكد من تعطيل حساب الخادم (${targetUser.name})؟ لن يتمكن من فتح التطبيق مجدداً.`,
            confirmText: 'نعم، تعطيل الحساب',
            cancelText: 'إلغاء',
            isDangerous: true,
            onConfirm: async () => {
                setProcessingUid(targetUser.uid || targetUser.id);
                try {
                    await AuthService.blockUser(targetUser.uid || targetUser.id, targetUser.name, currentUser);
                    window.notifySuccess(`تم تعطيل حساب (${targetUser.name}) بنجاح.`);
                    await loadData();
                } catch (e) {
                    console.error(e);
                    window.notifyError('فشل تعطيل الحساب.');
                } finally {
                    setProcessingUid(null);
                }
            }
        });
    };

    if (!isOpen) return null;
    if (!currentUser || currentUser.role !== 'admin') return null;

    const pendingCount = users.filter(u => u.status === 'pending').length;

    return (
        <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-3 sm:p-5 backdrop-blur-sm animate-fade-in" onClick={onClose}>
            <div className="bg-white rounded-2xl shadow-2xl w-full max-w-4xl max-h-[92vh] flex flex-col overflow-hidden" onClick={e => e.stopPropagation()}>
                
                {/* Header */}
                <div className="bg-[#002f6c] p-4 sm:p-5 text-white flex justify-between items-center border-b border-[#001f4c]">
                    <div className="flex items-center gap-3">
                        <div className="bg-amber-400/20 p-2 rounded-xl text-amber-300 border border-amber-400/30">
                            <Users size={24} />
                        </div>
                        <div>
                            <h3 className="font-bold text-lg sm:text-xl text-white flex items-center gap-2">
                                إدارة الخدام وصلاحيات الدخول
                            </h3>
                            <p className="text-xs text-blue-200 mt-0.5">
                                اعتماد طلبات التسجيل، التحكم في الصلاحيات، ومتابعة سجل حركة الخدام
                            </p>
                        </div>
                    </div>
                    <button onClick={onClose} className="text-white/80 hover:text-white p-2 rounded-lg hover:bg-white/10 transition-colors">
                        <X size={24} />
                    </button>
                </div>

                {/* Sub-Header Tabs */}
                <div className="bg-gray-50 border-b border-gray-200 flex px-4 gap-2">
                    <button
                        onClick={() => setActiveSubTab('users')}
                        className={`py-3 px-4 text-xs sm:text-sm font-bold border-b-2 flex items-center gap-2 transition-all ${
                            activeSubTab === 'users'
                                ? 'border-[#002f6c] text-[#002f6c] bg-white'
                                : 'border-transparent text-gray-500 hover:text-gray-700'
                        }`}
                    >
                        <Users size={16} />
                        <span>قائمة الخدام والمستخدمين</span>
                        {pendingCount > 0 && (
                            <span className="bg-rose-500 text-white text-[10px] px-2 py-0.5 rounded-full font-bold animate-pulse">
                                {pendingCount} بانتظار الموافقة
                            </span>
                        )}
                    </button>

                    <button
                        onClick={() => setActiveSubTab('logs')}
                        className={`py-3 px-4 text-xs sm:text-sm font-bold border-b-2 flex items-center gap-2 transition-all ${
                            activeSubTab === 'logs'
                                ? 'border-[#002f6c] text-[#002f6c] bg-white'
                                : 'border-transparent text-gray-500 hover:text-gray-700'
                        }`}
                    >
                        <History size={16} />
                        <span>سجل نشاط الخدام (Audit Log)</span>
                    </button>
                </div>

                {/* Body Content */}
                <div className="flex-1 overflow-y-auto p-4 sm:p-6 bg-[#f8fafc]">
                    {isLoading ? (
                        <div className="py-16 text-center text-gray-400 flex flex-col items-center justify-center">
                            <Clock size={36} className="animate-spin text-[#002f6c] mb-3" />
                            <p className="font-medium text-gray-600">جاري تحميل بيانات الخدام...</p>
                        </div>
                    ) : activeSubTab === 'users' ? (
                        <div className="space-y-3">
                            {users.length === 0 ? (
                                <p className="text-center text-gray-500 py-12">لا يوجد مستخدمون مسجلون بعد.</p>
                            ) : (
                                users.map(u => {
                                    const isPending = u.status === 'pending';
                                    const isBlocked = u.status === 'blocked';
                                    const isAdmin = u.role === 'admin';
                                    const isSelf = currentUser && (currentUser.uid === u.uid || currentUser.email === u.email);

                                    return (
                                        <div key={u.id || u.uid} className={`bg-white border rounded-xl p-4 shadow-sm flex flex-col md:flex-row md:items-center justify-between gap-3 transition-all ${
                                            isPending ? 'border-amber-400 ring-2 ring-amber-100 bg-amber-50/20' : 'border-gray-200'
                                        }`}>
                                            <div className="flex items-start gap-3">
                                                <div className={`p-2.5 rounded-xl shrink-0 ${
                                                    isAdmin ? 'bg-purple-100 text-purple-800' : isPending ? 'bg-amber-100 text-amber-800' : 'bg-blue-50 text-[#002f6c]'
                                                }`}>
                                                    <User size={22} />
                                                </div>
                                                <div>
                                                    <div className="flex items-center gap-2 flex-wrap">
                                                        <span className="font-bold text-gray-900 text-sm sm:text-base">
                                                            {u.name || 'بدون اسم'}
                                                        </span>
                                                        {isAdmin && (
                                                            <span className="bg-purple-100 text-purple-800 text-[10px] font-bold px-2 py-0.5 rounded-full">
                                                                مسؤول الخدمة (Admin)
                                                            </span>
                                                        )}
                                                        {isPending && (
                                                            <span className="bg-amber-100 text-amber-800 text-[10px] font-bold px-2 py-0.5 rounded-full flex items-center gap-1">
                                                                <Clock size={10} /> بانتظار موافقتك
                                                            </span>
                                                        )}
                                                        {isBlocked && (
                                                            <span className="bg-rose-100 text-rose-800 text-[10px] font-bold px-2 py-0.5 rounded-full">
                                                                معطل / محظور
                                                            </span>
                                                        )}
                                                        {u.status === 'approved' && !isAdmin && (
                                                            <span className="bg-emerald-100 text-emerald-800 text-[10px] font-bold px-2 py-0.5 rounded-full">
                                                                خادم معتمد ✅
                                                            </span>
                                                        )}
                                                    </div>
                                                    <p className="text-xs text-gray-500 mt-1 font-sans">
                                                        {u.email} {u.phone ? `• 📞 ${u.phone}` : ''}
                                                    </p>
                                                    <p className="text-[11px] text-gray-400 mt-0.5">
                                                        تاريخ التسجيل: {u.createdAt ? new Date(u.createdAt).toLocaleDateString('ar-EG') : 'غير مسجل'}
                                                    </p>
                                                </div>
                                            </div>

                                            {/* Action Buttons */}
                                            {!isSelf && (
                                                <div className="flex items-center gap-2 shrink-0 justify-end pt-2 md:pt-0 border-t md:border-t-0">
                                                    {isPending && (
                                                        <button
                                                            onClick={() => handleApprove(u)}

                                                            className="flex items-center gap-1.5 px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-xs font-bold shadow-sm transition-all disabled:opacity-50"
                                                        >
                                                            <CheckCircle size={14} />

                                                        </button>
                                                    )}

                                                    {!isBlocked && !isAdmin && (
                                                        <button
                                                            onClick={() => handleBlock(u)}

                                                        >
                                                            <ShieldAlert size={14} />
                                                            <span>تعطيل الحساب</span>
                                                        </button>
                                                    )}

                                                    {isBlocked && (
                                                        <button
                                                            onClick={() => handleApprove(u)}
                                                            disabled={processingUid === (u.uid || u.id)}
                                                            className="flex items-center gap-1.5 px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-xs font-bold transition-all disabled:opacity-50"
                                                        >
                                                            <RotateCcw size={14} />
                                                            <span>إلغاء الحظر وتفعيل</span>
                                                        </button>
                                                    )}
                                                </div>
                                            )}
                                        </div>
                                    );
                                })
                            )}
                        </div>
                    ) : (
                        /* ACTIVITY LOG TAB */
                        <div className="space-y-2">
                            {logs.length === 0 ? (
                                <p className="text-center text-gray-500 py-12">لا توجد حركات مسجلة بعد في السجل.</p>
                            ) : (
                                logs.map(log => (
                                    <div key={log.id} className="bg-white border border-gray-200 p-3 rounded-xl flex items-center justify-between gap-3 text-xs">
                                        <div className="flex items-center gap-2">
                                            <span className="w-2 h-2 rounded-full bg-[#002f6c]"></span>
                                            <strong className="text-[#002f6c]">{log.userName}:</strong>

                                        <span className="text-gray-400 whitespace-nowrap font-sans">
                                            {log.dateStr} - {log.timeStr}
                                        </span>
                                    </div>

                            )}
                        </div>
                    )}
                </div>

                {/* Footer */}
                <div className="bg-white p-3 border-t border-gray-200 flex justify-end px-5">
                    <button onClick={onClose} className="px-5 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold rounded-lg text-xs">
                        إغلاق
                    </button>
                </div>
            </div>
        </div>
    );
}

    function GlobalSearchModal({ isOpen, onClose, allVisits, onNavigateToCase, onQuickPay }) {
      const [searchQuery, setSearchQuery] = useState('');
      const [filterCategory, setFilterCategory] = useState('all'); // 'all' | 'beneficiary' | 'church' | 'notes'
      const inputRef = useRef(null);

      useEffect(() => {
        if (isOpen) {
          setSearchQuery('');
          setTimeout(() => {
            if (inputRef.current) inputRef.current.focus();
          }, 60);
        }
      }, [isOpen]);

      // Flatten all cases across all non-deleted visits
      const flattenedCases = React.useMemo(() => {
        const list = [];
        (allVisits || []).filter(v => !v.isDeleted).forEach(v => {
          (v.churches || []).forEach(ch => {
            (ch.servantsGroups || []).forEach(sg => {
              (sg.cases || []).forEach(c => {
                list.push({
                  visitId: v.id,
                  visitLocation: v.location || 'بدون اسم',
                  visitDate: v.date,
                  churchId: ch.id,
                  churchName: ch.churchName,
                  regionName: ch.regionName,
                  villageName: ch.villageName,
                  groupId: sg.id,
                  servantsNames: sg.servantsNames,
                  caseObj: c
                });
              });
            });
          });
        });
        return list;
      }, [allVisits]);

      const filteredResults = React.useMemo(() => {
        const q = normalizeArabicText(searchQuery);
        if (!q) return [];

        return flattenedCases.filter(item => {
          const c = item.caseObj;
          const normName = normalizeArabicText(c.name);
          const normNationalId = String(c.nationalId || '').trim();
          const normPhone = String(c.phone || '').trim();
          const normChurch = normalizeArabicText(item.churchName);
          const normRegion = normalizeArabicText(item.regionName);
          const normVillage = normalizeArabicText(item.villageName);
          const normServants = normalizeArabicText(item.servantsNames);
          const normProject = normalizeArabicText(c.executedProjectType || c.projectType);
          const normNotes = normalizeArabicText((c.notes || '') + ' ' + (c.executionNotes || ''));

          if (filterCategory === 'beneficiary') {
            return normName.includes(q) || normNationalId.includes(q) || normPhone.includes(q);
          }
          if (filterCategory === 'church') {
            return normChurch.includes(q) || normRegion.includes(q) || normVillage.includes(q);
          }
          if (filterCategory === 'notes') {
            return normNotes.includes(q) || normProject.includes(q);
          }

          return normName.includes(q) ||
                 normNationalId.includes(q) ||
                 normPhone.includes(q) ||
                 normChurch.includes(q) ||
                 normRegion.includes(q) ||
                 normVillage.includes(q) ||
                 normServants.includes(q) ||
                 normProject.includes(q) ||
                 normNotes.includes(q);
        }).slice(0, 30);
      }, [flattenedCases, searchQuery, filterCategory]);

      if (!isOpen) return null;

      return (
        <div className="fixed inset-0 z-50 overflow-y-auto bg-slate-900/60 backdrop-blur-sm p-3 sm:p-6 md:p-10 flex items-start justify-center animate-fade-in" onClick={onClose}>
          <div 
            className="bg-white rounded-2xl shadow-2xl border border-gray-200 w-full max-w-3xl overflow-hidden flex flex-col max-h-[85vh] mt-2 sm:mt-8"
            onClick={e => e.stopPropagation()}
          >

            } catch (err) {
              console.warn('Error syncing user profile:', err);
              setCurrentUser(prev => {
                const updated = prev || {
                  uid: authUser.uid,

            const currentSession = typeof AuthService !== 'undefined' ? AuthService.getSavedSession() : null;

                 return prevId;

                 setData(list[0]);

      const safeUpdateVisit = async (upd, reason = 'general') => {
        if (!db || isReadOnly || !upd || !upd.id) return;
        const visitRef = db.collection('visits').doc(upd.id);

        try {
          await db.runTransaction(async (transaction) => {
            const doc = await transaction.get(visitRef);
            if (!doc.exists) {
              transaction.set(visitRef, {
                ...upd,
                updatedAt: Date.now()
              });
              return;
            }

            const fresh = doc.data();

            // Smart Merge for Concurrency Protection:
            // When multiple servants work concurrently on the same visit (e.g. paying installments or updating statuses),
            // we merge at the church/group/case level so changes by Servant A are preserved when Servant B saves!
            let mergedChurches = upd.churches || fresh.churches || [];

            if (Array.isArray(fresh.churches) && Array.isArray(upd.churches)) {
              mergedChurches = upd.churches.map(updCh => {
                const freshCh = fresh.churches.find(c => c.id === updCh.id);
                if (!freshCh) return updCh;

                const mergedGroups = (updCh.servantsGroups || []).map(updGrp => {
                  const freshGrp = (freshCh.servantsGroups || []).find(g => g.id === updGrp.id);
                  if (!freshGrp) return updGrp;

                  const mergedCases = (updGrp.cases || []).map(updCase => {
                    const freshCase = (freshGrp.cases || []).find(c => c.id === updCase.id);
                    if (!freshCase) return updCase;

                    return {
                      ...freshCase,
                      ...updCase
                    };
                  });

                  (freshGrp.cases || []).forEach(fc => {
                    if (!mergedCases.some(mc => mc.id === fc.id)) {
                      mergedCases.push(fc);
                    }
                  });

                  return { ...updGrp, cases: mergedCases };
                });

                (freshCh.servantsGroups || []).forEach(fg => {
                  if (!mergedGroups.some(mg => mg.id === fg.id)) {
                    mergedGroups.push(fg);
                  }
                });

                return { ...updCh, servantsGroups: mergedGroups };
              });

              fresh.churches.forEach(fc => {
                if (!mergedChurches.some(mc => mc.id === fc.id)) {
                  mergedChurches.push(fc);
                }
              });
            }

            const finalDoc = {
              ...fresh,
              ...upd,
              churches: mergedChurches,
              updatedAt: Date.now()
            };

            transaction.set(visitRef, finalDoc);
          });
          if (typeof BackupService !== 'undefined') {

        window.showConfirm({
          title: 'إنهاء وبدء زيارة جديدة',
          message: 'هل أنت متأكد من حفظ وإنهاء هذه الزيارة والبدء في تسجيل زيارة جديدة؟',
          confirmText: 'نعم، بدء زيارة جديدة',
          cancelText: 'إلغاء',
          onConfirm: () => {
            const newId = uuidv4();
            const emptyData = { visitId: newId, location: '', date: new Date().toISOString().split('T')[0], churches: [], createdAt: Date.now() };
            setCurrentVisitId(newId);
            setData(emptyData);
            if (db && !isReadOnly) db.collection('visits').doc(newId).set(emptyData);
            window.notifySuccess('تم بدء زيارة جديدة بنجاح.');
          }
        });
      };


      return (
        <div className="min-h-screen bg-[#f8fafc] text-gray-900 selection:bg-[#002f6c] selection:text-white pb-20">
          
          {/* TOP NAVBAR */}
          <nav className="bg-[#002f6c] text-white shadow-md sticky top-0 z-30">
            <div className="max-w-7xl mx-auto px-3 py-2.5 sm:px-4 h-16 flex items-center justify-between w-full">
               {/* Right side in RTL (Hamburger + Logo) */}
               <div className="flex items-center gap-2 sm:gap-4 shrink-0">
                  <button onClick={() => setIsSidebarOpen(true)} className="p-1.5 sm:p-2 hover:bg-[#001f4c] rounded-md transition-colors">
                    <Menu size={24} />
                  </button>
                  <img src="anba_karas_splash.jpg" alt="أنبا كاراس" className="w-8 h-8 sm:w-10 sm:h-10 rounded-full object-cover border-2 border-amber-400 shadow-md ring-1 sm:ring-2 ring-amber-400/30" />
                  <div className="flex flex-col justify-center mr-1">
                     <span className="text-sm sm:text-base font-bold text-amber-300 tracking-tight leading-tight">
                        خدمة الأنبا كاراس
                     </span>
                     <span className="text-[11px] sm:text-xs text-blue-200 font-medium">
                        متابعة المشاريع
                     </span>
                  </div>
               </div>

               {/* Left side in RTL (User Profile + Search Button + Status Badges) */}
               <div className="flex items-center gap-2 sm:gap-3">
                   {currentUser && (
                     <div
                       onClick={() => { if (currentUser.role === 'admin') setShowUsersModal(true); }}
                       className={`flex items-center gap-2 bg-white/10 border border-amber-400/30 px-2.5 py-1 rounded-lg text-xs ${currentUser.role === 'admin' ? 'cursor-pointer hover:bg-white/20' : ''}`}
                       title={currentUser.role === 'admin' ? "إدارة الخدام والصلاحيات" : undefined}
                     >
                       <div className="w-6 h-6 rounded-full bg-amber-400 text-blue-950 font-bold flex items-center justify-center text-xs shadow-inner">
                         {(currentUser.name || currentUser.email || 'خ')[0].toUpperCase()}
                       </div>
                       <div className="flex flex-col text-right">
                         <span className="font-bold text-amber-200 leading-tight truncate max-w-[120px]">{currentUser.name || currentUser.email}</span>
                         <span className="text-[10px] text-blue-200/80 leading-none">
                           {currentUser.role === 'admin' ? 'مشرف عام 👑' : 'خادم معتمد'}
                         </span>
                       </div>
                     </div>
                   )}
                  <button 
                    type="button"
                    onClick={() => setShowGlobalSearch(true)}
                    className="flex items-center gap-1.5 px-2.5 sm:px-3 py-1.5 rounded-lg text-xs sm:text-sm font-medium transition-all bg-white/10 text-amber-200 hover:bg-white/20 border border-amber-400/30 shadow-sm"
                    title="بحث سريع شامل"
                  >
                    <Search size={15} />
                    <span className="hidden sm:inline font-bold">بحث شامل</span>
                  </button>
                  
                  <div className="flex items-center gap-2 mt-0.5">
                      {!isOnline && (
                        <div className="bg-amber-500/20 text-amber-200 border border-amber-400/50 px-2 py-0.5 rounded text-[10px] sm:text-xs font-bold flex items-center gap-1 shadow-sm animate-pulse">
                           <span>📴</span> غير متصل (محلياً)
                        </div>
                      )}
                      {isReadOnly && (
                        <div className="bg-red-500/20 text-red-100 border border-red-400/50 px-2 py-0.5 rounded text-[10px] sm:text-xs font-bold flex items-center gap-1 shadow-sm">
                           <span>👁️</span> للاطلاع فقط
                        </div>
                     )}
                     <div className="hidden sm:flex items-center text-[10px] sm:text-xs font-medium px-2 py-0.5 rounded bg-[#001f4c] text-blue-200">
                       {!isReadOnly && syncStatus === 'syncing' && <><CloudUpload size={12} className="ml-1 animate-pulse" /><span>جاري الحفظ...</span></>}
                       {!isReadOnly && syncStatus === 'synced' && <><Cloud size={12} className="ml-1 text-green-400" /><span>تم الحفظ</span></>}
                       {!isReadOnly && syncStatus === 'error' && <><CloudOff size={12} className="ml-1 text-red-400" /><span>غير متصل</span></>}
                     </div>
                  </div>
               </div>
            </div>
          </nav>

          {/* SIDEBAR DRAWER */}
          <div className={`fixed inset-0 bg-black/50 z-40 transition-opacity duration-300 ${isSidebarOpen ? 'opacity-100' : 'opacity-0 pointer-events-none'}`} onClick={() => setIsSidebarOpen(false)} />
          <div className={`fixed top-0 right-0 h-full w-72 bg-white shadow-2xl z-50 transform transition-transform duration-300 ease-in-out ${isSidebarOpen ? 'translate-x-0' : 'translate-x-full'}`}>
             <div className="h-16 bg-[#002f6c] px-4 flex items-center justify-between border-b border-[#001f4c]">
                <div className="flex items-center gap-3">
                   <img src="anba_karas_splash.jpg" alt="أنبا كاراس" className="w-9 h-9 rounded-full object-cover border-2 border-amber-400 shadow-md ring-2 ring-amber-400/30" />
                   <div className="flex flex-col">
                     <span className="font-bold text-[#d4af37] text-sm">خدمة الأنبا كاراس</span>
                     {currentUser && (
                       <span className="text-[10px] text-blue-200 leading-none mt-0.5">
                         {currentUser.name || currentUser.email} &bull; {currentUser.role === 'admin' ? 'مشرف عام' : 'خادم'}
                       </span>
                     )}
                   </div>
                </div>
                <button onClick={() => setIsSidebarOpen(false)} className="text-white hover:text-gray-300 p-2"><X size={20}/></button>
             </div>
                          <div className="py-4 flex flex-col h-[calc(100vh-64px)] overflow-y-auto">
                <button onClick={() => { setActiveTab('execution'); setIsSidebarOpen(false); }} className={`flex items-center gap-3 px-6 py-4 text-right transition-colors ${activeTab === 'execution' ? 'bg-amber-50 text-amber-900 border-r-4 border-amber-500 font-bold' : 'text-gray-700 hover:bg-gray-50'}`}>
                   <Zap size={20} className="text-amber-600" /> متابعة واعتماد تنفيذ المشاريع
                </button>
                <button onClick={() => { setActiveTab('installments'); setIsSidebarOpen(false); }} className={`flex items-center gap-3 px-6 py-4 text-right transition-colors ${activeTab === 'installments' ? 'bg-emerald-50 text-emerald-900 border-r-4 border-emerald-500 font-bold' : 'text-gray-700 hover:bg-gray-50'}`}>
                   <DollarSign size={20} className="text-emerald-600" /> متابعة الأقساط والتحصيل الدوري
                </button>
                 <button onClick={() => { setActiveTab('analytics'); setIsSidebarOpen(false); }} className={`flex items-center gap-3 px-6 py-4 text-right transition-colors ${activeTab === 'analytics' ? 'bg-purple-50 text-purple-900 border-r-4 border-purple-500 font-bold' : 'text-gray-700 hover:bg-gray-50'}`}>
                    <BarChart3 size={20} className="text-purple-600" /> لوحة التحليلات ونسب المشاريع
                 </button>
                <button onClick={() => { setActiveTab('archive'); setIsSidebarOpen(false); }} className={`flex items-center gap-3 px-6 py-4 text-right transition-colors ${activeTab === 'archive' || activeTab === 'archiveDetails' ? 'bg-blue-50 text-[#002f6c] border-r-4 border-[#002f6c] font-bold' : 'text-gray-600 hover:bg-gray-50'}`}>
                   <ListIcon size={20} /> أرشيف الزيارات والتقارير
                </button>
                <div className="mx-3 my-1.5 bg-gradient-to-b from-blue-50/80 to-indigo-50/40 rounded-xl border border-blue-200/80 overflow-hidden shadow-sm">
                    <button 
                       type="button"
                       onClick={() => setIsAddMenuOpen(prev => !prev)} 
                       className="w-full flex items-center justify-between px-3.5 py-3 text-right text-[#002f6c] hover:bg-blue-100/50 transition-colors"
                    >
                       <div className="flex items-center gap-2.5">
                          <PlusCircle size={19} className="text-[#002f6c]" />
                          <span className="font-bold text-sm text-[#002f6c]">إضافة زيارة</span>
                       </div>
                       {isAddMenuOpen ? <ChevronUp size={16} className="text-[#002f6c]/70" /> : <ChevronDown size={16} className="text-[#002f6c]/70" />}
                    </button>

                    {isAddMenuOpen && (
                       <div className="p-2 pt-0 flex flex-col gap-1.5 border-t border-blue-100/80">
                          {/* 1. زيارة جديدة */}
                          <button 
                             type="button"
                             onClick={() => { setActiveTab('entry'); setIsSidebarOpen(false); }} 
                             className={`flex items-center gap-2.5 px-3 py-2.5 rounded-lg text-right transition-all text-xs ${activeTab === 'entry' ? 'bg-[#002f6c] text-white font-bold shadow-sm' : 'bg-white/80 hover:bg-white text-gray-800 border border-gray-100'}`}
                          >
                             <div className="w-2 h-2 rounded-full bg-emerald-500 shrink-0"></div>
                             <div className="flex flex-col text-right">
                                <span className="font-bold">زيارة جديدة</span>
                                <span className={`text-[10px] ${activeTab === 'entry' ? 'text-blue-100' : 'text-gray-500'}`}>تسجيل الحالات ميدانياً خطوة بخطوة</span>
                             </div>
                          </button>

                          {/* 2. زيارة قديمة */}
                          <button 
                             type="button"
                             onClick={() => { setShowLegacyChoiceModal(true); setIsSidebarOpen(false); }} 
                             className="flex items-center gap-2.5 px-3 py-2.5 rounded-lg text-right transition-all text-xs bg-white/80 hover:bg-white text-gray-800 border border-gray-100 hover:border-blue-200"
                          >
                             <div className="w-2 h-2 rounded-full bg-blue-500 shrink-0"></div>
                             <div className="flex flex-col text-right">
                                <span className="font-bold">زيارة قديمة</span>
                                <span className="text-[10px] text-gray-500">رفع من Excel أو إدخال يدوي</span>
                             </div>
                          </button>
                       </div>
                    )}
                 </div>
                <button onClick={() => { setShowBackupModal(true); setIsSidebarOpen(false); }} className="flex items-center gap-3 px-6 py-3.5 text-right transition-colors text-amber-900 bg-amber-50/70 hover:bg-amber-100 border-t border-b border-amber-200/60 font-bold">
                   <ShieldCheck size={20} className="text-amber-600" /> النسخ الاحتياطي وتاريخ الإصدارات
                </button>
                {currentUser && currentUser.role === 'admin' && (
                  <button onClick={() => { setShowUsersModal(true); setIsSidebarOpen(false); }} className="flex items-center gap-3 px-6 py-3.5 text-right transition-colors text-purple-900 bg-purple-50/70 hover:bg-purple-100 border-b border-purple-200/60 font-bold">
                    <Users size={20} className="text-purple-600" />
                    <span>إدارة الخدام والصلاحيات</span>
                    {pendingServantsCount > 0 && (
                      <span className="mr-auto bg-rose-500 text-white text-[10px] px-2 py-0.5 rounded-full font-bold animate-pulse">
                        {pendingServantsCount}
                      </span>
                    )}
                  </button>
                )}
                {currentUser && (
                  <button onClick={() => { AuthService.logoutUser(currentUser).then(() => { setCurrentUser(null); setIsSidebarOpen(false); }); }} className="flex items-center gap-3 px-6 py-3.5 text-right transition-colors text-rose-700 bg-rose-50/50 hover:bg-rose-100 border-b border-rose-200/40 font-bold">
                    <LogOut size={20} className="text-rose-600" />
                    <span>تسجيل الخروج</span>
                  </button>
                )}
                <button onClick={() => { setActiveTab('trash'); setIsSidebarOpen(false); }} className={`flex items-center justify-between mt-auto px-6 py-4 text-right transition-colors border-t border-gray-100 ${activeTab === 'trash' ? 'bg-red-50 text-red-600 border-r-4 border-red-600 font-bold' : 'text-gray-600 hover:bg-red-50 hover:text-red-600'}`}>
                   <div className="flex items-center gap-3"><Trash2 size={20} /> سلة المهملات</div>
                   {allVisits.filter(v => v.isDeleted).length > 0 && (
                       <span className="bg-red-100 text-red-700 px-2 py-0.5 rounded-full text-xs font-bold font-sans">
                          {formatNumber(allVisits.filter(v => v.isDeleted).length)}
                       </span>
                   )}
                </button>
             </div>
          </div>

          {/* MAIN CONTENT AREA */}
          <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
             {activeTab === 'execution' && (
                <ExecutionPage 
                   allVisits={allVisits.filter(v => !v.isDeleted)} 
                   onUpdateVisit={(upd) => safeUpdateVisit(upd, 'execution')} 
                   onExport={openExportModal} 
                />
             )}
             {activeTab === 'installments' && (
                <InstallmentsPage 
                   allVisits={allVisits.filter(v => !v.isDeleted)} 
                   onUpdateVisit={(upd) => safeUpdateVisit(upd, 'installments')} 
                   onExport={openExportModal} 
                />
             )}
             {activeTab === 'analytics' && (
                <AnalyticsPage 
                   allVisits={allVisits.filter(v => !v.isDeleted)} 
                   onNavigateToCase={handleNavigateToCase} 
                   onExport={openExportModal} 
                />
             )}
             {activeTab === 'entry' && (
                <ActiveVisitForm data={data} updateData={updateData} onEndVisit={handleEndVisit} onExport={openExportModal} onOpenImportLegacy={() => setShowImportLegacyModal(true)} />
             )}
             {activeTab === 'archive' && (
                <ArchivePage 
                   allVisits={allVisits.filter(v => !v.isDeleted)} 
                   onViewDetails={(v) => { setViewingArchive(v); setActiveTab('archiveDetails'); }}
                   onEditVisit={handleEditVisit}
                   onDeleteVisit={handleDeleteVisit}
                />
             )}
             {activeTab === 'archiveDetails' && viewingArchive && (
                <ArchiveDetails 
                   visit={viewingArchive} onExport={openExportModal} onUpdateVisit={(upd) => { setViewingArchive(upd); safeUpdateVisit(upd, 'archive'); }} 
                   onBack={() => { setViewingArchive(null); setActiveTab('archive'); }} 
                />
             )}
             {activeTab === 'trash' && (
                <TrashPage 
                   deletedVisits={allVisits.filter(v => v.isDeleted)} 
                   onRestore={handleRestoreVisit} 
                   onPermanentDelete={handlePermanentDelete} 
                   onEmptyTrash={handleEmptyTrash} 
                />
             )}
                        {showGlobalSearch && (
             <GlobalSearchModal
               isOpen={showGlobalSearch}
               onClose={() => setShowGlobalSearch(false)}
               allVisits={allVisits}
               onNavigateToCase={handleNavigateToCase}
               onQuickPay={handleQuickPay}
             />
           )}
           {quickActionModalCase && (
             <InstallmentModal
               caseObj={quickActionModalCase.caseObj}
               churchName={quickActionModalCase.churchName}
               regionName={quickActionModalCase.regionName || ''}
               onSavePayments={(updatedPayments) => {
                 const targetVisit = allVisits.find(v => v.id === quickActionModalCase.visitId);
                 if (!targetVisit) return;
                 const updatedChurches = (targetVisit.churches || []).map(ch => ch.id === quickActionModalCase.churchId ? {
                   ...ch,
                   servantsGroups: (ch.servantsGroups || []).map(sg => sg.id === quickActionModalCase.groupId ? {
                     ...sg,
                     cases: (sg.cases || []).map(c => c.id === quickActionModalCase.caseObj.id ? {
                       ...c,
                       payments: updatedPayments
                     } : c)
                   } : sg)
                 } : ch);
                 safeUpdateVisit({ ...targetVisit, churches: updatedChurches }, 'quickActionModal');
                 setQuickActionModalCase(prev => prev ? ({ ...prev, caseObj: { ...prev.caseObj, payments: updatedPayments } }) : null);
               }}
               onClose={() => setQuickActionModalCase(null)}
             />
           )}
           <ToastContainer />
           <ConfirmDialogModal />
           {/* نافذة الاختيار للزيارة القديمة (Excel أو يدوي) */}
           {showLegacyChoiceModal && (
             <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-3 sm:p-4 backdrop-blur-sm" onClick={() => setShowLegacyChoiceModal(false)}>
               <div className="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden border border-gray-100 animate-fade-in" onClick={e => e.stopPropagation()}>
                 <div className="bg-[#002f6c] p-4 text-white flex justify-between items-center">
                   <div className="flex items-center gap-2.5">
                     <History size={22} className="text-amber-400" />
                     <div>
                       <h3 className="font-bold text-base">إضافة زيارة أو مشروع قديم</h3>
                       <p className="text-xs text-blue-200">اختر طريقة تسجيل النزلة والمشاريع السابقة</p>
                     </div>
                   </div>
                   <button onClick={() => setShowLegacyChoiceModal(false)} className="text-white/80 hover:text-white p-1 rounded-lg">
                     <X size={20} />
                   </button>
                 </div>

                 <div className="p-5 flex flex-col gap-3.5">
                   {/* خيار 1: رفع من Excel */}
                   <button 
                     type="button"
                     onClick={() => {
                       setShowLegacyChoiceModal(false);
                       setShowImportLegacyModal(true);
                     }}
                     className="flex items-center gap-3.5 p-4 rounded-xl border-2 border-emerald-200 hover:border-emerald-500 bg-emerald-50/50 hover:bg-emerald-50 text-right transition-all group shadow-sm hover:shadow"
                   >
                     <div className="w-12 h-12 rounded-xl bg-emerald-600 text-white flex items-center justify-center shrink-0 shadow-md group-hover:scale-105 transition-transform">
                       <FileSpreadsheet size={24} />
                     </div>
                     <div className="flex-1">
                       <div className="flex items-center justify-between">
                         <span className="font-bold text-emerald-950 text-sm sm:text-base">رفع من ملف Excel</span>
                         <span className="text-[10px] bg-emerald-200 text-emerald-800 px-2 py-0.5 rounded-full font-bold">آلي وذكي</span>
                       </div>
                       <p className="text-xs text-gray-600 mt-1 leading-relaxed">
                         استيراد شيت مشاريع كامل مع استخراج الكنائس والقرى وتوزيع الأقساط تلقائياً
                       </p>
                     </div>
                   </button>

                   {/* خيار 2: إدخال يدوي */}
                   <button 
                     type="button"
                     onClick={() => {
                       setShowLegacyChoiceModal(false);
                       setShowAddLegacyModal(true);
                     }}
                     className="flex items-center gap-3.5 p-4 rounded-xl border-2 border-blue-200 hover:border-blue-500 bg-blue-50/50 hover:bg-blue-50 text-right transition-all group shadow-sm hover:shadow"
                   >
                     <div className="w-12 h-12 rounded-xl bg-[#002f6c] text-white flex items-center justify-center shrink-0 shadow-md group-hover:scale-105 transition-transform">
                       <Edit2 size={22} />
                     </div>
                     <div className="flex-1">
                       <div className="flex items-center justify-between">
                         <span className="font-bold text-[#002f6c] text-sm sm:text-base">إدخال يدوي (بدون Excel)</span>
                         <span className="text-[10px] bg-blue-200 text-blue-800 px-2 py-0.5 rounded-full font-bold">تسجيل مباشر</span>
                       </div>
                       <p className="text-xs text-gray-600 mt-1 leading-relaxed">
                         تسجيل حالة أو مشروع قديم يدوياً للبيانات التي ليس لها ملف إكسيل
                       </p>
                     </div>
                   </button>
                 </div>

                 <div className="bg-gray-50 px-5 py-3 border-t border-gray-100 flex justify-end">
                   <button 
                     type="button"
                     onClick={() => setShowLegacyChoiceModal(false)}
                     className="px-4 py-1.5 text-xs text-gray-600 hover:bg-gray-200 rounded-lg transition-colors font-medium"
                   >
                     إلغاء
                   </button>
                 </div>
               </div>
             </div>
           )}

           {/* نافذة الإدخال اليدوي للمشاريع القديمة */}
           {showAddLegacyModal && (
             <AddLegacyProjectModal
               allVisits={allVisits}
               onUpdateVisit={(upd) => safeUpdateVisit(upd, 'addLegacyProject')}
               onOpenImportExcel={() => {
                 setShowAddLegacyModal(false);
                 setShowImportLegacyModal(true);
               }}
               onClose={() => setShowAddLegacyModal(false)}
             />
           )}

           {/* نافذة استيراد الإكسيل الذكي */}
           {showImportLegacyModal && (
             <ImportLegacyExcelModal
               allVisits={allVisits}
               onUpdateVisit={(upd) => safeUpdateVisit(upd, 'importLegacyExcel')}
               onOpenManualEntry={() => {
                 setShowImportLegacyModal(false);
                 setShowAddLegacyModal(true);
               }}
               onClose={() => setShowImportLegacyModal(false)}
             />
           )}
           {showExportModal && exportVisitData && (
                 <ExportModal visit={exportVisitData} onClose={() => setShowExportModal(false)} />
             )}
           {showBackupModal && (
                 <BackupVersionsModal 
                   isOpen={showBackupModal} 
                   onClose={() => setShowBackupModal(false)} 
                   allVisits={allVisits} 
                   onRestoreSuccess={(restoredVisits) => {
                     setAllVisits(restoredVisits);
                   }}
                 />
             )}
             {showUsersModal && (
                 <UserManagementModal 
                   isOpen={showUsersModal}
                   onClose={() => setShowUsersModal(false)}
                   currentUser={currentUser}
                 />
             )}
             {(!currentUser || currentUser.status !== 'approved') && !authLoading && (
                 <AuthModal 
                   userProfile={currentUser}
                   onAuthSuccess={(profile) => { setCurrentUser(profile); if (typeof AuthService !== 'undefined') AuthService.saveSession(profile); }}
                 />
             )}
          </main>
           {/* Fullscreen Splash Screen for Saint Anba Karas (3 Seconds) */}
           {showSplash && (
             <div 
               className="fixed inset-0 z-[99999] flex flex-col items-center justify-between bg-gradient-to-b from-[#021329] via-[#05264a] to-[#010c1c] text-white select-none transition-opacity duration-700 p-4 sm:p-6"
             >
               {/* Empty top spacing for balanced vertical centering */}
               <div className="w-full h-4"></div>

               {/* Center Image Container - Maximize image size while preserving aspect ratio */}
               <div className="relative flex-1 w-full max-w-lg flex flex-col items-center justify-center my-auto py-2">
                 <div className="relative group max-h-[78vh] w-auto flex items-center justify-center">
                   {/* Golden Halo glow effect behind the icon */}
                   <div className="absolute inset-0 bg-amber-500/25 blur-3xl rounded-full scale-105 animate-pulse pointer-events-none"></div>
                   
                   <img 
                     src={typeof ANBA_KARAS_SPLASH_IMAGE !== "undefined" ? ANBA_KARAS_SPLASH_IMAGE : ""}
                     alt="القديس الأنبا كاراس السائح" 
                     className="relative z-10 max-h-[75vh] max-w-[92vw] object-contain rounded-2xl shadow-[0_10px_35px_rgba(0,0,0,0.8)] border-2 border-amber-400/40"
                   />
                 </div>
               </div>

               {/* Bottom Section: Exact requested title & 3-Second Loading Bar */}
               <div className="w-full max-w-md flex flex-col items-center gap-3 pb-4">
                 <div className="text-center px-4">
                   <h1 className="text-xl sm:text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-amber-200 via-yellow-300 to-amber-100 drop-shadow">
                    <h1 className="text-xl sm:text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-amber-200 via-yellow-300 to-amber-100 drop-shadow flex flex-col items-center gap-1.5 leading-snug"><span>خدمة الأنبا كاراس لخدمة إخوة الرب</span><span className="text-lg sm:text-xl font-bold text-amber-300/95 tracking-wide">متابعة مشاريع</span></h1>
                   </h1>
                 </div>

                 {/* 3-Second Visual Progress Indicator */}
                 <div className="w-48 h-1.5 bg-white/15 rounded-full overflow-hidden backdrop-blur-sm mt-1">
                   <div 
                     className="h-full bg-gradient-to-r from-amber-400 to-yellow-300 rounded-full"
                     style={{
                       width: "100%",
                       animation: "splashProgress 3s linear forwards"
                     }}
                   ></div>
                 </div>
               </div>

               <style>{`
                 @keyframes splashProgress {
                   0% { width: 0%; }
                   100% { width: 100%; }
                 }
               `}</style>
             </div>
           )}
        </div>
      );
    }


    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>

  <script>
    // Automatically unregister old service workers and purge caches to guarantee immediate fresh updates
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(registrations => {
        for (let reg of registrations) {
          reg.unregister();
        }
      });
    }
    if (window.caches) {
      caches.keys().then(names => {
        for (let name of names) caches.delete(name);
      });
    }
  </script>
  <!-- AUTOMATIC DEPLOYMENT AUTO-REFRESH SCRIPT -->
  <script>
    (function() {
      const CLIENT_BUILD_ID = "1790770013916";
      let isUpdating = false;

      function isUserActivelyEditing() {
        try {
          const activeEl = document.activeElement;
          const isInputFocused = activeEl && (activeEl.tagName === 'INPUT' || activeEl.tagName === 'TEXTAREA' || activeEl.isContentEditable);
          const isModalOpen = !!document.querySelector('[role="dialog"], #app-installment-modal, .installment-modal');
          return isInputFocused || isModalOpen;
        } catch(e) {
          return false;
        }
      }

      function purgeCachesAndReload() {
        if (window.caches) {
          caches.keys().then(names => {
            return Promise.all(names.map(name => caches.delete(name)));
          }).catch(() => {});
        }
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(registrations => {
            registrations.forEach(r => r.unregister());
          }).catch(() => {});
        }
        const newUrl = new URL(window.location.href);
        newUrl.searchParams.set('_v', Date.now());
        window.location.replace(newUrl.toString());
      }

      function triggerAppReload(reason) {
        if (isUpdating) return;
        isUpdating = true;
        console.log('[Auto-Updater] New update detected (' + reason + ').');

        try {
          if (document.getElementById('app-auto-update-banner')) return;

          const banner = document.createElement('div');
          banner.id = 'app-auto-update-banner';
          banner.style.cssText = [
            'position: fixed',
            'top: 16px',
            'left: 50%',
            'transform: translateX(-50%)',
            'z-index: 9999999',
            'background: linear-gradient(135deg, #02204c 0%, #00122e 100%)',
            'color: #ffffff',
            'padding: 10px 18px',
            'border-radius: 14px',
            'box-shadow: 0 16px 36px rgba(0,0,0,0.4), 0 0 0 1px rgba(52,211,153,0.3)',
            'border: 1.5px solid #34d399',
            'display: flex',
            'align-items: center',
            'gap: 12px',
            'font-family: Cairo, system-ui, -apple-system, sans-serif',
            'direction: rtl',
            'animation: updateSlideDown 0.3s cubic-bezier(0.16, 1, 0.3, 1)',
            'max-width: 94vw',
            'width: 440px'
          ].join(';');

          banner.innerHTML = [
            '<div style="font-size: 22px; flex-shrink: 0;">✨</div>',
            '<div style="flex: 1; min-width: 0;">',
            '  <div style="font-weight: 800; font-size: 13px; color: #34d399; display: flex; align-items: center; gap: 6px;">',
            '    <span>يوجد تحديث جديد متاح</span>',
            '  </div>',
            '  <div style="font-size: 11px; color: #cbd5e1; margin-top: 2px; line-height: 1.3;">',
            '    يمكنك متابعة عملك بأمان والضغط على تحديث عند الانتهاء',
            '  </div>',
            '</div>',
            '<div style="display: flex; align-items: center; gap: 6px; flex-shrink: 0;">',
            '  <button id="app-update-now-btn" style="background: #34d399; color: #02204c; font-weight: 800; font-size: 11px; padding: 6px 12px; border-radius: 8px; border: none; cursor: pointer; white-space: nowrap; box-shadow: 0 4px 10px rgba(52,211,153,0.3); transition: transform 0.15s ease;">',
            '    تحديث الآن',
            '  </button>',
            '  <button id="app-update-dismiss-btn" style="background: rgba(255,255,255,0.1); color: #cbd5e1; font-weight: 600; font-size: 11px; padding: 6px 10px; border-radius: 8px; border: none; cursor: pointer; white-space: nowrap;">',
            '    لاحقاً ✕',
            '  </button>',
            '</div>'
          ].join('');

          if (!document.getElementById('auto-update-styles')) {
            const style = document.createElement('style');
            style.id = 'auto-update-styles';
            style.textContent = '@keyframes updateSlideDown { from { transform: translate(-50%, -40px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } } ' +
              '#app-update-now-btn:active { transform: scale(0.95); }';
            document.head.appendChild(style);
          }

          document.body.appendChild(banner);

          const nowBtn = document.getElementById('app-update-now-btn');
          if (nowBtn) {
            nowBtn.onclick = function() {
              nowBtn.disabled = true;
              nowBtn.textContent = 'جاري التحديث...';
              purgeCachesAndReload();
            };
          }

          const dismissBtn = document.getElementById('app-update-dismiss-btn');
          if (dismissBtn) {
            dismissBtn.onclick = function() {
              banner.style.display = 'none';
              // Allow showing again after 15 minutes if not updated
              setTimeout(() => { isUpdating = false; }, 15 * 60 * 1000);
            };
          }
        } catch(e) {
          console.warn('[Auto-Updater] Error showing update banner', e);
        }
      }

      // Check 1: Real-time Firestore version document
      function initFirestoreVersionListener() {
        const tryListen = () => {
          if (window.firebase && window.firebase.apps && window.firebase.apps.length) {
            try {
              const db = window.firebase.firestore();
              db.collection('system').doc('app_version').onSnapshot((doc) => {
                if (doc.exists) {
                  const data = doc.data();
                  if (data && data.buildId && CLIENT_BUILD_ID && data.buildId !== CLIENT_BUILD_ID) {
                    // Double check with static file to prevent false-alarm loop if push failed
                    checkVersionJson();
                  }
                }
              }, (err) => {
                // Silently ignore permission/network errors on real-time listener
              });
              return true;
            } catch(e) {
              return false;
            }
          }
          return false;
        };

        if (!tryListen()) {
          setTimeout(tryListen, 2500);
        }
      }

      // Check 2: Fetch /version.json
      async function checkVersionJson() {
        if (isUpdating) return;
        if (!window.location.protocol.startsWith('http')) return;

        try {
          const url = window.location.origin + '/version.json?_t=' + Date.now();
          const res = await fetch(url, {
            method: 'GET',
            cache: 'no-store',
            headers: {
              'Cache-Control': 'no-cache, no-store, must-revalidate',
              'Pragma': 'no-cache'
            }
          });

          if (res.ok) {
            const data = await res.json();
            if (data && data.buildId && CLIENT_BUILD_ID && data.buildId !== CLIENT_BUILD_ID) {
              triggerAppReload('version_json_mismatch');
              return;
            }
          }
        } catch(e) {}

        // Fallback: check index.html meta tag
        checkMetaTagVersion();
      }

      // Check 3: Check meta tag on index.html
      async function checkMetaTagVersion() {
        if (isUpdating) return;
        if (!window.location.protocol.startsWith('http')) return;

        try {
          const url = window.location.origin + window.location.pathname + '?_check_meta=' + Date.now();
          const res = await fetch(url, {
            method: 'GET',
            cache: 'no-store',
            headers: {
              'Cache-Control': 'no-cache, no-store, must-revalidate',
              'Pragma': 'no-cache',
              'Range': 'bytes=0-3000'
            }
          });

          if (!res.ok && res.status !== 206) return;
          const text = await res.text();
          const match = text.match(/<meta\s+name=["']app-build-id["']\s+content=["']([^"']+)["']/i);
          if (match && match[1]) {
            const remoteBuildId = match[1];
            if (CLIENT_BUILD_ID && remoteBuildId !== CLIENT_BUILD_ID && remoteBuildId !== '__BUILD_TIMESTAMP__') {
              triggerAppReload('build_id_mismatch');
            }
          }
        } catch(e) {}
      }

      function performUpdateCheck() {
        checkVersionJson();
      }

      // 1. Hook up Firestore Real-time Push
      initFirestoreVersionListener();

      // 2. Initial static checks (at 2s and 6s)
      setTimeout(performUpdateCheck, 2000);
      setTimeout(performUpdateCheck, 6000);

      // 3. Periodic polling every 12 seconds
      setInterval(performUpdateCheck, 12000);

      // 4. Check immediately upon returning to the window/tab or phone unlock
      window.addEventListener('focus', performUpdateCheck);
      window.addEventListener('online', performUpdateCheck);
      document.addEventListener('visibilitychange', function() {
        if (document.visibilityState === 'visible') {
          performUpdateCheck();
        }
      });

      window.__checkForUpdates = performUpdateCheck;
      window.__triggerAppReload = triggerAppReload;
    })();
  </script>
