    const uuidv4 = () => {
      return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
        const r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8);
        return v.toString(16);
      });
    };

    
    const getChurchStats = (churchLoc) => {
        let totalCases = 0;
        let totalValue = 0;
        let totalInst = 0;
        let totalGroups = (churchLoc.servantsGroups || []).length;
        (churchLoc.servantsGroups || []).forEach(sg => {
            (sg.cases || []).forEach(c => {
                totalCases++;
                totalValue += (parseFloat(c.projectValue) || 0);
                totalInst += (parseFloat(c.installmentAmount) || 0);
            });
        });
        return { totalCases, totalValue, totalInst, totalGroups };
    };

    const formatNumber = (num) => {
      if (num === null || num === undefined || num === '') return '';
      const str = String(num).replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));
      const cleanStr = str.replace(/,/g, '');
      if (!isNaN(cleanStr) && cleanStr.trim() !== '') {
        return Number(cleanStr).toLocaleString('en-US');
      }
      return str;
    };

    const parseArabicNumeric = (str) => {
      if (!str && str !== 0) return '';
      const englishStr = String(str).replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/,/g, '');
      const parsed = parseFloat(englishStr);
      return isNaN(parsed) ? '' : parsed;
    };

    // --- STATUS CONFIG & HELPERS ---

      executed: { label: 'مشروع منفذ', badgeClass: 'bg-emerald-100 text-emerald-800 border-emerald-300', dotColor: 'bg-emerald-500', icon: '✅' },
      cancelled: { label: 'ملغى / لم ينفذ', badgeClass: 'bg-rose-100 text-rose-800 border-rose-300', dotColor: 'bg-rose-500', icon: '❌' }
    };

    const normalizeArabicText = (text) => {
      if (!text) return '';
      return String(text)
        .trim()
        .toLowerCase()
        .replace(/[أإآ]/g, 'ا')
        .replace(/ة/g, 'ه')
        .replace(/ى/g, 'ي')
        .replace(/[\u064B-\u065F]/g, '')
        .replace(/\s+/g, ' ');
    };

    const StatusBadge = ({ status = 'initial', className = '', onClick = null }) => {

        >
          <span className={`w-2 h-2 rounded-full ${cfg.dotColor}`}></span>
          <span>{cfg.label}</span>
        </span>
      );
    };

    // --- MIC INPUT COMPONENT ---
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const MicInput = ({ value, onValueChange, placeholder, isNumeric = false, className = '', disabled = false }) => {
      const [isListening, setIsListening] = useState(false);

      const startListening = () => {
        if (!SpeechRecognition) {
          alert('متصفحك لا يدعم الإدخال الصوتي.');
          return;
        }
        const recognition = new SpeechRecognition();
        recognition.lang = 'ar-EG';
        recognition.continuous = false;
        recognition.interimResults = false;

        recognition.onstart = () => setIsListening(true);
        recognition.onresult = (event) => {
          const transcript = event.results[0][0].transcript;
          if (isNumeric) {
            onValueChange(parseArabicNumeric(transcript));
          } else {
            onValueChange(transcript);
          }
        };
        recognition.onerror = () => setIsListening(false);
        recognition.onend = () => setIsListening(false);
        recognition.start();
      };

      return (
        <div className={`relative flex items-center ${className}`}>
          <input
            type={isNumeric ? "text" : "text"}
            inputMode={isNumeric ? "numeric" : "text"}
            value={isNumeric ? formatNumber(value) : value}
            onChange={(e) => isNumeric ? onValueChange(parseArabicNumeric(e.target.value)) : onValueChange(e.target.value)}
            className={`w-full rounded-md border border-gray-300 p-2.5 pl-10 text-sm focus:border-[#002f6c] focus:ring-1 focus:ring-[#002f6c] focus:outline-none transition-shadow ${isNumeric ? 'font-sans text-left' : 'text-right'} text-gray-900`}
            placeholder={placeholder}
            dir={isNumeric ? "ltr" : "rtl"}
            disabled={disabled}
          />
          {!disabled && <button
            type="button"
            onClick={startListening}
            className={`absolute left-2 p-1.5 rounded-full transition-colors ${isListening ? 'bg-red-100 text-red-600 animate-pulse' : 'text-gray-400 hover:text-[#002f6c] hover:bg-gray-100'}`}

          </button>}

    // --- DYNAMIC PROJECT DICTIONARY HELPERS ---
    // Loads user-defined project categories and aliases from localStorage / visits
    const PROJECT_DICT_STORAGE_KEY = 'anba_karas_project_dictionary_v1';

    const getStoredProjectDictionary = () => {
      try {
        const raw = localStorage.getItem(PROJECT_DICT_STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed) && parsed.length > 0) return parsed;
        }
      } catch (e) {
        console.error('Error loading project dictionary from storage:', e);
      }
      return null;
    };

    const saveStoredProjectDictionary = (dict) => {
      try {
        localStorage.setItem(PROJECT_DICT_STORAGE_KEY, JSON.stringify(dict));
      } catch (e) {
        console.error('Error saving project dictionary:', e);
      }
    };

    // Scans all visits to extract all raw project names entered in the app
    const extractAppProjectNames = (allVisits = []) => {
      const names = new Set();
      (allVisits || []).filter(v => !v.isDeleted).forEach(v => {
        (v.churches || []).forEach(ch => {
          (ch.servantsGroups || []).forEach(sg => {
            (sg.cases || []).forEach(c => {
              const t = (c.executedProjectType || c.projectType || '').trim();
              if (t) names.add(t);
            });
          });
        });
      });
      return Array.from(names).sort();
    };

    // Builds the effective dictionary from stored rules + any newly discovered project types from visits
    const buildEffectiveProjectDictionary = (allVisits = []) => {
      const stored = getStoredProjectDictionary() || [];
      const appProjects = extractAppProjectNames(allVisits);

      // Start with stored categories
      const dict = stored.map(cat => ({
        id: cat.id || uuidv4(),
        name: cat.name.trim(),
        aliases: Array.isArray(cat.aliases) ? cat.aliases.map(a => a.trim()).filter(Boolean) : []
      }));

      // Find any projects in the app that aren't mapped yet
      const mappedNormalized = new Set();
      dict.forEach(cat => {
        mappedNormalized.add(normalizeArabicText(cat.name));
        cat.aliases.forEach(a => mappedNormalized.add(normalizeArabicText(a)));
      });

      appProjects.forEach(rawName => {
        const norm = normalizeArabicText(rawName);
        if (!mappedNormalized.has(norm)) {
          // Add as its own project category
          dict.push({
            id: uuidv4(),
            name: rawName,
            aliases: []
          });
          mappedNormalized.add(norm);
        }
      });

      return dict;
    };

    // Given any raw project name (e.g. 'غنم' or 'ماعز'), returns the canonical project category name
    const resolveCanonicalProject = (rawName, dictionary = []) => {
      if (!rawName || !String(rawName).trim()) return 'غير محدد';
      const clean = String(rawName).trim();
      const norm = normalizeArabicText(clean);

      for (const cat of dictionary) {
        if (normalizeArabicText(cat.name) === norm) {
          return cat.name;
        }
        if (Array.isArray(cat.aliases)) {
          for (const alias of cat.aliases) {
            if (normalizeArabicText(alias) === norm) {
              return cat.name;
            }
          }
        }
      }
      return clean;
    };

    // --- SEARCHABLE SELECT / COMBOBOX COMPONENT ---
    const SearchableSelect = ({ label, value, onChange, options = [], placeholder = '\u0627\u0644\u0643\u0644' }) => {
      const [isOpen, setIsOpen] = useState(false);

      const filteredOptions = useMemo(() => {
        if (!searchTerm.trim()) return options;
        const norm = typeof normalizeArabicText === 'function' ? normalizeArabicText(searchTerm.trim()) : searchTerm.trim().toLowerCase();
        const words = norm.split(/\s+/).filter(Boolean);
        return options.filter(opt => {
          const normOpt = typeof normalizeArabicText === 'function' ? normalizeArabicText(String(opt)) : String(opt).toLowerCase();
          return words.every(w => normOpt.includes(w));
        });
      }, [options, searchTerm]);

      useEffect(() => {
        const handleClickOutside = (e) => {
          if (containerRef.current && !containerRef.current.contains(e.target)) {
            setIsOpen(false);
          }

        return () => document.removeEventListener('mousedown', handleClickOutside);
      }, []);

      const handleSelect = (val) => {

              <ChevronDown size={14} className={`transition-transform duration-200 ${isOpen ? 'rotate-180' : ''}`} />

          {isOpen && (

              <div className="p-2 border-b border-gray-100 bg-gray-50/90 sticky top-0 z-10">
                <div className="relative">
                  <input
                    type="text"
                    autoFocus
                    value={searchTerm}
                    onChange={e => setSearchTerm(e.target.value)}
                    placeholder={'\u0627\u0643\u062a\u0628 \u0644\u0644\u0628\u062d\u062b...'}
                    className="w-full text-xs sm:text-sm border border-gray-200 rounded-lg pr-7 pl-6 py-1.5 outline-none focus:border-[#002f6c] focus:ring-1 focus:ring-[#002f6c] bg-white text-gray-800 placeholder-gray-400"
                  />
                  <div className="absolute inset-y-0 right-0 pr-2 flex items-center pointer-events-none text-gray-400">
                    <Search size={13} />
                  </div>
                  {searchTerm && (
                    <button
                      type="button"
                      onClick={() => setSearchTerm('')}
                      className="absolute inset-y-0 left-0 pl-2 flex items-center text-gray-400 hover:text-red-500"
                      title={'\u0645\u0633\u062d'}
                    >
                      <X size={12} />

              <div className="overflow-y-auto max-h-56 divide-y divide-gray-50">
                <div

                {filteredOptions.length === 0 ? (
                  <div className="px-3 py-4 text-center text-gray-400 text-xs">
                    {'\u0644\u0627 \u062a\u0648\u062c\u062f \u0646\u062a\u0627\u0626\u062c \u0645\u0637\u0627\u0628\u0642\u0629'}
                  </div>
                ) : (
                  filteredOptions.map((opt, idx) => (
                    <div
                      key={opt + '-' + idx}
                      onClick={() => handleSelect(opt)}
                      className={`px-3 py-2 cursor-pointer hover:bg-blue-50 transition-colors flex items-center justify-between ${value === opt ? 'bg-blue-50 text-[#002f6c] font-bold' : 'text-gray-700'}`}
                    >
                      <span className="truncate">{opt}</span>
                      {value === opt && <span className="text-blue-600 font-bold">&#10003;</span>}

    };
// ================================================================
// MODULE: components/ToastsAndConfirms.js

    // --- GLOBAL TOAST & NOTIFICATION BUS ---
    const toastListeners = new Set();
    const confirmListeners = new Set();

    window.showToast = (message, type = 'info', duration = 3500) => {
      const id = Date.now() + Math.random().toString(36).substring(2, 7);
      toastListeners.forEach(fn => fn({ id, message, type, duration }));
    };
    window.notifySuccess = (msg) => window.showToast && window.showToast(msg, 'success');
    window.notifyError = (msg) => window.showToast && window.showToast(msg, 'error');
    window.notifyWarning = (msg) => window.showToast && window.showToast(msg, 'warning');
    window.notifyInfo = (msg) => window.showToast && window.showToast(msg, 'info');

    window.showConfirm = ({ title, message, confirmText = 'تأكيد', cancelText = 'إلغاء', isDangerous = false, onConfirm }) => {
      confirmListeners.forEach(fn => fn({ title, message, confirmText, cancelText, isDangerous, onConfirm }));
    };

    function ToastContainer() {
      const [toasts, setToasts] = useState([]);

      useEffect(() => {
        const handler = (newToast) => {
          setToasts(prev => [...prev, newToast]);
          setTimeout(() => {
            setToasts(prev => prev.filter(t => t.id !== newToast.id));
          }, newToast.duration || 3500);
        };
        toastListeners.add(handler);
        return () => toastListeners.delete(handler);
      }, []);

      const removeToast = (id) => setToasts(prev => prev.filter(t => t.id !== id));

      if (toasts.length === 0) return null;

      return (
        <div className="fixed top-4 left-4 sm:left-6 z-[99999] flex flex-col gap-2.5 max-w-sm w-full pointer-events-none">
          {toasts.map(t => {
            const isSuccess = t.type === 'success';
            const isError = t.type === 'error';
            const isWarning = t.type === 'warning';

            const bgClass = isSuccess 
              ? 'bg-emerald-800/95 border-emerald-400 text-white shadow-emerald-900/30' 
              : isError 
              ? 'bg-rose-800/95 border-rose-400 text-white shadow-rose-900/30' 
              : isWarning 
              ? 'bg-amber-800/95 border-amber-400 text-white shadow-amber-900/30' 
              : 'bg-[#002f6c]/95 border-blue-400 text-white shadow-blue-900/30';

            const icon = isSuccess ? '✅' : isError ? '❌' : isWarning ? '⚠️' : 'ℹ️';

            return (
              <div
                key={t.id}
                onClick={() => removeToast(t.id)}
                className={`pointer-events-auto rounded-2xl p-3.5 shadow-2xl border flex items-center gap-3 backdrop-blur-md transition-all duration-300 transform translate-y-0 opacity-100 cursor-pointer animate-fade-in ${bgClass}`}
              >
                <span className="text-xl shrink-0">{icon}</span>
                <div className="flex-1 text-xs font-bold leading-relaxed">{t.message}</div>
                <button
                  type="button"
                  onClick={(e) => { e.stopPropagation(); removeToast(t.id); }}
                  className="text-white/60 hover:text-white text-xs p-1"
                >
                  ✕
                </button>
              </div>
            );
          })}
        </div>
      );
    }

    function ConfirmDialogModal() {
      const [dialog, setDialog] = useState(null);

      useEffect(() => {
        const handler = (cfg) => setDialog(cfg);
        confirmListeners.add(handler);
        return () => confirmListeners.delete(handler);
      }, []);

      if (!dialog) return null;

      const handleConfirm = () => {
        const cb = dialog.onConfirm;
        setDialog(null);
        if (cb) cb();
      };

      const handleCancel = () => {
        setDialog(null);
      };

      return (
        <div className="fixed inset-0 z-[99999] bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 animate-fade-in">
          <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-gray-100 text-right space-y-4">

              <div className={`w-10 h-10 rounded-xl flex items-center justify-center text-xl shrink-0 ${dialog.isDangerous ? 'bg-rose-100 text-rose-600' : 'bg-blue-100 text-[#002f6c]'}`}>
                {dialog.isDangerous ? '⚠️' : '❓'}
              </div>
              <h3 className="font-bold text-base text-gray-900">{dialog.title || 'تأكيد الإجراء'}</h3>
            </div>
            <p className="text-xs sm:text-sm text-gray-600 leading-relaxed">{dialog.message}</p>
            <div className="flex justify-end gap-2.5 pt-3 border-t border-gray-100">
              <button
                type="button"
                onClick={handleCancel}
                className="px-4 py-2 text-xs font-bold text-gray-600 bg-gray-100 hover:bg-gray-200 rounded-xl transition-colors"
              >
                {dialog.cancelText || 'إلغاء'}
              </button>
              <button
                type="button"
                onClick={handleConfirm}
                className={`px-5 py-2 text-xs font-bold text-white rounded-xl shadow-sm transition-all ${
                  dialog.isDangerous 
                    ? 'bg-rose-600 hover:bg-rose-700' 
                    : 'bg-[#002f6c] hover:bg-[#001f4c]'
                }`}
              >
                {dialog.confirmText || 'تأكيد'}
              </button>
            </div>
          </div>
        </div>
      );
    }


    // --- EXPORT FUNCTION ---
    const handleExportExcel = (visitData, options = { scope: 'full', targetRegion: '', targetChurchId: '', targetChurchObj: null }) => {
        if (typeof XLSX === 'undefined') {
          alert('مكتبة الإكسيل غير متوفرة.');
          return;
        }
        
        const { scope, targetRegion, targetChurchId, targetChurchObj } = options;

        const aoa = [];
        const headers = [
            'مسلسل الكنيسة', 'مكان الزيارة', 'تاريخ الزيارة', 'اسم المنطقة',
            'اسم القرية', 'اسم الكنيسة', 'أسماء الخدام', 'اسم الحالة',
            'حالة المشروع', 'نوع المشروع', 'نوع المشروع المنفذ',
            'قيمة المشروع (مبدئي)', 'القيمة المنفذة فعلياً', 'قيمة القسط (مبدئي)', 'القسط المنفذ',
            'تاريخ التنفيذ', 'ملاحظات'
        ];
        
        aoa.push(headers);
        
        let grandTotalProjects = 0;
        let grandTotalApprovedValue = 0;
        let grandTotalExecutedValue = 0;
        let grandTotalApprovedInstallments = 0;
        let grandTotalExecutedInstallments = 0;
        
        let targetChurches = visitData.churches || [];
        if (scope === 'region') {
            targetChurches = targetChurches.filter(ch => ch.regionName === targetRegion);
        } else if (scope === 'church') {
            targetChurches = targetChurches.filter(ch => ch.id === targetChurchId);
        }

        targetChurches.forEach((churchLoc, index) => {
          let churchSerial = 1;
          let churchHasCases = false;
          (churchLoc.servantsGroups || []).forEach(sg => {
            (sg.cases || []).forEach(c => {
              churchHasCases = true;
              const isExec = c.status === 'executed';
              const statusLabel = STATUS_CONFIG[c.status || 'initial']?.label || 'موافقة مبدئية';
              const projectVal = parseArabicNumeric(c.projectValue) || 0;
              const execVal = isExec && c.executedProjectValue ? parseArabicNumeric(c.executedProjectValue) : (isExec ? projectVal : '');
              const instVal = parseArabicNumeric(c.installmentAmount) || 0;
              const execInstVal = isExec && c.executedInstallmentAmount ? parseArabicNumeric(c.executedInstallmentAmount) : (isExec ? instVal : '');
              const execType = isExec ? (c.executedProjectType || c.projectType) : '';
              const execDate = isExec ? (c.executionDate || '') : '';
              let fullNotes = c.notes || '';
              if (c.executionNotes) {
                fullNotes = fullNotes ? `${fullNotes} | ملاحظات التنفيذ: ${c.executionNotes}` : `ملاحظات التنفيذ: ${c.executionNotes}`;
              }

              aoa.push([
                churchSerial,
                visitData.location,
                visitData.date,
                churchLoc.regionName,
                churchLoc.villageName,
                churchLoc.churchName,
                sg.servantsNames,
                c.name,
                statusLabel,
                c.projectType,
                execType,
                projectVal,
                execVal,
                instVal,
                execInstVal,
                execDate,
                fullNotes
              ]);
              
              churchSerial++;
              grandTotalProjects++;
              grandTotalApprovedValue += projectVal;
              if (isExec && typeof execVal === 'number') grandTotalExecutedValue += execVal;
              grandTotalApprovedInstallments += instVal;
              if (isExec && typeof execInstVal === 'number') grandTotalExecutedInstallments += execInstVal;
            });
          });
          // Add a divider row if it's not the last church and this church had cases
          if (index < targetChurches.length - 1 && churchHasCases) {
              aoa.push(new Array(headers.length).fill('')); // separator
          }
        });

        if (aoa.length === 1) { // Only headers
          alert('لا توجد بيانات للتصدير.');
          return;
        }

        // Final Summary Row
        aoa.push([
          'الإجمالي',
          '', '', '', '', '', '', '', '', '',
          grandTotalProjects + ' مشروع',
          grandTotalApprovedValue,
          grandTotalExecutedValue,
          grandTotalApprovedInstallments,
          grandTotalExecutedInstallments,
          '', ''
        ]);

        const ws = XLSX.utils.aoa_to_sheet(aoa);

        const headerStyle = {
            fill: { fgColor: { rgb: "1E3A8A" } },
            font: { color: { rgb: "FFFFFF" }, bold: true, sz: 12 },
            alignment: { horizontal: "center", vertical: "center" },
            border: {
                top: {style: 'thin', color: {rgb: "000000"}},
                bottom: {style: 'thin', color: {rgb: "000000"}},
                left: {style: 'thin', color: {rgb: "000000"}},
                right: {style: 'thin', color: {rgb: "000000"}}
            }
        };

        const evenStyle = {
            fill: { fgColor: { rgb: "FFFFFF" } },
            font: { sz: 11 },
            border: {
                top: {style: 'thin', color: {rgb: "CBD5E1"}},
                bottom: {style: 'thin', color: {rgb: "CBD5E1"}},
                left: {style: 'thin', color: {rgb: "CBD5E1"}},
                right: {style: 'thin', color: {rgb: "CBD5E1"}}
            }
        };

        const oddStyle = {
            fill: { fgColor: { rgb: "F1F5F9" } },
            font: { sz: 11 },
            border: {
                top: {style: 'thin', color: {rgb: "CBD5E1"}},
                bottom: {style: 'thin', color: {rgb: "CBD5E1"}},
                left: {style: 'thin', color: {rgb: "CBD5E1"}},
                right: {style: 'thin', color: {rgb: "CBD5E1"}}
            }
        };

        const separatorStyle = {
            fill: { fgColor: { rgb: "E2E8F0" } },
            font: { bold: true }
        };

        const summaryStyle = {
            fill: { fgColor: { rgb: "FEF3C7" } },
            font: { bold: true, sz: 12, color: { rgb: "000000"} },
            border: {
                top: {style: 'thin', color: {rgb: "000000"}},
                bottom: {style: 'double', color: {rgb: "000000"}},
                left: {style: 'thin', color: {rgb: "CBD5E1"}},
                right: {style: 'thin', color: {rgb: "CBD5E1"}}
            }
        };

        const range = XLSX.utils.decode_range(ws['!ref']);
        
        const rightAlignCols = [1, 3, 4, 5, 6, 7, 9, 10, 16]; // Indices of columns to right align
        
        let dataRowIdx = 0;

        for (let R = range.s.r; R <= range.e.r; ++R) {
            let isSeparator = false;
            let isSummary = (R === range.e.r);
            
            if (R > 0 && !isSummary) {
                // Check if separator
                const firstCell = ws[XLSX.utils.encode_cell({r: R, c: 0})];
                if (!firstCell || firstCell.v === '') {
                    isSeparator = true;
                } else {
                    dataRowIdx++;
                }
            }

            for (let C = range.s.c; C <= range.e.c; ++C) {
                const cellRef = XLSX.utils.encode_cell({ r: R, c: C });
                if (!ws[cellRef]) ws[cellRef] = { t: 's', v: '' }; // create cell if it doesn't exist
                
                let cell = ws[cellRef];
                
                let currentStyle = {};
                if (R === 0) {
                    currentStyle = JSON.parse(JSON.stringify(headerStyle));
                } else if (isSummary) {
                    currentStyle = JSON.parse(JSON.stringify(summaryStyle));
                } else if (isSeparator) {
                    currentStyle = JSON.parse(JSON.stringify(separatorStyle));
                } else {
                    currentStyle = JSON.parse(JSON.stringify(dataRowIdx % 2 === 0 ? evenStyle : oddStyle));
                }
                
                if (R > 0) {
                   if (rightAlignCols.includes(C)) {
                       currentStyle.alignment = { horizontal: "right", vertical: "center" };
                   } else {
                       currentStyle.alignment = { horizontal: "center", vertical: "center" };
                   }
                }
                
                cell.s = currentStyle;
            }
        }

        // Set column widths explicitly
        ws['!cols'] = [
            { wch: 14 }, // A: مسلسل الكنيسة
            { wch: 20 }, // B: مكان الزيارة
            { wch: 14 }, // C: تاريخ الزيارة
            { wch: 16 }, // D: اسم المنطقة
            { wch: 16 }, // E: اسم القرية
            { wch: 24 }, // F: اسم الكنيسة
            { wch: 26 }, // G: أسماء الخدام
            { wch: 24 }, // H: اسم الحالة
            { wch: 18 }, // I: حالة المشروع
            { wch: 20 }, // J: نوع المشروع
            { wch: 20 }, // K: نوع المشروع المنفذ
            { wch: 18 }, // L: قيمة المشروع (مبدئي)
            { wch: 18 }, // M: القيمة المنفذة فعلياً
            { wch: 16 }, // N: قيمة القسط (مبدئي)
            { wch: 16 }, // O: القسط المنفذ
            { wch: 16 }, // P: تاريخ التنفيذ
            { wch: 32 }  // Q: ملاحظات
        ];
        
        ws['!views'] = [{ RTL: true }];

        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, 'الزيارة');

        const locationSafe = visitData.location ? visitData.location.replace(/\s+/g, '_') : 'بدون_اسم';
        let filename = `زيارة_${locationSafe}`;
        if (scope === 'region' && targetRegion) {
            filename += `_منطقة_${targetRegion.replace(/\s+/g, '_')}`;
        } else if (scope === 'church' && targetChurchObj) {
            filename += `_كنيسة_${targetChurchObj.churchName.replace(/\s+/g, '_')}_${targetChurchObj.regionName.replace(/\s+/g, '_')}`;
        }
        filename += `_${visitData.date}.xlsx`;

        XLSX.writeFile(wb, filename, { cellStyles: true });
    };

    // --- EXECUTION MODAL ---
// ================================================================
// MODULE: components/ExecutionModal.js
// ================================================================
    function ExecutionModal({ caseData, churchName, onSave, onClose }) {
      const [status, setStatus] = useState(caseData?.status || 'executed');
      const [executedProjectType, setExecutedProjectType] = useState(caseData?.executedProjectType || caseData?.projectType || '');
      const [executedProjectValue, setExecutedProjectValue] = useState(caseData?.executedProjectValue ?? caseData?.projectValue ?? '');
      const [executedInstallmentAmount, setExecutedInstallmentAmount] = useState(caseData?.executedInstallmentAmount ?? caseData?.installmentAmount ?? '');
      const [executionDate, setExecutionDate] = useState(caseData?.executionDate || new Date().toISOString().split('T')[0]);
      const [executionNotes, setExecutionNotes] = useState(caseData?.executionNotes || caseData?.notes || '');

      const handleSave = () => {
        onSave({
          ...caseData,
          status,
          executedProjectType: executedProjectType ? String(executedProjectType).trim() : '',
          executedProjectValue: parseArabicNumeric(executedProjectValue) || 0,
          executedInstallmentAmount: parseArabicNumeric(executedInstallmentAmount) || 0,
          executionDate,

            <div className="p-4 border-b border-gray-100 bg-[#002f6c] text-white flex justify-between items-center shrink-0">
              <div>
                <h3 className="font-bold text-lg flex items-center gap-2">
                  <Zap size={20} className="text-[#d4af37]" />
                  تحديث وتأكيد تنفيذ المشروع
                </h3>
                <p className="text-xs text-blue-200 mt-0.5">الحالة: {caseData?.name} {churchName ? `(${churchName})` : ''}</p>
              </div>
              <button onClick={onClose} className="text-white/80 hover:text-white p-1"><X size={20} /></button>

            <div className="p-5 space-y-4 overflow-y-auto flex-1">
              <div>
                <label className="block text-sm font-bold text-gray-700 mb-2">حالة المشروع</label>
                <div className="grid grid-cols-3 gap-2">
                  {Object.entries(STATUS_CONFIG).map(([key, cfg]) => (
                    <button
                      key={key}
                      type="button"
                      onClick={() => setStatus(key)}
                      className={`flex flex-col items-center justify-center p-2.5 rounded-lg border text-xs font-bold transition-all ${
                        status === key 
                          ? 'border-[#002f6c] bg-blue-50 text-[#002f6c] shadow-sm ring-2 ring-[#002f6c]/20'
                          : 'border-gray-200 hover:bg-gray-50 text-gray-600'
                      }`}
                    >
                      <span className="text-base mb-1">{cfg.icon}</span>
                      <span>{cfg.label}</span>
                    </button>
                  ))}
                </div>
              </div>

              {status === 'executed' && (
                <div className="bg-emerald-50/50 border border-emerald-200 rounded-xl p-4 space-y-4 animate-fade-in">
                  <div className="text-xs font-bold text-emerald-800 flex items-center gap-1.5">
                    <CheckCircle size={16} /> بيانات التنفيذ الفعلي على الأرض
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-gray-700 mb-1">نوع المشروع الفعلي</label>
                    <MicInput value={executedProjectType} onValueChange={setExecutedProjectType} placeholder="نوع المشروع بعد التنفيذ" />
                    {caseData?.projectType && caseData?.projectType !== executedProjectType && (
                      <p className="text-[11px] text-gray-500 mt-1">النوع المبدئي: {caseData.projectType}</p>
                    )}
                  </div>

                  <div className="grid grid-cols-2 gap-4">
                    <div>
                      <label className="block text-xs font-semibold text-gray-700 mb-1">قيمة المشروع الفعلية (ج.م)</label>
                      <MicInput isNumeric value={executedProjectValue} onValueChange={setExecutedProjectValue} placeholder="0" />
                      {caseData?.projectValue && (
                        <p className="text-[11px] text-gray-500 mt-1">المبدئي: {formatNumber(caseData.projectValue)} ج.م</p>
                      )}
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-gray-700 mb-1">قيمة القسط الفعلي (ج.م)</label>
                      <MicInput isNumeric value={executedInstallmentAmount} onValueChange={setExecutedInstallmentAmount} placeholder="0" />
                      {caseData?.installmentAmount && (
                        <p className="text-[11px] text-gray-500 mt-1">المبدئي: {formatNumber(caseData.installmentAmount)} ج.م</p>
                      )}
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-gray-700 mb-1">تاريخ التنفيذ الفعلي</label>
                    <input 
                      type="date" 
                      value={executionDate} 
                      onChange={e => setExecutionDate(e.target.value)} 
                      className="w-full rounded-md border border-gray-300 p-2 text-sm focus:border-[#002f6c] focus:ring-1 focus:ring-[#002f6c] outline-none font-sans"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-gray-700 mb-1">ملاحظات مسؤول القرية بعد التنفيذ</label>
                    <MicInput value={executionNotes} onValueChange={setExecutionNotes} placeholder="أي ملاحظات إضافية حول التنفيذ..." />
                  </div>
                </div>
              )}

              {status === 'cancelled' && (
                <div className="bg-rose-50 border border-rose-200 rounded-xl p-4 space-y-3 animate-fade-in">
                  <label className="block text-xs font-semibold text-rose-800 mb-1">سبب إلغاء أو عدم تنفيذ المشروع</label>
                  <MicInput value={executionNotes} onValueChange={setExecutionNotes} placeholder="اكتب سبب عدم التنفيذ..." />

            <div className="p-4 border-t border-gray-100 bg-gray-50 flex justify-end gap-2 shrink-0">

              <button onClick={handleSave} className="px-6 py-2 rounded-md text-sm font-medium text-white bg-[#002f6c] hover:bg-[#001f4c] transition-colors shadow-sm">
