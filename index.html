    // --- PAGE 1: ACTIVE VISIT ENTRY ---
    function ActiveVisitForm({ data, updateData, onEndVisit, onExport }) {
      const [editingCaseInfo, setEditingCaseInfo] = useState(null);
      const [executingCaseInfo, setExecutingCaseInfo] = useState(null);
      const [showImportModal, setShowImportModal] = useState(false);
      const [filterStatus, setFilterStatus] = useState('all'); // 'all' | 'initial' | 'executed' | 'cancelled'

      const [filterRegion, setFilterRegion] = useState('');
      const [filterChurch, setFilterChurch] = useState('');
      const [filterServant, setFilterServant] = useState('');
      const [filterProject, setFilterProject] = useState('');
      const [filterCase, setFilterCase] = useState('');
      const [expandedRegions, setExpandedRegions] = useState({});
      const [expandedChurches, setExpandedChurches] = useState({});
      const toggleRegion = (regionName) => {
          setExpandedRegions(prev => ({ ...prev, [regionName]: !prev[regionName] }));
      };

      const uniqueRegions = Array.from(new Set((data.churches||[]).map(ch => ch.regionName).filter(Boolean))).sort();
      const uniqueChurches = Array.from(new Set((data.churches||[]).filter(ch => !filterRegion || ch.regionName === filterRegion).map(ch => ch.churchName).filter(Boolean))).sort();
      const uniqueServants = Array.from(new Set((data.churches||[]).flatMap(ch => (ch.servantsGroups || []).map(sg => sg.servantsNames)).filter(Boolean))).sort();
      const uniqueProjects = Array.from(new Set((data.churches||[]).flatMap(ch => (ch.servantsGroups || []).flatMap(sg => (sg.cases || []).map(c => c.projectType))).filter(Boolean))).sort();
      const uniqueCases = Array.from(new Set((data.churches||[]).flatMap(ch => (ch.servantsGroups || []).flatMap(sg => (sg.cases || []).map(c => c.name))).filter(Boolean))).sort();

      let filteredChurches = (data.churches || []).map(ch => {
          if (filterRegion && ch.regionName !== filterRegion) return null;
          if (filterChurch && ch.churchName !== filterChurch) return null;
          
          const filteredGroups = (ch.servantsGroups || []).map(sg => {
              if (filterServant && sg.servantsNames !== filterServant) return null;
              
              const filteredCases = (sg.cases || []).filter(c => {
                  if (filterStatus !== 'all' && (c.status || 'initial') !== filterStatus) return false;
                  if (filterProject && c.projectType !== filterProject) return false;
                  if (filterCase && c.name !== filterCase) return false;
                  return true;
              });
              
              if (filteredCases.length === 0 && (filterStatus !== 'all' || filterProject || filterCase)) return null;
              return { ...sg, cases: filteredCases };
          }).filter(Boolean);
          
          if (filteredGroups.length === 0 && (filterStatus !== 'all' || filterServant || filterProject || filterCase)) return null;
          return { ...ch, servantsGroups: filteredGroups };
      }).filter(Boolean);

      // Compute Church Serials
      const serialMap = {};
      (data.churches || []).forEach(churchLoc => {
        let churchS = 1;
        (churchLoc.servantsGroups || []).forEach(sg => {
          (sg.cases || []).forEach(c => {
            serialMap[c.id] = churchS++;
          });
        });
      });

      const toggleChurch = (id) => setExpandedChurches(prev => ({...prev, [id]: !prev[id]}));
      const handleAddChurch = () => {
        const newChurch = {
          id: uuidv4(), regionName: '', villageName: '', churchName: '',
          servantsGroups: [{ id: uuidv4(), servantsNames: '', cases: [] }]
        };
        updateData(prev => ({ ...prev, churches: [newChurch, ...(prev.churches || [])] }));
        setExpandedChurches(prev => ({ ...prev, [newChurch.id]: true }));
      };

      const handleUpdateChurch = (updatedChurch) => {
        updateData(prev => ({
          ...prev, churches: prev.churches.map(ch => ch.id === updatedChurch.id ? updatedChurch : ch)
        }));
      };

      const handleDeleteChurch = (id) => {
        if(confirm('هل أنت متأكد من حذف بيانات هذه الكنيسة بالكامل؟')) {
          updateData(prev => ({ ...prev, churches: prev.churches.filter(ch => ch.id !== id) }));
        }
      };

      const handleAddGroup = (churchId) => {
        updateData(prev => ({
          ...prev, churches: prev.churches.map(ch => ch.id === churchId ? {
            ...ch, servantsGroups: [...ch.servantsGroups, { id: uuidv4(), servantsNames: '', cases: [] }]
          } : ch)
        }));
      };

      const handleUpdateGroup = (churchId, updatedGroup) => {
        updateData(prev => ({
          ...prev, churches: prev.churches.map(ch => ch.id === churchId ? {
            ...ch, servantsGroups: ch.servantsGroups.map(sg => sg.id === updatedGroup.id ? updatedGroup : sg)
          } : ch)
        }));
      };

      const handleDeleteGroup = (churchId, groupId) => {
        updateData(prev => ({
          ...prev, churches: prev.churches.map(ch => ch.id === churchId ? {
            ...ch, servantsGroups: ch.servantsGroups.filter(sg => sg.id !== groupId)
          } : ch)
        }));
      };

      const handleEditCase = (caseObj, churchId, groupId) => {
        setEditingCaseInfo({ caseObj, churchId, groupId });
      };

      const handleSaveEditCase = (updatedCase) => {
        const { churchId, groupId } = editingCaseInfo;
        updateData(prev => ({
          ...prev, churches: prev.churches.map(ch => ch.id === churchId ? {
            ...ch, servantsGroups: ch.servantsGroups.map(sg => sg.id === groupId ? {
              ...sg, cases: sg.cases.map(c => c.id === updatedCase.id ? updatedCase : c)
            } : sg)
          } : ch)
        }));
        setEditingCaseInfo(null);
      };

      const handleSaveExecutionCase = (updatedCase) => {
        const { churchId, groupId } = executingCaseInfo;
        updateData(prev => ({
          ...prev, churches: prev.churches.map(ch => ch.id === churchId ? {
            ...ch, servantsGroups: ch.servantsGroups.map(sg => sg.id === groupId ? {
              ...sg, cases: sg.cases.map(c => c.id === updatedCase.id ? updatedCase : c)
            } : sg)
          } : ch)
        }));
        setExecutingCaseInfo(null);
      };

      const handleApplyExcelUpdates = (selectedMatches, execDate) => {
        updateData(prev => {
          const updatedChurches = (prev.churches || []).map(ch => ({
            ...ch,
            servantsGroups: (ch.servantsGroups || []).map(sg => ({
              ...sg,
              cases: (sg.cases || []).map(c => {
                const match = selectedMatches.find(m => m.existing.caseObj.id === c.id);
                if (match) {
                  return {
                    ...c,
                    status: 'executed',
                    executedProjectType: match.excelData.projectType || c.projectType,
                    executedProjectValue: match.excelData.projectValue || c.projectValue,
                    executedInstallmentAmount: match.excelData.installmentAmount || c.installmentAmount,
                    executionDate: execDate || new Date().toISOString().split('T')[0],
                    executionNotes: match.excelData.notes || c.notes || ''
                  };
                }
                return c;
              })
            }))
          }));
          return { ...prev, churches: updatedChurches };
        });
        alert(`تم بنجاح تحديث وتأكيد تنفيذ ${selectedMatches.length} حالة!`);
      };

      const handleDeleteCase = (caseId, churchId, groupId) => {
        if (!confirm('هل أنت متأكد من حذف هذه الحالة؟')) return;
        updateData(prev => ({
          ...prev, churches: prev.churches.map(ch => ch.id === churchId ? {
            ...ch, servantsGroups: ch.servantsGroups.map(sg => sg.id === groupId ? {
              ...sg, cases: sg.cases.filter(c => c.id !== caseId)
            } : sg)
          } : ch)
        }));
      };

      return (
        <div className="animate-fade-in">
          <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4">
             <h2 className="text-2xl font-bold text-[#002f6c] flex items-center gap-2">
               <Edit2 size={24} className="text-[#d4af37]" /> تسجيل الزيارة والمشاريع
             </h2>
             <div className="flex flex-wrap gap-2 w-full sm:w-auto">
                {!isReadOnly && (
                  <button onClick={() => setShowImportModal(true)} className="flex-1 sm:flex-none flex items-center justify-center gap-1.5 bg-emerald-600 text-white hover:bg-emerald-700 px-4 py-2 rounded-md font-medium shadow-sm transition-colors text-sm">
                    <Upload size={18} /> استيراد كشف التنفيذ
                  </button>
                )}
                <button onClick={() => onExport && onExport(data)} className="flex-1 sm:flex-none flex items-center justify-center gap-1.5 bg-white border border-[#d4af37] text-[#8a7222] hover:bg-[#fff9e6] px-4 py-2 rounded-md font-medium transition-colors text-sm">
                  <Download size={18} /> تصدير
                </button>
                {!isReadOnly && (
                  <button onClick={onEndVisit} className="flex-1 sm:flex-none flex items-center justify-center gap-1.5 bg-[#002f6c] text-white hover:bg-[#001f4c] px-4 py-2 rounded-md font-medium shadow-md transition-colors text-sm">
                    <CheckCircle size={18} /> حفظ وإنهاء
                  </button>
                )}
             </div>
          </div>

          <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-6 mb-8">
            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
              <div>
                <label className="block text-sm font-medium text-gray-700 mb-1">مكان الزيارة</label>
                <MicInput value={data.location} onValueChange={(v) => updateData(p => ({...p, location: v}))} placeholder="أدخل مكان الزيارة" />
              </div>
              <div>
                <label className="block text-sm font-medium text-gray-700 mb-1">تاريخ الزيارة</label>
                <input type="date" value={data.date} onChange={(e) => updateData(p => ({...p, date: e.target.value}))} className="w-full rounded-md border border-gray-300 p-2.5 text-sm focus:border-[#002f6c] focus:ring-1 focus:ring-[#002f6c] focus:outline-none transition-shadow text-gray-900 font-sans" />
              </div>
            </div>
          </div>

          {/* OVERALL VISIT SUMMARY BAR */}
          {(() => {
              let totalProjects = 0;
              let totalApprovedValue = 0;
              let totalExecutedValue = 0;
              let executedProjectsCount = 0;
              let totalInstallments = 0;
              let totalGroups = 0;
              let totalChurches = filteredChurches.length;
              
              filteredChurches.forEach(ch => {
                  totalGroups += (ch.servantsGroups || []).length;
                  (ch.servantsGroups || []).forEach(sg => {
                      (sg.cases || []).forEach(c => {
                          totalProjects++;
                          const val = parseFloat(c.projectValue) || 0;
                          const execVal = parseFloat(c.executedProjectValue) || val;
                          const inst = parseFloat(c.installmentAmount) || 0;
                          const execInst = parseFloat(c.executedInstallmentAmount) || inst;
                          
                          totalApprovedValue += val;
                          if (c.status === 'executed') {
                            executedProjectsCount++;
                            totalExecutedValue += execVal;
                            totalInstallments += execInst;
                          } else {
                            totalInstallments += inst;
                          }
                      });
                  });
              });

              return (
                 <div className="bg-[#002f6c]/5 rounded-xl border border-[#002f6c]/20 p-4 mb-6 flex flex-wrap gap-4 items-center justify-between">
                     <div className="flex flex-wrap gap-3 items-center">
                        <div className="bg-white px-3.5 py-2 rounded-lg shadow-sm border border-gray-100 flex items-center gap-2">
                           <span className="text-lg">👥</span>
                           <div className="flex flex-col">
                              <span className="text-[11px] text-gray-500 font-medium">مجموعات الخدام</span>
                              <span className="font-bold text-blue-600 text-sm"><span className="font-sans">{formatNumber(totalGroups)}</span> مجموعة</span>
                           </div>
                        </div>
                        <div className="bg-white px-3.5 py-2 rounded-lg shadow-sm border border-gray-100 flex items-center gap-2">
                           <span className="text-lg">📊</span>
                           <div className="flex flex-col">
                              <span className="text-[11px] text-gray-500 font-medium">إجمالي الحالات</span>
                              <span className="font-bold text-[#002f6c] text-sm"><span className="font-sans">{formatNumber(totalProjects)}</span> مشروع</span>
                           </div>
                        </div>
                        <div className="bg-white px-3.5 py-2 rounded-lg shadow-sm border border-amber-200 bg-amber-50/40 flex items-center gap-2">
                           <span className="text-lg">⏳</span>
                           <div className="flex flex-col">
                              <span className="text-[11px] text-amber-800 font-medium">موافقة مبدئية</span>
                              <span className="font-bold text-amber-700 text-sm"><span className="font-sans">{formatNumber(totalApprovedValue)}</span> ج.م</span>
                           </div>
                        </div>
                        <div className="bg-white px-3.5 py-2 rounded-lg shadow-sm border border-emerald-200 bg-emerald-50/40 flex items-center gap-2">
                           <span className="text-lg">✅</span>
                           <div className="flex flex-col">
                              <span className="text-[11px] text-emerald-800 font-medium">المنفذ فعلياً ({formatNumber(executedProjectsCount)})</span>
                              <span className="font-bold text-emerald-700 text-sm"><span className="font-sans">{formatNumber(totalExecutedValue)}</span> ج.م</span>
                           </div>
                        </div>
                        <div className="bg-white px-3.5 py-2 rounded-lg shadow-sm border border-gray-100 flex items-center gap-2">
                           <span className="text-lg">💸</span>
                           <div className="flex flex-col">
                              <span className="text-[11px] text-gray-500 font-medium">إجمالي الأقساط</span>
                              <span className="font-bold text-[#8a7222] text-sm"><span className="font-sans">{formatNumber(totalInstallments)}</span> ج.م</span>
                           </div>
                        </div>
                     </div>
                     <div className="bg-[#002f6c] text-white px-4 py-2 rounded-lg shadow-sm flex items-center gap-2">
                        <span className="text-xl">⛪</span>
                        <div className="flex flex-col">
                           <span className="text-xs text-blue-200 font-medium">عدد الكنائس</span>
                           <span className="font-bold"><span className="font-sans">{formatNumber(totalChurches)}</span> كنيسة</span>
                        </div>
                     </div>
                 </div>
              );
          })()}

          {/* STATUS NAVIGATION TABS */}
          {(() => {
              let all = 0, initial = 0, executed = 0, cancelled = 0;
              (data.churches || []).forEach(ch => {
                (ch.servantsGroups || []).forEach(sg => {
                  (sg.cases || []).forEach(c => {
                    all++;
                    const st = c.status || 'initial';
                    if (st === 'executed') executed++;
                    else if (st === 'cancelled') cancelled++;
                    else initial++;
                  });
                });
              });

              return (
                <div className="flex flex-wrap items-center gap-2 mb-6 bg-white p-2 rounded-xl shadow-sm border border-gray-200">
                  <button
                    type="button"
                    onClick={() => setFilterStatus('all')}
                    className={`flex items-center gap-2 px-4 py-2.5 rounded-lg text-sm font-bold transition-all ${
                      filterStatus === 'all'
                        ? 'bg-[#002f6c] text-white shadow-md'
                        : 'text-gray-600 hover:bg-gray-100'
                    }`}
                  >
                    <span>🌐 كل المشاريع</span>
                    <span className={`px-2 py-0.5 rounded-full text-xs font-sans ${filterStatus === 'all' ? 'bg-white/20 text-white' : 'bg-gray-200 text-gray-700'}`}>
                      {formatNumber(all)}
                    </span>
                  </button>

                  <button
                    type="button"
                    onClick={() => setFilterStatus('initial')}
                    className={`flex items-center gap-2 px-4 py-2.5 rounded-lg text-sm font-bold transition-all ${
                      filterStatus === 'initial'
                        ? 'bg-amber-600 text-white shadow-md'
                        : 'text-amber-800 hover:bg-amber-50'
                    }`}
                  >
                    <span>⏳ موافقة مبدئية</span>
                    <span className={`px-2 py-0.5 rounded-full text-xs font-sans ${filterStatus === 'initial' ? 'bg-white/20 text-white' : 'bg-amber-100 text-amber-900'}`}>
                      {formatNumber(initial)}
                    </span>
                  </button>

                  <button
                    type="button"
                    onClick={() => setFilterStatus('executed')}
                    className={`flex items-center gap-2 px-4 py-2.5 rounded-lg text-sm font-bold transition-all ${
                      filterStatus === 'executed'
                        ? 'bg-emerald-600 text-white shadow-md'
                        : 'text-emerald-800 hover:bg-emerald-50'
                    }`}
                  >
                    <span>✅ مشاريع منفذة</span>
                    <span className={`px-2 py-0.5 rounded-full text-xs font-sans ${filterStatus === 'executed' ? 'bg-white/20 text-white' : 'bg-emerald-100 text-emerald-900'}`}>
                      {formatNumber(executed)}
                    </span>
                  </button>

                  <button
                    type="button"
                    onClick={() => setFilterStatus('cancelled')}
                    className={`flex items-center gap-2 px-4 py-2.5 rounded-lg text-sm font-bold transition-all ${
                      filterStatus === 'cancelled'
                        ? 'bg-red-600 text-white shadow-md'
                        : 'text-red-700 hover:bg-red-50'
                    }`}
                  >
                    <span>❌ لم تُنفّذ / ملغاة</span>
                    <span className={`px-2 py-0.5 rounded-full text-xs font-sans ${filterStatus === 'cancelled' ? 'bg-white/20 text-white' : 'bg-red-100 text-red-800'}`}>
                      {formatNumber(cancelled)}
                    </span>
                  </button>
                </div>
              );
          })()}

          {/* ADVANCED FILTERS */}
          <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-5 mb-6">
             <div className="flex justify-between items-center mb-4 border-b border-gray-50 pb-2">
                <h4 className="text-sm font-bold text-gray-700 flex items-center gap-2"><Search size={16} className="text-[#002f6c]"/> تصفية متقدمة</h4>
                {(filterRegion || filterChurch || filterServant || filterProject || filterCase) && (
                   <button onClick={() => { setFilterRegion(''); setFilterChurch(''); setFilterServant(''); setFilterProject(''); setFilterCase(''); }} className="text-xs flex items-center gap-1 text-red-500 hover:text-red-700 bg-red-50 hover:bg-red-100 px-3 py-1.5 rounded-md transition-colors font-medium">
                       <RotateCcw size={14}/> إعادة ضبط الفلاتر
                   </button>
                )}
             </div>
             <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4">
                <div>
                   <label className="block text-xs font-medium text-gray-500 mb-1">قائمة المناطق</label>
                   <select value={filterRegion} onChange={e => { setFilterRegion(e.target.value); setFilterChurch(''); }} className="w-full text-sm border border-gray-200 rounded-md focus:border-[#002f6c] focus:ring-1 focus:ring-[#002f6c] py-2 px-3 outline-none text-gray-700 bg-gray-50 hover:bg-white transition-colors cursor-pointer">
                      <option value="">كل المناطق</option>
                      {uniqueRegions.map(opt => <option key={opt} value={opt}>{opt}</option>)}
                   </select>
                </div>
                <div>
                   <label className="block text-xs font-medium text-gray-500 mb-1">قائمة الكنائس</label>
                   <select value={filterChurch} onChange={e => setFilterChurch(e.target.value)} className="w-full text-sm border border-gray-200 rounded-md focus:border-[#002f6c] focus:ring-1 focus:ring-[#002f6c] py-2 px-3 outline-none text-gray-700 bg-gray-50 hover:bg-white transition-colors cursor-pointer">
                      <option value="">كل الكنائس</option>
                      {uniqueChurches.map(opt => <option key={opt} value={opt}>{opt}</option>)}
                   </select>
                </div>
                <div>
                   <label className="block text-xs font-medium text-gray-500 mb-1">قائمة الخدام</label>
                   <select value={filterServant} onChange={e => setFilterServant(e.target.value)} className="w-full text-sm border border-gray-200 rounded-md focus:border-[#002f6c] focus:ring-1 focus:ring-[#002f6c] py-2 px-3 outline-none text-gray-700 bg-gray-50 hover:bg-white transition-colors cursor-pointer">
                      <option value="">كل الخدام</option>
                      {uniqueServants.map(opt => <option key={opt} value={opt}>{opt}</option>)}
                   </select>
                </div>
                <div>
                   <label className="block text-xs font-medium text-gray-500 mb-1">قائمة أنواع المشاريع</label>
                   <select value={filterProject} onChange={e => setFilterProject(e.target.value)} className="w-full text-sm border border-gray-200 rounded-md focus:border-[#002f6c] focus:ring-1 focus:ring-[#002f6c] py-2 px-3 outline-none text-gray-700 bg-gray-50 hover:bg-white transition-colors cursor-pointer">
                      <option value="">كل المشاريع</option>
                      {uniqueProjects.map(opt => <option key={opt} value={opt}>{opt}</option>)}
                   </select>
                </div>
                <div>
                   <label className="block text-xs font-medium text-gray-500 mb-1">قائمة الحالات</label>
                   <select value={filterCase} onChange={e => setFilterCase(e.target.value)} className="w-full text-sm border border-gray-200 rounded-md focus:border-[#002f6c] focus:ring-1 focus:ring-[#002f6c] py-2 px-3 outline-none text-gray-700 bg-gray-50 hover:bg-white transition-colors cursor-pointer">
                      <option value="">كل الحالات</option>
                      {uniqueCases.map(opt => <option key={opt} value={opt}>{opt}</option>)}
                   </select>
                </div>
                          </div>
          </div>
          
          <div className="mb-6 flex flex-col sm:flex-row justify-between items-start sm:items-end gap-4">
            <h3 className="text-lg font-bold text-gray-800">الكنائس والمناطق ({formatNumber((data.churches||[]).length)})</h3>
            {!isReadOnly && <button onClick={handleAddChurch} className="flex items-center gap-1.5 bg-[#002f6c] text-white hover:bg-[#001f4c] px-4 py-2 rounded-md text-sm font-medium shadow-sm transition-colors">
              <Plus size={16} /> إضافة كنيسة/منطقة
            </button>}
          </div>

          {(data.churches || []).length === 0 ? (
            <div className="text-center py-16 bg-white rounded-xl border border-dashed border-gray-300">
              <MapPin size={48} className="mx-auto text-gray-300 mb-3" />
              <p className="text-gray-500 font-medium text-lg">لم يتم إضافة أي كنائس بعد</p>
              <p className="text-gray-400 text-sm mt-1">اضغط على زر إضافة كنيسة للبدء في التسجيل</p>
            </div>
          ) : (
            <div className="space-y-8">
              {(() => {
                if (filteredChurches.length === 0 && (filterChurch || filterServant || filterProject || filterCase)) {
                    return (
                        <div className="text-center py-12 bg-white rounded-xl border border-gray-100">
                           <Search size={48} className="mx-auto text-gray-200 mb-3" />
                           <p className="text-gray-500 font-medium text-lg">لا توجد نتائج مطابقة للبحث</p>
                        </div>
                    );
                }

                const groupedByRegion = filteredChurches.reduce((acc, ch) => {
                    const r = ch.regionName || 'منطقة غير محددة';
                    if(!acc[r]) acc[r] = [];
                    acc[r].push(ch);
                    return acc;
                }, {});
                
                return Object.entries(groupedByRegion).map(([regionName, churchesInRegion]) => {
                    const regionStats = churchesInRegion.reduce((acc, ch) => {
                        const s = getChurchStats(ch);
                        acc.totalChurches += 1;
                        acc.totalGroups += s.totalGroups;
                        acc.totalCases += s.totalCases;
                        acc.totalValue += s.totalValue;
                        acc.totalInst += s.totalInst;
                        return acc;
                    }, {totalChurches: 0, totalGroups: 0, totalCases: 0, totalValue: 0, totalInst: 0});
                    
                    return (
                        <div key={regionName} className="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden mb-6">
                            <div className="p-4 sm:p-5 border-b border-gray-200 bg-[#002f6c]/10 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 cursor-pointer hover:bg-[#002f6c]/20 transition-colors" onClick={() => toggleRegion(regionName)}>
                                <div className="flex-1 flex flex-wrap items-center gap-2 text-sm sm:text-base font-bold text-[#002f6c]">
                                    <span className="text-lg">🏛️ {regionName}</span>
                                    <div className="mr-auto flex flex-wrap gap-2 items-center">
                                       <span className="bg-white text-[#002f6c] border border-[#002f6c]/30 px-3 py-1 rounded-full text-xs font-bold shadow-sm whitespace-nowrap">
                                          ⛪ <span className="font-sans">{formatNumber(regionStats.totalChurches)}</span> كنائس
                                       </span>
                                       <span className="bg-white text-blue-600 border border-blue-200 px-3 py-1 rounded-full text-xs font-bold shadow-sm whitespace-nowrap">
                                          👥 <span className="font-sans">{formatNumber(regionStats.totalGroups)}</span> مجموعات
                                       </span>
                                       <span className="bg-white text-[#d4af37] border border-[#d4af37]/30 px-3 py-1 rounded-full text-xs font-bold shadow-sm whitespace-nowrap">
                                          📊 <span className="font-sans">{formatNumber(regionStats.totalCases)}</span> مشاريع
                                       </span>
                                       <span className="bg-white text-green-700 border border-green-200 px-3 py-1 rounded-full text-xs font-bold shadow-sm whitespace-nowrap">
                                          💰 <span className="font-sans">{formatNumber(regionStats.totalValue)}</span> ج.م
                                       </span>
                                    </div>
                                </div>
                                <div className="text-gray-500">
                                   {expandedRegions[regionName] ? <ChevronUp size={24} /> : <ChevronDown size={24} />}
                                </div>
                            </div>
                            
                            {expandedRegions[regionName] && (
                                <div className="p-4 sm:p-5 space-y-6 bg-gray-50/50">
                                    {churchesInRegion.map((churchLoc) => (
                                        <div key={churchLoc.id} className="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                  {/* Accordion Header */}
                  <div 
                    className="p-4 sm:p-5 border-b border-gray-200 bg-[#002f6c]/5 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 cursor-pointer hover:bg-[#002f6c]/10 transition-colors"
                    onClick={() => toggleChurch(churchLoc.id)}
                  >
                    <div className="flex-1 flex flex-wrap items-center gap-2 text-sm sm:text-base font-bold text-[#002f6c]">
                      <span>{churchLoc.regionName || 'منطقة غير محددة'}</span>
                      <span className="text-gray-400">-</span>
                      <span>{churchLoc.villageName || 'قرية غير محددة'}</span>
                      <span className="text-gray-400">-</span>
                      <span>{churchLoc.churchName || 'كنيسة غير محددة'}</span>
                      {(() => {
                         const stats = getChurchStats(churchLoc);
                         return (
                           <div className="mr-auto flex flex-wrap gap-2 items-center">
                              <span className="bg-white text-blue-600 border border-blue-200 px-3 py-1 rounded-full text-xs font-bold shadow-sm whitespace-nowrap">
                                 👥 <span className="font-sans">{formatNumber(stats.totalGroups)}</span> مجموعة
                              </span>
                              <span className="bg-white text-[#d4af37] border border-[#d4af37]/30 px-3 py-1 rounded-full text-xs font-bold shadow-sm whitespace-nowrap">
                                 📊 <span className="font-sans">{formatNumber(stats.totalCases)}</span> مشاريع
                              </span>
                              <span className="bg-white text-green-700 border border-green-200 px-3 py-1 rounded-full text-xs font-bold shadow-sm whitespace-nowrap">
                                 💰 <span className="font-sans">{formatNumber(stats.totalValue)}</span> ج.م
                              </span>
                              <span className="bg-white text-[#8a7222] border border-[#f0e0a8] px-3 py-1 rounded-full text-xs font-bold shadow-sm whitespace-nowrap hidden sm:inline-block">
                                 💸 <span className="font-sans">{formatNumber(stats.totalInst)}</span> ج.م
                              </span>
                           </div>
                         );
                      })()}
                    </div>
                    <div className="flex items-center gap-2">
                       {!isReadOnly && <button onClick={(e) => { e.stopPropagation(); handleDeleteChurch(churchLoc.id); }} className="text-red-500 hover:text-red-700 hover:bg-red-50 p-2 rounded-md transition-colors" title="حذف الكنيسة"><Trash2 size={20}/></button>}
                       <div className="text-gray-500">
                          {expandedChurches[churchLoc.id] ? <ChevronUp size={24} /> : <ChevronDown size={24} />}
                       </div>
                    </div>
                  </div>
                  
                  {/* Accordion Body */}
                  {expandedChurches[churchLoc.id] && (
                    <div className="animate-fade-in border-t-2 border-[#002f6c]">
                      {/* Edit Fields */}
                      <div className="p-4 sm:p-5 bg-gray-50 border-b border-gray-200 flex-1 w-full grid grid-cols-1 sm:grid-cols-3 gap-4">
                        <div><label className="block text-xs font-medium text-[#002f6c] mb-1">المنطقة</label><MicInput value={churchLoc.regionName||''} onValueChange={(v) => handleUpdateChurch({...churchLoc, regionName: v})} placeholder="اسم المنطقة" disabled={isReadOnly} /></div>
                        <div><label className="block text-xs font-medium text-[#002f6c] mb-1">القرية</label><MicInput value={churchLoc.villageName||''} onValueChange={(v) => handleUpdateChurch({...churchLoc, villageName: v})} placeholder="اسم القرية" disabled={isReadOnly} /></div>
                        <div><label className="block text-xs font-medium text-[#002f6c] mb-1">الكنيسة</label><MicInput value={churchLoc.churchName||''} onValueChange={(v) => handleUpdateChurch({...churchLoc, churchName: v})} placeholder="اسم الكنيسة" disabled={isReadOnly} /></div>
                      </div>
                      
                      <div className="p-4 sm:p-5 space-y-6">
                        {(churchLoc.servantsGroups || []).map(group => (
                          <ServantsGroupView 
                            key={group.id} 
                            group={group} 
                            churchId={churchLoc.id} 
                            onUpdateGroup={handleUpdateGroup} 
                            onDeleteGroup={handleDeleteGroup} 
                            serialMap={serialMap} 
                            onEditCase={handleEditCase} 
                            onDeleteCase={handleDeleteCase}
                            onExecuteCase={(caseObj, chId, grpId) => setExecutingCaseInfo({ caseObj, churchId: chId, groupId: grpId, churchName: churchLoc.churchName })}
                          />
                        ))}
                        <div className="flex justify-center">
                          {!isReadOnly && <button onClick={() => handleAddGroup(churchLoc.id)} className="flex items-center gap-2 bg-gray-50 hover:bg-gray-100 text-[#002f6c] text-sm font-medium py-2 px-5 rounded-md transition-colors border border-gray-300 border-dashed">
                            <Plus size={16} /> إضافة خدام آخرين لنفس الكنيسة
                          </button>}
                        </div>
                      </div>
                    </div>
                  )}
                </div>
              ))}
                                </div>
                            )}
                        </div>
                    );
                });
            })()}
            </div>
          )}

          {editingCaseInfo && <CaseModal caseData={editingCaseInfo.caseObj} onSave={handleSaveEditCase} onClose={() => setEditingCaseInfo(null)} />}
          {executingCaseInfo && (
            <ExecutionModal 
              caseData={executingCaseInfo.caseObj} 
              churchName={executingCaseInfo.churchName} 
              onSave={handleSaveExecutionCase} 
              onClose={() => setExecutingCaseInfo(null)} 
            />
          )}
          {showImportModal && (
            <ExcelImportModal 
              visitData={data} 
              onApplyUpdates={handleApplyExcelUpdates} 
              onClose={() => setShowImportModal(false)} 
            />
          )}
        </div>
      );
    }

    // --- PAGE 2: ARCHIVE & ANALYTICS ---
    function ArchivePage({ allVisits, onViewDetails, onEditVisit, onDeleteVisit }) {
      if (allVisits.length === 0) {
        return (
          <div className="text-center py-20">
             <ListIcon size={48} className="mx-auto text-gray-300 mb-4" />
             <p className="text-gray-500 text-lg">لا توجد زيارات مسجلة في السجل.</p>
          </div>
        );
      }
      return (
        <div className="animate-fade-in">
          <h2 className="text-2xl font-bold text-[#002f6c] mb-6 flex items-center gap-2">
            <ListIcon size={24} className="text-[#d4af37]" /> سجل الزيارات والإحصائيات
          </h2>
          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            {allVisits.map(visit => {
               const churchesCount = (visit.churches||[]).length;
               const casesCount = (visit.churches||[]).reduce((sum, ch) => sum + (ch.servantsGroups||[]).reduce((s2, sg) => s2 + (sg.cases||[]).length, 0), 0);
               return (
                 <div key={visit.id} onClick={() => onViewDetails(visit)} className="bg-white rounded-xl shadow-sm border border-gray-100 p-5 cursor-pointer hover:shadow-md hover:border-[#002f6c]/30 transition-all group">
                    <div className="flex justify-between items-start mb-3">
                       <h3 className="font-bold text-lg text-gray-900 group-hover:text-[#002f6c]">{visit.location || 'زيارة بدون اسم'}</h3>
                       <div className="flex items-center gap-2">
                           <div className="bg-gray-100 text-gray-500 text-xs px-2 py-1 rounded font-sans flex items-center gap-1"><Calendar size={12}/>{visit.date}</div>
                           {!isReadOnly && <button onClick={(e) => { e.stopPropagation(); onEditVisit(visit); }} className="text-gray-400 hover:text-[#002f6c] p-1 transition-colors bg-gray-50 hover:bg-gray-100 rounded" title="تعديل الزيارة"><Edit2 size={16}/></button>}
                           {!isReadOnly && <button onClick={(e) => { e.stopPropagation(); onDeleteVisit(visit.id); }} className="text-gray-400 hover:text-red-600 p-1 transition-colors bg-gray-50 hover:bg-red-50 rounded" title="حذف الزيارة"><Trash2 size={16}/></button>}
                       </div>
                    </div>
                    <div className="flex gap-4 text-sm text-gray-600 mt-4 pt-4 border-t border-gray-50">
                       <div>كنائس: <span className="font-bold font-sans text-gray-900">{formatNumber(churchesCount)}</span></div>
                       <div>حالات: <span className="font-bold font-sans text-gray-900">{formatNumber(casesCount)}</span></div>
                    </div>
                 </div>
               );
            })}
          </div>
        </div>
      );
    }


    // --- TRASH PAGE ---
    function TrashPage({ deletedVisits, onRestore, onPermanentDelete, onEmptyTrash }) {
      if (deletedVisits.length === 0) {
        return (
          <div className="text-center py-20">
             <Trash2 size={48} className="mx-auto text-gray-300 mb-4" />
             <p className="text-gray-500 text-lg">سلة المهملات فارغة.</p>
          </div>
        );
      }
      return (
        <div className="animate-fade-in">
          <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
              <h2 className="text-2xl font-bold text-[#002f6c] flex items-center gap-2">
                <Trash2 size={24} className="text-red-500" /> سلة المهملات
              </h2>
              {!isReadOnly && <button onClick={onEmptyTrash} className="flex items-center gap-2 bg-red-50 text-red-600 hover:bg-red-100 hover:text-red-700 px-4 py-2 rounded-md font-medium text-sm transition-colors border border-red-200 shadow-sm">
                 <AlertTriangle size={16} /> تفريغ سلة المهملات بالكامل
              </button>}
          </div>
          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            {deletedVisits.map(visit => {
               const churchesCount = (visit.churches||[]).length;
               const now = Date.now();
               const deletedAt = visit.deletedAt || now;
               const THIRTY_DAYS = 30 * 24 * 60 * 60 * 1000;
               const timePassed = now - deletedAt;
               const daysRemaining = Math.max(0, Math.ceil((THIRTY_DAYS - timePassed) / (1000 * 60 * 60 * 24)));

               return (
                 <div key={visit.id} className="bg-white rounded-xl shadow-sm border border-red-100 p-5 group relative overflow-hidden">
                    <div className="absolute top-0 right-0 left-0 h-1 bg-red-200"></div>
                    <div className="flex justify-between items-start mb-3">
                       <h3 className="font-bold text-lg text-gray-800 line-through opacity-70">{visit.location || 'زيارة بدون اسم'}</h3>
                       <div className="bg-red-50 text-red-600 text-xs px-2 py-1 rounded font-sans flex items-center gap-1 font-bold">
                           متبقي {formatNumber(daysRemaining)} يوم
                       </div>
                    </div>
                    <div className="text-sm text-gray-500 mb-4 flex items-center gap-1">
                        <Calendar size={14}/> تاريخ الزيارة: {visit.date}
                    </div>
                    <div className="flex gap-2 text-sm mt-4 pt-4 border-t border-gray-50 justify-end">
                       {!isReadOnly && <>
                       <button onClick={() => onRestore(visit.id)} className="flex items-center gap-1 bg-gray-50 hover:bg-green-50 text-gray-600 hover:text-green-700 px-3 py-1.5 rounded-md transition-colors border border-gray-200 hover:border-green-300 font-medium text-xs shadow-sm">
                           <RotateCcw size={14} /> استعادة
                       </button>
                       <button onClick={() => onPermanentDelete(visit.id)} className="flex items-center gap-1 bg-red-50 hover:bg-red-600 text-red-600 hover:text-white px-3 py-1.5 rounded-md transition-colors font-medium text-xs shadow-sm">
                           <Trash2 size={14} /> حذف نهائي للأبد
                       </button>
                       </>}
                    </div>
                 </div>
               );
            })}
          </div>
        </div>
      );
    }

    function ArchiveDetails({ visit, onBack, onExport, onUpdateVisit }) {
      const [filterStatus, setFilterStatus] = useState('all'); // 'all' | 'initial' | 'executed' | 'cancelled'
      const [executingCaseInfo, setExecutingCaseInfo] = useState(null);
      const [showImportModal, setShowImportModal] = useState(false);

      const [filterRegion, setFilterRegion] = useState('');
      const [filterChurch, setFilterChurch] = useState('');
      const [filterServant, setFilterServant] = useState('');
      const [filterProject, setFilterProject] = useState('');
      const [filterCase, setFilterCase] = useState('');
      const [expandedRegions, setExpandedRegions] = useState({});
      const [expandedChurches, setExpandedChurches] = useState({});
      const toggleRegion = (regionName) => setExpandedRegions(prev => ({ ...prev, [regionName]: !prev[regionName] }));
      const toggleChurch = (churchId) => setExpandedChurches(prev => ({ ...prev, [churchId]: !prev[churchId] }));

      const uniqueRegions = Array.from(new Set((visit.churches||[]).map(ch => ch.regionName).filter(Boolean))).sort();
      const uniqueChurches = Array.from(new Set((visit.churches||[]).filter(ch => !filterRegion || ch.regionName === filterRegion).map(ch => ch.churchName).filter(Boolean))).sort();
      const uniqueServants = Array.from(new Set((visit.churches||[]).flatMap(ch => (ch.servantsGroups || []).map(sg => sg.servantsNames)).filter(Boolean))).sort();
      const uniqueProjects = Array.from(new Set((visit.churches||[]).flatMap(ch => (ch.servantsGroups || []).flatMap(sg => (sg.cases || []).map(c => c.projectType))).filter(Boolean))).sort();
      const uniqueCases = Array.from(new Set((visit.churches||[]).flatMap(ch => (ch.servantsGroups || []).flatMap(sg => (sg.cases || []).map(c => c.name))).filter(Boolean))).sort();

      const statusCounts = { all: 0, initial: 0, executed: 0, cancelled: 0 };
      (visit.churches || []).forEach(ch => {
        (ch.servantsGroups || []).forEach(sg => {
          (sg.cases || []).forEach(c => {
            statusCounts.all++;
            const st = c.status || 'initial';
            if (st === 'executed') statusCounts.executed++;
            else if (st === 'cancelled') statusCounts.cancelled++;
            else statusCounts.initial++;
          });
        });
      });

      let filteredChurches = (visit.churches || []).map(ch => {
          if (filterRegion && ch.regionName !== filterRegion) return null;
          if (filterChurch && ch.churchName !== filterChurch) return null;
          
          const filteredGroups = (ch.servantsGroups || []).map(sg => {
              if (filterServant && sg.servantsNames !== filterServant) return null;
              
              const filteredCases = (sg.cases || []).filter(c => {
                  if (filterStatus !== 'all' && (c.status || 'initial') !== filterStatus) return false;
                  if (filterProject && c.projectType !== filterProject) return false;
                  if (filterCase && c.name !== filterCase) return false;
                  return true;
              });
              
              if (filteredCases.length === 0 && (filterStatus !== 'all' || filterProject || filterCase)) return null;
              return { ...sg, cases: filteredCases };
          }).filter(Boolean);
          
          if (filteredGroups.length === 0 && (filterStatus !== 'all' || filterServant || filterProject || filterCase)) return null;
          return { ...ch, servantsGroups: filteredGroups };
      }).filter(Boolean);

      let totalCases = 0, totalApprovedValue = 0, totalExecutedValue = 0, executedCasesCount = 0, totalInst = 0;
      const churchesCount = filteredChurches.length;
      
      const serialMap = {};
      (visit.churches || []).forEach(ch => {
         let s = 1;
         (ch.servantsGroups || []).forEach(sg => {
             (sg.cases || []).forEach(c => {
                 serialMap[c.id] = s++;
             });
         });
      });

      filteredChurches.forEach(ch => {
         (ch.servantsGroups || []).forEach(sg => {
             (sg.cases || []).forEach(c => {
                 totalCases++;
                 const val = parseFloat(c.projectValue) || 0;
                 const execVal = parseFloat(c.executedProjectValue) || val;
                 const inst = parseFloat(c.installmentAmount) || 0;
                 const execInst = parseFloat(c.executedInstallmentAmount) || inst;
                 
                 totalApprovedValue += val;
                 if (c.status === 'executed') {
                   executedCasesCount++;
                   totalExecutedValue += execVal;
                   totalInst += execInst;
                 } else {
                   totalInst += inst;
                 }
             });
         });
      });

      const handleSaveExecutionCase = (updatedCase) => {
        if (!onUpdateVisit || !executingCaseInfo) return;
        const { churchId, groupId } = executingCaseInfo;
        const updatedChurches = (visit.churches || []).map(ch => ch.id === churchId ? {
          ...ch,
          servantsGroups: (ch.servantsGroups || []).map(sg => sg.id === groupId ? {
            ...sg,
            cases: (sg.cases || []).map(c => c.id === updatedCase.id ? updatedCase : c)
          } : sg)
        } : ch);
        const nextVisit = { ...visit, churches: updatedChurches };
        onUpdateVisit(nextVisit);
        setExecutingCaseInfo(null);
      };

      const handleApplyExcelUpdates = (selectedMatches, execDate) => {
        if (!onUpdateVisit) return;
        const updatedChurches = (visit.churches || []).map(ch => ({
          ...ch,
          servantsGroups: (ch.servantsGroups || []).map(sg => ({
            ...sg,
            cases: (sg.cases || []).map(c => {
              const match = selectedMatches.find(m => m.existing.caseObj.id === c.id);
              if (match) {
                return {
                  ...c,
                  status: 'executed',
                  executedProjectType: match.excelData.projectType || c.projectType,
                  executedProjectValue: match.excelData.projectValue || c.projectValue,
                  executedInstallmentAmount: match.excelData.installmentAmount || c.installmentAmount,
                  executionDate: execDate || new Date().toISOString().split('T')[0],
                  executionNotes: match.excelData.notes || c.notes || ''
                };
              }
              return c;
            })
          }))
        }));
        const nextVisit = { ...visit, churches: updatedChurches };
        onUpdateVisit(nextVisit);
        setShowImportModal(false);
        alert(`تم بنجاح تحديث وتأكيد تنفيذ ${selectedMatches.length} حالة في هذه الزيارة!`);
      };

      return (
         <div className="animate-fade-in pb-10">
            <button onClick={onBack} className="flex items-center gap-1 text-sm font-medium text-gray-500 hover:text-[#002f6c] mb-6 transition-colors">
               <ChevronRight size={18} /> العودة للسجل
            </button>
            
            <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4">
               <div>
                  <h2 className="text-2xl font-bold text-[#002f6c]">{visit.location || 'زيارة بدون اسم'}</h2>
                  <p className="text-gray-500 text-sm mt-1 flex items-center gap-1"><Calendar size={14}/> {visit.date}</p>
               </div>
               <div className="flex flex-wrap gap-2 w-full md:w-auto">
                  {!isReadOnly && (
                     <button onClick={() => setShowImportModal(true)} className="flex-1 md:flex-none flex items-center justify-center gap-2 bg-emerald-600 text-white hover:bg-emerald-700 px-5 py-2 rounded-md shadow transition-colors font-medium text-sm">
                        <Upload size={18} /> استيراد كشف التنفيذ
                     </button>
                  )}
                  <button onClick={() => onExport(visit)} className="flex-1 md:flex-none flex items-center justify-center gap-2 bg-[#d4af37] text-white hover:bg-[#c49b27] px-5 py-2 rounded-md shadow transition-colors font-medium text-sm">
                     <Download size={18} /> تصدير الإكسيل
                  </button>
               </div>
            </div>

            <div className="grid grid-cols-2 md:grid-cols-5 gap-4 mb-6">
               <div className="bg-white p-4 rounded-xl border border-gray-100 shadow-sm text-center">
                  <div className="text-xs text-gray-500 mb-1">إجمالي الحالات</div>
                  <div className="text-xl font-bold text-[#002f6c] font-sans">{formatNumber(totalCases)}</div>
               </div>
               <div className="bg-white p-4 rounded-xl border border-gray-100 shadow-sm text-center">
                  <div className="text-xs text-gray-500 mb-1">عدد الكنائس</div>
                  <div className="text-xl font-bold text-[#002f6c] font-sans">{formatNumber(churchesCount)}</div>
               </div>
               <div className="bg-amber-50 p-4 rounded-xl border border-amber-200 shadow-sm text-center">
                  <div className="text-xs text-amber-800 mb-1">الموافقة المبدئية</div>
                  <div className="text-xl font-bold text-amber-700 font-sans">{formatNumber(totalApprovedValue)} <span className="text-xs font-normal">ج.م</span></div>
               </div>
               <div className="bg-emerald-50 p-4 rounded-xl border border-emerald-200 shadow-sm text-center">
                  <div className="text-xs text-emerald-800 mb-1">المنفذ فعلياً ({formatNumber(executedCasesCount)})</div>
                  <div className="text-xl font-bold text-emerald-700 font-sans">{formatNumber(totalExecutedValue)} <span className="text-xs font-normal">ج.م</span></div>
               </div>
               <div className="bg-[#fff9e6] p-4 rounded-xl border border-[#f0e0a8] shadow-sm text-center col-span-2 md:col-span-1">
                  <div className="text-xs text-[#8a7222] mb-1">إجمالي الأقساط</div>
                  <div className="text-xl font-bold text-[#8a7222] font-sans">{formatNumber(totalInst)} <span className="text-xs font-normal">ج.م</span></div>
               </div>
            </div>

            {/* STATUS NAVIGATION TABS */}
            <div className="flex flex-wrap items-center gap-2 mb-6 bg-white p-2 rounded-xl shadow-sm border border-gray-200">
               <button
                 type="button"
                 onClick={() => setFilterStatus('all')}
                 className={`flex items-center gap-2 px-4 py-2.5 rounded-lg text-sm font-bold transition-all ${
                   filterStatus === 'all'
                     ? 'bg-[#002f6c] text-white shadow-md'
                     : 'text-gray-600 hover:bg-gray-100'
                 }`}
               >
                 <span>🌐 كل المشاريع</span>
                 <span className={`px-2 py-0.5 rounded-full text-xs font-sans ${filterStatus === 'all' ? 'bg-white/20 text-white' : 'bg-gray-200 text-gray-700'}`}>
                   {formatNumber(statusCounts.all)}
                 </span>
               </button>

               <button
                 type="button"
                 onClick={() => setFilterStatus('initial')}
                 className={`flex items-center gap-2 px-4 py-2.5 rounded-lg text-sm font-bold transition-all ${
                   filterStatus === 'initial'
                     ? 'bg-amber-600 text-white shadow-md'
                     : 'text-amber-800 hover:bg-amber-50'
                 }`}
               >
                 <span>⏳ موافقة مبدئية</span>
                 <span className={`px-2 py-0.5 rounded-full text-xs font-sans ${filterStatus === 'initial' ? 'bg-white/20 text-white' : 'bg-amber-100 text-amber-900'}`}>
                   {formatNumber(statusCounts.initial)}
                 </span>
               </button>

               <button
                 type="button"
                 onClick={() => setFilterStatus('executed')}
                 className={`flex items-center gap-2 px-4 py-2.5 rounded-lg text-sm font-bold transition-all ${
                   filterStatus === 'executed'
                     ? 'bg-emerald-600 text-white shadow-md'
                     : 'text-emerald-800 hover:bg-emerald-50'
                 }`}
               >
                 <span>✅ مشاريع منفذة</span>
                 <span className={`px-2 py-0.5 rounded-full text-xs font-sans ${filterStatus === 'executed' ? 'bg-white/20 text-white' : 'bg-emerald-100 text-emerald-900'}`}>
                   {formatNumber(statusCounts.executed)}
                 </span>
               </button>

               <button
                 type="button"
                 onClick={() => setFilterStatus('cancelled')}
                 className={`flex items-center gap-2 px-4 py-2.5 rounded-lg text-sm font-bold transition-all ${
                   filterStatus === 'cancelled'
                     ? 'bg-red-600 text-white shadow-md'
                     : 'text-red-700 hover:bg-red-50'
                 }`}
               >
                 <span>❌ لم تُنفّذ / ملغاة</span>
                 <span className={`px-2 py-0.5 rounded-full text-xs font-sans ${filterStatus === 'cancelled' ? 'bg-white/20 text-white' : 'bg-red-100 text-red-800'}`}>
                   {formatNumber(statusCounts.cancelled)}
                 </span>
               </button>
            </div>
            
            {/* ADVANCED FILTERS */}
            <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-5 mb-6">
               <div className="flex justify-between items-center mb-4 border-b border-gray-50 pb-2">
                  <h4 className="text-sm font-bold text-gray-700 flex items-center gap-2"><Search size={16} className="text-[#002f6c]"/> تصفية متقدمة</h4>
                  {(filterRegion || filterChurch || filterServant || filterProject || filterCase) && (
                     <button onClick={() => { setFilterRegion(''); setFilterChurch(''); setFilterServant(''); setFilterProject(''); setFilterCase(''); }} className="text-xs flex items-center gap-1 text-red-500 hover:text-red-700 bg-red-50 hover:bg-red-100 px-3 py-1.5 rounded-md transition-colors font-medium">
                         <RotateCcw size={14}/> إعادة ضبط الفلاتر
                     </button>
                  )}
               </div>
               <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4">
                  <div>
                     <label className="block text-xs font-medium text-gray-500 mb-1">قائمة المناطق</label>
                     <select value={filterRegion} onChange={e => { setFilterRegion(e.target.value); setFilterChurch(''); }} className="w-full text-sm border border-gray-200 rounded-md focus:border-[#002f6c] focus:ring-1 focus:ring-[#002f6c] py-2 px-3 outline-none text-gray-700 bg-gray-50 hover:bg-white transition-colors cursor-pointer">
                        <option value="">كل المناطق</option>
                        {uniqueRegions.map(opt => <option key={opt} value={opt}>{opt}</option>)}
                     </select>
                  </div>
                  <div>
                     <label className="block text-xs font-medium text-gray-500 mb-1">قائمة الكنائس</label>
                     <select value={filterChurch} onChange={e => setFilterChurch(e.target.value)} className="w-full text-sm border border-gray-200 rounded-md focus:border-[#002f6c] focus:ring-1 focus:ring-[#002f6c] py-2 px-3 outline-none text-gray-700 bg-gray-50 hover:bg-white transition-colors cursor-pointer">
                        <option value="">كل الكنائس</option>
                        {uniqueChurches.map(opt => <option key={opt} value={opt}>{opt}</option>)}
                     </select>
                  </div>
                  <div>
                     <label className="block text-xs font-medium text-gray-500 mb-1">قائمة الخدام</label>
                     <select value={filterServant} onChange={e => setFilterServant(e.target.value)} className="w-full text-sm border border-gray-200 rounded-md focus:border-[#002f6c] focus:ring-1 focus:ring-[#002f6c] py-2 px-3 outline-none text-gray-700 bg-gray-50 hover:bg-white transition-colors cursor-pointer">
                        <option value="">كل الخدام</option>
                        {uniqueServants.map(opt => <option key={opt} value={opt}>{opt}</option>)}
                     </select>
                  </div>
                  <div>
                     <label className="block text-xs font-medium text-gray-500 mb-1">قائمة أنواع المشاريع</label>
                     <select value={filterProject} onChange={e => setFilterProject(e.target.value)} className="w-full text-sm border border-gray-200 rounded-md focus:border-[#002f6c] focus:ring-1 focus:ring-[#002f6c] py-2 px-3 outline-none text-gray-700 bg-gray-50 hover:bg-white transition-colors cursor-pointer">
                        <option value="">كل المشاريع</option>

            {executingCaseInfo && (

    // --- PAGE: PROJECTS EXECUTION & APPROVAL DASHBOARD ---
    function ExecutionPage({ allVisits, onUpdateVisit, onExport }) {
      const activeVisits = (allVisits || []).filter(v => !v.isDeleted);
      const [selectedVisitId, setSelectedVisitId] = useState(() => activeVisits[0]?.id || null);

      // Keep selectedVisit synced if list updates
      useEffect(() => {
        if (!selectedVisitId && activeVisits.length > 0) {
          setSelectedVisitId(activeVisits[0].id);
        }
      }, [activeVisits, selectedVisitId]);

      const currentVisit = activeVisits.find(v => v.id === selectedVisitId) || activeVisits[0] || null;

      const [filterStatus, setFilterStatus] = useState('all'); // 'all' | 'initial' | 'executed' | 'cancelled'
      const [filterRegion, setFilterRegion] = useState('');
      const [filterChurch, setFilterChurch] = useState('');
      const [filterSearch, setFilterSearch] = useState('');
      const [selectedCaseIds, setSelectedCaseIds] = useState({});
      
      const [executingCaseInfo, setExecutingCaseInfo] = useState(null);
      const [bulkConfirmInfo, setBulkConfirmInfo] = useState(null); // { title, cases: [...] }
      const [showImportModal, setShowImportModal] = useState(false);

      const [expandedRegions, setExpandedRegions] = useState({});
      const [expandedChurches, setExpandedChurches] = useState({});
      const toggleRegion = (r) => setExpandedRegions(prev => ({ ...prev, [r]: !prev[r] }));
      const toggleChurch = (c) => setExpandedChurches(prev => ({ ...prev, [c]: !prev[c] }));

      if (!currentVisit) {
        return (
          <div className="text-center py-20 bg-white rounded-2xl border border-gray-200 p-8 shadow-sm">
            <ListIcon size={48} className="mx-auto text-gray-300 mb-3" />
            <h3 className="text-lg font-bold text-gray-700 mb-1">لا توجد زيارات مسجلة للمتابعة</h3>
            <p className="text-sm text-gray-500">قم بتسجيل زيارة أولاً لتتمكن من مراجعة حالاتها واعتماد تنفيذها.</p>
          </div>
        );
      }

      // Collect all cases in current visit with church/group metadata
      const allCasesMeta = [];
      const serialMap = {};
      (currentVisit.churches || []).forEach(ch => {
        let churchS = 1;
        (ch.servantsGroups || []).forEach(sg => {
          (sg.cases || []).forEach(c => {
            serialMap[c.id] = churchS++;
            allCasesMeta.push({
              caseObj: c,
              churchId: ch.id,
              groupId: sg.id,
              churchName: ch.churchName || '',
              regionName: ch.regionName || '',
              villageName: ch.villageName || '',
              servantsNames: sg.servantsNames || ''
            });
          });
        });
      });

      // Status Counts
      const statusCounts = { all: 0, initial: 0, executed: 0, cancelled: 0 };
      allCasesMeta.forEach(m => {
        statusCounts.all++;
        const st = m.caseObj.status || 'initial';
        if (st === 'executed') statusCounts.executed++;
        else if (st === 'cancelled') statusCounts.cancelled++;
        else statusCounts.initial++;
      });

      // Filtered Churches & Cases
      const normSearch = normalizeArabicText(filterSearch.trim());
      const filteredChurches = (currentVisit.churches || []).map(ch => {
        if (filterRegion && ch.regionName !== filterRegion) return null;
        if (filterChurch && ch.churchName !== filterChurch) return null;

        const filteredGroups = (ch.servantsGroups || []).map(sg => {
          const filteredCases = (sg.cases || []).filter(c => {
            const st = c.status || 'initial';
            if (filterStatus !== 'all' && st !== filterStatus) return false;
            if (normSearch) {
              const nameMatch = normalizeArabicText(c.name || '').includes(normSearch);
              const typeMatch = normalizeArabicText(c.executedProjectType || c.projectType || '').includes(normSearch);
              const notesMatch = normalizeArabicText(c.notes || '').includes(normSearch);
              if (!nameMatch && !typeMatch && !notesMatch) return false;
            }
            return true;
          });

          if (filteredCases.length === 0) return null;
          return { ...sg, cases: filteredCases };
        }).filter(Boolean);

        if (filteredGroups.length === 0) return null;
        return { ...ch, servantsGroups: filteredGroups };
      }).filter(Boolean);

      // Financial Metrics
      let totalApprovedValue = 0;
      let totalExecutedValue = 0;
      let totalInstallments = 0;
      allCasesMeta.forEach(m => {
        const c = m.caseObj;
        const val = parseFloat(c.projectValue) || 0;
        const execVal = parseFloat(c.executedProjectValue) || val;
        const inst = parseFloat(c.installmentAmount) || 0;
        const execInst = parseFloat(c.executedInstallmentAmount) || inst;
        
        totalApprovedValue += val;
        if (c.status === 'executed') {
          totalExecutedValue += execVal;
          totalInstallments += execInst;
        } else {
          totalInstallments += inst;
        }
      });

      const executionPercentage = statusCounts.all > 0 ? Math.round((statusCounts.executed / statusCounts.all) * 100) : 0;

      // Unique Filter Options
      const uniqueRegions = Array.from(new Set((currentVisit.churches || []).map(ch => ch.regionName).filter(Boolean))).sort();
      const uniqueChurches = Array.from(new Set((currentVisit.churches || []).filter(ch => !filterRegion || ch.regionName === filterRegion).map(ch => ch.churchName).filter(Boolean))).sort();

      // Handlers
      const handleSingleQuickExecute = (caseObj, churchId, groupId) => {
        const updatedChurches = (currentVisit.churches || []).map(ch => ch.id === churchId ? {
          ...ch,
          servantsGroups: (ch.servantsGroups || []).map(sg => sg.id === groupId ? {
            ...sg,
            cases: (sg.cases || []).map(c => c.id === caseObj.id ? {
              ...c,
              status: 'executed',
              executedProjectValue: c.executedProjectValue || c.projectValue,
              executedInstallmentAmount: c.executedInstallmentAmount || c.installmentAmount,
              executedProjectType: c.executedProjectType || c.projectType,
              executionDate: c.executionDate || new Date().toISOString().split('T')[0]
            } : c)
          } : sg)
        } : ch);
        onUpdateVisit({ ...currentVisit, churches: updatedChurches });
      };

      const handleRevertToInitial = (caseId, churchId, groupId) => {
        const updatedChurches = (currentVisit.churches || []).map(ch => ch.id === churchId ? {
          ...ch,
          servantsGroups: (ch.servantsGroups || []).map(sg => sg.id === groupId ? {
            ...sg,
            cases: (sg.cases || []).map(c => c.id === caseId ? {
              ...c,
              status: 'initial'
            } : c)
          } : sg)
        } : ch);
        onUpdateVisit({ ...currentVisit, churches: updatedChurches });
      };

      const handleSaveExecutionCase = (updatedCase) => {
        if (!executingCaseInfo) return;
        const { churchId, groupId } = executingCaseInfo;
        const updatedChurches = (currentVisit.churches || []).map(ch => ch.id === churchId ? {
          ...ch,
          servantsGroups: (ch.servantsGroups || []).map(sg => sg.id === groupId ? {
            ...sg,
            cases: (sg.cases || []).map(c => c.id === updatedCase.id ? updatedCase : c)
          } : sg)
        } : ch);
        onUpdateVisit({ ...currentVisit, churches: updatedChurches });
        setExecutingCaseInfo(null);
      };

      const handleExecuteBulkConfirmed = (casesToExecute, execDate, notes) => {
        const targetIds = new Set(casesToExecute.map(m => m.caseObj.id));
        const updatedChurches = (currentVisit.churches || []).map(ch => ({
          ...ch,
          servantsGroups: (ch.servantsGroups || []).map(sg => ({
            ...sg,
            cases: (sg.cases || []).map(c => {
              if (targetIds.has(c.id)) {
                return {
                  ...c,
                  status: 'executed',
                  executedProjectValue: c.executedProjectValue || c.projectValue,
                  executedInstallmentAmount: c.executedInstallmentAmount || c.installmentAmount,
                  executedProjectType: c.executedProjectType || c.projectType,
                  executionDate: execDate || new Date().toISOString().split('T')[0],
                  executionNotes: notes ? (c.executionNotes ? `${c.executionNotes} | ${notes}` : notes) : (c.executionNotes || '')
                };
              }
              return c;
            })
          }))
        }));
        onUpdateVisit({ ...currentVisit, churches: updatedChurches });
        setBulkConfirmInfo(null);
        setSelectedCaseIds({});
        alert(`تم بنجاح اعتماد وتأكيد تنفيذ ${casesToExecute.length} حالة!`);
      };

      const handleApplyExcelUpdates = (selectedMatches, execDate) => {
        const updatedChurches = (currentVisit.churches || []).map(ch => ({
          ...ch,
          servantsGroups: (ch.servantsGroups || []).map(sg => ({
            ...sg,
            cases: (sg.cases || []).map(c => {
              const match = selectedMatches.find(m => m.existing.caseObj.id === c.id);
              if (match) {
                return {
                  ...c,
                  status: 'executed',
                  executedProjectType: match.excelData.projectType || c.projectType,
                  executedProjectValue: match.excelData.projectValue || c.projectValue,
                  executedInstallmentAmount: match.excelData.installmentAmount || c.installmentAmount,
                  executionDate: execDate || new Date().toISOString().split('T')[0],
                  executionNotes: match.excelData.notes || c.notes || ''
                };
              }
              return c;
            })
          }))
        }));
        onUpdateVisit({ ...currentVisit, churches: updatedChurches });
        setShowImportModal(false);
        alert(`تم بنجاح تحديث وتأكيد تنفيذ ${selectedMatches.length} حالة من ملف الإكسيل!`);
      };

      // Multi-Select Helpers
      const selectedCount = Object.values(selectedCaseIds).filter(Boolean).length;
      const toggleSelectCase = (id) => {
        setSelectedCaseIds(prev => ({ ...prev, [id]: !prev[id] }));
      };
      const handleSelectAllFiltered = () => {
        const newSel = { ...selectedCaseIds };
        const visibleCases = filteredChurches.flatMap(ch => (ch.servantsGroups || []).flatMap(sg => sg.cases || []));
        const allAlreadySelected = visibleCases.every(c => newSel[c.id]);
        visibleCases.forEach(c => {
          newSel[c.id] = !allAlreadySelected;
        });
        setSelectedCaseIds(newSel);
      };

      // Bulk action triggers
      const triggerApproveEntireVisit = () => {
        const pending = allCasesMeta.filter(m => (m.caseObj.status || 'initial') !== 'executed');
        if (pending.length === 0) {
          alert('جميع حالات هذه الزيارة معتمدة ومنفذة بالفعل!');
          return;
        }
        setBulkConfirmInfo({
          title: `زيارة "${currentVisit.location || 'الزيارة الحالية'}" بالكامل`,
          cases: pending
        });
      };

      const triggerApproveRegion = (regionName) => {
        const pending = allCasesMeta.filter(m => m.regionName === regionName && (m.caseObj.status || 'initial') !== 'executed');
        if (pending.length === 0) {
          alert(`جميع حالات منطقة ${regionName} معتمدة ومنفذة بالفعل!`);
          return;
        }
        setBulkConfirmInfo({
          title: `منطقة "${regionName}" (${pending.length} حالة متبقية)`,
          cases: pending
        });
      };

      const triggerApproveChurch = (churchId, churchName) => {
        const pending = allCasesMeta.filter(m => m.churchId === churchId && (m.caseObj.status || 'initial') !== 'executed');
        if (pending.length === 0) {
          alert(`جميع حالات كنيسة ${churchName} معتمدة ومنفذة بالفعل!`);
          return;
        }
        setBulkConfirmInfo({
          title: `كنيسة "${churchName}" (${pending.length} حالة متبقية)`,
          cases: pending
        });
      };

      const triggerApproveSelected = () => {
        const selectedMetas = allCasesMeta.filter(m => selectedCaseIds[m.caseObj.id] && (m.caseObj.status || 'initial') !== 'executed');
        if (selectedMetas.length === 0) {
          alert('يرجى تحديد حالات بانتظار الاعتماد لتنفيذها.');
          return;
        }
        setBulkConfirmInfo({
          title: `${selectedMetas.length} حالة محددة`,
          cases: selectedMetas
        });
      };

      return (
        <div className="animate-fade-in pb-16 space-y-6">
          {/* HEADER & VISIT SELECTOR */}
          <div className="bg-white rounded-2xl shadow-sm border border-gray-200 p-5 sm:p-6 flex flex-col lg:flex-row justify-between items-start lg:items-center gap-4">
            <div className="flex-1 w-full lg:w-auto">
              <div className="flex items-center gap-2 mb-2">
                <span className="p-2 rounded-xl bg-amber-500/10 text-amber-600 font-bold text-xl">⚡</span>
                <div>
                  <h2 className="text-xl sm:text-2xl font-black text-[#002f6c]">متابعة واعتماد تنفيذ المشاريع</h2>
                  <p className="text-xs text-gray-500">مراجعة الحالات على الأرض، تعديل القيم المنفذة، واعتماد التنفيذ فردياً أو بالجملة</p>
                </div>
              </div>

              <div className="flex flex-wrap items-center gap-3 mt-3">
                <label className="text-xs font-bold text-gray-700 whitespace-nowrap">الزيارة الحالية:</label>
                <select 
                  value={selectedVisitId || ''} 
                  onChange={e => setSelectedVisitId(e.target.value)} 
                  className="bg-blue-50/70 border border-blue-200 rounded-lg px-3 py-1.5 text-sm font-bold text-[#002f6c] outline-none focus:ring-2 focus:ring-[#002f6c]/20 cursor-pointer"
                >
                  {activeVisits.map(v => (
                    <option key={v.id} value={v.id}>
                      {v.location || 'زيارة بدون اسم'} ({v.date})
                    </option>
                  ))}
                </select>
              </div>
            </div>

            <div className="flex flex-wrap gap-2 w-full lg:w-auto justify-end">
              {!isReadOnly && (
                <button 
                  onClick={() => setShowImportModal(true)} 
                  className="flex-1 sm:flex-none flex items-center justify-center gap-2 bg-emerald-600 hover:bg-emerald-700 text-white text-xs sm:text-sm font-bold px-4 py-2.5 rounded-xl shadow-sm transition-all"
                  title="رفع كشف الإكسيل لمسؤول القرية"
                >
                  <Upload size={18} />
                  <span>استيراد كشف الإكسيل</span>
                </button>
              )}

              <button 
                onClick={() => onExport(currentVisit)} 
                className="flex-1 sm:flex-none flex items-center justify-center gap-2 bg-white border border-[#d4af37] text-[#8a7222] hover:bg-amber-50 text-xs sm:text-sm font-bold px-4 py-2.5 rounded-xl transition-all"
              >
                <Download size={18} />
                <span>تصدير كشف الزيارة</span>
              </button>

              {!isReadOnly && (
                <button 
                  onClick={triggerApproveEntireVisit} 
                  className="w-full sm:w-auto flex items-center justify-center gap-2 bg-[#002f6c] hover:bg-[#001f4c] text-white text-xs sm:text-sm font-bold px-5 py-2.5 rounded-xl shadow-md transition-all ring-2 ring-[#002f6c]/20"
                >
                  <span>🚀</span>
                  <span>اعتماد الزيارة بالكامل للتنفيذ</span>
                </button>
              )}
            </div>
          </div>

          {/* KPI STATS CARDS */}
          <div className="grid grid-cols-2 lg:grid-cols-5 gap-4">
            <div className="bg-white p-4 rounded-2xl border border-gray-200 shadow-sm flex flex-col justify-between">
              <span className="text-xs font-semibold text-gray-500">إجمالي الحالات</span>
              <div className="flex items-baseline justify-between mt-2">
                <span className="text-2xl font-black text-[#002f6c] font-sans">{formatNumber(statusCounts.all)}</span>
                <span className="text-xs text-gray-400">مشروع</span>
              </div>
            </div>

            <div className="bg-amber-50/70 p-4 rounded-2xl border border-amber-200 shadow-sm flex flex-col justify-between">
              <span className="text-xs font-semibold text-amber-800">بانتظار التنفيذ (مبدئية)</span>
              <div className="flex items-baseline justify-between mt-2">
                <span className="text-2xl font-black text-amber-700 font-sans">{formatNumber(statusCounts.initial)}</span>
                <span className="text-xs font-bold text-amber-800 font-sans">{formatNumber(totalApprovedValue)} ج.م</span>
              </div>
            </div>

            <div className="bg-emerald-50/70 p-4 rounded-2xl border border-emerald-200 shadow-sm flex flex-col justify-between">
              <span className="text-xs font-semibold text-emerald-800">منفذة فعلياً ومؤكدة</span>
              <div className="flex items-baseline justify-between mt-2">
                <span className="text-2xl font-black text-emerald-700 font-sans">{formatNumber(statusCounts.executed)}</span>
                <span className="text-xs font-bold text-emerald-800 font-sans">{formatNumber(totalExecutedValue)} ج.م</span>
              </div>
            </div>

            <div className="bg-rose-50/70 p-4 rounded-2xl border border-rose-200 shadow-sm flex flex-col justify-between">
              <span className="text-xs font-semibold text-rose-800">لم تُنفّذ / ملغاة</span>
              <div className="flex items-baseline justify-between mt-2">
                <span className="text-2xl font-black text-rose-700 font-sans">{formatNumber(statusCounts.cancelled)}</span>
                <span className="text-xs text-rose-600">حالة</span>
              </div>
            </div>

            <div className="bg-white p-4 rounded-2xl border border-gray-200 shadow-sm flex flex-col justify-between col-span-2 lg:col-span-1">

                <span>نسبة التنفيذ</span>

                <div

              <span className="text-[11px] text-gray-400 mt-2 font-sans">إجمالي الأقساط: {formatNumber(totalInstallments)} ج.م</span>

                {formatNumber(statusCounts.all)}
              </span>
            </button>

            <button
              onClick={() => setFilterStatus('initial')}
              className={`flex items-center gap-2 px-4 py-2.5 rounded-xl text-sm font-bold transition-all ${
                filterStatus === 'initial'
                  ? 'bg-amber-600 text-white shadow-md'
                  : 'text-amber-800 hover:bg-amber-50'
