    // --- PAGE: PROJECTS EXECUTION & APPROVAL DASHBOARD ---
// ================================================================
// MODULE: pages/ExecutionPage.js
// ================================================================
    function ExecutionPage({ allVisits, onUpdateVisit, onExport }) {
      const activeVisits = (allVisits || []).filter(v => !v.isDeleted);
      const [selectedVisitId, setSelectedVisitId] = useState(() => activeVisits[0]?.id || null);

      // Keep selectedVisit synced if list updates
      useEffect(() => {
        if (!selectedVisitId && activeVisits.length > 0) {
          setSelectedVisitId(activeVisits[0].id);
        }
      }, [activeVisits, selectedVisitId]);

      const currentVisit = activeVisits.find(v => v.id === selectedVisitId) || activeVisits[0] || null;

      const [filterStatus, setFilterStatus] = useState('all'); // 'all' | 'initial' | 'executed' | 'cancelled'
      const [filterRegion, setFilterRegion] = useState('');
      const [filterChurch, setFilterChurch] = useState('');
      const [filterSearch, setFilterSearch] = useState('');
      const [selectedCaseIds, setSelectedCaseIds] = useState({});
      
      const [executingCaseInfo, setExecutingCaseInfo] = useState(null);
      const [bulkConfirmInfo, setBulkConfirmInfo] = useState(null); // { title, cases: [...] }
      const [showImportModal, setShowImportModal] = useState(false);

      const [expandedRegions, setExpandedRegions] = useState({});
      const [expandedChurches, setExpandedChurches] = useState({});
      const toggleRegion = (r) => setExpandedRegions(prev => ({ ...prev, [r]: !prev[r] }));
      const toggleChurch = (c) => setExpandedChurches(prev => ({ ...prev, [c]: !prev[c] }));

      if (!currentVisit) {
        return (
          <div className="text-center py-20 bg-white rounded-2xl border border-gray-200 p-8 shadow-sm">
            <ListIcon size={48} className="mx-auto text-gray-300 mb-3" />
            <h3 className="text-lg font-bold text-gray-700 mb-1">لا توجد زيارات مسجلة للمتابعة</h3>
            <p className="text-sm text-gray-500">قم بتسجيل زيارة أولاً لتتمكن من مراجعة حالاتها واعتماد تنفيذها.</p>
          </div>
        );
      }

      // Collect all cases in current visit with church/group metadata
      const allCasesMeta = [];
      const serialMap = {};
      (currentVisit.churches || []).forEach(ch => {
        let churchS = 1;
        (ch.servantsGroups || []).forEach(sg => {
          (sg.cases || []).forEach(c => {
            serialMap[c.id] = churchS++;
            allCasesMeta.push({
              caseObj: c,
              churchId: ch.id,
              groupId: sg.id,
              churchName: ch.churchName || '',
              regionName: ch.regionName || '',
              villageName: ch.villageName || '',
              servantsNames: sg.servantsNames || ''
            });
          });
        });
      });

      // Status Counts
      const statusCounts = { all: 0, initial: 0, executed: 0, cancelled: 0 };
      allCasesMeta.forEach(m => {
        statusCounts.all++;
        const st = m.caseObj.status || 'initial';
        if (st === 'executed') statusCounts.executed++;
        else if (st === 'cancelled') statusCounts.cancelled++;
        else statusCounts.initial++;
      });

      // Filtered Churches & Cases
      const normSearch = normalizeArabicText(filterSearch.trim());
      const filteredChurches = (currentVisit.churches || []).map(ch => {
        if (filterRegion && ch.regionName !== filterRegion) return null;
        if (filterChurch && ch.churchName !== filterChurch) return null;

        const filteredGroups = (ch.servantsGroups || []).map(sg => {
          const filteredCases = (sg.cases || []).filter(c => {
            const st = c.status || 'initial';
            if (filterStatus !== 'all' && st !== filterStatus) return false;
            if (normSearch) {
              const nameMatch = normalizeArabicText(c.name || '').includes(normSearch);
              const typeMatch = normalizeArabicText(c.executedProjectType || c.projectType || '').includes(normSearch);
              const notesMatch = normalizeArabicText(c.notes || '').includes(normSearch);
              if (!nameMatch && !typeMatch && !notesMatch) return false;
            }
            return true;
          });

          if (filteredCases.length === 0) return null;
          return { ...sg, cases: filteredCases };
        }).filter(Boolean);

        if (filteredGroups.length === 0) return null;
        return { ...ch, servantsGroups: filteredGroups };
      }).filter(Boolean);

      // Financial Metrics
      let totalApprovedValue = 0;
      let totalExecutedValue = 0;
      let totalInstallments = 0;
      allCasesMeta.forEach(m => {
        const c = m.caseObj;
        const val = parseFloat(c.projectValue) || 0;
        const execVal = parseFloat(c.executedProjectValue) || val;
        const inst = parseFloat(c.installmentAmount) || 0;
        const execInst = parseFloat(c.executedInstallmentAmount) || inst;
        
        totalApprovedValue += val;
        if (c.status === 'executed') {
          totalExecutedValue += execVal;
          totalInstallments += execInst;
        } else {
          totalInstallments += inst;
        }
      });

      const executionPercentage = statusCounts.all > 0 ? Math.round((statusCounts.executed / statusCounts.all) * 100) : 0;

      // Unique Filter Options
      const uniqueRegions = Array.from(new Set((currentVisit.churches || []).map(ch => ch.regionName).filter(Boolean))).sort();
      const uniqueChurches = Array.from(new Set((currentVisit.churches || []).filter(ch => !filterRegion || ch.regionName === filterRegion).map(ch => ch.churchName).filter(Boolean))).sort();

      // Handlers
      const handleSingleQuickExecute = (caseObj, churchId, groupId) => {
        const updatedChurches = (currentVisit.churches || []).map(ch => ch.id === churchId ? {
          ...ch,
          servantsGroups: (ch.servantsGroups || []).map(sg => sg.id === groupId ? {
            ...sg,
            cases: (sg.cases || []).map(c => c.id === caseObj.id ? {
              ...c,
              status: 'executed',
              executedProjectValue: c.executedProjectValue || c.projectValue,
              executedInstallmentAmount: c.executedInstallmentAmount || c.installmentAmount,
              executedProjectType: c.executedProjectType || c.projectType,
              executionDate: c.executionDate || new Date().toISOString().split('T')[0]
            } : c)
          } : sg)
        } : ch);
        onUpdateVisit({ ...currentVisit, churches: updatedChurches });
      };

      const handleRevertToInitial = (caseId, churchId, groupId) => {
        const updatedChurches = (currentVisit.churches || []).map(ch => ch.id === churchId ? {
          ...ch,
          servantsGroups: (ch.servantsGroups || []).map(sg => sg.id === groupId ? {
            ...sg,
            cases: (sg.cases || []).map(c => c.id === caseId ? {
              ...c,
              status: 'initial'
            } : c)
          } : sg)
        } : ch);
        onUpdateVisit({ ...currentVisit, churches: updatedChurches });
      };

      const handleSaveExecutionCase = (updatedCase) => {
        if (!executingCaseInfo) return;
        const { churchId, groupId } = executingCaseInfo;
        const updatedChurches = (currentVisit.churches || []).map(ch => ch.id === churchId ? {
          ...ch,
          servantsGroups: (ch.servantsGroups || []).map(sg => sg.id === groupId ? {
            ...sg,
            cases: (sg.cases || []).map(c => c.id === updatedCase.id ? updatedCase : c)
          } : sg)
        } : ch);
        onUpdateVisit({ ...currentVisit, churches: updatedChurches });
        setExecutingCaseInfo(null);
      };

      const handleExecuteBulkConfirmed = (casesToExecute, execDate, notes) => {
        const targetIds = new Set(casesToExecute.map(m => m.caseObj.id));
        const updatedChurches = (currentVisit.churches || []).map(ch => ({
          ...ch,
          servantsGroups: (ch.servantsGroups || []).map(sg => ({
            ...sg,
            cases: (sg.cases || []).map(c => {
              if (targetIds.has(c.id)) {
                return {
                  ...c,
                  status: 'executed',
                  executedProjectValue: c.executedProjectValue || c.projectValue,
                  executedInstallmentAmount: c.executedInstallmentAmount || c.installmentAmount,
                  executedProjectType: c.executedProjectType || c.projectType,
                  executionDate: execDate || new Date().toISOString().split('T')[0],
                  executionNotes: notes ? (c.executionNotes ? `${c.executionNotes} | ${notes}` : notes) : (c.executionNotes || '')
                };
              }
              return c;
            })
          }))
        }));
        onUpdateVisit({ ...currentVisit, churches: updatedChurches });
        setBulkConfirmInfo(null);
        setSelectedCaseIds({});
        alert(`تم بنجاح اعتماد وتأكيد تنفيذ ${casesToExecute.length} حالة!`);
      };

      const handleApplyExcelUpdates = (selectedMatches, execDate) => {
        const updatedChurches = (currentVisit.churches || []).map(ch => ({
          ...ch,
          servantsGroups: (ch.servantsGroups || []).map(sg => ({
            ...sg,
            cases: (sg.cases || []).map(c => {
              const match = selectedMatches.find(m => m.existing.caseObj.id === c.id);
              if (match) {
                return {
                  ...c,
                  status: 'executed',
                  executedProjectType: match.excelData.projectType || c.projectType,
                  executedProjectValue: match.excelData.projectValue || c.projectValue,
                  executedInstallmentAmount: match.excelData.installmentAmount || c.installmentAmount,
                  executionDate: execDate || new Date().toISOString().split('T')[0],
                  executionNotes: match.excelData.notes || c.notes || ''
                };
              }
              return c;
            })
          }))
        }));
        onUpdateVisit({ ...currentVisit, churches: updatedChurches });
        setShowImportModal(false);
        alert(`تم بنجاح تحديث وتأكيد تنفيذ ${selectedMatches.length} حالة من ملف الإكسيل!`);
      };

      // Multi-Select Helpers
      const selectedCount = Object.values(selectedCaseIds).filter(Boolean).length;
      const toggleSelectCase = (id) => {
        setSelectedCaseIds(prev => ({ ...prev, [id]: !prev[id] }));
      };
      const handleSelectAllFiltered = () => {
        const newSel = { ...selectedCaseIds };
        const visibleCases = filteredChurches.flatMap(ch => (ch.servantsGroups || []).flatMap(sg => sg.cases || []));
        const allAlreadySelected = visibleCases.every(c => newSel[c.id]);
        visibleCases.forEach(c => {
          newSel[c.id] = !allAlreadySelected;
        });
        setSelectedCaseIds(newSel);
      };

      // Bulk action triggers
      const triggerApproveEntireVisit = () => {
        const pending = allCasesMeta.filter(m => (m.caseObj.status || 'initial') !== 'executed');
        if (pending.length === 0) {
          alert('جميع حالات هذه الزيارة معتمدة ومنفذة بالفعل!');
          return;
        }
        setBulkConfirmInfo({
          title: `زيارة "${currentVisit.location || 'الزيارة الحالية'}" بالكامل`,
          cases: pending
        });
      };

      const triggerApproveRegion = (regionName) => {
        const pending = allCasesMeta.filter(m => m.regionName === regionName && (m.caseObj.status || 'initial') !== 'executed');
        if (pending.length === 0) {
          alert(`جميع حالات منطقة ${regionName} معتمدة ومنفذة بالفعل!`);
          return;
        }
        setBulkConfirmInfo({
          title: `منطقة "${regionName}" (${pending.length} حالة متبقية)`,
          cases: pending
        });
      };

      const triggerApproveChurch = (churchId, churchName) => {
        const pending = allCasesMeta.filter(m => m.churchId === churchId && (m.caseObj.status || 'initial') !== 'executed');
        if (pending.length === 0) {
          alert(`جميع حالات كنيسة ${churchName} معتمدة ومنفذة بالفعل!`);
          return;
        }
        setBulkConfirmInfo({
          title: `كنيسة "${churchName}" (${pending.length} حالة متبقية)`,
          cases: pending
        });
      };

      const triggerApproveSelected = () => {
        const selectedMetas = allCasesMeta.filter(m => selectedCaseIds[m.caseObj.id] && (m.caseObj.status || 'initial') !== 'executed');
        if (selectedMetas.length === 0) {
          alert('يرجى تحديد حالات بانتظار الاعتماد لتنفيذها.');
          return;
        }
        setBulkConfirmInfo({
          title: `${selectedMetas.length} حالة محددة`,
          cases: selectedMetas
        });
      };

      return (
        <div className="animate-fade-in pb-16 space-y-6">
          {/* HEADER & VISIT SELECTOR */}
          <div className="bg-white rounded-2xl shadow-sm border border-gray-200 p-5 sm:p-6 flex flex-col lg:flex-row justify-between items-start lg:items-center gap-4">
            <div className="flex-1 w-full lg:w-auto">
              <div className="flex items-center gap-2 mb-2">
                <span className="p-2 rounded-xl bg-amber-500/10 text-amber-600 font-bold text-xl">⚡</span>
                <div>
                  <h2 className="text-xl sm:text-2xl font-black text-[#002f6c]">متابعة واعتماد تنفيذ المشاريع</h2>
                  <p className="text-xs text-gray-500">مراجعة الحالات على الأرض، تعديل القيم المنفذة، واعتماد التنفيذ فردياً أو بالجملة</p>
                </div>
              </div>

              <div className="flex flex-wrap items-center gap-3 mt-3">
                <label className="text-xs font-bold text-gray-700 whitespace-nowrap">الزيارة الحالية:</label>
                <select 
                  value={selectedVisitId || ''} 
                  onChange={e => setSelectedVisitId(e.target.value)} 
                  className="bg-blue-50/70 border border-blue-200 rounded-lg px-3 py-1.5 text-sm font-bold text-[#002f6c] outline-none focus:ring-2 focus:ring-[#002f6c]/20 cursor-pointer"
                >
                  {activeVisits.map(v => (
                    <option key={v.id} value={v.id}>
                      {v.location || 'زيارة بدون اسم'} ({v.date})
                    </option>
                  ))}
                </select>
              </div>
            </div>

            <div className="grid grid-cols-1 sm:grid-cols-3 gap-2.5 w-full lg:w-auto">
              {/* 1. Export Button */}
              <button 
                type="button"
                onClick={() => onExport(currentVisit)} 
                className="flex items-center justify-center gap-2.5 bg-amber-50/60 border-2 border-amber-400 text-amber-900 hover:bg-amber-100 py-2.5 px-3.5 rounded-xl transition-all shadow-xs text-right"
              >
                <Download size={20} className="text-amber-700 shrink-0" />
                <div className="flex flex-col text-right">
                  <span className="text-xs sm:text-sm font-bold">تحميل كشف للميدان (Excel)</span>
                  <span className="text-[10px] text-amber-700 font-medium">طباعة أو إرسال لمسؤول القرية</span>
                </div>
              </button>

              {/* 2. Import Button */}
              {!isReadOnly && (
                <button 
                  type="button"
                  onClick={() => setShowImportModal(true)} 
                  className="flex items-center justify-center gap-2.5 bg-emerald-600 hover:bg-emerald-700 text-white py-2.5 px-3.5 rounded-xl shadow-sm transition-all text-right"
                >
                  <Upload size={20} className="shrink-0 text-emerald-100" />
                  <div className="flex flex-col text-right">
                    <span className="text-xs sm:text-sm font-bold">رفع كشف التنفيذ (Excel)</span>
                    <span className="text-[10px] text-emerald-100 font-medium">تحديث واعتماد تلقائي من الملف</span>
                  </div>
                </button>
              )}

              {/* 3. Bulk Approve Button */}
              {!isReadOnly && (
                <button 
                  type="button"
                  onClick={triggerApproveEntireVisit} 
                  className="flex items-center justify-center gap-2 bg-[#002f6c] hover:bg-[#001f4c] text-white py-2.5 px-4 rounded-xl shadow-md transition-all text-right ring-2 ring-[#002f6c]/20"
                >
                  <span className="text-lg shrink-0">🚀</span>
                  <div className="flex flex-col text-right">
                    <span className="text-xs sm:text-sm font-bold">اعتماد الزيارة بالكامل</span>
                    <span className="text-[10px] text-blue-200 font-medium">تأكيد تنفيذ كل الحالات دفعة واحدة</span>
                  </div>
                </button>
              )}
            </div>
          </div>

          {/* Quick Explanatory Guidance Banner for Mobile and New Users */}
          <div className="bg-gradient-to-r from-blue-50/90 via-amber-50/50 to-emerald-50/80 border border-blue-200/80 rounded-2xl p-3.5 sm:p-4 text-xs shadow-xs">
            <div className="flex items-start gap-2.5">
              <span className="text-base sm:text-lg shrink-0">💡</span>
              <div className="space-y-1 text-gray-700 leading-relaxed">
                <span className="font-bold text-[#002f6c] block text-xs sm:text-sm">كيف تتم دورة اعتماد وتنفيذ مشاريع الزيارة؟</span>
                <div className="grid grid-cols-1 sm:grid-cols-3 gap-2 pt-1 font-medium text-[11px] sm:text-xs">
                  <div className="bg-white/80 p-2 rounded-lg border border-amber-200/70 flex items-center gap-2">
                    <span className="font-bold text-amber-800 bg-amber-100 px-1.5 py-0.5 rounded">1</span>
                    <span><strong>حمّل كشف الميدان (Excel)</strong> وابعته لمسؤول القرية للتسجيل أثناء النزول.</span>
                  </div>
                  <div className="bg-white/80 p-2 rounded-lg border border-emerald-200/70 flex items-center gap-2">
                    <span className="font-bold text-emerald-800 bg-emerald-100 px-1.5 py-0.5 rounded">2</span>
                    <span><strong>ارفع الملف المعدل</strong> بعد انتهاء النزول ليعتمد التطبيق الحالات تلقائياً.</span>
                  </div>
                  <div className="bg-white/80 p-2 rounded-lg border border-blue-200/70 flex items-center gap-2">
                    <span className="font-bold text-blue-800 bg-blue-100 px-1.5 py-0.5 rounded">3</span>
                    <span>أو اضغط <strong>اعتماد الزيارة بالكامل</strong> لو اتنفذت بنفس القيم بدون تعديلات.</span>
                  </div>
                </div>
              </div>
            </div>
          </div>

          {/* KPI STATS CARDS */}
          <div className="grid grid-cols-2 lg:grid-cols-5 gap-4">
            <div className="bg-white p-4 rounded-2xl border border-gray-200 shadow-sm flex flex-col justify-between">
              <span className="text-xs font-semibold text-gray-500">إجمالي الحالات</span>
              <div className="flex items-baseline justify-between mt-2">
                <span className="text-2xl font-black text-[#002f6c] font-sans">{formatNumber(statusCounts.all)}</span>
                <span className="text-xs text-gray-400">مشروع</span>
              </div>
            </div>

            <div className="bg-amber-50/70 p-4 rounded-2xl border border-amber-200 shadow-sm flex flex-col justify-between">
              <span className="text-xs font-semibold text-amber-800">بانتظار التنفيذ (مبدئية)</span>
              <div className="flex items-baseline justify-between mt-2">
                <span className="text-2xl font-black text-amber-700 font-sans">{formatNumber(statusCounts.initial)}</span>
                <span className="text-xs font-bold text-amber-800 font-sans">{formatNumber(totalApprovedValue)} ج.م</span>
              </div>
            </div>

            <div className="bg-emerald-50/70 p-4 rounded-2xl border border-emerald-200 shadow-sm flex flex-col justify-between">
              <span className="text-xs font-semibold text-emerald-800">منفذة فعلياً ومؤكدة</span>
              <div className="flex items-baseline justify-between mt-2">
                <span className="text-2xl font-black text-emerald-700 font-sans">{formatNumber(statusCounts.executed)}</span>
                <span className="text-xs font-bold text-emerald-800 font-sans">{formatNumber(totalExecutedValue)} ج.م</span>
              </div>
            </div>

            <div className="bg-rose-50/70 p-4 rounded-2xl border border-rose-200 shadow-sm flex flex-col justify-between">
              <span className="text-xs font-semibold text-rose-800">لم تُنفّذ / ملغاة</span>
              <div className="flex items-baseline justify-between mt-2">
                <span className="text-2xl font-black text-rose-700 font-sans">{formatNumber(statusCounts.cancelled)}</span>
                <span className="text-xs text-rose-600">حالة</span>
              </div>
            </div>

            <div className="bg-white p-4 rounded-2xl border border-gray-200 shadow-sm flex flex-col justify-between col-span-2 lg:col-span-1">
              <div className="flex justify-between items-center text-xs font-semibold text-gray-600 mb-1">
                <span>نسبة التنفيذ</span>
                <span className="font-bold text-[#002f6c] font-sans">{executionPercentage}%</span>
              </div>
              <div className="w-full bg-gray-200 h-2.5 rounded-full overflow-hidden mt-1">
                <div 
                  className="bg-emerald-500 h-full rounded-full transition-all duration-500" 
                  style={{ width: `${Math.min(100, Math.max(0, executionPercentage))}%` }}
                />
              </div>
              <span className="text-[11px] text-gray-400 mt-2 font-sans">إجمالي الأقساط: {formatNumber(totalInstallments)} ج.م</span>
            </div>
          </div>

          {/* STATUS FILTER TABS */}
          <div className="bg-white p-2 rounded-2xl shadow-sm border border-gray-200 flex flex-wrap items-center gap-2">
            <button
              onClick={() => setFilterStatus('all')}
              className={`flex items-center gap-2 px-4 py-2.5 rounded-xl text-sm font-bold transition-all ${
                filterStatus === 'all'
                  ? 'bg-[#002f6c] text-white shadow-md'
                  : 'text-gray-600 hover:bg-gray-100'
              }`}
            >
              <span>🌐 كل الحالات</span>
              <span className={`px-2 py-0.5 rounded-full text-xs font-sans ${filterStatus === 'all' ? 'bg-white/20 text-white' : 'bg-gray-200 text-gray-700'}`}>
                {formatNumber(statusCounts.all)}
              </span>
            </button>

            <button
              onClick={() => setFilterStatus('initial')}
              className={`flex items-center gap-2 px-4 py-2.5 rounded-xl text-sm font-bold transition-all ${
                filterStatus === 'initial'
                  ? 'bg-amber-600 text-white shadow-md'
                  : 'text-amber-800 hover:bg-amber-50'
              }`}
            >
              <span>⏳ بانتظار الاعتماد (موافقة مبدئية)</span>
              <span className={`px-2 py-0.5 rounded-full text-xs font-sans ${filterStatus === 'initial' ? 'bg-white/20 text-white' : 'bg-amber-100 text-amber-900'}`}>
                {formatNumber(statusCounts.initial)}
              </span>
            </button>

            <button
              onClick={() => setFilterStatus('executed')}
              className={`flex items-center gap-2 px-4 py-2.5 rounded-xl text-sm font-bold transition-all ${
                filterStatus === 'executed'
                  ? 'bg-emerald-600 text-white shadow-md'
                  : 'text-emerald-800 hover:bg-emerald-50'
              }`}
            >
              <span>✅ منفذة ومعتمدة فعلياً</span>
              <span className={`px-2 py-0.5 rounded-full text-xs font-sans ${filterStatus === 'executed' ? 'bg-white/20 text-white' : 'bg-emerald-100 text-emerald-900'}`}>
                {formatNumber(statusCounts.executed)}
              </span>
            </button>

            <button
              onClick={() => setFilterStatus('cancelled')}
              className={`flex items-center gap-2 px-4 py-2.5 rounded-lg text-sm font-bold transition-all ${
                filterStatus === 'cancelled'
                  ? 'bg-rose-600 text-white shadow-md'
                  : 'text-rose-700 hover:bg-rose-50'
              }`}
            >
              <span>❌ لم تُنفّذ / ملغاة</span>
              <span className={`px-2 py-0.5 rounded-full text-xs font-sans ${filterStatus === 'cancelled' ? 'bg-white/20 text-white' : 'bg-rose-100 text-rose-800'}`}>
                {formatNumber(statusCounts.cancelled)}
              </span>
            </button>
          </div>

          {/* SEARCH & FILTERS BAR */}
          <div className="bg-white rounded-2xl shadow-sm border border-gray-200 p-4 sm:p-5">
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
              <div>
                <label className="block text-xs font-bold text-gray-500 mb-1">بحث بالاسم أو نوع المشروع</label>
                <div className="relative">
                  <input 
                    type="text" 
                    value={filterSearch} 
                    onChange={e => setFilterSearch(e.target.value)} 
                    placeholder="ابحث عن اسم الحالة..." 
                    className="w-full text-sm border border-gray-200 rounded-xl py-2 pr-9 pl-3 outline-none focus:border-[#002f6c] focus:ring-1 focus:ring-[#002f6c]"
                  />
                  <Search size={16} className="absolute right-3 top-2.5 text-gray-400" />
                </div>
              </div>

              <div>
                <label className="block text-xs font-bold text-gray-500 mb-1">تصفية حسب المنطقة</label>
                <select 
                  value={filterRegion} 
                  onChange={e => { setFilterRegion(e.target.value); setFilterChurch(''); }} 
                  className="w-full text-sm border border-gray-200 rounded-xl py-2 px-3 outline-none focus:border-[#002f6c] bg-gray-50"
                >
                  <option value="">كل المناطق ({formatNumber(uniqueRegions.length)})</option>
                  {uniqueRegions.map(r => <option key={r} value={r}>{r}</option>)}
                </select>
              </div>

              <div>
                <label className="block text-xs font-bold text-gray-500 mb-1">تصفية حسب الكنيسة</label>
                <select 
                  value={filterChurch} 
                  onChange={e => setFilterChurch(e.target.value)} 
                  className="w-full text-sm border border-gray-200 rounded-xl py-2 px-3 outline-none focus:border-[#002f6c] bg-gray-50"
                >
                  <option value="">كل الكنائس ({formatNumber(uniqueChurches.length)})</option>
                  {uniqueChurches.map(c => <option key={c} value={c}>{c}</option>)}
                </select>
              </div>

              <div className="flex items-end gap-2">
                {(filterSearch || filterRegion || filterChurch || filterStatus !== 'all') && (
                  <button 
                    onClick={() => { setFilterSearch(''); setFilterRegion(''); setFilterChurch(''); setFilterStatus('all'); }} 
                    className="w-full flex items-center justify-center gap-1.5 text-xs font-bold text-rose-600 bg-rose-50 hover:bg-rose-100 py-2.5 px-3 rounded-xl transition-colors border border-rose-200"
                  >
                    <RotateCcw size={14} />
                    <span>إعادة ضبط الفلاتر</span>
                  </button>
                )}
              </div>
            </div>
          </div>

          {/* FLOATING / FIXED MULTI-SELECT ACTION BAR */}
          {selectedCount > 0 && (
            <div className="sticky top-20 z-20 bg-[#002f6c] text-white p-3.5 rounded-2xl shadow-xl border border-blue-400/30 flex flex-wrap items-center justify-between gap-3 animate-fade-in">
              <div className="flex items-center gap-2">
                <span className="w-7 h-7 rounded-full bg-amber-400 text-[#002f6c] flex items-center justify-center font-black text-sm">
                  {formatNumber(selectedCount)}
                </span>
                <span className="text-sm font-bold">تم تحديد {formatNumber(selectedCount)} حالة</span>
              </div>

              <div className="flex items-center gap-2">
                {!isReadOnly && (
                  <button 
                    onClick={triggerApproveSelected} 
                    className="bg-emerald-500 hover:bg-emerald-600 text-white text-xs sm:text-sm font-black px-4 py-2 rounded-xl shadow transition-all flex items-center gap-1.5"
                  >
                    <CheckCircle size={16} />
                    <span>اعتماد الحالات المحددة للتنفيذ ({formatNumber(selectedCount)})</span>
                  </button>
                )}
                <button 
                  onClick={() => setSelectedCaseIds({})} 
                  className="bg-white/10 hover:bg-white/20 text-white text-xs font-bold px-3 py-2 rounded-xl transition-colors"
                >
                  إلغاء التحديد
                </button>
              </div>
            </div>
          )}

          {/* HIERARCHICAL ACCORDIONS: REGIONS -> CHURCHES -> CASES */}
          {filteredChurches.length === 0 ? (
            <div className="bg-white rounded-2xl border border-dashed border-gray-300 p-12 text-center text-gray-500">
              <Search size={40} className="mx-auto text-gray-300 mb-2" />
              <p className="font-bold text-base">لا توجد حالات مطابقة للبحث أو الفلتر المختار</p>
            </div>
          ) : (
            <div className="space-y-6">
              {(() => {
                const groupedByRegion = filteredChurches.reduce((acc, ch) => {
                  const r = ch.regionName || 'منطقة غير محددة';
                  if (!acc[r]) acc[r] = [];
                  acc[r].push(ch);
                  return acc;
                }, {});

                return Object.entries(groupedByRegion).map(([regionName, churchesInReg]) => {
                  // Region cases
                  const regMetas = allCasesMeta.filter(m => m.regionName === regionName);
                  const regPending = regMetas.filter(m => (m.caseObj.status || 'initial') !== 'executed');
                  const regExecuted = regMetas.filter(m => m.caseObj.status === 'executed');

                  const regStats = churchesInReg.reduce((acc, ch) => {
                    const s = getChurchStats(ch);
                    acc.totalChurches += 1;
                    acc.totalCases += s.totalCases;
                    acc.totalValue += s.totalValue;
                    return acc;
                  }, { totalChurches: 0, totalCases: 0, totalValue: 0 });

                  return (
                    <div key={regionName} className="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
                      {/* Region Header */}
                      <div 
                        onClick={() => toggleRegion(regionName)} 
                        className="p-4 sm:p-5 bg-gradient-to-r from-blue-50/90 to-indigo-50/50 border-b border-gray-200 flex flex-col md:flex-row justify-between items-start md:items-center gap-3 cursor-pointer hover:bg-blue-100/50 transition-colors"
                      >
                        <div className="flex flex-wrap items-center gap-3">
                          <span className="text-xl">🏛️</span>
                          <span className="font-black text-lg text-[#002f6c]">{regionName}</span>
                          <span className="bg-white text-[#002f6c] border border-blue-200 px-3 py-1 rounded-full text-xs font-bold shadow-sm font-sans">
                            {formatNumber(regStats.totalChurches)} كنائس
                          </span>
                          <span className="bg-white text-emerald-700 border border-emerald-200 px-3 py-1 rounded-full text-xs font-bold shadow-sm font-sans">
                            {formatNumber(regExecuted.length)} منفذ / {formatNumber(regMetas.length)} إجمالي
                          </span>
                        </div>

                        <div className="flex items-center gap-3 w-full md:w-auto justify-between md:justify-end">
                          {!isReadOnly && regPending.length > 0 && (
                            <button 
                              onClick={(e) => { e.stopPropagation(); triggerApproveRegion(regionName); }} 
                              className="bg-amber-600 hover:bg-amber-700 text-white text-xs font-bold px-3.5 py-1.5 rounded-lg shadow-sm flex items-center gap-1.5 transition-colors"
                              title="اعتماد كافة الحالات المتبقية في هذه المنطقة للتنفيذ"
                            >
                              <span>⚡</span>
                              <span>اعتماد منطقة {regionName} ({formatNumber(regPending.length)})</span>
                            </button>
                          )}
                          <div className="text-gray-400">
                            {expandedRegions[regionName] ? <ChevronUp size={22} /> : <ChevronDown size={22} />}
                          </div>
                        </div>
                      </div>

                      {/* Region Body: Churches */}
                      {expandedRegions[regionName] && (
                        <div className="p-4 sm:p-5 space-y-5 bg-gray-50/40">
                          {churchesInReg.map(ch => {
                            const chMetas = allCasesMeta.filter(m => m.churchId === ch.id);
                            const chPending = chMetas.filter(m => (m.caseObj.status || 'initial') !== 'executed');
                            const chExecuted = chMetas.filter(m => m.caseObj.status === 'executed');

                            return (
                              <div key={ch.id} className="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                                {/* Church Header */}
                                <div 
                                  onClick={() => toggleChurch(ch.id)} 
                                  className="p-3.5 sm:p-4 bg-gray-50 border-b border-gray-200 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 cursor-pointer hover:bg-gray-100 transition-colors"
                                >
                                  <div className="flex flex-wrap items-center gap-2">
                                    <span className="text-lg">⛪</span>
                                    <h4 className="font-bold text-[#002f6c] text-base">{ch.churchName}</h4>
                                    {ch.villageName && <span className="text-xs text-gray-500 font-medium">({ch.villageName})</span>}
                                    <span className="bg-white text-emerald-700 border border-emerald-200 px-2.5 py-0.5 rounded-full text-xs font-bold font-sans">
                                      {formatNumber(chExecuted.length)} منفذ من {formatNumber(chMetas.length)}
                                    </span>
                                  </div>

                                  <div className="flex items-center gap-2 w-full sm:w-auto justify-between sm:justify-end">
                                    {!isReadOnly && chPending.length > 0 && (
                                      <button 
                                        onClick={(e) => { e.stopPropagation(); triggerApproveChurch(ch.id, ch.churchName); }} 
                                        className="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-3 py-1.5 rounded-lg shadow-sm flex items-center gap-1 transition-colors"
                                        title="اعتماد كافة الحالات المتبقية في هذه الكنيسة للتنفيذ"
                                      >
                                        <span>⚡</span>
                                        <span>اعتماد كنيسة {ch.churchName} ({formatNumber(chPending.length)})</span>
                                      </button>
                                    )}
                                    <div className="text-gray-400">
                                      {expandedChurches[ch.id] ? <ChevronUp size={20} /> : <ChevronDown size={20} />}
                                    </div>
                                  </div>
                                </div>

                                {/* Church Body: Cases Table */}
                                {expandedChurches[ch.id] && (
                                  <div>
                                    {/* Desktop Table View */}
                                  <div className="hidden md:block p-0 overflow-x-auto">
                                    <table className="w-full text-sm text-right">
                                      <thead className="bg-[#002f6c] text-white text-xs">
                                        <tr>
                                          <th className="px-3 py-3 text-center w-10">
                                            <input 
                                              type="checkbox" 
                                              onChange={handleSelectAllFiltered}
                                              className="w-4 h-4 rounded text-[#002f6c] cursor-pointer"
                                              title="تحديد الكل"
                                            />
                                          </th>
                                          <th className="px-2 py-3 text-center w-12 font-bold"># كنيسة</th>
                                          <th className="px-3 py-3 min-w-[120px] font-bold">الخدام</th>
                                          <th className="px-3 py-3 min-w-[140px] font-bold">اسم الحالة</th>
                                          <th className="px-3 py-3 text-center min-w-[120px] font-bold">حالة المشروع</th>
                                          <th className="px-3 py-3 min-w-[120px] font-bold">نوع المشروع</th>

    // Modal to record payment or view installment schedule for a case
// ================================================================
// MODULE: components/InstallmentModal.js
// ================================================================
    function InstallmentModal({ caseObj, churchName, regionName, onSavePayments, onClose }) {
      const totalAmount = parseFloat(caseObj.executedProjectValue || caseObj.projectValue) || 0;
      const monthlyAmount = parseFloat(caseObj.executedInstallmentAmount || caseObj.installmentAmount) || 0;
      const totalMonths = monthlyAmount > 0 ? Math.ceil(totalAmount / monthlyAmount) : 0;
      
      const payments = caseObj.payments || [];
      const totalPaid = payments.reduce((sum, p) => sum + (parseFloat(p.amount) || 0), 0);
      const rawRemaining = Math.max(0, totalAmount - totalPaid);

      // Exemption (إعفاء الحالة لوفاة أو مرض)
      const isExempted = !!caseObj.isExempted;
      const exemptedAmount = isExempted
        ? (caseObj.exemptedAmount !== undefined ? parseFloat(caseObj.exemptedAmount) : rawRemaining)
        : 0;
      const remainingAmount = isExempted ? 0 : rawRemaining;
      const isCompleted = !isExempted && rawRemaining <= 0 && totalAmount > 0;
      const paidPercentage = totalAmount > 0 ? Math.min(100, Math.round((totalPaid / totalAmount) * 100)) : 0;

      // Exemption modal dialog state
      const [showExemptionDialog, setShowExemptionDialog] = useState(false);
      const [exemptionReason, setExemptionReason] = useState(caseObj.exemptionReason || 'وفاة المستفيد');
      const [exemptionNotes, setExemptionNotes] = useState(caseObj.exemptionNotes || '');
      const [exemptedDate, setExemptedDate] = useState(() => caseObj.exemptedAt || new Date().toISOString().split('T')[0]);

      const handleConfirmExemption = (e) => {
        if (e) e.preventDefault();
        if (!exemptionReason) {
          window.notifyWarning('يرجى اختيار سبب الإعفاء.');
          return;
        }
        const rem = Math.max(0, totalAmount - totalPaid);
        onSavePayments(payments, {
          isExempted: true,
          exemptionReason,
          exemptionNotes: exemptionNotes.trim(),
          exemptedAt: exemptedDate || new Date().toISOString().split('T')[0],
          exemptedAmount: rem
        });
        setShowExemptionDialog(false);
        window.notifySuccess('تم بنجاح تسجيل إعفاء الحالة وإسقاط باقي الأقساط.');
      };

      const handleCancelExemption = () => {
        window.showConfirm({
          title: 'إلغاء إعفاء الحالة',
          message: 'هل أنت متأكد من إلغاء الإعفاء واستئناف مطالبة الحالة بسداد باقي الأقساط؟',
          confirmText: 'نعم، إلغاء الإعفاء واستئناف السداد',
          cancelText: 'تراجع',
          onConfirm: () => {
            onSavePayments(payments, {
              isExempted: false,
              exemptionReason: '',
              exemptionNotes: '',
              exemptedAt: '',
              exemptedAmount: 0
            });
            window.notifySuccess('تم إلغاء الإعفاء واستئناف السداد بنجاح.');
          }
        });
      };

      // New payment form state (Always visible by default)
      const [newAmount, setNewAmount] = useState(() => {
        if (remainingAmount <= 0) return '';
        return monthlyAmount > 0 ? Math.min(monthlyAmount, remainingAmount) : remainingAmount;
      });
      const [newPaidDate, setNewPaidDate] = useState(() => new Date().toISOString().split('T')[0]);
      const [newNotes, setNewNotes] = useState('');

      const handleAddPayment = (e) => {
        e.preventDefault();
        const amt = parseFloat(newAmount);
        if (!amt || amt <= 0) {
          window.notifyWarning('يرجى إدخال مبلغ صحيح للسداد.');
          return;
        }

        const newPayment = {
          id: uuidv4(),
          amount: amt,
          paidDate: newPaidDate || new Date().toISOString().split('T')[0],
          notes: newNotes.trim()
        };

        const updatedPayments = [...payments, newPayment];
        onSavePayments(updatedPayments);
        window.notifySuccess(`تم بنجاح تسجيل دفعة سداد بمبلغ ${formatNumber(amt)} ج.م`);
        setNewNotes('');
        setNewPaidDate(new Date().toISOString().split('T')[0]);
        const newRem = Math.max(0, remainingAmount - amt);
        if (newRem > 0 && monthlyAmount > 0) {
          setNewAmount(Math.min(monthlyAmount, newRem));
        } else {
          setNewAmount('');
        }
      };

      // Edit payment state
      const [editingPaymentId, setEditingPaymentId] = useState(null);
      const [editAmount, setEditAmount] = useState('');
      const [editPaidDate, setEditPaidDate] = useState('');
      const [editNotes, setEditNotes] = useState('');

      const startEditingPayment = (p) => {
        setEditingPaymentId(p.id);
        setEditAmount(p.amount);
        setEditPaidDate(p.paidDate || new Date().toISOString().split('T')[0]);
        setEditNotes(p.notes || '');
      };

      const handleSaveEditedPayment = () => {
        const amt = parseFloat(editAmount);
        if (!amt || amt <= 0) {
          window.notifyWarning('يرجى إدخال مبلغ صحيح.');
          return;
        }
        const updatedPayments = payments.map(p => {
          if (p.id === editingPaymentId) {
            return {
              ...p,
              amount: amt,
              paidDate: editPaidDate || new Date().toISOString().split('T')[0],
              notes: (editNotes || '').trim()
            };
          }
          return p;
        });
        onSavePayments(updatedPayments);
        window.notifySuccess('تم تعديل بيانات دفعة السداد بنجاح!');
        setEditingPaymentId(null);
      };

      const cancelEditingPayment = () => {
        setEditingPaymentId(null);
      };

      const handleDeletePayment = (paymentId) => {
        window.showConfirm({
          title: 'حذف دفعة سداد',
          message: 'هل أنت متأكد من حذف هذه الدفعة المسجلة؟ سيتم إعادة حساب الرصيد والمتبقي تلقائياً.',
          confirmText: 'نعم، حذف الدفعة',
          cancelText: 'إلغاء',
          isDangerous: true,
          onConfirm: () => {
            const updatedPayments = payments.filter(p => p.id !== paymentId);
            onSavePayments(updatedPayments);
            window.notifySuccess('تم حذف الدفعة المسجلة بنجاح.');
          }
        });
      };

      // Generate expected monthly schedule with early deduction from the LAST installments
      const baseSchedule = [];
      const hasFirstDate = !!caseObj.firstInstallmentDate;
      const initialDate = hasFirstDate ? new Date(caseObj.firstInstallmentDate) : (caseObj.executionDate ? new Date(caseObj.executionDate) : new Date());
      
      for (let i = 1; i <= Math.max(totalMonths, 1); i++) {
        const dueDate = new Date(initialDate);
        if (hasFirstDate) {
          dueDate.setMonth(dueDate.getMonth() + (i - 1));
        } else {
          dueDate.setMonth(dueDate.getMonth() + i);
        }
        const expectedAmt = (i === totalMonths && totalAmount % monthlyAmount !== 0)
          ? (totalAmount - (totalMonths - 1) * monthlyAmount)
          : monthlyAmount;
        
        baseSchedule.push({
          monthNum: i,
          dueDateStr: dueDate.toISOString().split('T')[0],
          amount: expectedAmt,
          paidFromFront: 0,
          deductedFromBack: 0,
          status: 'pending' // 'paid' | 'partial' | 'pending' | 'back_deducted' | 'back_paid'
        });
      }

      // Calculate full monthly installments from the front vs excess from the back
      let fullMonths = 0;
      let excess = 0;
      let partialFront = 0;

      if (monthlyAmount > 0) {
        if (totalPaid < monthlyAmount) {
          partialFront = totalPaid;
        } else {
          fullMonths = Math.floor(totalPaid / monthlyAmount);
          excess = totalPaid - (fullMonths * monthlyAmount);
        }
      } else {
        fullMonths = totalMonths;
      }

      // 1. Apply full months from the front
      for (let i = 0; i < fullMonths && i < baseSchedule.length; i++) {
        baseSchedule[i].paidFromFront = baseSchedule[i].amount;
        baseSchedule[i].status = 'paid';
      }

      // 2. Partial payment for first month only if total paid is less than 1 full monthly installment
      if (partialFront > 0 && baseSchedule.length > 0) {
        baseSchedule[0].paidFromFront = partialFront;
        baseSchedule[0].status = 'partial';
      }

      // 3. Excess is deducted from the LAST installments backwards
      let remainingExcess = excess;
      for (let i = baseSchedule.length - 1; i >= fullMonths && remainingExcess > 0; i--) {
        const m = baseSchedule[i];
        const deductAmt = Math.min(remainingExcess, m.amount);
        m.deductedFromBack = deductAmt;
        remainingExcess -= deductAmt;

        if (m.deductedFromBack >= m.amount) {
          m.status = 'back_paid';
        } else if (m.deductedFromBack > 0) {
          m.status = 'back_deducted';
        }
      }

      const schedule = baseSchedule;
      const firstDueDate = baseSchedule.length > 0 ? baseSchedule[0].dueDateStr : '—';
      const lastDueDate = baseSchedule.length > 0 ? baseSchedule[baseSchedule.length - 1].dueDateStr : '—';

      // Overdue calculations
      const todayStr = new Date().toISOString().split('T')[0];
      let dueInstallmentsCount = 0;
      let expectedDueAmount = 0;
      baseSchedule.forEach(inst => {
        if (inst.dueDateStr <= todayStr) {
          dueInstallmentsCount++;
          expectedDueAmount += inst.amount;
        }
      });
      expectedDueAmount = Math.min(expectedDueAmount, totalAmount);

      let overdueAmount = 0;
      let overdueCount = 0;
      let isOverdue = false;
      if (!isExempted && totalPaid < expectedDueAmount && !isCompleted && remainingAmount > 0) {
        overdueAmount = Math.min(remainingAmount, expectedDueAmount - totalPaid);
        overdueCount = monthlyAmount > 0 ? Math.ceil(overdueAmount / monthlyAmount) : 1;
        isOverdue = true;
      }

      return (
        <div id="app-installment-modal" className="fixed inset-0 z-50 bg-black/60 backdrop-blur-xs flex items-center justify-center p-3 sm:p-4 overflow-y-auto animate-fade-in">
          <div className="bg-white rounded-2xl shadow-2xl w-full max-w-4xl max-h-[92vh] flex flex-col overflow-hidden border border-gray-100">
            {/* Modal Header */}
            <div className="bg-gradient-to-r from-[#002f6c] to-[#004b9b] text-white p-4 sm:p-5 flex justify-between items-center shrink-0">
              <div>
                <div className="flex items-center gap-2 flex-wrap">
                  <span className="text-xl">💳</span>
                  <h3 className="font-bold text-lg sm:text-xl">
                    سداد أقساط: {caseObj.caseName || caseObj.beneficiaryName || caseObj.name}
                  </h3>
                  {isExempted && (
                    <span className="bg-purple-500/90 text-white text-xs px-2.5 py-0.5 rounded-full font-bold border border-purple-300/40 shadow-xs">
                      💜 معفى من السداد ({caseObj.exemptionReason || 'وفاة المستفيد'})
                    </span>
                  )}
                </div>
                <div className="text-xs text-blue-100 mt-1 flex flex-wrap items-center gap-3">
                  <span>⛪ {churchName || '—'}</span>
                  <span>📍 {regionName || '—'}</span>
                  <span>💼 {caseObj.projectType || caseObj.caseType || 'مشروع'}</span>
                </div>
              </div>
              <div className="flex items-center gap-2">
                {!isExempted && !isCompleted && totalAmount > 0 && (
                  <button
                    type="button"
                    onClick={() => setShowExemptionDialog(true)}
                    className="bg-purple-600/90 hover:bg-purple-600 text-white text-xs font-bold px-3 py-1.5 rounded-lg border border-purple-400/40 transition-all flex items-center gap-1.5 shadow-xs"
                    title="إعفاء الحالة من باقي الأقساط لوفاة أو مرض"
                  >
                    <span>💜</span>
                    <span className="hidden sm:inline">إعفاء من السداد</span>
                  </button>
                )}
                <button
                  type="button"
                  onClick={onClose}
                  className="text-white/80 hover:text-white hover:bg-white/10 p-1.5 rounded-lg transition-colors"
                >
                  <X size={22} />
                </button>
              </div>
            </div>

            {/* Modal Body */}
            <div className="p-4 sm:p-6 space-y-5 overflow-y-auto">
              {/* Financial Quick Cards */}
              <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">

    // BATCH PAYMENT MODAL COMPONENT (سداد مجمع: للنزلة / المنطقة / الكنيسة)
    // ================================================================
    function BatchPaymentModal({
      title,
      targetCases,
      onConfirm,
      onClose
    }) {
      const [paidDate, setPaidDate] = useState(() => new Date().toISOString().split('T')[0]);
      const [notes, setNotes] = useState('سداد قسط شهري مجمع');

      // Track selected case IDs for payment (all selected by default)
      const [selectedCaseIds, setSelectedCaseIds] = useState(() => {
        return new Set(targetCases.map(item => (item.caseObj ? item.caseObj.id : item.id)));
      });

      // Toggle selection
      const toggleSelectCase = (id) => {
        setSelectedCaseIds(prev => {
          const next = new Set(prev);
          if (next.has(id)) next.delete(id);
          else next.add(id);
          return next;
        });
      };

      const toggleSelectAll = () => {
        if (selectedCaseIds.size === targetCases.length) {
          setSelectedCaseIds(new Set());
        } else {
          setSelectedCaseIds(new Set(targetCases.map(item => (item.caseObj ? item.caseObj.id : item.id))));
        }
      };

      // Calculate totals for selected cases
      let selectedCount = 0;
      let totalAmountToCollect = 0;

      targetCases.forEach(item => {
        const c = item.caseObj || item;
        const cid = c.id;
        if (selectedCaseIds.has(cid)) {
          selectedCount++;
          const total = parseFloat(c.executedProjectValue || c.projectValue) || 0;
          const monthly = parseFloat(c.executedInstallmentAmount || c.installmentAmount) || 0;
          const payments = c.payments || [];
          const paid = payments.reduce((sum, p) => sum + (parseFloat(p.amount) || 0), 0);
          const remaining = Math.max(0, total - paid);
          const payAmt = monthly > 0 ? Math.min(monthly, remaining) : remaining;
          totalAmountToCollect += payAmt;
        }
      });

      const handleSubmit = (e) => {
        e.preventDefault();
        if (selectedCaseIds.size === 0) {
          window.notifyWarning('برجاء تحديد حالة واحدة على الأقل للسداد.');
          return;
        }
        if (!paidDate) {
          window.notifyWarning('برجاء إدخال تاريخ السداد.');
          return;
        }
        onConfirm(paidDate, notes, Array.from(selectedCaseIds));
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-4 bg-black/60 backdrop-blur-sm animate-fade-in overflow-y-auto">
          <div className="bg-white rounded-3xl shadow-2xl border border-gray-100 w-full max-w-3xl overflow-hidden my-auto max-h-[90vh] flex flex-col">
            {/* Modal Header */}
            <div className="p-5 bg-gradient-to-r from-emerald-800 to-teal-900 text-white flex justify-between items-center shrink-0">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-2xl bg-white/10 flex items-center justify-center border border-white/20">
                  <CreditCard size={22} className="text-emerald-300" />
                </div>
                <div>
                  <h3 className="font-bold text-lg sm:text-xl text-white">{title || 'سداد أقساط مجمع'}</h3>
                  <p className="text-xs text-emerald-100/80 mt-0.5">
                    تسجيل سداد قسط شهري لعدة حالات دفعة واحدة تلقائياً
                  </p>
                </div>
              </div>
              <button
                type="button"
                onClick={onClose}
                className="text-white/80 hover:text-white p-2 rounded-xl hover:bg-white/10 transition-colors"

                <X size={20} />

            </div>

            {/* Modal Body */}
            <form onSubmit={handleSubmit} className="p-5 space-y-5 overflow-y-auto flex-1">
              {/* Quick Metrics Cards */}
              <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                <div className="bg-emerald-50 rounded-2xl p-3 border border-emerald-100 flex flex-col justify-between">
                  <span className="text-xs text-emerald-800 font-bold">الحالات المحددة للسداد</span>
                  <div className="text-xl font-bold font-sans text-emerald-950 mt-1">
                    {formatNumber(selectedCount)} <span className="text-xs font-normal text-emerald-700">من {targetCases.length} حالة</span>
                  </div>
                </div>

                <div className="bg-blue-50 rounded-2xl p-3 border border-blue-100 flex flex-col justify-between">
                  <span className="text-xs text-blue-800 font-bold">إجمالي المبلغ المراد تحصيله</span>
                  <div className="text-xl font-bold font-sans text-blue-950 mt-1">
                    {formatNumber(totalAmountToCollect)} <span className="text-xs font-normal text-blue-700">ج.م</span>

                  <span className="text-xs text-amber-800 font-bold">تاريخ السداد المسجل</span>

                  <input

                    type="text"

                    className="text-xs font-bold text-emerald-700 hover:text-emerald-900 underline"

                </div>

                <div className="border border-gray-200 rounded-2xl overflow-hidden max-h-64 overflow-y-auto">
                  <table className="w-full text-right text-xs">
                    <thead className="bg-gray-100 text-gray-700 font-bold sticky top-0 border-b border-gray-200 z-10">
                      <tr>
                        <th className="p-2.5 w-10 text-center">
                          <input
                            type="checkbox"
                            checked={selectedCaseIds.size === targetCases.length && targetCases.length > 0}
                            onChange={toggleSelectAll}
                            className="rounded text-emerald-600 focus:ring-emerald-500 w-4 h-4 cursor-pointer"
                          />
                        </th>
                        <th className="p-2.5">المستفيد</th>
                        <th className="p-2.5">الكنيسة / المنطقة</th>
                        <th className="p-2.5">المتبقي</th>
                        <th className="p-2.5">قيمة القسط المسدد</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-gray-100">
                      {targetCases.map(item => {
                        const c = item.caseObj || item;
                        const cid = c.id;
                        const total = parseFloat(c.executedProjectValue || c.projectValue) || 0;
                        const monthly = parseFloat(c.executedInstallmentAmount || c.installmentAmount) || 0;
                        const payments = c.payments || [];
                        const paid = payments.reduce((sum, p) => sum + (parseFloat(p.amount) || 0), 0);
                        const remaining = Math.max(0, total - paid);
                        const payAmt = monthly > 0 ? Math.min(monthly, remaining) : remaining;
                        const isSelected = selectedCaseIds.has(cid);

                        return (
                          <tr
                            key={cid}
                            onClick={() => toggleSelectCase(cid)}
                            className={`cursor-pointer transition-colors ${isSelected ? 'bg-emerald-50/40 hover:bg-emerald-50' : 'bg-gray-50/50 hover:bg-gray-100 opacity-60'}`}
                          >
                            <td className="p-2.5 text-center" onClick={(e) => e.stopPropagation()}>
                              <input
                                type="checkbox"
                                checked={isSelected}
                                onChange={() => toggleSelectCase(cid)}
                                className="rounded text-emerald-600 focus:ring-emerald-500 w-4 h-4 cursor-pointer"
                              />
                            </td>
                            <td className="p-2.5 font-bold text-gray-900">
                              <div>{c.caseName}</div>
                              <div className="text-[10px] text-gray-500 font-normal">
                                {c.executedProjectType || c.projectType || 'مشروع'}
                              </div>
                            </td>
                            <td className="p-2.5 text-gray-600">
                              <div>{item.churchName || '—'}</div>
                              {item.regionName && <div className="text-[10px] text-gray-400">{item.regionName}</div>}
                              {item.visitDate && (
                                <div className="text-[10px] text-blue-600 font-sans mt-0.5">
                                  🏛️ {item.visitLocation ? `${item.visitLocation} • ` : ''}{item.visitDate}
                                </div>
                              )}
                            </td>
                            <td className="p-2.5 font-sans font-bold text-rose-700">
                              {formatNumber(remaining)} ج.م
                            </td>
                            <td className="p-2.5 font-sans font-bold text-emerald-700">
                              {formatNumber(payAmt)} ج.م
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              </div>

              {/* Action Buttons */}
              <div className="pt-3 border-t border-gray-100 flex flex-col-reverse sm:flex-row justify-end items-center gap-3">
                <button
                  type="button"
                  onClick={onClose}
                  className="w-full sm:w-auto px-5 py-2.5 rounded-xl border border-gray-300 text-gray-700 text-xs font-bold hover:bg-gray-50 transition-colors"
                >
                  إلغاء

                <button
                  type="submit"
                  disabled={selectedCount === 0}
                  className="w-full sm:w-auto px-6 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 disabled:opacity-50 text-white text-xs font-bold shadow-md shadow-emerald-600/20 flex items-center justify-center gap-2 transition-all"
                >
                  <CheckCircle size={16} />
                  <span>تأكيد تسجيل السداد ({selectedCount} حالة • {formatNumber(totalAmountToCollect)} ج.م)</span>
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    function AddLegacyProjectModal({ allVisits, onUpdateVisit, onClose, onOpenImportExcel }) {
      const activeVisits = (allVisits || []).filter(v => !v.isDeleted);

      // Unique lists for auto-suggest
      const existingRegions = Array.from(new Set(activeVisits.flatMap(v => (v.churches || []).map(ch => ch.regionName)).filter(Boolean))).sort();
      const existingChurches = Array.from(new Set(activeVisits.flatMap(v => (v.churches || []).map(ch => ch.churchName)).filter(Boolean))).sort();
      const rawTypes = activeVisits.flatMap(v => (v.churches || []).flatMap(ch => (ch.servantsGroups || []).flatMap(sg => (sg.cases || []).map(c => c.executedProjectType || c.projectType))));
      const dictTypes = buildEffectiveProjectDictionary(allVisits).map(c => c.name);
      const existingTypes = Array.from(new Set([...rawTypes, ...dictTypes].filter(Boolean))).sort();

      // Target visit selector & custom naming
      const [targetVisitChoice, setTargetVisitChoice] = useState('new_custom');
      const [customVisitLocation, setCustomVisitLocation] = useState('');
      const [customVisitDate, setCustomVisitDate] = useState(() => new Date().toISOString().split('T')[0]);

      // Form state
      const [caseName, setCaseName] = useState('');
      const [nationalId, setNationalId] = useState('');
      const [regionName, setRegionName] = useState('');
      const [churchName, setChurchName] = useState('');
      const [villageName, setVillageName] = useState('');
      const [projectType, setProjectType] = useState('');
      const [projectValue, setProjectValue] = useState('');
      const [installmentAmount, setInstallmentAmount] = useState('');
      const [executionDate, setExecutionDate] = useState(() => new Date().toISOString().split('T')[0]);
      const [alreadyPaidAmount, setAlreadyPaidAmount] = useState('');
      const [notes, setNotes] = useState('');

      const handleSubmit = (e) => {
        e.preventDefault();
        const pVal = parseFloat(projectValue);
        const instAmt = parseFloat(installmentAmount);
        if (!caseName.trim()) { alert('يرجى كتابة اسم الحالة / المستفيد.'); return; }
        if (!pVal || pVal <= 0) { alert('يرجى إدخال قيمة صحيحة للمشروع.'); return; }
        if (!instAmt || instAmt <= 0) { alert('يرجى إدخال قيمة صحيحة للقسط الشهري.'); return; }
        if (!churchName.trim()) { alert('يرجى إدخال اسم الكنيسة.'); return; }

        const paidPrev = parseFloat(alreadyPaidAmount) || 0;

        const newCase = {
          id: uuidv4(),
          caseName: caseName.trim(),
          nationalId: nationalId.trim(),
          projectType: projectType.trim() || 'مشروع سابق',
          executedProjectType: projectType.trim() || 'مشروع سابق',
          projectValue: pVal,
          executedProjectValue: pVal,
          installmentAmount: instAmt,
          executedInstallmentAmount: instAmt,
          executionDate: executionDate || new Date().toISOString().split('T')[0],
          status: 'executed',
          notes: notes.trim(),
          payments: paidPrev > 0 ? [
            {
              id: uuidv4(),
              amount: paidPrev,
              paidDate: executionDate || new Date().toISOString().split('T')[0],
              notes: 'مسدد سابقاً قبل استخدام التطبيق'
            }
          ] : []
        };

        // Determine target visit object
        let targetVisit = null;
        if (targetVisitChoice === 'new_custom') {
          const cleanLoc = customVisitLocation.trim();
          if (!cleanLoc) {
            alert('يرجى كتابة المناطق أو اسم النزلة الجديدة.');
            return;
          }
          targetVisit = {
            id: uuidv4(),
            location: cleanLoc,
            date: customVisitDate || executionDate || new Date().toISOString().split('T')[0],
            churches: [],
            createdAt: Date.now() - 100000
          };
        } else {
          targetVisit = activeVisits.find(v => v.id === targetVisitChoice) || activeVisits[0];
        }

        // Find or create church in targetVisit
        const churches = [...(targetVisit.churches || [])];
        let churchIdx = churches.findIndex(ch => normalizeArabicText(ch.churchName) === normalizeArabicText(churchName) && (!regionName || normalizeArabicText(ch.regionName) === normalizeArabicText(regionName)));

        if (churchIdx === -1) {
          const newChurch = {
            id: uuidv4(),
            churchName: churchName.trim(),
            regionName: regionName.trim() || 'عام',
            villageName: villageName.trim(),
            servantsGroups: [
              {
                id: uuidv4(),
                servantsNames: 'خدام المتابعة',
                cases: [newCase]
              }
            ]
          };
          churches.push(newChurch);
        } else {
          const ch = { ...churches[churchIdx] };
          const sGroups = [...(ch.servantsGroups || [])];
          if (sGroups.length === 0) {
            sGroups.push({
              id: uuidv4(),
              servantsNames: 'خدام المتابعة',
              cases: [newCase]
            });
          } else {
            sGroups[0] = {
              ...sGroups[0],
              cases: [...(sGroups[0].cases || []), newCase]
            };
          }
          ch.servantsGroups = sGroups;
          churches[churchIdx] = ch;
        }

        const updatedVisit = {
          ...targetVisit,
          churches: churches
        };

        onUpdateVisit(updatedVisit);
        alert('تمت إضافة الحالة السابقة بنجاح كمشروع منفذ!');
        onClose();
      };

      return (

                <div>

                  <p className="text-xs text-blue-200 mt-0.5">تسجيل بيانات نزلة ومشاريع منفذة مسبقاً لإدراجها في متابعة وجدول الأقساط</p>
                </div>
              </div>
              <button onClick={onClose} className="text-white/80 hover:text-white p-1 rounded-lg transition-colors"><X size={22}/></button>
            </div>

            {/* Mode Switcher Tabs */}
            <div className="flex border-b border-gray-200 bg-gray-50/80 shrink-0">
              <button
                type="button"
                onClick={() => {
                  onClose();
                  if (onOpenImportExcel) onOpenImportExcel();
                }}
                className="flex-1 py-3 px-4 text-xs sm:text-sm font-bold flex items-center justify-center gap-2 text-teal-700 hover:bg-teal-50 transition-all border-b-2 border-transparent"
              >
                <FileSpreadsheet size={18} className="text-teal-600" />
                <span>رفع شيت إكسيل (Excel) مجمع</span>
                <span className="bg-teal-100 text-teal-800 text-[10px] px-2 py-0.5 rounded-full font-bold">أسرع وأسهل</span>

              <button

              >
                <span>✍️</span>
                <span>إدخال يدوي (حالة بحالة)</span>
              </button>
            </div>

            <form onSubmit={handleSubmit} className="p-5 sm:p-6 overflow-y-auto space-y-4">

              <div className="bg-gradient-to-r from-teal-50 via-emerald-50 to-teal-50 border-2 border-teal-300 rounded-2xl p-3.5 flex flex-col sm:flex-row items-center justify-between gap-3 shadow-xs">
