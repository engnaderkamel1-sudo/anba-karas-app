    // =========================================================================
    // --- COMPONENT: IMPORT LEGACY PROJECTS FROM EXCEL MODAL ---
    // =========================================================================
// ================================================================
// MODULE: components/ImportLegacyExcelModal.js
// ================================================================
    function ImportLegacyExcelModal({ allVisits, onUpdateVisit, onClose, onOpenManualEntry }) {
      const activeVisits = (allVisits || []).filter(v => !v.isDeleted);
      const [fileName, setFileName] = useState('');
      const [parsedCases, setParsedCases] = useState([]);
      const [targetVisitChoice, setTargetVisitChoice] = useState('new_custom');
      const [customVisitLocation, setCustomVisitLocation] = useState('');
      const [customVisitDate, setCustomVisitDate] = useState(() => new Date().toISOString().split('T')[0]);
      const [isParsing, setIsParsing] = useState(false);

      // 1. Installment Start Date & Auto-Settlement Settings
      const [firstInstallmentDate, setFirstInstallmentDate] = useState('');
      const [settlementOption, setSettlementOption] = useState('excel_only'); // 'excel_only' | 'settle_up_to_today' | 'settle_full_100'

      // 2. Fuzzy Suggestions Map (e.g., suggestions for churches / regions)
      const [fuzzySuggestions, setFuzzySuggestions] = useState([]); // Array of { type: 'church'|'region', original: string, suggested: string, count: number }
      const [appliedMappings, setAppliedMappings] = useState({}); // { [original]: approvedReplacement }

      // Existing unique regions & churches in the system for fuzzy comparison
      const existingRegions = useMemo(() => {
        return Array.from(new Set(activeVisits.flatMap(v => (v.churches || []).map(ch => ch.regionName)).filter(Boolean)));
      }, [activeVisits]);

      const existingChurches = useMemo(() => {
        return Array.from(new Set(activeVisits.flatMap(v => (v.churches || []).map(ch => ch.churchName)).filter(Boolean)));
      }, [activeVisits]);

      const existingVillages = useMemo(() => {
        return Array.from(new Set(activeVisits.flatMap(v => (v.churches || []).map(ch => ch.villageName || ch.village)).filter(Boolean)));
      }, [activeVisits]);

      const existingProjects = useMemo(() => {
        const rawTypes = activeVisits.flatMap(v => (v.churches || []).flatMap(ch => (ch.servantsGroups || []).flatMap(sg => (sg.cases || []).map(c => c.executedProjectType || c.projectType))));
        const dictTypes = typeof buildEffectiveProjectDictionary === 'function' ? buildEffectiveProjectDictionary(allVisits).map(c => c.name) : [];
        return Array.from(new Set([...rawTypes, ...dictTypes].filter(Boolean)));
      }, [activeVisits, allVisits]);

      // Helper to compute string similarity (Levenshtein based)
      const getSimilarity = (str1, str2) => {
        const s1 = (typeof normalizeArabicText === 'function' ? normalizeArabicText(str1) : String(str1).trim()).replace(/[-_]/g, ' ');
        const s2 = (typeof normalizeArabicText === 'function' ? normalizeArabicText(str2) : String(str2).trim()).replace(/[-_]/g, ' ');
        if (!s1 || !s2) return 0;
        if (s1 === s2) return 1.0;
        if (s1.includes(s2) || s2.includes(s1)) {
          return Math.min(s1.length, s2.length) / Math.max(s1.length, s2.length);
        }
        const m = s1.length;
        const n = s2.length;
        const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
        for (let i = 0; i <= m; i++) dp[i][0] = i;
        for (let j = 0; j <= n; j++) dp[0][j] = j;
        for (let i = 1; i <= m; i++) {
          for (let j = 1; j <= n; j++) {
            if (s1[i - 1] === s2[j - 1]) dp[i][j] = dp[i - 1][j - 1];
            else dp[i][j] = 1 + Math.min(dp[i - 1][j], dp[i][j - 1], dp[i - 1][j - 1]);
          }
        }
        return Math.max(0, 1 - (dp[m][n] / Math.max(m, n)));
      };

      const handleFileUpload = (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        const currentFileName = file.name;
        // Reset input value immediately so selecting the same file again triggers onChange
        e.target.value = null;

        setFileName(currentFileName);
        setIsParsing(true);
        setAppliedMappings({});
        setFuzzySuggestions([]);
        if (typeof window.notifyInfo === 'function') {
          window.notifyInfo(`جاري قراءة وتحليل ملف الإكسيل (${currentFileName})...`);
        }

        const reader = new FileReader();
        reader.onload = (evt) => {
          try {
            const data = evt.target.result;
            const workbook = XLSX.read(data, { type: 'binary' });

            if (!workbook || !workbook.SheetNames || workbook.SheetNames.length === 0) {
              window.notifyError('الملف لا يحتوي على أي شيتات صالحة للقراءة.');
              setIsParsing(false);
              return;
            }

            // Prioritize sheet containing 'مشاريع' or 'مشروع' or 'بيانات' or first sheet
            let targetSheetName = workbook.SheetNames.find(s => {
              const norm = normalizeArabicText(s);
              return norm.includes('مشاريع') || norm.includes('مشروع') || norm.includes('تنفيذ') || norm.includes('حالات');
            }) || workbook.SheetNames[0];

            const worksheet = workbook.Sheets[targetSheetName];
            const rawRows = XLSX.utils.sheet_to_json(worksheet, { defval: '', header: 1 });

            if (!rawRows || rawRows.length === 0) {
              window.notifyError(`الشيت "${targetSheetName}" فارغ أو لا يحتوي على صفوف بيانات.`);
              setIsParsing(false);
              return;
            }

            // Find header row (containing 'اسم الحالة' or 'اسم المستفيد' or 'المستفيد' or 'الحالة' or 'الاسم')
            let headerRowIdx = -1;
            for (let r = 0; r < Math.min(15, rawRows.length); r++) {
              const rowStr = (rawRows[r] || []).map(c => normalizeArabicText(String(c))).join(' ');
              if (rowStr.includes('اسم الحاله') || rowStr.includes('اسم المستفيد') || rowStr.includes('الحاله') || rowStr.includes('المستفيد')) {
                headerRowIdx = r;
                break;
              }
            }

            let headers = [];
            let dataRows = [];
            if (headerRowIdx !== -1) {
              headers = (rawRows[headerRowIdx] || []).map(c => String(c).trim());
              dataRows = rawRows.slice(headerRowIdx + 1);
            } else {
              // Fallback to standard object parsing or first non-empty row
              const jsonObjects = XLSX.utils.sheet_to_json(worksheet, { defval: '' });
              if (jsonObjects.length > 0) {
                headers = Object.keys(jsonObjects[0] || {});
                dataRows = jsonObjects.map(obj => headers.map(k => obj[k]));
              } else {
                headers = (rawRows[0] || []).map(c => String(c).trim());
                dataRows = rawRows.slice(1);
              }
            }

            // Helper to get index of header matching keywords
            const findColIdx = (keywords) => {
              for (let kw of keywords) {
                const normKw = normalizeArabicText(kw);
                const idx = headers.findIndex(h => normalizeArabicText(h).includes(normKw));
                if (idx !== -1) return idx;
              }
              return -1;
            };

            const nameIdx = findColIdx(['اسم الحاله', 'اسم المستفيد', 'المستفيد', 'الاسم', 'الحاله']);
            const villageIdx = findColIdx(['القريه', 'الكنيسه', 'المنطقه', 'مركز', 'العزبه', 'عزبه']);
            const projectIdx = findColIdx(['المشروع 1', 'المشروع', 'نوع المشروع']);
            const costIdx = findColIdx(['المبلغ', 'قيمه المشروع', 'المبلغ المنفذ', 'التكلفه', 'اصل المبلغ']);
            const instIdx = findColIdx(['القسط', 'القسط الشهري']);
            const monthsIdx = findColIdx(['عدد الشهور', 'الشهور', 'مده']);
            const paidIdx = findColIdx(['المسدد', 'المدفوع', 'اجمالي المسدد', 'تم سداده']);
            const dateIdx = findColIdx(['تاريخ التنفيذ', 'التاريخ', 'تاريخ']);
            const notesIdx = findColIdx(['ملاحظات', 'ملاحظه', 'تقرير']);

            const cleanRows = [];
            dataRows.forEach((row, rIndex) => {
              const rawName = nameIdx !== -1 ? String(row[nameIdx] || '').trim() : '';
              if (!rawName) return; // skip empty

              // Ignore summary / total rows (e.g. '45 مشروع' or 'الاجمالي' or 'Grand Total')
              const normName = normalizeArabicText(rawName);
              if (normName.includes('مشروع') && normName.match(/\d+/)) return;
              if (normName.includes('اجمالي') || normName.includes('مجموع') || normName.includes('total')) return;

              // Parse village/church column: e.g. "ابو قرقاص - المحراص" or "قطوشه مطاي - رئيس الملائكه ميخائيل"
              const rawVillageField = villageIdx !== -1 ? String(row[villageIdx] || '').trim() : '';
              let regionName = 'عام';
              let churchName = 'كنيسة عامة';
              let villageName = '';

              if (rawVillageField.includes('-')) {
                const parts = rawVillageField.split('-');
                regionName = parts[0].trim() || 'عام';
                churchName = parts.slice(1).join('-').trim() || 'كنيسة عامة';
                villageName = churchName;
              } else if (rawVillageField) {
                regionName = rawVillageField;
                churchName = rawVillageField;
                villageName = rawVillageField;
              }

              const projectType = projectIdx !== -1 ? String(row[projectIdx] || '').trim() || 'مشروع منفذ' : 'مشروع منفذ';
              const pVal = costIdx !== -1 ? (parseFloat(parseArabicNumeric(row[costIdx])) || 0) : 0;
              const instAmt = instIdx !== -1 ? (parseFloat(parseArabicNumeric(row[instIdx])) || 0) : 0;
              const monthsCount = monthsIdx !== -1 ? (parseInt(parseArabicNumeric(row[monthsIdx])) || 0) : 0;
              const paidAmt = paidIdx !== -1 ? (parseFloat(parseArabicNumeric(row[paidIdx])) || 0) : 0;
              const execDate = dateIdx !== -1 && row[dateIdx] ? String(row[dateIdx]).trim() : '';
              const notes = notesIdx !== -1 ? String(row[notesIdx] || '').trim() : '';

              const finalProjectVal = pVal > 0 ? pVal : 10000;
              const finalInstAmt = instAmt > 0 ? instAmt : (monthsCount > 0 ? Math.round(finalProjectVal / monthsCount) : 500);

              cleanRows.push({
                id: uuidv4(),
                caseName: rawName,
                originalRegionName: regionName,
                regionName: regionName,
                originalChurchName: churchName,
                churchName: churchName,
                villageName: villageName,
                projectType,
                projectValue: finalProjectVal,
                installmentAmount: finalInstAmt,
                monthsCount: monthsCount > 0 ? monthsCount : Math.ceil(finalProjectVal / finalInstAmt),
                executionDate: execDate || new Date().toISOString().split('T')[0],
                alreadyPaid: paidAmt,
                notes
              });
            });

            if (cleanRows.length === 0) {
              const msg = 'لم نتمكن من قراءة أسماء الحالات من شيت المشاريع. يرجى التأكد من احتواء الملف على عمود "اسم الحالة" أو "المستفيد".';
              if (typeof window.notifyError === 'function') window.notifyError(msg);
              else alert(msg);
              setIsParsing(false);
              return;
            }

            setParsedCases(cleanRows);
            if (typeof window.notifySuccess === 'function') {
              window.notifySuccess(`تم قراءة وتحليل (${formatNumber(cleanRows.length)}) مشروع بنجاح! جاهزة للمعاينة الآن.`);
            }

            // Auto-detect common visit location from regions
            const autoRegions = Array.from(new Set(cleanRows.map(r => r.regionName).filter(r => r && r !== 'عام'))).join(' + ');
            if (autoRegions) {
              setCustomVisitLocation(autoRegions);
            }

            // Auto-detect visit date (use execution date if available, or default to current date / 2026-05)
            const validDates = cleanRows.map(r => r.executionDate).filter(Boolean).sort();
            const chosenDate = validDates.length > 0 ? validDates[validDates.length - 1] : new Date().toISOString().split('T')[0];
            setCustomVisitDate(chosenDate);

            // Default first installment date: next month after visit date
            try {
              const d = new Date(chosenDate);
              d.setMonth(d.getMonth() + 1);
              setFirstInstallmentDate(d.toISOString().split('T')[0]);
            } catch(e) {
              setFirstInstallmentDate(new Date().toISOString().split('T')[0]);
            }

            // --- SMART FUZZY SUGGESTIONS DISCOVERY ---
            const suggestions = [];
            const processedChurches = new Set();
            const processedRegions = new Set();
            const processedProjects = new Set();

            cleanRows.forEach(c => {
              // Check Church similarity against existing churches
              if (!processedChurches.has(c.churchName)) {
                processedChurches.add(c.churchName);
                for (let existCh of existingChurches) {
                  const sim = getSimilarity(c.churchName, existCh);
                  if (sim >= 0.70 && sim < 1.0) {
                    const matchCount = cleanRows.filter(x => x.churchName === c.churchName).length;
                    suggestions.push({
                      type: 'church',
                      original: c.churchName,
                      suggested: existCh,
                      similarity: Math.round(sim * 100),
                      count: matchCount
                    });
                    break;
                  }
                }
              }

              // Check Region similarity
              if (!processedRegions.has(c.regionName)) {
                processedRegions.add(c.regionName);
                for (let existReg of existingRegions) {
                  const sim = getSimilarity(c.regionName, existReg);
                  if (sim >= 0.70 && sim < 1.0) {
                    const matchCount = cleanRows.filter(x => x.regionName === c.regionName).length;
                    suggestions.push({
                      type: 'region',
                      original: c.regionName,
                      suggested: existReg,
                      similarity: Math.round(sim * 100),
                      count: matchCount
                    });
                    break;
                  }
                }
              }

              // Check Project Type similarity against existing projects
              if (c.projectType && !processedProjects.has(c.projectType)) {
                processedProjects.add(c.projectType);
                for (let existProj of existingProjects) {
                  const sim = getSimilarity(c.projectType, existProj);
                  if (sim >= 0.70 && sim < 1.0) {
                    const matchCount = cleanRows.filter(x => x.projectType === c.projectType).length;
                    suggestions.push({
                      type: 'project',
                      original: c.projectType,
                      suggested: existProj,
                      similarity: Math.round(sim * 100),
                      count: matchCount
                    });
                    break;
                  }
                }
              }
            });

            setFuzzySuggestions(suggestions);

          } catch (err) {
            console.error("Excel import error:", err);
            const errMsg = `حدث خطأ أثناء قراءة ملف الإكسيل: ${err && err.message ? err.message : 'تأكد من سلامة صيغة الملف'}`;
            if (typeof window.notifyError === 'function') window.notifyError(errMsg);
            else alert(errMsg);
          } finally {
            setIsParsing(false);
          }
        };
        reader.readAsBinaryString(file);
      };

      // Apply a fuzzy unification suggestion (e.g. replace Excel's original with existing suggested)
      const handleApplyFuzzySuggestion = (original, suggested, type) => {
        setAppliedMappings(prev => ({ ...prev, [original]: suggested }));
        setParsedCases(prev => prev.map(c => {
          if (type === 'church' && c.churchName === original) {
            return { ...c, churchName: suggested };
          }
          if (type === 'region' && c.regionName === original) {
            return { ...c, regionName: suggested };
          }
          if (type === 'project' && c.projectType === original) {
            return { ...c, projectType: suggested };
          }
          return c;
        }));
        // Remove suggestion after applied
        setFuzzySuggestions(prev => prev.filter(s => s.original !== original));
      };

      // Adopt Excel's name (e.g. "فراخ") and globally rename old/typo name ("فريخ") across all past visits
      const handleGlobalAdoptAndRename = (excelName, oldName, type) => {
        // 1. Keep excelName in parsedCases
        setParsedCases(prev => prev.map(c => {
          if (type === 'project' && (c.projectType === oldName || c.projectType === excelName)) {
            return { ...c, projectType: excelName };
          }
          if (type === 'church' && (c.churchName === oldName || c.churchName === excelName)) {
            return { ...c, churchName: excelName };
          }
          if (type === 'region' && (c.regionName === oldName || c.regionName === excelName)) {
            return { ...c, regionName: excelName };
          }
          return c;
        }));

        // 2. Globally update all existing visits in the system if onUpdateVisit provided
        if (typeof onUpdateVisit === 'function' && Array.isArray(allVisits)) {
          let updatedCount = 0;
          allVisits.forEach(v => {
            let visitChanged = false;
            const updatedChurches = (v.churches || []).map(ch => {
              let churchObj = { ...ch };
              if (type === 'region' && churchObj.regionName === oldName) {
                churchObj.regionName = excelName;
                visitChanged = true;
              }
              if (type === 'church' && churchObj.churchName === oldName) {
                churchObj.churchName = excelName;
                visitChanged = true;
              }
              if (type === 'project') {
                const updatedGroups = (churchObj.servantsGroups || []).map(sg => {
                  let groupChanged = false;
                  const updatedCases = (sg.cases || []).map(c => {
                    const curPType = c.executedProjectType || c.projectType;
                    if (curPType === oldName) {
                      groupChanged = true;
                      visitChanged = true;
                      return {
                        ...c,
                        projectType: excelName,
                        executedProjectType: excelName
                      };
                    }
                    return c;
                  });
                  return groupChanged ? { ...sg, cases: updatedCases } : sg;
                });
                if (groupChanged || visitChanged) {
                  churchObj.servantsGroups = updatedGroups;
                }
              }
              return churchObj;
            });

            if (visitChanged) {
              updatedCount++;
              onUpdateVisit({ ...v, churches: updatedChurches });
            }
          });

          if (typeof window.notifySuccess === 'function') {
            window.notifySuccess(`تم اعتماد "${excelName}" رسمياً وتصحيح مسمى "${oldName}" في جميع الزيارات السابقة بنجاح!`);
          }
        }

        // Dismiss the suggestion
        setFuzzySuggestions(prev => prev.filter(s => s.original !== excelName));
      };

      // Dismiss a suggestion (keep original text)
      const handleDismissFuzzySuggestion = (original) => {
        setFuzzySuggestions(prev => prev.filter(s => s.original !== original));
      };

      // Inline case deletion from preview table
      const handleDeletePreviewCase = (caseId) => {
        setParsedCases(prev => prev.filter(c => c.id !== caseId));
      };

      // Inline case update from preview table (with auto recalculation of months when value or installment changes)
      const handleUpdatePreviewCase = (caseId, field, value) => {
        setParsedCases(prev => prev.map(c => {
          if (c.id === caseId) {
            const updated = { ...c, [field]: value };
            if (field === 'projectValue' || field === 'installmentAmount') {
              const pVal = parseFloat(field === 'projectValue' ? value : c.projectValue) || 0;
              const pInst = parseFloat(field === 'installmentAmount' ? value : c.installmentAmount) || 0;
              updated.monthsCount = pInst > 0 ? Math.ceil(pVal / pInst) : c.monthsCount;
            }
            return updated;
          }
          return c;
        }));
      };

      // CONFIRM & IMPORT FUNCTION (Only executed when clicking Confirm)
      const handleConfirmImport = () => {
        if (parsedCases.length === 0) {
          alert('لا توجد حالات للاستيراد.');
          return;
        }

        // Calculate auto-settlement payments if selected
        const today = new Date();
        const startDue = firstInstallmentDate ? new Date(firstInstallmentDate) : new Date(customVisitDate);

        // Group cases into churches and servant groups
        const churchMap = {};
        parsedCases.forEach(item => {
          const effectiveChurch = item.churchName || 'كنيسة عامة';
          const effectiveRegion = item.regionName || 'عام';
          const key = `${effectiveRegion}___${effectiveChurch}`;

          if (!churchMap[key]) {
            churchMap[key] = {
              id: uuidv4(),
              regionName: effectiveRegion,
              churchName: effectiveChurch,
              villageName: item.villageName || effectiveChurch,
              servantsGroups: [
                {
                  id: uuidv4(),
                  servantsNames: 'خدام المتابعة',
                  cases: []
                }
              ]
            };
          }

          // Generate payments based on settlementOption
          let payments = [];
          if (settlementOption === 'settle_full_100') {
            // Full 100% project value paid
            payments.push({
              id: uuidv4(),
              amount: item.projectValue,
              paidDate: item.executionDate || customVisitDate,
              notes: 'تم سداد كامل المشروع بالكامل سابقاً'
            });
          } else if (settlementOption === 'settle_up_to_today') {
            // Calculate elapsed months from firstInstallmentDate up to today
            let monthsPassed = 0;
            if (startDue <= today && item.installmentAmount > 0) {
              const diffYears = today.getFullYear() - startDue.getFullYear();
              const diffMonths = today.getMonth() - startDue.getMonth();
              monthsPassed = Math.max(0, diffYears * 12 + diffMonths + 1);
            }

            const totalEligibleMonths = Math.min(monthsPassed, item.monthsCount || Math.ceil(item.projectValue / item.installmentAmount));
            let runningPaid = 0;

            for (let m = 0; m < totalEligibleMonths; m++) {
              const payDueDate = new Date(startDue);
              payDueDate.setMonth(payDueDate.getMonth() + m);
              if (payDueDate > today) break;

              const remaining = item.projectValue - runningPaid;
              if (remaining <= 0) break;

              const thisAmt = Math.min(item.installmentAmount, remaining);
              runningPaid += thisAmt;

              payments.push({
                id: uuidv4(),
                amount: thisAmt,
                paidDate: payDueDate.toISOString().split('T')[0],
                notes: `قسط رقم (${m + 1}) مسدد بانتظام`
              });
            }
          } else {
            // excel_only: keep alreadyPaid from Excel if any
            if (item.alreadyPaid > 0) {
              payments.push({
                id: uuidv4(),
                amount: item.alreadyPaid,
                paidDate: item.executionDate || customVisitDate,
                notes: 'مسدد سابقاً قبل استخدام التطبيق'
              });
            }
          }

          const caseObj = {
            id: item.id || uuidv4(),
            name: item.caseName,
            caseName: item.caseName,
            nationalId: item.nationalId || '',
            projectType: item.projectType,
            executedProjectType: item.projectType,
            projectValue: item.projectValue,
            executedProjectValue: item.projectValue,
            installmentAmount: item.installmentAmount,
            executedInstallmentAmount: item.installmentAmount,
            executionDate: item.executionDate || customVisitDate,
            firstInstallmentDate: firstInstallmentDate || customVisitDate,
            status: 'executed',
            notes: item.notes || '',
            payments: payments
          };

          churchMap[key].servantsGroups[0].cases.push(caseObj);
        });

        // Save into target visit
        if (targetVisitChoice === 'new_custom') {
          const finalLoc = customVisitLocation.trim();
          if (!finalLoc) {
            alert('يرجى تحديد المناطق أو اسم النزلة الجديدة.');
            return;
          }
          const finalDate = customVisitDate || new Date().toISOString().split('T')[0];
          const newVisitObj = {
            id: uuidv4(),
            location: finalLoc,
            date: finalDate,
            churches: Object.values(churchMap),
            createdAt: Date.now() - 50000
          };
          onUpdateVisit(newVisitObj);
        } else {
          const existing = activeVisits.find(v => v.id === targetVisitChoice);
          if (existing) {
            const mergedChurches = [...(existing.churches || [])];
            Object.values(churchMap).forEach(newCh => {
              const exIdx = mergedChurches.findIndex(c => normalizeArabicText(c.churchName) === normalizeArabicText(newCh.churchName) && normalizeArabicText(c.regionName) === normalizeArabicText(newCh.regionName));
              if (exIdx === -1) {
                mergedChurches.push(newCh);
              } else {
                const exCh = { ...mergedChurches[exIdx] };
                const sGroups = [...(exCh.servantsGroups || [])];
                if (sGroups.length === 0) {
                  sGroups.push(newCh.servantsGroups[0]);
                } else {
                  sGroups[0] = {
                    ...sGroups[0],
                    cases: [...(sGroups[0].cases || []), ...(newCh.servantsGroups[0]?.cases || [])]
                  };
                }
                exCh.servantsGroups = sGroups;
                mergedChurches[exIdx] = exCh;
              }
            });
            onUpdateVisit({
              ...existing,
              churches: mergedChurches
            });
          }
        }

        alert(`تم بنجاح اعتماد واستيراد (${formatNumber(parsedCases.length)}) مشروع وترحيلها لصفحة الأقساط!`);
        onClose();
      };

      const totalImportedValue = parsedCases.reduce((sum, c) => sum + (c.projectValue || 0), 0);
      const totalImportedInst = parsedCases.reduce((sum, c) => sum + (c.installmentAmount || 0), 0);

      return (
        <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-3 sm:p-4 backdrop-blur-sm animate-fade-in" onClick={onClose}>
          <div className="bg-white rounded-2xl shadow-2xl w-full max-w-4xl overflow-hidden border border-gray-100 flex flex-col max-h-[92vh]" onClick={e => e.stopPropagation()}>
            {/* Header */}
            <div className="bg-[#002f6c] p-4 sm:p-5 text-white flex justify-between items-center shrink-0">
              <div className="flex items-center gap-2">
                <span className="text-2xl">📥</span>
                <div>
                  <h3 className="font-bold text-base sm:text-lg">معاينة واستيراد نزلات ومشاريع سابقة (Excel)</h3>
                  <p className="text-xs text-blue-200 mt-0.5">قراءة شيت المشاريع آلياً مع التحقق الذكي من الأسماء وجدولة الأقساط قبل الحفظ</p>
                </div>
              </div>
              <button onClick={onClose} className="text-white/80 hover:text-white p-1 rounded-lg transition-colors"><X size={22}/></button>
            </div>

            <div className="p-5 sm:p-6 overflow-y-auto space-y-4">
              {/* File Selector */}
              <div className="flex flex-col sm:flex-row items-center justify-between gap-3 bg-gray-50 border border-gray-200 rounded-xl p-4">
                <div>
                  <div className="font-bold text-xs sm:text-sm text-gray-800">اختر ملف الإكسيل (مثل: شيت المنيا مايو 2026)</div>
                  <div className="text-[11px] text-gray-500 mt-0.5">يقرأ شيت "مشاريع" ويفصل القرى والكنائس تلقائياً دون أي تعديل يدوي</div>
                </div>

                <div className="flex items-center gap-2 w-full sm:w-auto">
                  <label className={`cursor-pointer px-4 py-2.5 rounded-xl text-xs font-bold text-white shadow transition-colors flex items-center gap-1.5 shrink-0 ${isParsing ? 'bg-gray-400 cursor-not-allowed' : 'bg-emerald-600 hover:bg-emerald-700'}`}>
                    {isParsing ? (
                      <>
                        <div className="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
                        <span>جاري التحليل...</span>
                      </>
                    ) : (
                      <>
                        <Upload size={15} />
                        <span>{fileName ? 'اختيار ملف آخر' : 'رفع ملف الإكسيل'}</span>
                      </>
                    )}
                    <input 
                      type="file" 
                      accept=".xlsx, .xls, .csv" 
                      onClick={(e) => { e.target.value = null; }} 
                      onChange={handleFileUpload} 
                      disabled={isParsing}
                      className="hidden" 
                    />
                  </label>
                </div>
              </div>

              {onOpenManualEntry && !fileName && (
                <div className="text-center py-0.5">
                  <button
                    type="button"
                    onClick={onOpenManualEntry}
                    className="text-xs text-[#002f6c] hover:text-blue-800 hover:underline inline-flex items-center gap-1.5 font-bold transition-colors"
                  >
                    <Edit2 size={13} />
                    <span>ليس لديك ملف إكسيل للنزلة؟ اضغط هنا لتسجيل بياناتها يدوياً بدون إكسيل</span>
                  </button>
                </div>
              )}

              {isParsing && (
                <div className="text-xs text-blue-800 bg-blue-50 border border-blue-200 rounded-lg p-3 flex items-center gap-2 animate-pulse">
                  <div className="w-4 h-4 border-2 border-blue-600 border-t-transparent rounded-full animate-spin"></div>
                  <span>جاري قراءة أعمدة الشيت واكتشاف أسماء الحالات والمناطق تلقائياً، يرجى الانتظار ثوانٍ معدودة...</span>
                </div>
              )}

              {fileName && (
                <div className="text-xs text-emerald-800 bg-emerald-50 border border-emerald-200 rounded-lg p-3 flex items-center justify-between">
                  <span className="flex items-center gap-2">
                    <span>📄</span>
                    <span>تم تحليل الملف: <strong>{fileName}</strong></span>
                  </span>
                  <span className="font-bold font-sans">{formatNumber(parsedCases.length)} حالة جاهزة للمعاينة</span>
                </div>
              )}

              {/* FUZZY MATCHING NOTIFICATIONS ("هل تقصد كذا؟") */}
              {fuzzySuggestions.length > 0 && (
                <div className="bg-amber-50 border border-amber-300 rounded-xl p-3.5 space-y-2.5 animate-fade-in shadow-xs">
                  <div className="flex items-center gap-2 text-xs font-bold text-amber-900">
                    <span className="text-base">🔔</span>
                    <span>تنبيه توحيد المسميات الذكي (اكتشفنا أسماء متقاربة في الملف لتفادي التكرار):</span>
                  </div>
                  <div className="space-y-2">
                    {fuzzySuggestions.map((sug, sIdx) => (
                      <div key={sIdx} className="bg-white rounded-lg p-2.5 border border-amber-200 flex flex-wrap items-center justify-between gap-2 text-xs">
                        <div className="flex items-center gap-2 flex-wrap">
                          <span className={`px-2 py-0.5 rounded text-[11px] font-bold ${
                            sug.type === 'project'
                              ? 'bg-purple-100 text-purple-900 border border-purple-200'
                              : sug.type === 'church'
                              ? 'bg-amber-100 text-amber-900'
                              : 'bg-blue-100 text-blue-900'
                          }`}>
                            {sug.type === 'project' ? '💼 مشروع / نشاط' : sug.type === 'church' ? '⛪ كنيسة' : '📍 منطقة'}
                          </span>
                          <span className="text-gray-600">في الملف: <strong className="text-rose-700 font-sans">{sug.original}</strong></span>
                          <span>⬅️</span>
                          <span className="text-gray-800">هل تقصد: <strong className="text-emerald-700 font-sans">{sug.suggested}</strong>؟</span>
                          <span className="text-[10px] text-gray-400 font-sans">({sug.count} حالة • تطابق {sug.similarity}%)</span>
                        </div>
                        <div className="flex items-center gap-1.5 shrink-0 flex-wrap">
                          <button
                            type="button"
                            onClick={() => handleApplyFuzzySuggestion(sug.original, sug.suggested, sug.type)}
                            className="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-3 py-1 rounded text-xs transition-colors flex items-center gap-1"
                            title={`تغيير كل حالات الملف من "${sug.original}" إلى "${sug.suggested}"`}
                          >
                            <span>✓ نعم، حوّل إلى "{sug.suggested}"</span>
                          </button>
                          <button
                            type="button"
                            onClick={() => handleGlobalAdoptAndRename(sug.original, sug.suggested, sug.type)}
                            className="bg-blue-600 hover:bg-blue-700 text-white font-bold px-3 py-1 rounded text-xs transition-colors flex items-center gap-1 shadow-xs"
                            title={`اعتماد اسم "${sug.original}" في هذا الملف وتعديل كل المشاريع السابقة المسجلة بـ "${sug.suggested}" إلى "${sug.original}"`}
                          >
                            <span>🔄 اعتمد "{sug.original}" وعدّل القديم كله</span>
                          </button>
                          <button
                            type="button"
                            onClick={() => handleDismissFuzzySuggestion(sug.original)}
                            className="bg-gray-100 hover:bg-gray-200 text-gray-700 font-medium px-2.5 py-1 rounded text-xs transition-colors"
                          >
                            تجاهل
                          </button>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* Target Visit Destination Card */}
              {parsedCases.length > 0 && (
                <div className="space-y-3">
                  <div className="bg-blue-50/70 border border-blue-200 rounded-xl p-4 space-y-3">
                    <div>
                      <label className="block text-xs font-bold text-blue-900 mb-1.5">حفظ المشاريع المستوردة ضمن زيارة / نزلة:</label>
                      <select
                        value={targetVisitChoice}
                        onChange={e => setTargetVisitChoice(e.target.value)}
                        className="w-full bg-white rounded-lg border border-blue-300 p-2 text-xs font-bold text-[#002f6c] outline-none"
                      >
                        <option value="new_custom">➕ إنشاء نزلة جديدة مخصصة (تحديد المناطق والتاريخ)</option>
                        {activeVisits.map(v => (
                          <option key={v.id} value={v.id}>زيارة سابقة: {v.location || 'بدون اسم'} ({v.date || 'بدون تاريخ'})</option>
                        ))}
                      </select>
                    </div>

                    {targetVisitChoice === 'new_custom' && (
                      <div className="bg-white p-3 rounded-lg border border-blue-200 space-y-2.5 animate-fade-in shadow-xs">
                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                          <div>
                            <label className="block text-[11px] font-bold text-gray-700 mb-1">
                              المناطق / مراكز النزلة *
                            </label>
                            <input
                              type="text"
                              required
                              value={customVisitLocation}
                              onChange={e => setCustomVisitLocation(e.target.value)}
                              placeholder="مثال: ابو قرقاص + مطاي"
                              className="w-full rounded-lg border border-gray-300 p-2 text-xs focus:border-[#002f6c] outline-none font-bold text-[#002f6c]"
                            />
                          </div>
                          <div>
                            <label className="block text-[11px] font-bold text-gray-700 mb-1">
                              تاريخ النزلة الفعلي *
                            </label>
                            <input
                              type="date"
                              required
                              value={customVisitDate}
                              onChange={e => setCustomVisitDate(e.target.value)}
                              className="w-full rounded-lg border border-gray-300 p-2 text-xs focus:border-[#002f6c] outline-none font-sans"
                            />
                          </div>
                        </div>
                      </div>
                    )}
                  </div>

                  {/* SMART INSTALLMENT & SETTLEMENT CONTROLS */}
                  <div className="bg-emerald-50/70 border border-emerald-300 rounded-xl p-4 space-y-3">
                    <div className="font-bold text-xs sm:text-sm text-emerald-950 flex items-center gap-2">
                      <span>⚙️</span>
                      <span>إعدادات تحصيل الأقساط والسداد التلقائي (خاص بالنزلات القديمة المنفذة):</span>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                      <div>
                        <label className="block text-xs font-bold text-gray-800 mb-1">
                          🗓️ تاريخ أول سداد / استحقاق القسط الأول (مقترح ويمكنك تعديله):
                        </label>
                        <input
                          type="date"
                          value={firstInstallmentDate}
                          onChange={e => setFirstInstallmentDate(e.target.value)}
                          className="w-full bg-white rounded-lg border-2 border-emerald-400 p-2.5 text-xs font-sans font-bold text-emerald-950 focus:border-[#002f6c] outline-none shadow-xs"
                        />
                        <p className="text-[11px] text-gray-600 font-medium mt-1">💡 يمكنك تغيير التاريخ لأي شهر أو يوم (مثل 1/6 أو 1/7 أو 1/8) لضبط المتأخرات بدقة.</p>
                      </div>

                      <div>
                        <label className="block text-xs font-bold text-gray-700 mb-1">
                          💳 هل تم الدفع والسداد بانتظام حتى اليوم؟
                        </label>
                        <select

    // =========================================================================
    // --- COMPONENT: PROJECT DICTIONARY MANAGEMENT MODAL ---
    // =========================================================================
    function ProjectDictionaryModal({ allVisits, isOpen, onClose, onDictionaryUpdated }) {
      const [dictionary, setDictionary] = useState([]);
      const [newCategoryName, setNewCategoryName] = useState('');
      const [newAliasInputs, setNewAliasInputs] = useState({});
      const [searchFilter, setSearchFilter] = useState('');

      useEffect(() => {
        if (isOpen) {
          const dict = buildEffectiveProjectDictionary(allVisits);
          setDictionary(dict);
        }
      }, [isOpen, allVisits]);

      if (!isOpen) return null;

      const handleAddCategory = (e) => {
        e.preventDefault();
        const trimmed = newCategoryName.trim();
        if (!trimmed) return;

        const norm = normalizeArabicText(trimmed);
        const exists = dictionary.some(c => normalizeArabicText(c.name) === norm);
        if (exists) {
          alert('هذا المشروع مسجل بالفعل في القاموس!');
          return;
        }

        const updated = [
          { id: uuidv4(), name: trimmed, aliases: [] },
          ...dictionary
        ];
        setDictionary(updated);
        saveStoredProjectDictionary(updated);
        setNewCategoryName('');
        if (onDictionaryUpdated) onDictionaryUpdated(updated);
      };

      const handleRemoveCategory = (catId) => {
        const cat = dictionary.find(c => c.id === catId);
        if (!cat) return;

        if (confirm(`هل تريد حذف تصنيف "${cat.name}" من القاموس؟ (ستعود مسمياته كمشاريع فردية)`)) {
          const updated = dictionary.filter(c => c.id !== catId);
          setDictionary(updated);
          saveStoredProjectDictionary(updated);
          if (onDictionaryUpdated) onDictionaryUpdated(updated);
        }
      };

      const handleAddAlias = (catId) => {
        const inputVal = (newAliasInputs[catId] || '').trim();
        if (!inputVal) return;

        const normInput = normalizeArabicText(inputVal);
        const updated = dictionary.map(c => {
          if (c.id === catId) {
            const alreadyAlias = (c.aliases || []).some(a => normalizeArabicText(a) === normInput);
            if (alreadyAlias) return c;
            return {
              ...c,
              aliases: [...(c.aliases || []), inputVal]
            };
          }
          // Remove from other categories if present as alias or name
          return {
            ...c,
            aliases: (c.aliases || []).filter(a => normalizeArabicText(a) !== normInput)
          };
        });

        // Also if input was a standalone category, merge it in
        const filtered = updated.filter(c => c.id === catId || normalizeArabicText(c.name) !== normInput);

        setDictionary(filtered);
        saveStoredProjectDictionary(filtered);
        setNewAliasInputs(prev => ({ ...prev, [catId]: '' }));
        if (onDictionaryUpdated) onDictionaryUpdated(filtered);
      };

      const handleRemoveAlias = (catId, aliasToRemove) => {
        const updated = dictionary.map(c => {
          if (c.id === catId) {
            return {
              ...c,
              aliases: (c.aliases || []).filter(a => a !== aliasToRemove)
            };
          }
          return c;
        });
        setDictionary(updated);
        saveStoredProjectDictionary(updated);
        if (onDictionaryUpdated) onDictionaryUpdated(updated);
      };

      const filteredDictionary = dictionary.filter(cat => {
        if (!searchFilter.trim()) return true;
        const q = normalizeArabicText(searchFilter);
        return normalizeArabicText(cat.name).includes(q) ||
               (cat.aliases || []).some(a => normalizeArabicText(a).includes(q));
      });

      return (
        <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm p-3 sm:p-6 flex items-center justify-center animate-fade-in" onClick={onClose}>
          <div 
            className="bg-white rounded-2xl shadow-2xl border border-gray-200 w-full max-w-3xl overflow-hidden flex flex-col max-h-[90vh]"
            onClick={e => e.stopPropagation()}
          >
            {/* Header */}
            <div className="bg-[#002f6c] p-4 sm:p-5 text-white flex justify-between items-center shrink-0">
              <div className="flex items-center gap-2.5">
                <span className="text-2xl">📚</span>
                <div>
                  <h3 className="font-bold text-base sm:text-lg">قاموس وضبط مسميات المشاريع</h3>
                  <p className="text-xs text-blue-200 mt-0.5">
                    توحيد المسميات المتشابهة (مثل: خرفان، غنم، ماعز) لضمان دقة التحليلات والإحصائيات
                  </p>
                </div>
              </div>
              <button onClick={onClose} className="text-white/80 hover:text-white p-1 rounded-lg transition-colors">
                <X size={22} />
              </button>
            </div>

            {/* Quick Add Form + Search */}
            <div className="p-4 sm:p-5 bg-gray-50 border-b border-gray-200 space-y-3 shrink-0">
              <form onSubmit={handleAddCategory} className="flex flex-col sm:flex-row gap-2">
                <input
                  type="text"
                  value={newCategoryName}
                  onChange={e => setNewCategoryName(e.target.value)}
                  placeholder="اسم مشروع رئيسي جديد (مثال: تروسيكل، خرفان، بقالة...)"
                  className="flex-1 bg-white border border-gray-300 rounded-xl px-3.5 py-2 text-xs sm:text-sm font-medium outline-none focus:border-[#002f6c]"
                />
                <button
                  type="submit"
                  className="bg-emerald-600 hover:bg-emerald-700 text-white text-xs sm:text-sm font-bold px-4 py-2 rounded-xl shadow-sm flex items-center justify-center gap-1.5 transition-all"
                >
                  <Plus size={16} />
                  <span>إضافة مشروع جديد</span>
                </button>
              </form>

              <div className="relative">
                <input
                  type="text"
                  value={searchFilter}
                  onChange={e => setSearchFilter(e.target.value)}
                  placeholder="بحث في أسماء ومرادفات المشاريع المسجلة..."
                  className="w-full bg-white border border-gray-200 rounded-xl px-3 py-1.5 text-xs outline-none focus:border-[#002f6c]"
                />
              </div>
            </div>

            {/* Dictionary List */}
            <div className="p-4 sm:p-5 overflow-y-auto space-y-3.5 flex-1 divide-y divide-gray-100">
              {filteredDictionary.length === 0 ? (
                <div className="py-12 text-center text-gray-400 text-xs sm:text-sm">
                  لا توجد مشاريع مطابقة.
                </div>
              ) : (
                filteredDictionary.map(cat => (
                  <div key={cat.id} className="pt-3.5 first:pt-0 space-y-2">
                    <div className="flex justify-between items-center gap-2">
                      <div className="flex items-center gap-2">
                        <span className="text-base">🏷️</span>
                        <span className="font-bold text-sm text-[#002f6c]">{cat.name}</span>
                        <span className="bg-blue-50 text-blue-800 text-[10px] font-bold px-2 py-0.5 rounded-full font-sans">
                          {cat.aliases?.length ? `${cat.aliases.length} مرادفات` : 'اسم مباشر'}
                        </span>
                      </div>
                      <button
                        type="button"
                        onClick={() => handleRemoveCategory(cat.id)}
                        className="text-gray-400 hover:text-red-600 p-1 text-xs"
                        title="حذف هذا المشروع من القاموس"
                      >
                        <Trash2 size={15} />
                      </button>
                    </div>

                    {/* Aliases Chips */}
                    <div className="flex flex-wrap items-center gap-1.5 pr-6">
                      <span className="text-[11px] text-gray-500 font-medium ml-1">يُحسب معه تلقائياً:</span>
                      {(!cat.aliases || cat.aliases.length === 0) ? (
                        <span className="text-[11px] text-gray-400 italic">لا توجد مرادفات إضافية</span>
                      ) : (
                        cat.aliases.map(alias => (
                          <span
                            key={alias}
                            className="bg-amber-50 text-amber-900 border border-amber-200/80 px-2 py-0.5 rounded-lg text-xs font-medium flex items-center gap-1 shadow-xs"
                          >
                            <span>{alias}</span>
                            <button
                              type="button"
                              onClick={() => handleRemoveAlias(cat.id, alias)}
                              className="text-amber-700 hover:text-red-700 ml-0.5 text-xs font-bold"
                              title="إزالة هذا المرادف"
                            >
                              ×
                            </button>
                          </span>
                        ))
                      )}
                    </div>

                    {/* Inline Add Alias Box */}
                    <div className="flex items-center gap-2 pr-6 pt-1 max-w-sm">
                      <input
                        type="text"
                        value={newAliasInputs[cat.id] || ''}
                        onChange={e => setNewAliasInputs({ ...newAliasInputs, [cat.id]: e.target.value })}
                        onKeyDown={e => { if (e.key === 'Enter') { e.preventDefault(); handleAddAlias(cat.id); } }}
                        placeholder={`أضف مسمى بديل لـ "${cat.name}" (مثل: غنم، ماعز...)`}
                        className="flex-1 bg-white border border-gray-200 rounded-lg px-2.5 py-1 text-xs outline-none focus:border-[#002f6c]"
                      />
                      <button
                        type="button"
                        onClick={() => handleAddAlias(cat.id)}
                        className="bg-blue-50 text-[#002f6c] border border-blue-200 hover:bg-[#002f6c] hover:text-white px-2.5 py-1 rounded-lg text-xs font-bold transition-colors"
                      >
                        + دمج
                      </button>
                    </div>
                  </div>
                ))
              )}
            </div>

            {/* Footer */}
            <div className="p-3.5 bg-gray-50 border-t border-gray-200 flex justify-between items-center text-xs text-gray-500 shrink-0">
              <span>إجمالي المشاريع المضبوطة بالقاموس: <strong className="font-sans text-gray-800">{dictionary.length}</strong></span>
              <button
                type="button"
                onClick={onClose}
                className="bg-[#002f6c] hover:bg-[#001f4c] text-white font-bold px-4 py-1.5 rounded-xl transition-colors"
              >
                حفظ وإغلاق
              </button>
            </div>
          </div>
        </div>
      );
    }
