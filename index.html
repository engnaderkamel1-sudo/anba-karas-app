</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    // --- FIREBASE INITIALIZATION ---
    const firebaseConfig = {
      apiKey: "AIzaSyDpzXjAZ-VQfwNs_2yjMyQdhuOKl1khNUQ",
      authDomain: "anba-karas-projects.firebaseapp.com",
      projectId: "anba-karas-projects",
      storageBucket: "anba-karas-projects.firebasestorage.app",
      messagingSenderId: "747402974061",
      appId: "1:747402974061:web:b0831b41baa3e533544064",
      measurementId: "G-MSTGV49GW2"
    };

    if (typeof firebase !== 'undefined' && !firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = typeof firebase !== 'undefined' ? firebase.firestore() : null;
    
    if (db) {
      try {
        db.settings({
          cacheSizeBytes: firebase.firestore.CACHE_SIZE_UNLIMITED,
          experimentalForceLongPolling: true
        });
        db.enablePersistence().catch((err) => {
          console.warn("Persistence Error:", err.code);
        });
      } catch (e) {
        console.warn("Firestore settings error:", e);
      }
    }

    const { useState, useEffect, useRef } = React;
    const urlParams = new URLSearchParams(window.location.search);
    const isReadOnly = urlParams.get('mode') === 'view' || urlParams.get('readonly') === 'true';

    // --- UTILS & HELPERS ---
    const uuidv4 = () => {
      return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
        const r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8);
        return v.toString(16);
      });
    };

    
    const getChurchStats = (churchLoc) => {
        let totalCases = 0;
        let totalValue = 0;
        let totalInst = 0;
        let totalGroups = (churchLoc.servantsGroups || []).length;
        (churchLoc.servantsGroups || []).forEach(sg => {
            (sg.cases || []).forEach(c => {
                totalCases++;
                totalValue += (parseFloat(c.projectValue) || 0);
                totalInst += (parseFloat(c.installmentAmount) || 0);
            });
        });
        return { totalCases, totalValue, totalInst, totalGroups };
    };

    const formatNumber = (num) => {
      if (num === null || num === undefined || num === '') return '';
      const str = String(num).replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));
      const cleanStr = str.replace(/,/g, '');
      if (!isNaN(cleanStr) && cleanStr.trim() !== '') {
        return Number(cleanStr).toLocaleString('en-US');
      }
      return str;
    };

    const parseArabicNumeric = (str) => {
      if (!str && str !== 0) return '';
      const englishStr = String(str).replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/,/g, '');
      const parsed = parseFloat(englishStr);
      return isNaN(parsed) ? '' : parsed;
    };

    // --- STATUS CONFIG & HELPERS ---
    const STATUS_CONFIG = {
      initial: { label: 'موافقة مبدئية', badgeClass: 'bg-amber-100 text-amber-800 border-amber-300', dotColor: 'bg-amber-500', icon: '⏳' },
      executed: { label: 'مشروع منفذ', badgeClass: 'bg-emerald-100 text-emerald-800 border-emerald-300', dotColor: 'bg-emerald-500', icon: '✅' },
      cancelled: { label: 'ملغى / لم ينفذ', badgeClass: 'bg-rose-100 text-rose-800 border-rose-300', dotColor: 'bg-rose-500', icon: '❌' }
    };

    const normalizeArabicText = (text) => {
      if (!text) return '';
      return String(text)
        .trim()
        .toLowerCase()
        .replace(/[أإآ]/g, 'ا')
        .replace(/ة/g, 'ه')
        .replace(/ى/g, 'ي')
        .replace(/[\u064B-\u065F]/g, '')
        .replace(/\s+/g, ' ');
    };

    const StatusBadge = ({ status = 'initial', className = '', onClick = null }) => {
      const cfg = STATUS_CONFIG[status] || STATUS_CONFIG.initial;
      return (
        <span 
          onClick={onClick}
          className={`inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-bold border transition-all ${cfg.badgeClass} ${onClick ? 'cursor-pointer hover:shadow-sm' : ''} ${className}`}
          title={onClick ? 'انقر لتغيير الحالة' : undefined}
        >
          <span className={`w-2 h-2 rounded-full ${cfg.dotColor}`}></span>
          <span>{cfg.label}</span>
        </span>
      );
    };

    // --- ICONS ---
    const Menu = ({ size=24, className='' }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>;
    const X = ({ size=24, className='' }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>;
    const Plus = ({ size=24, className='' }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>;
    const Trash2 = ({ size=24, className='' }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>;
    const Eye = ({ size=24, className='' }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>;
    const Edit2 = ({ size=24, className='' }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></svg>;
    const Mic = ({ size=24, className='' }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg>;
    const MapPin = ({ size=24, className='' }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>;
    const Download = ({ size=24, className='' }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>;
    const Cloud = ({ size=24, className='' }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></svg>;
    const CloudUpload = ({ size=24, className='' }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/><path d="M12 12v9"/><path d="m8 16 4-4 4 4"/></svg>;
    const CloudOff = ({ size=24, className='' }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m2 2 20 20"/><path d="M5.782 5.782A7 7 0 0 0 9 19h8.5a4.5 4.5 0 0 0 1.307-.193"/><path d="M21.532 16.5A4.5 4.5 0 0 0 17.5 10h-1.79A7.008 7.008 0 0 0 10 5.22"/></svg>;
    const ListIcon = ({ size=24, className='' }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>;
    const ChevronRight = ({ size=24, className='' }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="9 18 15 12 9 6"/></svg>;

    const ChevronDown = ({ size=24, className='' }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="6 9 12 15 18 9"/></svg>;
    const ChevronUp = ({ size=24, className='' }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="18 15 12 9 6 15"/></svg>;
    const SaintHaloIcon = ({ className='' }) => (
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" className={className}>
        <circle cx="50" cy="50" r="50" fill="#001f4c"/>
        <circle cx="50" cy="45" r="28" fill="none" stroke="#d4af37" strokeWidth="3"/>
        <path d="M50 25 V55 M35 38 H65" stroke="#d4af37" strokeWidth="5" strokeLinecap="round"/>
        <path d="M30 100 C30 70, 70 70, 70 100" fill="#d4af37"/>
      </svg>
    );
    const Calendar = ({ size=24, className='' }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>;
    const CheckCircle = ({ size=24, className='' }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>;
    const RotateCcw = ({ size=24, className='' }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="3 2 3 14 15 14"/><path d="M20.49 9A9 9 0 0 0 5.64 5.64L3 14"/></svg>;
        const Search = ({ size=24, className='' }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>;
    const AlertTriangle = ({ size=24, className='' }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>;
    const Upload = ({ size=24, className='' }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>;
    const CheckSquare = ({ size=24, className='' }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>;
    const Zap = ({ size=24, className='' }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>;
    const FileSpreadsheet = ({ size=24, className='' }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="16" y2="17"/><line x1="10" y1="9" x2="10" y2="21"/></svg>;

    // --- MIC INPUT COMPONENT ---
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const MicInput = ({ value, onValueChange, placeholder, isNumeric = false, className = '', disabled = false }) => {
      const [isListening, setIsListening] = useState(false);

      const startListening = () => {
        if (!SpeechRecognition) {
          alert('متصفحك لا يدعم الإدخال الصوتي.');
          return;
        }
        const recognition = new SpeechRecognition();
        recognition.lang = 'ar-EG';
        recognition.continuous = false;
        recognition.interimResults = false;

        recognition.onstart = () => setIsListening(true);
        recognition.onresult = (event) => {
          const transcript = event.results[0][0].transcript;
          if (isNumeric) {
            onValueChange(parseArabicNumeric(transcript));
          } else {
            onValueChange(transcript);
          }
        };
        recognition.onerror = () => setIsListening(false);
        recognition.onend = () => setIsListening(false);
        recognition.start();
      };

      return (
        <div className={`relative flex items-center ${className}`}>
          <input
            type={isNumeric ? "text" : "text"}
            inputMode={isNumeric ? "numeric" : "text"}
            value={isNumeric ? formatNumber(value) : value}
            onChange={(e) => isNumeric ? onValueChange(parseArabicNumeric(e.target.value)) : onValueChange(e.target.value)}
            className={`w-full rounded-md border border-gray-300 p-2.5 pl-10 text-sm focus:border-[#002f6c] focus:ring-1 focus:ring-[#002f6c] focus:outline-none transition-shadow ${isNumeric ? 'font-sans text-left' : 'text-right'} text-gray-900`}
            placeholder={placeholder}
            dir={isNumeric ? "ltr" : "rtl"}
            disabled={disabled}
          />
          {!disabled && <button
            type="button"
            onClick={startListening}
            className={`absolute left-2 p-1.5 rounded-full transition-colors ${isListening ? 'bg-red-100 text-red-600 animate-pulse' : 'text-gray-400 hover:text-[#002f6c] hover:bg-gray-100'}`}
            title="إدخال صوتي"
          >
            <Mic size={18} />
          </button>}
        </div>
      );
    };

    // --- EXPORT FUNCTION ---
    const handleExportExcel = (visitData, options = { scope: 'full', targetRegion: '', targetChurchId: '', targetChurchObj: null }) => {
        if (typeof XLSX === 'undefined') {
          alert('مكتبة الإكسيل غير متوفرة.');
          return;
        }
        
        const { scope, targetRegion, targetChurchId, targetChurchObj } = options;

        const aoa = [];
        const headers = [
            'مسلسل الكنيسة', 'مكان الزيارة', 'تاريخ الزيارة', 'اسم المنطقة',
            'اسم القرية', 'اسم الكنيسة', 'أسماء الخدام', 'اسم الحالة',
            'حالة المشروع', 'نوع المشروع', 'نوع المشروع المنفذ',
            'قيمة المشروع (مبدئي)', 'القيمة المنفذة فعلياً', 'قيمة القسط (مبدئي)', 'القسط المنفذ',
            'تاريخ التنفيذ', 'ملاحظات'
        ];
        
        aoa.push(headers);
        
        let grandTotalProjects = 0;
        let grandTotalApprovedValue = 0;
        let grandTotalExecutedValue = 0;
        let grandTotalApprovedInstallments = 0;
        let grandTotalExecutedInstallments = 0;
        
        let targetChurches = visitData.churches || [];
        if (scope === 'region') {
            targetChurches = targetChurches.filter(ch => ch.regionName === targetRegion);
        } else if (scope === 'church') {
            targetChurches = targetChurches.filter(ch => ch.id === targetChurchId);
        }

        targetChurches.forEach((churchLoc, index) => {
          let churchSerial = 1;
          let churchHasCases = false;
          (churchLoc.servantsGroups || []).forEach(sg => {
            (sg.cases || []).forEach(c => {
              churchHasCases = true;
              const isExec = c.status === 'executed';
              const statusLabel = STATUS_CONFIG[c.status || 'initial']?.label || 'موافقة مبدئية';
              const projectVal = parseArabicNumeric(c.projectValue) || 0;
              const execVal = isExec && c.executedProjectValue ? parseArabicNumeric(c.executedProjectValue) : (isExec ? projectVal : '');
              const instVal = parseArabicNumeric(c.installmentAmount) || 0;
              const execInstVal = isExec && c.executedInstallmentAmount ? parseArabicNumeric(c.executedInstallmentAmount) : (isExec ? instVal : '');
              const execType = isExec ? (c.executedProjectType || c.projectType) : '';
              const execDate = isExec ? (c.executionDate || '') : '';
              let fullNotes = c.notes || '';
              if (c.executionNotes) {
                fullNotes = fullNotes ? `${fullNotes} | ملاحظات التنفيذ: ${c.executionNotes}` : `ملاحظات التنفيذ: ${c.executionNotes}`;
              }

              aoa.push([
                churchSerial,
                visitData.location,
                visitData.date,
                churchLoc.regionName,
                churchLoc.villageName,
                churchLoc.churchName,
                sg.servantsNames,
                c.name,
                statusLabel,
                c.projectType,
                execType,
                projectVal,
                execVal,
                instVal,
                execInstVal,
                execDate,
                fullNotes
              ]);
              
              churchSerial++;
              grandTotalProjects++;
              grandTotalApprovedValue += projectVal;
              if (isExec && typeof execVal === 'number') grandTotalExecutedValue += execVal;
              grandTotalApprovedInstallments += instVal;
              if (isExec && typeof execInstVal === 'number') grandTotalExecutedInstallments += execInstVal;
            });
          });
          // Add a divider row if it's not the last church and this church had cases
          if (index < targetChurches.length - 1 && churchHasCases) {
              aoa.push(new Array(headers.length).fill('')); // separator
          }
        });

        if (aoa.length === 1) { // Only headers
          alert('لا توجد بيانات للتصدير.');
          return;
        }

        // Final Summary Row
        aoa.push([
          'الإجمالي',
          '', '', '', '', '', '', '', '', '',
          grandTotalProjects + ' مشروع',
          grandTotalApprovedValue,
          grandTotalExecutedValue,
          grandTotalApprovedInstallments,
          grandTotalExecutedInstallments,
          '', ''
        ]);

        const ws = XLSX.utils.aoa_to_sheet(aoa);

        const headerStyle = {
            fill: { fgColor: { rgb: "1E3A8A" } },
            font: { color: { rgb: "FFFFFF" }, bold: true, sz: 12 },
            alignment: { horizontal: "center", vertical: "center" },
            border: {
                top: {style: 'thin', color: {rgb: "000000"}},
                bottom: {style: 'thin', color: {rgb: "000000"}},
                left: {style: 'thin', color: {rgb: "000000"}},
                right: {style: 'thin', color: {rgb: "000000"}}
            }
        };

        const evenStyle = {
            fill: { fgColor: { rgb: "FFFFFF" } },
            font: { sz: 11 },
            border: {
                top: {style: 'thin', color: {rgb: "CBD5E1"}},
                bottom: {style: 'thin', color: {rgb: "CBD5E1"}},
                left: {style: 'thin', color: {rgb: "CBD5E1"}},
                right: {style: 'thin', color: {rgb: "CBD5E1"}}
            }
        };

        const oddStyle = {
            fill: { fgColor: { rgb: "F1F5F9" } },
            font: { sz: 11 },
            border: {
                top: {style: 'thin', color: {rgb: "CBD5E1"}},
                bottom: {style: 'thin', color: {rgb: "CBD5E1"}},
                left: {style: 'thin', color: {rgb: "CBD5E1"}},
                right: {style: 'thin', color: {rgb: "CBD5E1"}}
            }
        };

        const separatorStyle = {
            fill: { fgColor: { rgb: "E2E8F0" } },
            font: { bold: true }
        };

        const summaryStyle = {
            fill: { fgColor: { rgb: "FEF3C7" } },
            font: { bold: true, sz: 12, color: { rgb: "000000"} },
            border: {
                top: {style: 'thin', color: {rgb: "000000"}},
                bottom: {style: 'double', color: {rgb: "000000"}},
                left: {style: 'thin', color: {rgb: "CBD5E1"}},
                right: {style: 'thin', color: {rgb: "CBD5E1"}}
            }
        };

        const range = XLSX.utils.decode_range(ws['!ref']);
        
        const rightAlignCols = [1, 3, 4, 5, 6, 7, 9, 10, 16]; // Indices of columns to right align
        
        let dataRowIdx = 0;

        for (let R = range.s.r; R <= range.e.r; ++R) {
            let isSeparator = false;
            let isSummary = (R === range.e.r);
            
            if (R > 0 && !isSummary) {
                // Check if separator
                const firstCell = ws[XLSX.utils.encode_cell({r: R, c: 0})];
                if (!firstCell || firstCell.v === '') {
                    isSeparator = true;
                } else {
                    dataRowIdx++;
                }
            }

            for (let C = range.s.c; C <= range.e.c; ++C) {
                const cellRef = XLSX.utils.encode_cell({ r: R, c: C });
                if (!ws[cellRef]) ws[cellRef] = { t: 's', v: '' }; // create cell if it doesn't exist
                
                let cell = ws[cellRef];
                
                let currentStyle = {};
                if (R === 0) {
                    currentStyle = JSON.parse(JSON.stringify(headerStyle));
                } else if (isSummary) {
                    currentStyle = JSON.parse(JSON.stringify(summaryStyle));
                } else if (isSeparator) {
                    currentStyle = JSON.parse(JSON.stringify(separatorStyle));
                } else {
                    currentStyle = JSON.parse(JSON.stringify(dataRowIdx % 2 === 0 ? evenStyle : oddStyle));
                }
                
                if (R > 0) {
                   if (rightAlignCols.includes(C)) {
                       currentStyle.alignment = { horizontal: "right", vertical: "center" };
                   } else {
                       currentStyle.alignment = { horizontal: "center", vertical: "center" };
                   }
                }
                
                cell.s = currentStyle;
            }
        }

        // Set column widths explicitly
        ws['!cols'] = [
            { wch: 14 }, // A: مسلسل الكنيسة
            { wch: 20 }, // B: مكان الزيارة
            { wch: 14 }, // C: تاريخ الزيارة
            { wch: 16 }, // D: اسم المنطقة
            { wch: 16 }, // E: اسم القرية
            { wch: 24 }, // F: اسم الكنيسة
            { wch: 26 }, // G: أسماء الخدام
            { wch: 24 }, // H: اسم الحالة
            { wch: 18 }, // I: حالة المشروع
            { wch: 20 }, // J: نوع المشروع
            { wch: 20 }, // K: نوع المشروع المنفذ
            { wch: 18 }, // L: قيمة المشروع (مبدئي)
            { wch: 18 }, // M: القيمة المنفذة فعلياً
            { wch: 16 }, // N: قيمة القسط (مبدئي)
            { wch: 16 }, // O: القسط المنفذ
            { wch: 16 }, // P: تاريخ التنفيذ
            { wch: 32 }  // Q: ملاحظات
        ];
        
        ws['!views'] = [{ RTL: true }];

        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, 'الزيارة');

        const locationSafe = visitData.location ? visitData.location.replace(/\s+/g, '_') : 'بدون_اسم';
        let filename = `زيارة_${locationSafe}`;
        if (scope === 'region' && targetRegion) {
            filename += `_منطقة_${targetRegion.replace(/\s+/g, '_')}`;
        } else if (scope === 'church' && targetChurchObj) {
            filename += `_كنيسة_${targetChurchObj.churchName.replace(/\s+/g, '_')}_${targetChurchObj.regionName.replace(/\s+/g, '_')}`;
        }
        filename += `_${visitData.date}.xlsx`;

        XLSX.writeFile(wb, filename, { cellStyles: true });
    };

    // --- EXECUTION MODAL ---
    function ExecutionModal({ caseData, churchName, onSave, onClose }) {
      const [status, setStatus] = useState(caseData?.status || 'executed');
      const [executedProjectType, setExecutedProjectType] = useState(caseData?.executedProjectType || caseData?.projectType || '');
      const [executedProjectValue, setExecutedProjectValue] = useState(caseData?.executedProjectValue ?? caseData?.projectValue ?? '');
      const [executedInstallmentAmount, setExecutedInstallmentAmount] = useState(caseData?.executedInstallmentAmount ?? caseData?.installmentAmount ?? '');
      const [executionDate, setExecutionDate] = useState(caseData?.executionDate || new Date().toISOString().split('T')[0]);
      const [executionNotes, setExecutionNotes] = useState(caseData?.executionNotes || caseData?.notes || '');

      const handleSave = () => {
        onSave({
          ...caseData,
          status,
          executedProjectType: executedProjectType ? String(executedProjectType).trim() : '',
          executedProjectValue: parseArabicNumeric(executedProjectValue) || 0,
          executedInstallmentAmount: parseArabicNumeric(executedInstallmentAmount) || 0,
          executionDate,
          executionNotes: executionNotes ? String(executionNotes).trim() : ''
        });
      };

      return (
        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50 animate-fade-in">
          <div className="bg-white rounded-xl shadow-2xl w-full max-w-lg overflow-hidden border border-gray-100 flex flex-col max-h-[90vh]">
            <div className="p-4 border-b border-gray-100 bg-[#002f6c] text-white flex justify-between items-center shrink-0">
              <div>
                <h3 className="font-bold text-lg flex items-center gap-2">
                  <Zap size={20} className="text-[#d4af37]" />
                  تحديث وتأكيد تنفيذ المشروع
                </h3>
                <p className="text-xs text-blue-200 mt-0.5">الحالة: {caseData?.name} {churchName ? `(${churchName})` : ''}</p>
              </div>
              <button onClick={onClose} className="text-white/80 hover:text-white p-1"><X size={20} /></button>
            </div>

            <div className="p-5 space-y-4 overflow-y-auto flex-1">
              <div>
                <label className="block text-sm font-bold text-gray-700 mb-2">حالة المشروع</label>
                <div className="grid grid-cols-3 gap-2">
                  {Object.entries(STATUS_CONFIG).map(([key, cfg]) => (
                    <button
                      key={key}
                      type="button"
                      onClick={() => setStatus(key)}
                      className={`flex flex-col items-center justify-center p-2.5 rounded-lg border text-xs font-bold transition-all ${
                        status === key 
                          ? 'border-[#002f6c] bg-blue-50 text-[#002f6c] shadow-sm ring-2 ring-[#002f6c]/20'
                          : 'border-gray-200 hover:bg-gray-50 text-gray-600'
                      }`}
                    >
                      <span className="text-base mb-1">{cfg.icon}</span>
                      <span>{cfg.label}</span>
                    </button>
                  ))}
                </div>
              </div>

              {status === 'executed' && (
                <div className="bg-emerald-50/50 border border-emerald-200 rounded-xl p-4 space-y-4 animate-fade-in">
                  <div className="text-xs font-bold text-emerald-800 flex items-center gap-1.5">
                    <CheckCircle size={16} /> بيانات التنفيذ الفعلي على الأرض
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-gray-700 mb-1">نوع المشروع الفعلي</label>
                    <MicInput value={executedProjectType} onValueChange={setExecutedProjectType} placeholder="نوع المشروع بعد التنفيذ" />
                    {caseData?.projectType && caseData?.projectType !== executedProjectType && (
                      <p className="text-[11px] text-gray-500 mt-1">النوع المبدئي: {caseData.projectType}</p>
                    )}
                  </div>

                  <div className="grid grid-cols-2 gap-4">
                    <div>
                      <label className="block text-xs font-semibold text-gray-700 mb-1">قيمة المشروع الفعلية (ج.م)</label>
                      <MicInput isNumeric value={executedProjectValue} onValueChange={setExecutedProjectValue} placeholder="0" />
                      {caseData?.projectValue && (
                        <p className="text-[11px] text-gray-500 mt-1">المبدئي: {formatNumber(caseData.projectValue)} ج.م</p>
                      )}
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-gray-700 mb-1">قيمة القسط الفعلي (ج.م)</label>
                      <MicInput isNumeric value={executedInstallmentAmount} onValueChange={setExecutedInstallmentAmount} placeholder="0" />
                      {caseData?.installmentAmount && (
                        <p className="text-[11px] text-gray-500 mt-1">المبدئي: {formatNumber(caseData.installmentAmount)} ج.م</p>
                      )}
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-gray-700 mb-1">تاريخ التنفيذ الفعلي</label>
                    <input 
                      type="date" 
                      value={executionDate} 
                      onChange={e => setExecutionDate(e.target.value)} 
                      className="w-full rounded-md border border-gray-300 p-2 text-sm focus:border-[#002f6c] focus:ring-1 focus:ring-[#002f6c] outline-none font-sans"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-gray-700 mb-1">ملاحظات مسؤول القرية بعد التنفيذ</label>
                    <MicInput value={executionNotes} onValueChange={setExecutionNotes} placeholder="أي ملاحظات إضافية حول التنفيذ..." />
                  </div>
                </div>
              )}

              {status === 'cancelled' && (
                <div className="bg-rose-50 border border-rose-200 rounded-xl p-4 space-y-3 animate-fade-in">
                  <label className="block text-xs font-semibold text-rose-800 mb-1">سبب إلغاء أو عدم تنفيذ المشروع</label>
                  <MicInput value={executionNotes} onValueChange={setExecutionNotes} placeholder="اكتب سبب عدم التنفيذ..." />
                </div>
              )}
            </div>

            <div className="p-4 border-t border-gray-100 bg-gray-50 flex justify-end gap-2 shrink-0">
              <button onClick={onClose} className="px-5 py-2 rounded-md text-sm font-medium text-gray-600 hover:bg-gray-200 transition-colors">إلغاء</button>
              <button onClick={handleSave} className="px-6 py-2 rounded-md text-sm font-medium text-white bg-[#002f6c] hover:bg-[#001f4c] transition-colors shadow-sm">
                حفظ وتحديث الحالة
              </button>
            </div>
          </div>
        </div>
      );
    }

    // --- EXCEL IMPORT MODAL ---
    function ExcelImportModal({ visitData, onApplyUpdates, onClose }) {
      const [fileName, setFileName] = useState('');
      const [matchedItems, setMatchedItems] = useState([]);
      const [unmatchedRows, setUnmatchedRows] = useState([]);
      const [selectedIds, setSelectedIds] = useState({});
      const [executionDate, setExecutionDate] = useState(new Date().toISOString().split('T')[0]);
      const [isProcessing, setIsProcessing] = useState(false);

      const existingCases = [];
      (visitData.churches || []).forEach(ch => {
        (ch.servantsGroups || []).forEach(sg => {
          (sg.cases || []).forEach(c => {
            existingCases.push({
              caseObj: c,
              churchId: ch.id,
              groupId: sg.id,
              churchName: ch.churchName || '',
              regionName: ch.regionName || '',
              villageName: ch.villageName || '',
              servantsNames: sg.servantsNames || ''
            });
          });
        });
      });

      const handleFileUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        setFileName(file.name);
        setIsProcessing(true);

        const reader = new FileReader();
        reader.onload = (evt) => {
          try {
            const bstr = evt.target.result;
            const wb = XLSX.read(bstr, { type: 'binary' });
            const wsName = wb.SheetNames[0];
            const ws = wb.Sheets[wsName];
            const rows = XLSX.utils.sheet_to_json(ws, { defval: '' });

            const matches = [];
            const unmatched = [];
            const initialSelected = {};

            rows.forEach((row, idx) => {
              const rowName = row['اسم الحالة'] || row['الحالة'] || row['الاسم'] || row['اسم_الحالة'] || '';
              if (!rowName || String(rowName).includes('الإجمالي') || String(rowName).includes('اجمالي')) {
                return;
              }

              const normRowName = normalizeArabicText(rowName);
              const rowChurch = normalizeArabicText(row['اسم الكنيسة'] || row['الكنيسة'] || '');
              const newProjectType = String(row['نوع المشروع المنفذ'] || row['نوع المشروع'] || row['المشروع'] || '').trim();
              const newProjectVal = parseArabicNumeric(row['القيمة المنفذة'] || row['القيمة الفعلية'] || row['قيمة المشروع المنفذ'] || row['قيمة المشروع'] || row['القيمة'] || row['المبلغ']) || 0;
              const newInstallmentVal = parseArabicNumeric(row['القسط المنفذ'] || row['القسط الفعلي'] || row['قيمة القسط المنفذ'] || row['قيمة القسط'] || row['القسط']) || 0;
              const newNotes = String(row['ملاحظات التنفيذ'] || row['ملاحظات'] || '').trim();

              let found = existingCases.find(ec => {
                const ecName = normalizeArabicText(ec.caseObj.name);
                if (ecName === normRowName) {
                  if (rowChurch && normalizeArabicText(ec.churchName)) {
                    return normalizeArabicText(ec.churchName).includes(rowChurch) || rowChurch.includes(normalizeArabicText(ec.churchName));
                  }
                  return true;
                }
                return false;
              });

              if (!found) {
                found = existingCases.find(ec => {
                  const ecName = normalizeArabicText(ec.caseObj.name);
                  return (ecName.length > 5 && normRowName.length > 5 && (ecName.includes(normRowName) || normRowName.includes(ecName)));
                });
              }

              if (found) {
                const effectiveVal = newProjectVal > 0 ? newProjectVal : (found.caseObj.executedProjectValue || found.caseObj.projectValue);
                const effectiveInst = newInstallmentVal > 0 ? newInstallmentVal : (found.caseObj.executedInstallmentAmount || found.caseObj.installmentAmount);
                const effectiveType = newProjectType || found.caseObj.executedProjectType || found.caseObj.projectType;

                const hasValueChanged = effectiveVal !== found.caseObj.projectValue;
                const hasInstChanged = effectiveInst !== found.caseObj.installmentAmount;
                const hasTypeChanged = effectiveType !== found.caseObj.projectType;

                const matchObj = {
                  rowIdx: idx,
                  existing: found,
                  excelData: {
                    name: rowName,
                    projectType: effectiveType,
                    projectValue: effectiveVal,
                    installmentAmount: effectiveInst,
                    notes: newNotes || found.caseObj.notes || ''
                  },
                  hasChanges: hasValueChanged || hasInstChanged || hasTypeChanged
                };

                matches.push(matchObj);
                initialSelected[found.caseObj.id] = true;
              } else {
                unmatched.push({
                  rowIdx: idx,
                  name: rowName,
                  church: row['اسم الكنيسة'] || '',
                  projectType: newProjectType,
                  projectValue: newProjectVal,
                  installmentAmount: newInstallmentVal,
                  notes: newNotes
                });
              }
            });

            setMatchedItems(matches);
            setUnmatchedRows(unmatched);
            setSelectedIds(initialSelected);
          } catch (err) {
            console.error("Excel parse error:", err);
            alert('حدث خطأ أثناء قراءة ملف الإكسيل. يرجى التأكد من صيغة الملف.');
          } finally {
            setIsProcessing(false);
          }
        };
        reader.readAsBinaryString(file);
      };

      const toggleSelectAll = () => {
        const allSelected = matchedItems.every(m => selectedIds[m.existing.caseObj.id]);
        const next = {};
        matchedItems.forEach(m => {
          next[m.existing.caseObj.id] = !allSelected;
        });
        setSelectedIds(next);
      };

      const handleApply = () => {
        const selectedMatches = matchedItems.filter(m => selectedIds[m.existing.caseObj.id]);
        if (selectedMatches.length === 0) {
          alert('برجاء تحديد حالة واحدة على الأقل لتحديثها.');
          return;
        }

        onApplyUpdates(selectedMatches, executionDate);
        onClose();
      };

      return (
        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50 animate-fade-in">
          <div className="bg-white rounded-xl shadow-2xl w-full max-w-4xl overflow-hidden border border-gray-100 flex flex-col max-h-[90vh]">
            <div className="p-4 border-b border-gray-100 bg-[#002f6c] text-white flex justify-between items-center shrink-0">
              <div>
                <h3 className="font-bold text-lg flex items-center gap-2">
                  <Upload size={20} className="text-[#d4af37]" />
                  استيراد ومطابقة كشف التنفيذ الفعلي من الإكسيل
                </h3>
                <p className="text-xs text-blue-200 mt-0.5">مطابقة الحالات آلياً وتحديث القيم وتحويلها إلى مشاريع منفذة</p>
              </div>
              <button onClick={onClose} className="text-white/80 hover:text-white p-1"><X size={20} /></button>
            </div>

            <div className="p-5 space-y-5 overflow-y-auto flex-1">
              {!matchedItems.length && !unmatchedRows.length && (
                <div className="border-2 border-dashed border-[#002f6c]/30 hover:border-[#002f6c] rounded-xl p-8 text-center bg-blue-50/30 transition-colors">
                  <FileSpreadsheet size={48} className="mx-auto text-[#002f6c] mb-3 opacity-80" />
                  <p className="text-gray-700 font-bold mb-1">اختر ملف الإكسيل المُعدل من مسؤول القرية</p>
                  <p className="text-gray-500 text-xs mb-4">يدعم ملفات (.xlsx, .xls) التي تم تصديرها من التطبيق سابقاً بعد تعديلها</p>
                  <label className="inline-flex items-center gap-2 bg-[#002f6c] hover:bg-[#001f4c] text-white px-5 py-2.5 rounded-lg cursor-pointer font-medium text-sm transition-colors shadow-sm">
                    <Upload size={18} />
                    <span>اختيار ملف الإكسيل</span>
                    <input type="file" accept=".xlsx,.xls,.csv" onChange={handleFileUpload} className="hidden" />
                  </label>
                </div>
              )}

              {isProcessing && (
                <div className="text-center py-10">
                  <div className="w-8 h-8 border-4 border-[#002f6c] border-t-transparent rounded-full animate-spin mx-auto mb-2"></div>
                  <p className="text-gray-600 font-medium text-sm">جاري قراءة ومطابقة بيانات الإكسيل...</p>
                </div>
              )}

              {(matchedItems.length > 0 || unmatchedRows.length > 0) && (
                <div className="space-y-4 animate-fade-in">
                  <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 bg-gray-50 p-4 rounded-xl border border-gray-200">
                    <div className="flex flex-wrap items-center gap-2">
                      <FileSpreadsheet size={20} className="text-[#002f6c]" />
                      <span className="font-bold text-gray-800 text-sm">{fileName}</span>
                      <span className="bg-emerald-100 text-emerald-800 text-xs font-bold px-2.5 py-0.5 rounded-full">
                        تم مطابقة {matchedItems.length} حالة
                      </span>
                      {unmatchedRows.length > 0 && (
                        <span className="bg-amber-100 text-amber-800 text-xs font-bold px-2.5 py-0.5 rounded-full">
                          {unmatchedRows.length} غير متطابقة
                        </span>
                      )}
                    </div>

                    <div className="flex items-center gap-3 w-full sm:w-auto">
                      <div className="flex items-center gap-1.5 text-xs text-gray-600">
                        <span>تاريخ التنفيذ:</span>
                        <input 
                          type="date" 
                          value={executionDate} 
                          onChange={e => setExecutionDate(e.target.value)} 
                          className="border border-gray-300 rounded px-2 py-1 text-xs font-sans outline-none focus:border-[#002f6c]"
                        />
                      </div>
                      <label className="text-xs text-[#002f6c] hover:underline cursor-pointer flex items-center gap-1">
                        <input type="file" accept=".xlsx,.xls" onChange={handleFileUpload} className="hidden" />
                        تغيير الملف
                      </label>
                    </div>
                  </div>

                  <div className="border border-gray-200 rounded-xl overflow-hidden shadow-sm">
                    <div className="bg-gray-100 px-4 py-2.5 border-b border-gray-200 flex justify-between items-center">
                      <div className="flex items-center gap-2">
                        <input 
                          type="checkbox" 
                          id="selectAllMatches"
                          checked={matchedItems.length > 0 && matchedItems.every(m => selectedIds[m.existing.caseObj.id])} 
                          onChange={toggleSelectAll} 
                          className="w-4 h-4 text-[#002f6c] rounded"
                        />
                        <label htmlFor="selectAllMatches" className="text-xs font-bold text-gray-700 cursor-pointer">
                          تحديد كل الحالات المتطابقة ({matchedItems.length})
                        </label>
                      </div>
                      <span className="text-xs text-gray-500">
                        المحدد للتحديث: {Object.values(selectedIds).filter(Boolean).length}
                      </span>
                    </div>

                    <div className="max-h-72 overflow-y-auto">
                      <table className="w-full text-xs text-right">
                        <thead className="bg-gray-50 text-gray-600 border-b border-gray-200 uppercase sticky top-0">
                          <tr>
                            <th className="p-2.5 w-10 text-center">اختيار</th>
                            <th className="p-2.5">اسم الحالة</th>
                            <th className="p-2.5">الكنيسة</th>
                            <th className="p-2.5">نوع المشروع</th>
                            <th className="p-2.5 text-center">القيمة (المبدئي ⬅️ الفعلي)</th>

                                </td>
                                <td className="p-2.5 font-bold text-gray-900">{m.existing.caseObj.name}</td>
                                <td className="p-2.5 text-gray-600">{m.existing.churchName}</td>

                                <td className="p-2.5 text-center font-sans">

                                    <div className="flex items-center justify-center gap-1 font-bold text-emerald-700">

    // --- CASE MODAL ---

              <button onClick={handleSave} className="px-5 py-2 rounded-md text-sm font-medium text-white bg-[#002f6c] hover:bg-[#001f4c] transition-colors shadow-sm">حفظ الحالة</button>
            </div>
          </div>
        </div>
      );
    }

    // --- SERVANTS GROUP VIEW ---
    function ServantsGroupView({ group, churchId, onUpdateGroup, onDeleteGroup, serialMap, onEditCase, onDeleteCase, onExecuteCase }) {
