<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>خدمة الأنبا كاراس | OED - ORASCOM CONSTRUCTION</title>
  
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM via CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel for in-browser transpilation of JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- SheetJS for Excel Export -->
  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>

  <!-- Firebase Compat via CDN -->
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>

  <style>
    body { font-family: system-ui, -apple-system, sans-serif; }
  </style>
</head>
<body class="bg-gray-50 text-slate-800 antialiased">
  <div id="root"></div>

  <!-- The entire React App -->
  <script type="text/babel" data-type="module">
    // Initialize Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyDpzXjAZ-VQfwNs_2yjMyQdhuOKl1khNUQ",
      authDomain: "anba-karas-projects.firebaseapp.com",
      projectId: "anba-karas-projects",
      storageBucket: "anba-karas-projects.firebasestorage.app",
      messagingSenderId: "747402974061",
      appId: "1:747402974061:web:b0831b41baa3e533544064",
      measurementId: "G-MSTGV49GW2"
    };

    if (typeof firebase !== 'undefined' && !firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = typeof firebase !== 'undefined' ? firebase.firestore() : null;
    
    if (db) {
      db.enablePersistence().catch((err) => {
        console.error("Firebase persistence error:", err.code);
      });
    }

    const { useState, useEffect, useRef } = React;

    const uuidv4 = () => {
      if (crypto && crypto.randomUUID) return crypto.randomUUID();
      return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
        const r = Math.random() * 16 | 0, v = c === 'x' ? r : (r & 0x3 | 0x8);
        return v.toString(16);
      });
    };

    const formatNumber = (num) => {
      if (num === null || num === undefined || isNaN(num)) return '0';
      return Number(num).toLocaleString('en-US');
    };

    const parseArabicNumeric = (val) => {
      if (!val) return 0;
      const englishStr = String(val).replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));
      const num = Number(englishStr.replace(/[^0-9.-]/g, ''));
      return isNaN(num) ? 0 : num;
    };

    // Icons
    const Mic = ({ size = 24, className = '' }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg>
    );
    const MicOff = ({ size = 24, className = '' }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="2" x2="22" y1="2" y2="22"/><path d="M18.89 13.23A7.12 7.12 0 0 0 19 12v-2"/><path d="M5 10v2a7 7 0 0 0 12 5"/><path d="M15 9.34V5a3 3 0 0 0-5.68-1.33"/><path d="M9 9v3a3 3 0 0 0 5.12 2.12"/><line x1="12" x2="12" y1="19" y2="22"/></svg>
    );
    const Plus = ({ size = 24, className = '' }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M5 12h14"/><path d="M12 5v14"/></svg>
    );
    const Download = ({ size = 24, className = '' }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
    );
    const RefreshCw = ({ size = 24, className = '' }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
    );
    const MapPin = ({ size = 24, className = '' }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
    );
    const Trash2 = ({ size = 24, className = '' }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>
    );
    const Pencil = ({ size = 24, className = '' }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></svg>
    );
    const Cloud = ({ size = 24, className = '' }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></svg>
    );
    const CloudUpload = ({ size = 24, className = '' }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/><path d="M12 12v9"/><path d="m8 16 4-4 4 4"/></svg>
    );
    const CloudOff = ({ size = 24, className = '' }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m2 2 20 20"/><path d="M5.782 5.782A7 7 0 0 0 9 19h8.5a4.5 4.5 0 0 0 1.307-.193"/><path d="M21.532 16.5A4.5 4.5 0 0 0 17.5 10h-1.79A7.008 7.008 0 0 0 10 5.22"/></svg>
    );

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    function MicInput({ value, onValueChange, multiline = false, type = 'text', placeholder, className = "", id }) {
      const [isListening, setIsListening] = useState(false);
      const recognitionRef = useRef(null);

      useEffect(() => {
        if (SpeechRecognition) {
          recognitionRef.current = new SpeechRecognition();
          recognitionRef.current.continuous = false;
          recognitionRef.current.interimResults = false;
          recognitionRef.current.lang = 'ar-EG';

          recognitionRef.current.onresult = (event) => {
            const transcript = event.results[0][0].transcript;
            onValueChange(value ? `${value} ${transcript}` : transcript);
          };

          recognitionRef.current.onerror = (event) => {
            console.error("Speech recognition error", event.error);
            setIsListening(false);
          };

          recognitionRef.current.onend = () => {
            setIsListening(false);
          };
        }
      }, [value, onValueChange]);

      const toggleListen = () => {
        if (isListening) {
          recognitionRef.current?.stop();
          setIsListening(false);
        } else {
          try {
            recognitionRef.current?.start();
            setIsListening(true);
          } catch (e) {
            console.error(e);
          }
        }
      };

      const baseInputClass = "w-full rounded-md border border-gray-300 p-2.5 text-sm focus:border-[#002f6c] focus:ring-1 focus:ring-[#002f6c] focus:outline-none transition-shadow text-gray-900";

      return (
        <div className="relative flex items-center w-full">
          {multiline ? (
            <textarea
              id={id}
              value={value}
              onChange={(e) => onValueChange(e.target.value)}
              placeholder={placeholder}
              className={`${baseInputClass} pl-12 min-h-[80px] ${className}`}
            />
          ) : (
            <input
              id={id}
              type={type === 'number' ? 'text' : type}
              inputMode={type === 'number' ? 'decimal' : undefined}
              value={value}
              onChange={(e) => onValueChange(e.target.value)}
              placeholder={placeholder}
              className={`${baseInputClass} pl-12 ${className}`}
            />
          )}
          
          {SpeechRecognition && type !== 'date' && (
            <button
              type="button"
              onClick={toggleListen}
              className={`absolute left-2 top-2 p-1.5 rounded-full transition-colors flex-shrink-0 ${
                isListening ? 'bg-red-100 text-red-600 animate-pulse' : 'text-gray-400 hover:text-[#002f6c] hover:bg-gray-100'
              }`}
              title="تحدث للإدخال"
            >
              {isListening ? <Mic size={18} /> : <MicOff size={18} />}
            </button>
          )}
        </div>
      );
    }

    function EditCaseModal({ caseData, onSave, onCancel }) {
      const [name, setName] = useState(caseData.name);
      const [projectType, setProjectType] = useState(caseData.projectType || '');
      const [projectValue, setProjectValue] = useState(caseData.projectValue || '');
      const [installmentAmount, setInstallmentAmount] = useState(caseData.installmentAmount || '');
      const [notes, setNotes] = useState(caseData.notes || '');

      const handleSave = (e) => {
        e.preventDefault();
        if (!name.trim()) return;
        onSave({
          ...caseData,
          name: name.trim(),
          projectType: projectType.trim(),
          projectValue: parseArabicNumeric(projectValue),
          installmentAmount: parseArabicNumeric(installmentAmount),
          notes: notes.trim()
        });
      };

      return (
        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-[100]">
          <div className="bg-white rounded-xl shadow-xl w-full max-w-lg overflow-hidden flex flex-col max-h-[90vh]">
            <div className="bg-[#002f6c] p-4 text-white flex justify-between items-center shrink-0">
              <h3 className="font-bold text-lg">تعديل الحالة</h3>
            </div>
            <div className="p-4 sm:p-6 overflow-y-auto">
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-6">
                <div>
                  <label className="block text-sm font-medium text-gray-700 mb-1">اسم الحالة *</label>
                  <MicInput value={name} onValueChange={setName} placeholder="أدخل اسم الحالة" />
                </div>
                <div>
                  <label className="block text-sm font-medium text-gray-700 mb-1">نوع المشروع</label>
                  <MicInput value={projectType} onValueChange={setProjectType} placeholder="أدخل نوع المشروع" />
                </div>
                <div>
                  <label className="block text-sm font-medium text-gray-700 mb-1">قيمة المشروع</label>
                  <MicInput type="number" value={projectValue} onValueChange={setProjectValue} placeholder="0" />
                </div>
                <div>
                  <label className="block text-sm font-medium text-gray-700 mb-1">قيمة القسط</label>
                  <MicInput type="number" value={installmentAmount} onValueChange={setInstallmentAmount} placeholder="0" />
                </div>
                <div className="sm:col-span-2">
                  <label className="block text-sm font-medium text-gray-700 mb-1">ملاحظات</label>
                  <MicInput value={notes} onValueChange={setNotes} placeholder="أضف ملاحظات..." multiline />
                </div>
              </div>
              <div className="flex gap-3 justify-end">
                <button onClick={onCancel} className="px-4 py-2 border border-gray-300 rounded-md text-gray-700 font-medium hover:bg-gray-50 transition-colors">إلغاء</button>
                <button onClick={handleSave} disabled={!name.trim()} className="px-4 py-2 bg-[#d4af37] text-white rounded-md font-medium hover:bg-[#c49b27] transition-colors disabled:bg-gray-300">حفظ التعديل</button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function CaseForm({ onAddCase }) {
      const [name, setName] = useState('');
      const [projectType, setProjectType] = useState('');
      const [projectValue, setProjectValue] = useState('');
      const [installmentAmount, setInstallmentAmount] = useState('');
      const [notes, setNotes] = useState('');

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!name.trim()) return;

        onAddCase({
          id: uuidv4(),
          name: name.trim(),
          projectType: projectType.trim(),
          projectValue: parseArabicNumeric(projectValue),
          installmentAmount: parseArabicNumeric(installmentAmount),
          notes: notes.trim()
        });

        setName('');
        setProjectType('');
        setProjectValue('');
        setInstallmentAmount('');
        setNotes('');
      };

      return (
        <form onSubmit={handleSubmit} className="bg-gray-50 border border-gray-200 rounded-lg p-4 mb-4">
          <h4 className="font-semibold text-lg text-[#002f6c] mb-4">إضافة حالة جديدة</h4>
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
            <div>
              <label className="block text-sm font-medium text-gray-700 mb-1">اسم الحالة *</label>
              <MicInput value={name} onValueChange={setName} placeholder="أدخل اسم الحالة" />
            </div>
            <div>
              <label className="block text-sm font-medium text-gray-700 mb-1">نوع المشروع</label>
              <MicInput value={projectType} onValueChange={setProjectType} placeholder="أدخل نوع المشروع" />
            </div>
            <div>
              <label className="block text-sm font-medium text-gray-700 mb-1">قيمة المشروع</label>
              <MicInput type="number" value={projectValue} onValueChange={setProjectValue} placeholder="0" />
            </div>
            <div>
              <label className="block text-sm font-medium text-gray-700 mb-1">قيمة القسط</label>
              <MicInput type="number" value={installmentAmount} onValueChange={setInstallmentAmount} placeholder="0" />
            </div>
            <div className="sm:col-span-2">
              <label className="block text-sm font-medium text-gray-700 mb-1">ملاحظات</label>
              <MicInput value={notes} onValueChange={setNotes} placeholder="أضف ملاحظات..." multiline />
            </div>
          </div>
          <button type="submit" disabled={!name.trim()} className="w-full sm:w-auto flex items-center justify-center gap-2 bg-[#d4af37] hover:bg-[#c49b27] disabled:bg-gray-300 disabled:cursor-not-allowed text-white font-medium py-2.5 px-6 rounded-md transition-colors shadow-sm">
            <Plus size={18} />
            <span>إضافة الحالة</span>
          </button>
        </form>
      );
    }

    function ServantsGroupView({ group, churchId, onUpdateGroup, onDeleteGroup, serialMap, onEditCase, onDeleteCase }) {
      const handleAddCase = (newCase) => {
        onUpdateGroup({ ...group, cases: [...group.cases, newCase] });
      };

      return (
        <div className="p-5 bg-white border border-gray-200 rounded-lg shadow-sm relative">
          <button onClick={() => { if(confirm('هل أنت متأكد من حذف فريق الخدام هذا وكل حالاته؟')) onDeleteGroup(group.id); }} className="absolute top-4 left-4 text-red-500 hover:text-red-700 bg-red-50 p-1.5 rounded-md" title="حذف الفريق">
            <Trash2 size={18} />
          </button>
          
          <div className="max-w-md mb-6 pr-2">
            <label className="block text-sm font-bold text-gray-800 mb-2">فريق الخدام</label>
            <MicInput value={group.servantsNames || ''} onValueChange={(v) => onUpdateGroup({ ...group, servantsNames: v })} placeholder="أدخل أسماء الخدام" />
          </div>
          
          <CaseForm onAddCase={handleAddCase} />
          
          {group.cases.length > 0 && (
            <div className="overflow-x-auto rounded-lg border border-gray-200 mt-6">
              <table className="w-full text-sm text-right text-gray-600 min-w-[900px]">
                <thead className="text-xs text-gray-700 uppercase bg-gray-100">
                  <tr>
                    <th className="px-3 py-3 w-16 text-center border-l border-gray-200">م. عام</th>
                    <th className="px-3 py-3 w-16 text-center border-l border-gray-200">م. منطقة</th>
                    <th className="px-3 py-3 w-16 text-center border-l border-gray-200">م. كنيسة</th>
                    <th className="px-4 py-3">اسم الحالة</th>
                    <th className="px-4 py-3">نوع المشروع</th>
                    <th className="px-4 py-3">قيمة المشروع</th>
                    <th className="px-4 py-3">قيمة القسط</th>
                    <th className="px-4 py-3">ملاحظات</th>
                    <th className="px-4 py-3 text-center">إجراءات</th>
                  </tr>
                </thead>
                <tbody>
                  {group.cases.map(c => {
                    const s = serialMap[c.id] || { g: 0, r: 0, c: 0 };
                    return (
                      <tr key={c.id} className="bg-white border-b hover:bg-gray-50 transition-colors">
                        <td className="px-3 py-3 text-center font-bold text-gray-500 bg-gray-50 border-l border-gray-200 font-sans">{formatNumber(s.g)}</td>
                        <td className="px-3 py-3 text-center font-bold text-gray-500 bg-gray-50 border-l border-gray-200 font-sans">{formatNumber(s.r)}</td>
                        <td className="px-3 py-3 text-center font-bold text-gray-500 bg-gray-50 border-l border-gray-200 font-sans">{formatNumber(s.c)}</td>
                        <td className="px-4 py-3 font-medium text-gray-900">{c.name}</td>
                        <td className="px-4 py-3">{c.projectType || '-'}</td>
                        <td className="px-4 py-3 font-semibold font-sans">{formatNumber(c.projectValue)}</td>
                        <td className="px-4 py-3 font-semibold font-sans">{formatNumber(c.installmentAmount)}</td>
                        <td className="px-4 py-3 max-w-[150px] truncate" title={c.notes}>{c.notes || '-'}</td>
                        <td className="px-4 py-3 text-center">
                          <div className="flex items-center justify-center gap-2">
                            <button onClick={() => onEditCase(c, churchId, group.id)} className="text-blue-500 hover:bg-blue-50 p-1.5 rounded" title="تعديل">
                              <Pencil size={16} />
                            </button>
                            <button onClick={() => onDeleteCase(c.id, churchId, group.id)} className="text-red-500 hover:bg-red-50 p-1.5 rounded" title="حذف">
                              <Trash2 size={16} />
                            </button>
                          </div>
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          )}
        </div>
      );
    }

    function ChurchCard({ churchLoc, onUpdateChurch, onDeleteChurch, serialMap, onEditCase, onDeleteCase }) {
      const handleAddServantsGroup = () => {
        const newGroup = { id: uuidv4(), servantsNames: '', cases: [] };
        onUpdateChurch({ ...churchLoc, servantsGroups: [...(churchLoc.servantsGroups || []), newGroup] });
      };
      
      const handleUpdateGroup = (updatedGroup) => {
        onUpdateChurch({
          ...churchLoc,
          servantsGroups: churchLoc.servantsGroups.map(g => g.id === updatedGroup.id ? updatedGroup : g)
        });
      };

      const handleDeleteGroup = (groupId) => {
        onUpdateChurch({
          ...churchLoc,
          servantsGroups: churchLoc.servantsGroups.filter(g => g.id !== groupId)
        });
      };

      let totalProjects = 0;
      let totalProjectValue = 0;
      let totalInstallments = 0;
      (churchLoc.servantsGroups || []).forEach(g => {
        g.cases.forEach(c => {
          totalProjects++;
          totalProjectValue += c.projectValue;
          totalInstallments += c.installmentAmount;
        });
      });

      return (
        <div className="bg-white rounded-xl shadow-md border border-gray-100 overflow-hidden mb-6">
          <div className="p-4 sm:p-6 border-b border-gray-200 bg-[#002f6c]/5 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
            <div className="flex-1 w-full grid grid-cols-1 sm:grid-cols-3 gap-4">
              <div>
                <label className="block text-sm font-medium text-[#002f6c] mb-1">المنطقة</label>
                <MicInput value={churchLoc.regionName || ''} onValueChange={(v) => onUpdateChurch({...churchLoc, regionName: v})} placeholder="أدخل اسم المنطقة" />
              </div>
              <div>
                <label className="block text-sm font-medium text-[#002f6c] mb-1">القرية</label>
                <MicInput value={churchLoc.villageName || ''} onValueChange={(v) => onUpdateChurch({...churchLoc, villageName: v})} placeholder="أدخل اسم القرية" />
              </div>
              <div>
                <label className="block text-sm font-medium text-[#002f6c] mb-1">الكنيسة</label>
                <MicInput value={churchLoc.churchName || ''} onValueChange={(v) => onUpdateChurch({...churchLoc, churchName: v})} placeholder="أدخل اسم الكنيسة" />
              </div>
            </div>
            <button onClick={() => { if (confirm('هل أنت متأكد من حذف بيانات هذه الكنيسة بالكامل؟')) onDeleteChurch(churchLoc.id); }} className="text-red-500 hover:text-red-700 hover:bg-red-50 p-2 rounded-md transition-colors">
              <Trash2 size={20} />
            </button>
          </div>

          <div className="p-4 sm:p-6">
            <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
              <div className="bg-blue-50 border border-blue-100 rounded-lg p-4 text-center">
                <span className="block text-sm font-medium text-blue-800 mb-1">إجمالي حالات الكنيسة</span>
                <span className="block text-2xl font-bold text-[#002f6c] font-sans">{formatNumber(totalProjects)}</span>
              </div>
              <div className="bg-green-50 border border-green-100 rounded-lg p-4 text-center">
                <span className="block text-sm font-medium text-green-800 mb-1">إجمالي قيمة المشاريع</span>
                <span className="block text-2xl font-bold text-[#002f6c]"><span className="font-sans">{formatNumber(totalProjectValue)}</span> ج.م</span>
              </div>
              <div className="bg-[#fff9e6] border border-[#f0e0a8] rounded-lg p-4 text-center">
                <span className="block text-sm font-medium text-[#8a7222] mb-1">إجمالي الأقساط</span>
                <span className="block text-2xl font-bold text-[#002f6c]"><span className="font-sans">{formatNumber(totalInstallments)}</span> ج.م</span>
              </div>
            </div>

            <div className="space-y-8">
              {(churchLoc.servantsGroups || []).map(group => (
                <ServantsGroupView 
                  key={group.id} 
                  group={group} 
                  churchId={churchLoc.id}
                  onUpdateGroup={handleUpdateGroup} 
                  onDeleteGroup={handleDeleteGroup} 
                  serialMap={serialMap} 
                  onEditCase={onEditCase} 
                  onDeleteCase={onDeleteCase} 
                />
              ))}
            </div>

            <div className="mt-6 flex justify-center">
              <button onClick={handleAddServantsGroup} className="flex items-center gap-2 bg-gray-50 hover:bg-gray-100 text-[#002f6c] font-medium py-2.5 px-6 rounded-md transition-colors border border-gray-300 shadow-sm">
                <Plus size={18} />
                <span>إضافة خدام آخرين لنفس الكنيسة</span>
              </button>
            </div>
          </div>
        </div>
      );
    }

    const STORAGE_KEY = 'anba_karas_visit_data';
    const initialData = { visitId: uuidv4(), location: '', date: new Date().toISOString().split('T')[0], churches: [] };

    function App() {
      const [syncStatus, setSyncStatus] = useState('synced');
      
      const [data, setData] = useState(() => {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          try {
            const parsed = JSON.parse(saved);
            if (!parsed.visitId) parsed.visitId = uuidv4();
            // Migrate old structure if present
            if (parsed.regions && !parsed.churches) {
              parsed.churches = parsed.regions.map(r => ({
                id: r.id,
                regionName: r.name || '',
                villageName: r.villageName || '',
                churchName: r.churchName || '',
                servantsGroups: [{ id: uuidv4(), servantsNames: r.servantsNames || '', cases: r.cases || [] }]
              }));
              delete parsed.regions;
            }
            return parsed;
          } catch (e) { console.error('Failed to parse local storage', e); }
        }
        return initialData;
      });

      const [editingCaseInfo, setEditingCaseInfo] = useState(null);

      const isRemoteUpdate = useRef(false);

      useEffect(() => {
        if (!db) return;
        const unsubscribe = db.collection('visits').doc('current_visit').onSnapshot((doc) => {
          if (doc.exists) {
            if (!doc.metadata.hasPendingWrites) {
              const cloudData = doc.data();
              setData(prevData => {
                if (JSON.stringify(prevData) !== JSON.stringify(cloudData)) {
                  isRemoteUpdate.current = true;
                  return cloudData;
                }
                return prevData;
              });
            }
          } else {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
              try {
                const parsed = JSON.parse(saved);
                if (parsed && Object.keys(parsed).length > 0) {
                  setSyncStatus('syncing');
                  db.collection('visits').doc('current_visit').set(parsed)
                    .then(() => setSyncStatus('synced'))
                    .catch(() => setSyncStatus('error'));
                }
              } catch(e) {}
            }
          }
        });
        return () => unsubscribe();
      }, []);

      useEffect(() => {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        
        if (isRemoteUpdate.current) {
          isRemoteUpdate.current = false;
          return;
        }

        if (!db) return;

        setSyncStatus('syncing');
        db.collection('visits').doc('current_visit').set(data)
          .then(() => setSyncStatus('synced'))
          .catch((err) => {
            console.error("Firestore Save Error:", err);
            setSyncStatus('error');
          });
      }, [data]);

      // Serial mapping logic
      const serialMap = {};
      let globalS = 0;
      let lastRegion = null;
      let regionS = 0;
      let lastChurch = null;
      let churchS = 0;

      (data.churches || []).forEach(churchLoc => {
        const rKey = (churchLoc.regionName || '').trim().toLowerCase();
        const cKey = rKey + '|' + (churchLoc.villageName || '').trim().toLowerCase() + '|' + (churchLoc.churchName || '').trim().toLowerCase();

        (churchLoc.servantsGroups || []).forEach(sg => {
          (sg.cases || []).forEach(c => {
            globalS++;
            if (rKey !== lastRegion) {
              lastRegion = rKey;
              regionS = 1;
            } else {
              regionS++;
            }
            
            if (cKey !== lastChurch) {
              lastChurch = cKey;
              churchS = 1;
            } else {
              churchS++;
            }
            
            serialMap[c.id] = { g: globalS, r: regionS, c: churchS };
          });
        });
      });

      const handleAddChurch = () => {
        const newChurch = {
          id: uuidv4(),
          regionName: '',
          villageName: '',
          churchName: '',
          servantsGroups: [{ id: uuidv4(), servantsNames: '', cases: [] }]
        };
        setData(prev => ({ ...prev, churches: [newChurch, ...(prev.churches || [])] }));
      };

      const handleUpdateChurch = (updatedChurch) => {
        setData(prev => ({
          ...prev,
          churches: prev.churches.map(ch => ch.id === updatedChurch.id ? updatedChurch : ch)
        }));
      };

      const handleDeleteChurch = (id) => {
        setData(prev => ({
          ...prev,
          churches: prev.churches.filter(ch => ch.id !== id)
        }));
      };

      const handleSaveEditCase = (updatedCase) => {
        const { churchId, groupId } = editingCaseInfo;
        setData(prev => ({
          ...prev,
          churches: prev.churches.map(ch => ch.id === churchId ? {
            ...ch,
            servantsGroups: ch.servantsGroups.map(sg => sg.id === groupId ? {
              ...sg,
              cases: sg.cases.map(c => c.id === updatedCase.id ? updatedCase : c)
            } : sg)
          } : ch)
        }));
        setEditingCaseInfo(null);
      };

      const handleDeleteCase = (caseId, churchId, groupId) => {
        if (!confirm('هل أنت متأكد من حذف هذه الحالة؟')) return;
        setData(prev => ({
          ...prev,
          churches: prev.churches.map(ch => ch.id === churchId ? {
            ...ch,
            servantsGroups: ch.servantsGroups.map(sg => sg.id === groupId ? {
              ...sg,
              cases: sg.cases.filter(c => c.id !== caseId)
            } : sg)
          } : ch)
        }));
      };

      const handleClearAll = () => {
        if (confirm('هل أنت متأكد من مسح جميع البيانات والبدء بزيارة جديدة؟ لا يمكن التراجع عن هذا الإجراء.')) {
          setData({ visitId: uuidv4(), location: '', date: new Date().toISOString().split('T')[0], churches: [] });
        }
      };

      const handleForceSync = () => {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          try {
            const parsed = JSON.parse(saved);
            setSyncStatus('syncing');
            db.collection('visits').doc('current_visit').set(parsed)
              .then(() => {
                 setSyncStatus('synced');
                 alert('تم رفع البيانات المحلية للسحابة بنجاح!');
              })
              .catch(err => {
                 console.error("Manual Sync Error:", err);
                 setSyncStatus('error');
                 alert('حدث خطأ أثناء الرفع: ' + err.message);
              });
          } catch(e) {
             alert('فشل قراءة البيانات المحلية');
          }
        } else {
          alert('لا توجد بيانات محلية لرفعها.');
        }
      };

      const handleExportExcel = () => {
        if (typeof XLSX === 'undefined') {
          alert('جاري تحميل مكتبة الإكسيل، يرجى المحاولة مرة أخرى بعد قليل.');
          return;
        }

        const rows = [];
        let grandTotalProjects = 0;
        let grandTotalProjectValue = 0;
        let grandTotalInstallments = 0;

        (data.churches || []).forEach(churchLoc => {
          (churchLoc.servantsGroups || []).forEach(sg => {
            (sg.cases || []).forEach(c => {
              const s = serialMap[c.id] || { g: 0, r: 0, c: 0 };
              rows.push({
                'مسلسل عام': s.g,
                'مسلسل المنطقة': s.r,
                'مسلسل الكنيسة': s.c,
                'مكان الزيارة': data.location,
                'تاريخ الزيارة': data.date,
                'اسم المنطقة': churchLoc.regionName,
                'اسم القرية': churchLoc.villageName,
                'اسم الكنيسة': churchLoc.churchName,
                'أسماء الخدام': sg.servantsNames,
                'اسم الحالة': c.name,
                'نوع المشروع': c.projectType,
                'قيمة المشروع': c.projectValue,
                'قيمة القسط': c.installmentAmount,
                'ملاحظات': c.notes
              });
              grandTotalProjects++;
              grandTotalProjectValue += c.projectValue;
              grandTotalInstallments += c.installmentAmount;
            });
          });
        });

        if (rows.length === 0) {
          alert('لا توجد بيانات للتصدير.');
          return;
        }

        rows.push({
          'مسلسل عام': 'الإجمالي',
          'مسلسل المنطقة': '',
          'مسلسل الكنيسة': '',
          'مكان الزيارة': '',
          'تاريخ الزيارة': '',
          'اسم المنطقة': '',
          'اسم القرية': '',
          'اسم الكنيسة': '',
          'أسماء الخدام': '',
          'اسم الحالة': '',
          'نوع المشروع': `${grandTotalProjects} مشروع`,
          'قيمة المشروع': grandTotalProjectValue,
          'قيمة القسط': grandTotalInstallments,
          'ملاحظات': ''
        });

        const worksheet = XLSX.utils.json_to_sheet(rows);
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, 'الزيارة');

        const locationPart = data.location ? `_${data.location.replace(/\s+/g, '_')}` : '';
        const filename = `زيارة${locationPart}_${data.date}.xlsx`;
        XLSX.writeFile(workbook, filename);
      };

      const grandTotalProjects = (data.churches || []).reduce((sum, ch) => sum + ch.servantsGroups.reduce((s2, sg) => s2 + sg.cases.length, 0), 0);
      const grandTotalProjectValue = (data.churches || []).reduce((sum, ch) => sum + ch.servantsGroups.reduce((s2, sg) => s2 + sg.cases.reduce((s3, c) => s3 + c.projectValue, 0), 0), 0);
      const grandTotalInstallments = (data.churches || []).reduce((sum, ch) => sum + ch.servantsGroups.reduce((s2, sg) => s2 + sg.cases.reduce((s3, c) => s3 + c.installmentAmount, 0), 0), 0);

      return (
        <div className="min-h-screen pb-36">
          <nav className="bg-[#002f6c] text-white shadow-md sticky top-0 z-50">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="flex justify-between h-16 items-center">
                <div className="flex items-center gap-3">
                  <div className="flex flex-col">
                    <span className="text-[#d4af37] text-lg font-bold">خدمة الأنبا كاراس</span>
                  </div>
                  
                  <div className="hidden sm:flex items-center mr-4 text-xs font-medium px-2 py-1 rounded bg-[#001f4c] text-blue-200" title="حالة التزامن مع السحابة">
                    {syncStatus === 'syncing' && <><CloudUpload size={14} className="ml-1 animate-pulse" /><span>جاري الحفظ...</span></>}
                    {syncStatus === 'synced' && <><Cloud size={14} className="ml-1 text-green-400" /><span>تم الحفظ</span></>}
                    {syncStatus === 'error' && <><CloudOff size={14} className="ml-1 text-red-400" /><span>غير متصل</span></>}
                  </div>
                </div>
                <div className="flex gap-2">
                  <button onClick={handleForceSync} className="hidden sm:flex items-center gap-1.5 bg-[#005c29] hover:bg-[#004a20] text-white px-3 py-1.5 rounded text-sm font-medium transition-colors" title="مزامنة ورفع البيانات السابقة للسحابة">
                    <CloudUpload size={16} />
                    <span className="hidden md:inline">رفع للسحابة</span>
                  </button>
                  <button onClick={handleExportExcel} className="hidden sm:flex items-center gap-1.5 bg-[#d4af37] hover:bg-[#c49b27] text-white px-3 py-1.5 rounded text-sm font-medium transition-colors">
                    <Download size={16} />
                    <span>تصدير إكسيل</span>
                  </button>
                  <button onClick={handleClearAll} className="hidden sm:flex items-center gap-1.5 bg-red-600 hover:bg-red-700 text-white px-3 py-1.5 rounded text-sm font-medium transition-colors">
                    <RefreshCw size={16} />
                    <span>زيارة جديدة</span>
                  </button>
                </div>
              </div>
            </div>
          </nav>

          <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
            <section className="bg-white rounded-xl shadow-md border border-gray-100 p-6 mb-8">
              <h2 className="text-xl font-bold text-[#002f6c] mb-4 flex items-center gap-2">
                <MapPin size={24} className="text-[#d4af37]" />
                بيانات الزيارة
              </h2>
              <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                  <label className="block text-sm font-medium text-gray-700 mb-1">مكان الزيارة</label>
                  <MicInput value={data.location} onValueChange={(v) => setData(p => ({...p, location: v}))} placeholder="أدخل مكان الزيارة" />
                </div>
                <div>
                  <label className="block text-sm font-medium text-gray-700 mb-1">تاريخ الزيارة</label>
                  <input
                    type="date"
                    value={data.date}
                    onChange={(e) => setData(p => ({...p, date: e.target.value}))}
                    className="w-full rounded-md border border-gray-300 p-2.5 text-sm focus:border-[#002f6c] focus:ring-1 focus:ring-[#002f6c] focus:outline-none transition-shadow text-gray-900 font-sans"
                  />
                </div>
              </div>
            </section>

            <div className="flex flex-col sm:flex-row justify-between items-center mb-6 gap-4">
              <h2 className="text-2xl font-bold text-gray-800 w-full sm:w-auto">أقسام الكنائس</h2>
              <button onClick={handleAddChurch} className="w-full sm:w-auto flex items-center justify-center gap-2 bg-[#002f6c] hover:bg-[#001f4c] text-white font-medium py-2.5 px-6 rounded-md transition-colors shadow-md">
                <Plus size={20} />
                <span>إضافة كنيسة جديدة</span>
              </button>
            </div>

            <div className="space-y-6">
              {(data.churches || []).length === 0 ? (
                <div className="text-center py-12 bg-white rounded-xl shadow-sm border border-dashed border-gray-300">
                  <p className="text-gray-500 mb-4">لم يتم إضافة أي بيانات بعد.</p>
                  <button onClick={handleAddChurch} className="inline-flex items-center justify-center gap-2 bg-[#002f6c] hover:bg-[#001f4c] text-white font-medium py-2 px-6 rounded-md transition-colors">
                    <Plus size={18} />
                    <span>إضافة القسم الأول</span>
                  </button>
                </div>
              ) : (
                (data.churches || []).map(churchLoc => (
                  <ChurchCard
                    key={churchLoc.id}
                    churchLoc={churchLoc}
                    onUpdateChurch={handleUpdateChurch}
                    onDeleteChurch={handleDeleteChurch}
                    serialMap={serialMap}
                    onEditCase={(c, churchId, groupId) => setEditingCaseInfo({ caseData: c, churchId, groupId })}
                    onDeleteCase={handleDeleteCase}
                  />
                ))
              )}
            </div>
          </main>

          <div className="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)] z-40">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3">
              <div className="grid grid-cols-2 md:grid-cols-4 gap-4 text-center sm:text-right">
                <div className="flex flex-col">
                  <span className="text-xs text-gray-500">عدد الكنائس</span>
                  <span className="font-bold text-[#002f6c] text-lg font-sans">{formatNumber((data.churches || []).length)}</span>
                </div>
                <div className="flex flex-col">
                  <span className="text-xs text-gray-500">إجمالي الحالات الكلي</span>
                  <span className="font-bold text-[#002f6c] text-lg font-sans">{formatNumber(grandTotalProjects)}</span>
                </div>
                <div className="flex flex-col">
                  <span className="text-xs text-gray-500">إجمالي قيم المشاريع</span>
                  <span className="font-bold text-green-700 text-lg"><span className="font-sans">{formatNumber(grandTotalProjectValue)}</span> ج.م</span>
                </div>
                <div className="flex flex-col">
                  <span className="text-xs text-gray-500">إجمالي الأقساط</span>
                  <span className="font-bold text-[#8a7222] text-lg"><span className="font-sans">{formatNumber(grandTotalInstallments)}</span> ج.م</span>
                </div>
              </div>
              <div className="flex sm:hidden gap-2 mt-3 pt-3 border-t border-gray-100">
                <button onClick={handleExportExcel} className="flex-1 flex justify-center items-center gap-1.5 bg-[#d4af37] hover:bg-[#c49b27] text-white px-3 py-2 rounded text-sm font-medium transition-colors">
                  <Download size={16} />
                  <span>تصدير إكسيل</span>
                </button>
                <button onClick={handleClearAll} className="flex-1 flex justify-center items-center gap-1.5 bg-red-600 hover:bg-red-700 text-white px-3 py-2 rounded text-sm font-medium transition-colors">
                  <RefreshCw size={16} />
                  <span>زيارة جديدة</span>
                </button>
              </div>
            </div>
          </div>
          
          {editingCaseInfo && (
            <EditCaseModal
              caseData={editingCaseInfo.caseData}
              onSave={handleSaveEditCase}
              onCancel={() => setEditingCaseInfo(null)}
            />
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
